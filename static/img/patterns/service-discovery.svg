<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Instances register themselves; callers look them up at call time</text>

  <!-- Registry (the pattern) -->
  <rect x="300" y="35" width="160" height="60" rx="8" fill="#0f766e"/>
  <text x="380" y="61" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Service Registry</text>
  <text x="380" y="79" font-size="9" fill="#ccfbf1" text-anchor="middle">healthy instances of "orders"</text>

  <!-- Instance A healthy -->
  <rect x="80" y="150" width="140" height="55" rx="8" fill="#334155"/>
  <text x="150" y="174" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">orders-instance-A</text>
  <text x="150" y="191" font-size="9" fill="#cbd5e1" text-anchor="middle">registered, healthy</text>

  <!-- Instance B unhealthy (red) -->
  <rect x="80" y="230" width="140" height="55" rx="8" fill="#dc2626"/>
  <text x="150" y="254" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">orders-instance-B</text>
  <text x="150" y="271" font-size="9" fill="#fee2e2" text-anchor="middle">failed health check</text>

  <!-- Instance C healthy -->
  <rect x="580" y="150" width="140" height="55" rx="8" fill="#334155"/>
  <text x="650" y="174" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">orders-instance-C</text>
  <text x="650" y="191" font-size="9" fill="#cbd5e1" text-anchor="middle">registered, healthy</text>

  <!-- register arrows -->
  <line x1="150" y1="148" x2="310" y2="97" stroke="#334155" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#sdArrowGrey)"/>
  <text x="200" y="130" font-size="8" fill="#334155" text-anchor="middle">register</text>
  <line x1="650" y1="148" x2="450" y2="97" stroke="#334155" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#sdArrowGrey)"/>
  <text x="600" y="130" font-size="8" fill="#334155" text-anchor="middle">register</text>
  <line x1="150" y1="228" x2="300" y2="90" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="200" y="215" font-size="8" fill="#dc2626" text-anchor="middle">removed on failed check</text>

  <!-- Caller -->
  <rect x="300" y="240" width="160" height="55" rx="8" fill="#1d4ed8"/>
  <text x="380" y="264" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Caller</text>
  <text x="380" y="281" font-size="9" fill="#dbeafe" text-anchor="middle">"who is healthy for orders?"</text>

  <line x1="380" y1="238" x2="380" y2="97" stroke="#1d4ed8" stroke-width="2" marker-end="url(#sdArrowBlue)"/>
  <text x="410" y="170" font-size="9" fill="#1d4ed8" text-anchor="middle">lookup</text>

  <line x1="380" y1="240" x2="180" y2="185" stroke="#0f766e" stroke-width="2" marker-end="url(#sdArrowTeal)"/>
  <line x1="380" y1="240" x2="600" y2="185" stroke="#0f766e" stroke-width="2" marker-end="url(#sdArrowTeal)"/>
  <text x="380" y="220" font-size="9" fill="#0f766e" text-anchor="middle">call A or C — never B</text>

  <defs>
    <marker id="sdArrowGrey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="sdArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="sdArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
