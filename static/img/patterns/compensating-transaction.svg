<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>

  <!-- Step 1: forward action, committed -->
  <rect x="30" y="60" width="170" height="70" rx="8" fill="#15803d"/>
  <text x="115" y="88" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Reserve inventory</text>
  <text x="115" y="105" font-size="9" fill="#dcfce7" text-anchor="middle">committed — real, durable</text>
  <text x="115" y="118" font-size="9" fill="#dcfce7" text-anchor="middle">effect, already visible</text>

  <!-- Step 2: later step fails -->
  <rect x="275" y="60" width="170" height="70" rx="8" fill="#b45309"/>
  <text x="360" y="88" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Charge payment</text>
  <text x="360" y="105" font-size="9" fill="#fef3c7" text-anchor="middle">FAILS</text>
  <text x="360" y="118" font-size="9" fill="#fef3c7" text-anchor="middle">nothing to roll back to</text>

  <line x1="200" y1="95" x2="273" y2="95" stroke="#334155" stroke-width="2" marker-end="url(#arrowCtGray)"/>

  <!-- compensating transaction: new operation, not a rollback -->
  <rect x="30" y="200" width="170" height="70" rx="8" fill="#0f766e"/>
  <text x="115" y="228" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Release inventory</text>
  <text x="115" y="245" font-size="9" fill="#ccfbf1" text-anchor="middle">a NEW transaction —</text>
  <text x="115" y="258" font-size="9" fill="#ccfbf1" text-anchor="middle">semantic inverse, not undo</text>

  <line x1="360" y1="132" x2="360" y2="235" stroke="#b45309" stroke-width="2" marker-end="url(#arrowCtOrange)"/>
  <line x1="358" y1="235" x2="202" y2="235" stroke="#b45309" stroke-width="2" marker-end="url(#arrowCtOrange)"/>
  <text x="360" y="180" font-size="9" fill="#b45309" text-anchor="middle">failure triggers compensation</text>

  <!-- timeline showing history is not erased -->
  <text x="360" y="20" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">History is preserved, not erased</text>
  <line x1="30" y1="300" x2="690" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="115" cy="300" r="5" fill="#15803d"/>
  <text x="115" y="316" font-size="9" fill="#15803d" text-anchor="middle">reserved (t1)</text>
  <circle cx="360" cy="300" r="5" fill="#b45309"/>
  <text x="360" y="316" font-size="9" fill="#b45309" text-anchor="middle">payment failed (t2)</text>
  <circle cx="600" cy="300" r="5" fill="#0f766e"/>
  <text x="600" y="316" font-size="9" fill="#0f766e" text-anchor="middle">released (t3)</text>

  <rect x="520" y="200" width="170" height="70" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="605" y="222" font-size="9" fill="#64748b" text-anchor="middle">record shows:</text>
  <text x="605" y="238" font-size="9" fill="#64748b" text-anchor="middle">reserve -&gt; fail -&gt; release</text>
  <text x="605" y="254" font-size="9" fill="#64748b" text-anchor="middle">(not "as if never reserved")</text>

  <line x1="202" y1="235" x2="518" y2="235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <defs>
    <marker id="arrowCtGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowCtOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
