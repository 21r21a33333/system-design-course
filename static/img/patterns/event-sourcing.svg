<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Append-only events are the source of truth; current state is a fold over them</text>

  <!-- Append-only event store label -->
  <text x="40" y="66" font-size="10" fill="#64748b" font-weight="600">Event store (append-only, immutable)</text>

  <!-- events -->
  <rect x="40" y="76" width="118" height="50" rx="6" fill="#1d4ed8"/>
  <text x="99" y="97" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Opened</text>
  <text x="99" y="113" font-size="8" fill="#dbeafe" text-anchor="middle">owner=ada · v1</text>

  <rect x="166" y="76" width="118" height="50" rx="6" fill="#1d4ed8"/>
  <text x="225" y="97" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Deposited</text>
  <text x="225" y="113" font-size="8" fill="#dbeafe" text-anchor="middle">+100 · v2</text>

  <!-- snapshot marker after v2 -->
  <rect x="292" y="66" width="70" height="70" rx="6" fill="#b45309"/>
  <text x="327" y="92" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Snapshot</text>
  <text x="327" y="106" font-size="8" fill="#fde68a" text-anchor="middle">bal=100</text>
  <text x="327" y="118" font-size="8" fill="#fde68a" text-anchor="middle">thru v2</text>

  <rect x="370" y="76" width="118" height="50" rx="6" fill="#1d4ed8"/>
  <text x="429" y="97" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Withdrawn</text>
  <text x="429" y="113" font-size="8" fill="#dbeafe" text-anchor="middle">-30 · v3</text>

  <rect x="496" y="76" width="118" height="50" rx="6" fill="#1d4ed8"/>
  <text x="555" y="97" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Deposited</text>
  <text x="555" y="113" font-size="8" fill="#dbeafe" text-anchor="middle">+5 · v4</text>

  <!-- append arrow -->
  <line x1="614" y1="101" x2="700" y2="101" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#esArrowSlate)"/>
  <text x="672" y="92" font-size="8.5" fill="#64748b" text-anchor="middle">append</text>

  <!-- fold arrows down to state -->
  <line x1="99" y1="126" x2="300" y2="196" stroke="#15803d" stroke-width="1.5" marker-end="url(#esArrowGreen)"/>
  <line x1="225" y1="126" x2="330" y2="196" stroke="#15803d" stroke-width="1.5" marker-end="url(#esArrowGreen)"/>
  <line x1="429" y1="126" x2="360" y2="196" stroke="#15803d" stroke-width="1.5" marker-end="url(#esArrowGreen)"/>
  <line x1="555" y1="126" x2="390" y2="196" stroke="#15803d" stroke-width="1.5" marker-end="url(#esArrowGreen)"/>

  <text x="470" y="168" font-size="9" fill="#15803d" text-anchor="middle" font-weight="600">fold: state = apply(apply(apply(...)))</text>

  <!-- derived current state -->
  <rect x="270" y="198" width="220" height="52" rx="8" fill="#0f766e"/>
  <text x="380" y="220" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Current state (derived)</text>
  <text x="380" y="236" font-size="9" fill="#ccfbf1" text-anchor="middle">balance = 75 · version 4</text>

  <!-- fast path note -->
  <line x1="327" y1="136" x2="327" y2="196" stroke="#b45309" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#esArrowAmber)"/>
  <text x="150" y="270" font-size="9" fill="#b45309" font-weight="600">Fast load: restore snapshot (v2), replay only the tail (v3, v4)</text>

  <rect x="24" y="286" width="712" height="36" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="308" font-size="9" fill="#334155" text-anchor="middle">Snapshots are a derived cache to bound replay — delete them and full state still rebuilds from the events alone</text>

  <defs>
    <marker id="esArrowGreen" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#15803d"/></marker>
    <marker id="esArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="esArrowAmber" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/></marker>
  </defs>
</svg>
