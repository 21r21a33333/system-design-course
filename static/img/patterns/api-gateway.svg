<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Every client call passes through one gateway before reaching any backend</text>

  <!-- Clients -->
  <rect x="30" y="60" width="120" height="42" rx="8" fill="#1d4ed8"/>
  <text x="90" y="86" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Web client</text>

  <rect x="30" y="115" width="120" height="42" rx="8" fill="#1d4ed8"/>
  <text x="90" y="141" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Mobile client</text>

  <rect x="30" y="170" width="120" height="42" rx="8" fill="#1d4ed8"/>
  <text x="90" y="196" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Partner API</text>

  <!-- Gateway -->
  <rect x="290" y="105" width="180" height="90" rx="8" fill="#0f766e"/>
  <text x="380" y="132" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">API Gateway</text>
  <text x="380" y="150" font-size="9" fill="#ccfbf1" text-anchor="middle">auth, rate limit,</text>
  <text x="380" y="163" font-size="9" fill="#ccfbf1" text-anchor="middle">routing, transform</text>
  <text x="380" y="180" font-size="9" fill="#ccfbf1" text-anchor="middle">single entry point</text>

  <line x1="150" y1="81" x2="288" y2="130" stroke="#1d4ed8" stroke-width="2" marker-end="url(#gwArrowBlue)"/>
  <line x1="150" y1="136" x2="288" y2="145" stroke="#1d4ed8" stroke-width="2" marker-end="url(#gwArrowBlue)"/>
  <line x1="150" y1="191" x2="288" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#gwArrowBlue)"/>

  <!-- Backends -->
  <rect x="580" y="40" width="150" height="42" rx="8" fill="#334155"/>
  <text x="655" y="66" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Orders service</text>

  <rect x="580" y="95" width="150" height="42" rx="8" fill="#334155"/>
  <text x="655" y="121" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Users service</text>

  <rect x="580" y="150" width="150" height="42" rx="8" fill="#334155"/>
  <text x="655" y="176" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Inventory service</text>

  <rect x="580" y="205" width="150" height="42" rx="8" fill="#334155"/>
  <text x="655" y="231" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Payments service</text>

  <line x1="472" y1="120" x2="578" y2="65" stroke="#0f766e" stroke-width="2" marker-end="url(#gwArrowTeal)"/>
  <line x1="472" y1="135" x2="578" y2="118" stroke="#0f766e" stroke-width="2" marker-end="url(#gwArrowTeal)"/>
  <line x1="472" y1="163" x2="578" y2="173" stroke="#0f766e" stroke-width="2" marker-end="url(#gwArrowTeal)"/>
  <line x1="472" y1="178" x2="578" y2="222" stroke="#0f766e" stroke-width="2" marker-end="url(#gwArrowTeal)"/>

  <text x="380" y="220" font-size="9" fill="#334155" text-anchor="middle">clients never see backend addresses</text>

  <!-- Failure mode note -->
  <rect x="230" y="255" width="300" height="45" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="273" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="600">Gateway is a concentration point:</text>
  <text x="380" y="287" font-size="9.5" fill="#b45309" text-anchor="middle">an outage here blocks every client, every backend</text>

  <defs>
    <marker id="gwArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="gwArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
