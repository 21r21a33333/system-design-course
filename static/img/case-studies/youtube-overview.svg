<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">YouTube: initial high-level design</text>

  <!-- Uploader client -->
  <rect x="20" y="60" width="120" height="50" rx="8" fill="#1d4ed8"/>
  <text x="80" y="81" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Uploader</text>
  <text x="80" y="97" font-size="9" fill="#dbeafe" text-anchor="middle">chunked upload</text>

  <!-- Viewer client -->
  <rect x="20" y="260" width="120" height="50" rx="8" fill="#1d4ed8"/>
  <text x="80" y="281" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Viewer</text>
  <text x="80" y="297" font-size="9" fill="#dbeafe" text-anchor="middle">adaptive playback</text>

  <!-- Ingest service -->
  <rect x="190" y="60" width="130" height="50" rx="8" fill="#0f766e"/>
  <text x="255" y="81" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Ingest Service</text>
  <text x="255" y="97" font-size="9" fill="#ccfbf1" text-anchor="middle">raw file + event</text>

  <line x1="140" y1="85" x2="188" y2="85" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ytArrowBlue)"/>

  <!-- Transcoding pipeline -->
  <rect x="360" y="60" width="160" height="65" rx="8" fill="#0f766e"/>
  <text x="440" y="85" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Transcoding Pipeline</text>
  <text x="440" y="102" font-size="9" fill="#ccfbf1" text-anchor="middle">async, compute-bound</text>
  <text x="440" y="115" font-size="9" fill="#ccfbf1" text-anchor="middle">multiple renditions</text>

  <line x1="320" y1="85" x2="358" y2="92" stroke="#0f766e" stroke-width="2" marker-end="url(#ytArrowTeal)"/>

  <!-- Blob storage -->
  <rect x="580" y="60" width="150" height="65" rx="8" fill="#334155"/>
  <text x="655" y="85" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Blob Storage</text>
  <text x="655" y="102" font-size="9" fill="#cbd5e1" text-anchor="middle">raw file +</text>
  <text x="655" y="115" font-size="9" fill="#cbd5e1" text-anchor="middle">rendition outputs</text>

  <line x1="520" y1="92" x2="578" y2="92" stroke="#0f766e" stroke-width="2" marker-end="url(#ytArrowTeal)"/>

  <!-- Metadata store -->
  <rect x="360" y="170" width="160" height="55" rx="8" fill="#334155"/>
  <text x="440" y="193" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Video Metadata</text>
  <text x="440" y="210" font-size="9" fill="#cbd5e1" text-anchor="middle">status: processing/ready</text>

  <line x1="440" y1="125" x2="440" y2="168" stroke="#0f766e" stroke-width="2" marker-end="url(#ytArrowTeal)"/>

  <!-- CDN -->
  <rect x="190" y="245" width="140" height="65" rx="8" fill="#b45309"/>
  <text x="260" y="270" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">CDN</text>
  <text x="260" y="287" font-size="9" fill="#fde68a" text-anchor="middle">segment delivery,</text>
  <text x="260" y="300" font-size="9" fill="#fde68a" text-anchor="middle">bandwidth-dominant</text>

  <line x1="140" y1="280" x2="188" y2="278" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ytArrowBlue)"/>
  <path d="M655,125 C655,220 400,270 330,278" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ytArrowAmber)"/>
  <text x="500" y="240" font-size="9" fill="#b45309" text-anchor="middle">origin fetch on cache miss only</text>

  <!-- Search / discovery -->
  <rect x="580" y="170" width="150" height="55" rx="8" fill="#334155"/>
  <text x="655" y="193" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Search Index</text>
  <text x="655" y="210" font-size="9" fill="#cbd5e1" text-anchor="middle">title/description</text>

  <line x1="440" y1="198" x2="578" y2="198" stroke="#0f766e" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ytArrowTeal)"/>

  <rect x="20" y="335" width="710" height="45" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="375" y="352" font-size="9" fill="#334155" text-anchor="middle">Upload is not watchable until the async pipeline produces at least one rendition.</text>
  <text x="375" y="368" font-size="9" fill="#334155" text-anchor="middle">Playback never touches the pipeline or origin directly in the common case — CDN serves it.</text>

  <defs>
    <marker id="ytArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="ytArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="ytArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
