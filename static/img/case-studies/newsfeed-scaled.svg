<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Newsfeed: scaled design</text>

  <!-- Producers -->
  <rect x="20" y="60" width="120" height="45" rx="8" fill="#1d4ed8"/>
  <text x="80" y="78" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Producers</text>
  <text x="80" y="92" font-size="8" fill="#dbeafe" text-anchor="middle">many activity types</text>

  <!-- Ingestion with bulkhead -->
  <rect x="175" y="60" width="130" height="45" rx="8" fill="#0f766e"/>
  <text x="240" y="78" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Ingestion</text>
  <text x="240" y="92" font-size="8" fill="#ccfbf1" text-anchor="middle">bulkheaded per type</text>

  <line x1="140" y1="82" x2="173" y2="82" stroke="#1d4ed8" stroke-width="2" marker-end="url(#nfsArrowBlue)"/>

  <!-- Partitioned fan-out queue -->
  <rect x="340" y="60" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="415" y="81" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Fan-out Queue</text>
  <text x="415" y="97" font-size="8" fill="#dcfce7" text-anchor="middle">partitioned by activity type</text>

  <line x1="305" y1="82" x2="338" y2="82" stroke="#15803d" stroke-width="2" marker-end="url(#nfsArrowGreen)"/>

  <!-- Fan-out workers -->
  <rect x="530" y="30" width="140" height="40" rx="8" fill="#0f766e"/>
  <text x="600" y="55" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Fan-out Workers A</text>

  <rect x="530" y="80" width="140" height="40" rx="8" fill="#0f766e"/>
  <text x="600" y="105" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Fan-out Workers B</text>

  <line x1="490" y1="72" x2="528" y2="50" stroke="#15803d" stroke-width="2" marker-end="url(#nfsArrowGreen)"/>
  <line x1="490" y1="90" x2="528" y2="98" stroke="#15803d" stroke-width="2" marker-end="url(#nfsArrowGreen)"/>

  <!-- Sharded social graph -->
  <rect x="710" y="30" width="130" height="40" rx="8" fill="#334155"/>
  <text x="775" y="55" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Social Graph (sharded)</text>

  <line x1="670" y1="50" x2="708" y2="48" stroke="#334155" stroke-width="2" marker-end="url(#nfsArrowSlate)"/>

  <!-- Sharded feed store -->
  <rect x="710" y="80" width="130" height="40" rx="8" fill="#334155"/>
  <text x="775" y="105" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Feed Store (sharded)</text>

  <line x1="670" y1="100" x2="708" y2="100" stroke="#0f766e" stroke-width="2" marker-end="url(#nfsArrowTeal)"/>

  <!-- Feed cache -->
  <rect x="530" y="180" width="150" height="55" rx="8" fill="#15803d"/>
  <text x="605" y="203" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Feed Cache</text>
  <text x="605" y="219" font-size="8" fill="#dcfce7" text-anchor="middle">active users only</text>

  <line x1="775" y1="120" x2="680" y2="195" stroke="#334155" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#nfsArrowSlate)"/>

  <!-- Ranking workers -->
  <rect x="340" y="180" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="415" y="203" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Ranking Workers</text>
  <text x="415" y="219" font-size="8" fill="#ccfbf1" text-anchor="middle">stateless, scale on reads</text>

  <line x1="530" y1="207" x2="490" y2="207" stroke="#0f766e" stroke-width="2" marker-end="url(#nfsArrowTeal)"/>

  <!-- Client -->
  <rect x="150" y="180" width="130" height="55" rx="8" fill="#1d4ed8"/>
  <text x="215" y="203" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Viewing Clients</text>
  <text x="215" y="219" font-size="8" fill="#dbeafe" text-anchor="middle">250M DAU</text>

  <line x1="280" y1="207" x2="338" y2="207" stroke="#1d4ed8" stroke-width="2" marker-end="url(#nfsArrowBlue)"/>

  <rect x="20" y="330" width="290" height="65" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="348" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Green = scaled/redundant additions</text>
  <text x="165" y="363" font-size="9" fill="#334155" text-anchor="middle">Partitioned fan-out isolates one</text>
  <text x="165" y="377" font-size="9" fill="#334155" text-anchor="middle">activity type's surge from others</text>

  <defs>
    <marker id="nfsArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="nfsArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="nfsArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
    <marker id="nfsArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
