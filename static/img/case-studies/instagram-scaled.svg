<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Instagram: scaled design</text>

  <!-- Client -->
  <rect x="20" y="180" width="110" height="50" rx="8" fill="#1d4ed8"/>
  <text x="75" y="201" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="75" y="217" font-size="8" fill="#dbeafe" text-anchor="middle">~40K reads/s peak</text>

  <!-- CDN -->
  <rect x="165" y="70" width="120" height="50" rx="8" fill="#b45309"/>
  <text x="225" y="91" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">CDN</text>
  <text x="225" y="107" font-size="8" fill="#fde68a" text-anchor="middle">image bytes, origin rarely hit</text>

  <line x1="130" y1="190" x2="225" y2="118" stroke="#b45309" stroke-width="2" marker-end="url(#isArrowAmber)"/>

  <!-- Feed cache -->
  <rect x="165" y="200" width="120" height="50" rx="8" fill="#15803d"/>
  <text x="225" y="221" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Feed Cache</text>
  <text x="225" y="237" font-size="8" fill="#dcfce7" text-anchor="middle">active users only</text>

  <line x1="130" y1="205" x2="163" y2="220" stroke="#1d4ed8" stroke-width="2" marker-end="url(#isArrowBlue)"/>

  <!-- Feed store shards -->
  <rect x="320" y="200" width="140" height="50" rx="8" fill="#334155"/>
  <text x="390" y="221" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Feed Store Shards</text>
  <text x="390" y="237" font-size="8" fill="#cbd5e1" text-anchor="middle">cache-aside miss path</text>

  <line x1="285" y1="225" x2="318" y2="225" stroke="#15803d" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#isArrowGreen)"/>

  <!-- Fan-out queue -->
  <rect x="320" y="270" width="140" height="50" rx="8" fill="#15803d"/>
  <text x="390" y="291" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Fan-Out Queue</text>
  <text x="390" y="307" font-size="8" fill="#dcfce7" text-anchor="middle">async post events</text>

  <!-- Fan-out workers -->
  <rect x="500" y="270" width="140" height="50" rx="8" fill="#15803d"/>
  <text x="570" y="291" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Fan-Out Workers</text>
  <text x="570" y="307" font-size="8" fill="#dcfce7" text-anchor="middle">push, or skip for mega-accounts</text>

  <line x1="460" y1="295" x2="498" y2="295" stroke="#15803d" stroke-width="2" marker-end="url(#isArrowGreen)"/>
  <line x1="570" y1="270" x2="450" y2="228" stroke="#15803d" stroke-width="2" marker-end="url(#isArrowGreen)"/>

  <!-- Pull path for high-follower accounts -->
  <rect x="500" y="200" width="140" height="50" rx="8" fill="#b45309"/>
  <text x="570" y="221" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">High-Follower Merge</text>
  <text x="570" y="237" font-size="8" fill="#fde68a" text-anchor="middle">read-time pull, few accounts</text>

  <line x1="390" y1="200" x2="540" y2="200" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Social graph, sharded -->
  <rect x="320" y="100" width="140" height="50" rx="8" fill="#334155"/>
  <text x="390" y="121" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Social Graph</text>
  <text x="390" y="137" font-size="8" fill="#cbd5e1" text-anchor="middle">sharded by user_id</text>

  <line x1="390" y1="270" x2="390" y2="150" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Sharded counters -->
  <rect x="680" y="100" width="140" height="50" rx="8" fill="#334155"/>
  <text x="750" y="121" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Sharded Counters</text>
  <text x="750" y="137" font-size="8" fill="#cbd5e1" text-anchor="middle">like/comment counts</text>

  <!-- Post store, hot/cold tiers -->
  <rect x="680" y="270" width="140" height="50" rx="8" fill="#334155"/>
  <text x="750" y="291" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Post Store</text>
  <text x="750" y="307" font-size="8" fill="#cbd5e1" text-anchor="middle">hot/cold tiered</text>

  <rect x="20" y="330" width="810" height="70" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="425" y="350" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Green = scaled/redundant additions</text>
  <text x="425" y="367" font-size="9" fill="#334155" text-anchor="middle">Fan-out moves off the write path via a queue; push below a follower-count threshold,</text>
  <text x="425" y="383" font-size="9" fill="#334155" text-anchor="middle">pull-and-merge above it; CDN absorbs nearly all image read volume</text>

  <defs>
    <marker id="isArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="isArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="isArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
    <marker id="isArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
