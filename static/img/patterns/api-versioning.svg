<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Old and new contracts served side by side during migration</text>

  <!-- Old client -->
  <rect x="30" y="70" width="140" height="55" rx="8" fill="#1d4ed8"/>
  <text x="100" y="94" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Legacy Client</text>
  <text x="100" y="111" font-size="9" fill="#dbeafe" text-anchor="middle">calls /v1/orders</text>

  <!-- New client -->
  <rect x="30" y="195" width="140" height="55" rx="8" fill="#1d4ed8"/>
  <text x="100" y="219" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">New Client</text>
  <text x="100" y="236" font-size="9" fill="#dbeafe" text-anchor="middle">calls /v2/orders</text>

  <!-- Gateway -->
  <rect x="290" y="130" width="150" height="60" rx="8" fill="#334155"/>
  <text x="365" y="156" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">API Gateway</text>
  <text x="365" y="174" font-size="9" fill="#cbd5e1" text-anchor="middle">routes by version</text>

  <line x1="170" y1="97" x2="288" y2="150" stroke="#1d4ed8" stroke-width="2" marker-end="url(#avArrowBlue)"/>
  <line x1="170" y1="222" x2="288" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#avArrowBlue)"/>

  <!-- v1 handler (amber - deprecated) -->
  <rect x="550" y="60" width="170" height="60" rx="8" fill="#b45309"/>
  <text x="635" y="86" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">v1 Handler</text>
  <text x="635" y="104" font-size="9" fill="#fde68a" text-anchor="middle">deprecated, sunset date set</text>

  <!-- v2 handler (teal - current, the pattern) -->
  <rect x="550" y="200" width="170" height="60" rx="8" fill="#0f766e"/>
  <text x="635" y="226" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">v2 Handler</text>
  <text x="635" y="244" font-size="9" fill="#ccfbf1" text-anchor="middle">current contract</text>

  <line x1="440" y1="145" x2="548" y2="100" stroke="#b45309" stroke-width="2" marker-end="url(#avArrowAmber)"/>
  <line x1="440" y1="175" x2="548" y2="222" stroke="#0f766e" stroke-width="2" marker-end="url(#avArrowTeal)"/>

  <rect x="30" y="278" width="690" height="32" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="375" y="298" font-size="9" fill="#334155" text-anchor="middle">v1 keeps working unchanged until its published sunset date; v2 is where new development happens</text>

  <defs>
    <marker id="avArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="avArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="avArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
