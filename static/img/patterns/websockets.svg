<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="26" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">One TCP connection, upgraded once, then full-duplex frames either way</text>

  <!-- Client -->
  <rect x="40" y="120" width="150" height="90" rx="8" fill="#1d4ed8"/>
  <text x="115" y="152" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="115" y="172" font-size="9" fill="#dbeafe" text-anchor="middle">browser / app</text>
  <text x="115" y="188" font-size="9" fill="#dbeafe" text-anchor="middle">sends + receives</text>

  <!-- Server -->
  <rect x="530" y="120" width="150" height="90" rx="8" fill="#0f766e"/>
  <text x="605" y="152" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Server</text>
  <text x="605" y="172" font-size="9" fill="#ccfbf1" text-anchor="middle">holds live conn</text>
  <text x="605" y="188" font-size="9" fill="#ccfbf1" text-anchor="middle">+ per-conn state</text>

  <!-- handshake -->
  <line x1="190" y1="135" x2="530" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#wsArrowSlate)"/>
  <text x="360" y="128" font-size="9" fill="#334155" text-anchor="middle">GET /ws  Upgrade: websocket</text>
  <line x1="530" y1="158" x2="190" y2="158" stroke="#15803d" stroke-width="2" marker-end="url(#wsArrowGreen)"/>
  <text x="360" y="151" font-size="9" fill="#15803d" text-anchor="middle">101 Switching Protocols</text>

  <!-- full-duplex frames -->
  <line x1="190" y1="182" x2="530" y2="182" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#wsArrowBlue)"/>
  <text x="360" y="176" font-size="9" fill="#1d4ed8" text-anchor="middle">client → server frame</text>
  <line x1="530" y1="200" x2="190" y2="200" stroke="#0f766e" stroke-width="2.5" marker-end="url(#wsArrowTeal)"/>
  <text x="360" y="214" font-size="9" fill="#0f766e" text-anchor="middle">server → client frame (any time)</text>

  <!-- heartbeat -->
  <text x="360" y="238" font-size="9" fill="#b45309" text-anchor="middle">ping / pong heartbeat keeps the idle connection alive</text>

  <!-- backplane note -->
  <rect x="40" y="262" width="640" height="56" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="284" font-size="9" fill="#334155" text-anchor="middle">Scaling across instances: sticky sessions pin a client to one server, or a shared pub/sub backplane</text>
  <text x="360" y="300" font-size="9" fill="#334155" text-anchor="middle">lets a message accepted on one instance reach a client connected to another.</text>

  <defs>
    <marker id="wsArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="wsArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/></marker>
    <marker id="wsArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
    <marker id="wsArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
  </defs>
</svg>
