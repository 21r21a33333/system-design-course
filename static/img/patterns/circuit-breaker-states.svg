<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>

  <text x="380" y="26" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">The three-state machine: failures trip Closed→Open, a cooldown yields Half-Open, a trial decides the outcome</text>

  <!-- Closed -->
  <circle cx="150" cy="200" r="70" fill="#15803d"/>
  <text x="150" y="196" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Closed</text>
  <text x="150" y="216" font-size="9" fill="#dcfce7" text-anchor="middle">calls pass through</text>

  <!-- Open -->
  <circle cx="610" cy="200" r="70" fill="#dc2626"/>
  <text x="610" y="196" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Open</text>
  <text x="610" y="216" font-size="9" fill="#fee2e2" text-anchor="middle">reject immediately</text>

  <!-- Half-Open -->
  <circle cx="380" cy="200" r="70" fill="#b45309"/>
  <text x="380" y="192" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Half-Open</text>
  <text x="380" y="210" font-size="9" fill="#fde68a" text-anchor="middle">allow a trial call</text>
  <text x="380" y="224" font-size="9" fill="#fde68a" text-anchor="middle">through</text>

  <!-- Closed -> Open (failure threshold) top arc -->
  <path d="M 205 158 Q 380 60 555 158" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#stRed)"/>
  <text x="380" y="88" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="600">failure rate / count crosses threshold</text>

  <!-- Open -> Half-Open (cooldown) -->
  <path d="M 545 220 Q 490 260 452 224" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#stSlate)"/>
  <text x="500" y="272" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">reset timeout elapses</text>

  <!-- Half-Open -> Closed (trial success) -->
  <path d="M 312 208 Q 250 250 210 232" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#stGreen)"/>
  <text x="255" y="290" font-size="10" fill="#15803d" text-anchor="middle" font-weight="600">trial succeeds</text>

  <!-- Half-Open -> Open (trial failure) -->
  <path d="M 448 176 Q 505 150 543 172" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#stRed)"/>
  <text x="500" y="132" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="600">trial fails</text>

  <!-- Closed self-loop success -->
  <path d="M 118 138 Q 150 100 182 138" fill="none" stroke="#15803d" stroke-width="1.8" marker-end="url(#stGreen)"/>
  <text x="150" y="118" font-size="8.5" fill="#15803d" text-anchor="middle">success resets counter</text>

  <rect x="40" y="330" width="680" height="34" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="351" font-size="9" fill="#334155" text-anchor="middle">In Open the breaker fails fast (fallback); Half-Open limits exposure to a single probe so a still-broken dependency isn't re-flooded</text>

  <defs>
    <marker id="stRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
    <marker id="stGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/></marker>
    <marker id="stSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
  </defs>
</svg>
