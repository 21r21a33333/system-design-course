<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">A cascading failure is a positive feedback loop — each step makes the next step worse</text>

  <defs>
    <marker id="cfArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 4 nodes arranged in a cycle -->
  <!-- Top: some servers fail -->
  <rect x="290" y="50" width="180" height="60" rx="8" fill="#dc2626"/>
  <text x="380" y="76" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Some servers fail</text>
  <text x="380" y="94" font-size="9" fill="#fecaca" text-anchor="middle">crash, health-check death, overload</text>

  <!-- Right: load redistributes -->
  <rect x="540" y="170" width="180" height="60" rx="8" fill="#b45309"/>
  <text x="630" y="196" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Traffic redistributes</text>
  <text x="630" y="214" font-size="9" fill="#fde68a" text-anchor="middle">load balancer excludes them</text>

  <!-- Bottom: survivors overload -->
  <rect x="290" y="290" width="180" height="60" rx="8" fill="#b91c1c"/>
  <text x="380" y="316" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Survivors overload</text>
  <text x="380" y="334" font-size="9" fill="#fecaca" text-anchor="middle">CPU / memory / thread exhaustion</text>

  <!-- Left: more crash -->
  <rect x="40" y="170" width="180" height="60" rx="8" fill="#7f1d1d"/>
  <text x="130" y="196" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">More servers fail</text>
  <text x="130" y="214" font-size="9" fill="#fecaca" text-anchor="middle">the cycle accelerates</text>

  <!-- cycle arrows -->
  <path d="M470,90 Q560,120 590,168" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#cfArrow)"/>
  <path d="M600,232 Q500,280 472,300" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#cfArrow)"/>
  <path d="M288,318 Q190,290 158,232" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#cfArrow)"/>
  <path d="M150,168 Q220,110 288,88" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#cfArrow)"/>

  <!-- center label -->
  <circle cx="380" cy="200" r="55" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="380" y="195" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">positive</text>
  <text x="380" y="210" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">feedback</text>

  <!-- break-the-loop callout -->
  <rect x="20" y="368" width="720" height="24" rx="4" fill="#0f766e"/>
  <text x="380" y="384" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Every prevention technique on this page exists to break one edge of this loop before it completes a lap</text>
</svg>
