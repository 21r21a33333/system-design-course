<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">TinyURL: initial high-level design</text>

  <!-- Creating client -->
  <rect x="20" y="80" width="130" height="55" rx="8" fill="#1d4ed8"/>
  <text x="85" y="103" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Creating Client</text>
  <text x="85" y="120" font-size="9" fill="#dbeafe" text-anchor="middle">submits long URL</text>

  <!-- Visiting client -->
  <rect x="20" y="220" width="130" height="55" rx="8" fill="#1d4ed8"/>
  <text x="85" y="243" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Visiting Client</text>
  <text x="85" y="260" font-size="9" fill="#dbeafe" text-anchor="middle">clicks short link</text>

  <!-- Shortening service -->
  <rect x="220" y="70" width="150" height="65" rx="8" fill="#0f766e"/>
  <text x="295" y="96" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Shortening Service</text>
  <text x="295" y="113" font-size="9" fill="#ccfbf1" text-anchor="middle">create mapping</text>

  <!-- Redirect service -->
  <rect x="220" y="220" width="150" height="65" rx="8" fill="#0f766e"/>
  <text x="295" y="246" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Redirect Service</text>
  <text x="295" y="263" font-size="9" fill="#ccfbf1" text-anchor="middle">resolve + 302</text>

  <line x1="150" y1="107" x2="218" y2="102" stroke="#1d4ed8" stroke-width="2" marker-end="url(#tuArrowBlue)"/>
  <line x1="150" y1="247" x2="218" y2="252" stroke="#1d4ed8" stroke-width="2" marker-end="url(#tuArrowBlue)"/>

  <!-- Code generator -->
  <rect x="430" y="70" width="150" height="65" rx="8" fill="#0f766e"/>
  <text x="505" y="96" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Code Generator</text>
  <text x="505" y="113" font-size="9" fill="#ccfbf1" text-anchor="middle">unique ID ranges</text>

  <line x1="370" y1="102" x2="428" y2="102" stroke="#0f766e" stroke-width="2" marker-end="url(#tuArrowTeal)"/>

  <!-- Mapping store -->
  <rect x="430" y="220" width="150" height="65" rx="8" fill="#334155"/>
  <text x="505" y="246" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Mapping Store</text>
  <text x="505" y="263" font-size="9" fill="#cbd5e1" text-anchor="middle">code -&gt; long URL</text>

  <line x1="370" y1="120" x2="490" y2="218" stroke="#334155" stroke-width="2" marker-end="url(#tuArrowSlate)"/>
  <line x1="370" y1="252" x2="428" y2="252" stroke="#334155" stroke-width="2" marker-end="url(#tuArrowSlate)"/>

  <!-- Click counter -->
  <rect x="630" y="220" width="150" height="65" rx="8" fill="#b45309"/>
  <text x="705" y="246" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Click Counter</text>
  <text x="705" y="263" font-size="9" fill="#fde68a" text-anchor="middle">async, off critical path</text>

  <line x1="295" y1="285" x2="700" y2="252" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#tuArrowAmber)"/>
  <text x="500" y="300" font-size="8" fill="#b45309">click event, fire-and-forget</text>

  <rect x="600" y="70" width="190" height="80" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="695" y="90" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Range allocation is rare —</text>
  <text x="695" y="104" font-size="9" fill="#334155" text-anchor="middle">servers draw many codes</text>
  <text x="695" y="118" font-size="9" fill="#334155" text-anchor="middle">from one granted range</text>
  <text x="695" y="132" font-size="9" fill="#334155" text-anchor="middle">before requesting another</text>

  <defs>
    <marker id="tuArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="tuArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="tuArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="tuArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
