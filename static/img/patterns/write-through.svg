<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Write blocks until the store has durably accepted it</text>

  <!-- Application -->
  <rect x="30" y="120" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="95" y="146" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Application</text>
  <text x="95" y="164" font-size="9" fill="#dbeafe" text-anchor="middle">set(key, value)</text>

  <!-- Cache -->
  <rect x="300" y="120" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="375" y="146" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Cache</text>
  <text x="375" y="164" font-size="9" fill="#ccfbf1" text-anchor="middle">holds write until store confirms</text>

  <!-- Store -->
  <rect x="580" y="120" width="150" height="60" rx="8" fill="#334155"/>
  <text x="655" y="146" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Store</text>
  <text x="655" y="164" font-size="9" fill="#cbd5e1" text-anchor="middle">durable write</text>

  <!-- app -> cache -->
  <line x1="160" y1="140" x2="298" y2="140" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowWt1)"/>
  <text x="230" y="130" font-size="9" fill="#1d4ed8" text-anchor="middle">1. write</text>

  <!-- cache -> store synchronous -->
  <line x1="450" y1="140" x2="578" y2="140" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowWtTeal)"/>
  <text x="515" y="130" font-size="9" fill="#0f766e" text-anchor="middle">2. sync write</text>

  <!-- store -> cache ack -->
  <line x1="578" y1="160" x2="450" y2="160" stroke="#15803d" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowWtGreen)"/>
  <text x="515" y="178" font-size="9" fill="#15803d" text-anchor="middle">3. store confirms</text>

  <!-- cache -> app ack -->
  <line x1="298" y1="105" x2="160" y2="115" stroke="#15803d" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowWtGreen)"/>
  <text x="230" y="98" font-size="9" fill="#15803d" text-anchor="middle">4. write succeeds</text>

  <!-- timeline strip -->
  <rect x="30" y="220" width="700" height="70" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="240" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">One logical operation — no window where cache and store disagree</text>
  <line x1="60" y1="270" x2="700" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="60" cy="270" r="4" fill="#1d4ed8"/>
  <text x="60" y="286" font-size="8" fill="#334155" text-anchor="middle">write called</text>
  <circle cx="700" cy="270" r="4" fill="#15803d"/>
  <text x="700" y="286" font-size="8" fill="#334155" text-anchor="middle">write returns (store durable)</text>

  <defs>
    <marker id="arrowWt1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowWtTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowWtGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
  </defs>
</svg>
