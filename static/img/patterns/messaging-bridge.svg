<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>

  <!-- System A -->
  <rect x="30" y="125" width="160" height="70" rx="8" fill="#1d4ed8"/>
  <text x="110" y="155" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">System A</text>
  <text x="110" y="175" font-size="10" fill="#dbeafe" text-anchor="middle">broker / protocol X</text>

  <!-- Bridge -->
  <rect x="280" y="125" width="160" height="70" rx="8" fill="#0f766e"/>
  <text x="360" y="152" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Messaging Bridge</text>
  <text x="360" y="170" font-size="10" fill="#ccfbf1" text-anchor="middle">translate + relay</text>
  <text x="360" y="184" font-size="10" fill="#ccfbf1" text-anchor="middle">both directions</text>

  <!-- System B -->
  <rect x="530" y="125" width="160" height="70" rx="8" fill="#1d4ed8"/>
  <text x="610" y="155" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">System B</text>
  <text x="610" y="175" font-size="10" fill="#dbeafe" text-anchor="middle">broker / protocol Y</text>

  <!-- A -> Bridge -->
  <line x1="192" y1="145" x2="278" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#arrowMb)"/>
  <text x="235" y="135" font-size="9" fill="#334155" text-anchor="middle">publish (A format)</text>

  <!-- Bridge -> B -->
  <line x1="442" y1="145" x2="528" y2="145" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowMbTeal)"/>
  <text x="485" y="135" font-size="9" fill="#0f766e" text-anchor="middle">republish (B format)</text>

  <!-- B -> Bridge -->
  <line x1="528" y1="175" x2="442" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#arrowMb)"/>
  <text x="485" y="195" font-size="9" fill="#334155" text-anchor="middle">publish (B format)</text>

  <!-- Bridge -> A -->
  <line x1="278" y1="175" x2="192" y2="175" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowMbTeal)"/>
  <text x="235" y="195" font-size="9" fill="#0f766e" text-anchor="middle">republish (A format)</text>

  <text x="360" y="250" font-size="11" fill="#64748b" text-anchor="middle">Neither system is aware of the other — each only sees its own protocol and format.</text>

  <defs>
    <marker id="arrowMb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowMbTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
