<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Gateway centralizes keys, routing, and metering — callers never see the provider directly</text>

  <!-- Callers -->
  <rect x="30" y="60" width="140" height="45" rx="8" fill="#1d4ed8"/>
  <text x="100" y="80" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Service A</text>
  <text x="100" y="95" font-size="9" fill="#dbeafe" text-anchor="middle">no provider key</text>

  <rect x="30" y="130" width="140" height="45" rx="8" fill="#1d4ed8"/>
  <text x="100" y="150" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Service B</text>
  <text x="100" y="165" font-size="9" fill="#dbeafe" text-anchor="middle">no provider key</text>

  <rect x="30" y="200" width="140" height="45" rx="8" fill="#1d4ed8"/>
  <text x="100" y="220" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Service C</text>
  <text x="100" y="235" font-size="9" fill="#dbeafe" text-anchor="middle">no provider key</text>

  <!-- Gateway -->
  <rect x="270" y="115" width="200" height="90" rx="8" fill="#0f766e"/>
  <text x="370" y="140" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">LLM Gateway</text>
  <text x="370" y="158" font-size="9" fill="#ccfbf1" text-anchor="middle">auth, rate limit, meter</text>
  <text x="370" y="172" font-size="9" fill="#ccfbf1" text-anchor="middle">log prompt/response</text>
  <text x="370" y="186" font-size="9" fill="#ccfbf1" text-anchor="middle">route + fail over</text>

  <line x1="170" y1="83" x2="268" y2="135" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#lgArrowBlue)"/>
  <line x1="170" y1="153" x2="268" y2="158" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#lgArrowBlue)"/>
  <line x1="170" y1="222" x2="268" y2="182" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#lgArrowBlue)"/>

  <!-- Primary provider -->
  <rect x="560" y="70" width="150" height="55" rx="8" fill="#334155"/>
  <text x="635" y="93" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Primary provider</text>
  <text x="635" y="109" font-size="9" fill="#cbd5e1" text-anchor="middle">holds real API key</text>
  <line x1="470" y1="140" x2="558" y2="105" stroke="#0f766e" stroke-width="2" marker-end="url(#lgArrowTeal)"/>

  <!-- Backup provider -->
  <rect x="560" y="185" width="150" height="55" rx="8" fill="#b45309"/>
  <text x="635" y="208" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Backup provider</text>
  <text x="635" y="224" font-size="9" fill="#fef3c7" text-anchor="middle">used on failover</text>
  <line x1="470" y1="180" x2="558" y2="205" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#lgArrowAmber)"/>

  <rect x="230" y="255" width="280" height="45" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="370" y="273" font-size="9.5" fill="#334155" text-anchor="middle" font-weight="600">One place to rotate keys, cap spend,</text>
  <text x="370" y="287" font-size="9.5" fill="#334155" text-anchor="middle">and audit every prompt/response pair</text>

  <defs>
    <marker id="lgArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="lgArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="lgArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
