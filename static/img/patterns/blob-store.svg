<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>

  <text x="380" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">One object is split into chunks, striped across nodes, indexed by a manifest</text>

  <!-- Client -->
  <rect x="24" y="80" width="120" height="60" rx="8" fill="#1d4ed8"/>
  <text x="84" y="106" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="84" y="124" font-size="9" fill="#dbeafe" text-anchor="middle">PUT video.mp4</text>

  <!-- Metadata service -->
  <rect x="24" y="230" width="120" height="66" rx="8" fill="#334155"/>
  <text x="84" y="256" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Metadata</text>
  <text x="84" y="272" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">service</text>
  <text x="84" y="288" font-size="8" fill="#cbd5e1" text-anchor="middle">key → manifest</text>

  <!-- Storage coordinator (chunker) -->
  <rect x="220" y="120" width="150" height="70" rx="8" fill="#0f766e"/>
  <text x="295" y="148" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Chunker +</text>
  <text x="295" y="164" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">erasure coder</text>
  <text x="295" y="180" font-size="8" fill="#ccfbf1" text-anchor="middle">split → k data + m parity</text>

  <!-- client -> chunker -->
  <line x1="144" y1="110" x2="218" y2="140" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blBlue)"/>
  <!-- chunker -> metadata (write manifest) -->
  <line x1="240" y1="190" x2="120" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#blSlate)"/>
  <text x="150" y="212" font-size="8" fill="#334155" text-anchor="middle">write manifest</text>

  <!-- Storage nodes -->
  <g>
    <rect x="470" y="60" width="120" height="46" rx="7" fill="#15803d"/>
    <text x="530" y="80" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Node 1</text>
    <text x="530" y="96" font-size="8" fill="#dcfce7" text-anchor="middle">chunk d0</text>

    <rect x="470" y="120" width="120" height="46" rx="7" fill="#15803d"/>
    <text x="530" y="140" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Node 2</text>
    <text x="530" y="156" font-size="8" fill="#dcfce7" text-anchor="middle">chunk d1</text>

    <rect x="470" y="180" width="120" height="46" rx="7" fill="#15803d"/>
    <text x="530" y="200" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Node 3</text>
    <text x="530" y="216" font-size="8" fill="#dcfce7" text-anchor="middle">chunk d2</text>

    <rect x="470" y="240" width="120" height="46" rx="7" fill="#b45309"/>
    <text x="530" y="260" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Node 4</text>
    <text x="530" y="276" font-size="8" fill="#fde68a" text-anchor="middle">parity p0</text>
  </g>

  <line x1="370" y1="150" x2="468" y2="83" stroke="#0f766e" stroke-width="2" marker-end="url(#blTeal)"/>
  <line x1="370" y1="155" x2="468" y2="143" stroke="#0f766e" stroke-width="2" marker-end="url(#blTeal)"/>
  <line x1="370" y1="160" x2="468" y2="203" stroke="#0f766e" stroke-width="2" marker-end="url(#blTeal)"/>
  <line x1="370" y1="165" x2="468" y2="263" stroke="#b45309" stroke-width="2" marker-end="url(#blAmber)"/>

  <!-- durability note -->
  <rect x="620" y="60" width="118" height="226" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="679" y="80" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Durability</text>
  <text x="679" y="104" font-size="8" fill="#64748b" text-anchor="middle">RS(3,1) here:</text>
  <text x="679" y="120" font-size="8" fill="#64748b" text-anchor="middle">any 1 node can</text>
  <text x="679" y="132" font-size="8" fill="#64748b" text-anchor="middle">fail, object</text>
  <text x="679" y="144" font-size="8" fill="#64748b" text-anchor="middle">still rebuilds</text>
  <text x="679" y="168" font-size="8" fill="#64748b" text-anchor="middle">overhead 1.33x</text>
  <text x="679" y="188" font-size="8" fill="#64748b" text-anchor="middle">vs 2x replication</text>
  <text x="679" y="200" font-size="8" fill="#64748b" text-anchor="middle">for same fault</text>
  <text x="679" y="212" font-size="8" fill="#64748b" text-anchor="middle">tolerance</text>

  <rect x="24" y="330" width="712" height="34" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="351" font-size="9" fill="#334155" text-anchor="middle">Objects are immutable: an "update" writes a whole new object and a new manifest — never an in-place partial write</text>

  <defs>
    <marker id="blBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
    <marker id="blTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="blAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
    <marker id="blSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
  </defs>
</svg>
