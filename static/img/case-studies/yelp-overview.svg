<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Yelp: initial high-level design</text>

  <!-- Client -->
  <rect x="20" y="160" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="85" y="185" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="85" y="202" font-size="9" fill="#dbeafe" text-anchor="middle">search, view, review</text>

  <!-- Search service -->
  <rect x="220" y="70" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="295" y="95" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Search Service</text>
  <text x="295" y="112" font-size="9" fill="#ccfbf1" text-anchor="middle">nearby query + rank</text>

  <!-- Business service -->
  <rect x="220" y="160" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="295" y="185" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Business Service</text>
  <text x="295" y="202" font-size="9" fill="#ccfbf1" text-anchor="middle">listing CRUD</text>

  <!-- Review service -->
  <rect x="220" y="250" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="295" y="275" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Review Service</text>
  <text x="295" y="292" font-size="9" fill="#ccfbf1" text-anchor="middle">ratings + rolling avg</text>

  <line x1="150" y1="175" x2="218" y2="105" stroke="#1d4ed8" stroke-width="2" marker-end="url(#yArrowBlue)"/>
  <line x1="150" y1="190" x2="218" y2="190" stroke="#1d4ed8" stroke-width="2" marker-end="url(#yArrowBlue)"/>
  <line x1="150" y1="205" x2="218" y2="280" stroke="#1d4ed8" stroke-width="2" marker-end="url(#yArrowBlue)"/>

  <!-- Spatial index -->
  <rect x="440" y="70" width="160" height="60" rx="8" fill="#b45309"/>
  <text x="520" y="95" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Spatial Index</text>
  <text x="520" y="112" font-size="9" fill="#fde68a" text-anchor="middle">geo-cell -&gt; business ids</text>

  <!-- Business store -->
  <rect x="440" y="160" width="160" height="60" rx="8" fill="#334155"/>
  <text x="520" y="185" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Business Store</text>
  <text x="520" y="202" font-size="9" fill="#cbd5e1" text-anchor="middle">durable listing data</text>

  <!-- Review store -->
  <rect x="440" y="250" width="160" height="60" rx="8" fill="#334155"/>
  <text x="520" y="275" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Review Store</text>
  <text x="520" y="292" font-size="9" fill="#cbd5e1" text-anchor="middle">sharded by business_id</text>

  <line x1="370" y1="100" x2="438" y2="100" stroke="#0f766e" stroke-width="2" marker-end="url(#yArrowTeal)"/>
  <line x1="370" y1="190" x2="438" y2="190" stroke="#0f766e" stroke-width="2" marker-end="url(#yArrowTeal)"/>
  <line x1="370" y1="280" x2="438" y2="280" stroke="#0f766e" stroke-width="2" marker-end="url(#yArrowTeal)"/>

  <line x1="520" y1="220" x2="520" y2="248" stroke="#334155" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="520" y1="130" x2="520" y2="158" stroke="#334155" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="650" y="140" font-size="8" fill="#64748b">index rebuilt from</text>
  <text x="650" y="152" font-size="8" fill="#64748b">business store, async</text>

  <rect x="630" y="200" width="160" height="80" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="710" y="220" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Static points, not moving</text>
  <text x="710" y="235" font-size="9" fill="#334155" text-anchor="middle">vehicles: index is rebuilt</text>
  <text x="710" y="249" font-size="9" fill="#334155" text-anchor="middle">on rare listing changes,</text>
  <text x="710" y="263" font-size="9" fill="#334155" text-anchor="middle">not on a ping interval</text>

  <defs>
    <marker id="yArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="yArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
