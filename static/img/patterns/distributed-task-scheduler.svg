<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>

  <text x="380" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Leader dispatches from a durable job store; workers hold time-bounded leases per run</text>

  <!-- Scheduler instances -->
  <rect x="30" y="70" width="150" height="50" rx="8" fill="#0f766e"/>
  <text x="105" y="92" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Scheduler (leader)</text>
  <text x="105" y="108" font-size="9" fill="#ccfbf1" text-anchor="middle">dispatches due jobs</text>

  <rect x="30" y="132" width="150" height="50" rx="8" fill="#b45309"/>
  <text x="105" y="154" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Scheduler (standby)</text>
  <text x="105" y="170" font-size="9" fill="#fde68a" text-anchor="middle">idle until leader dies</text>

  <!-- coordination -->
  <rect x="30" y="200" width="150" height="46" rx="8" fill="#334155"/>
  <text x="105" y="221" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Leader election</text>
  <text x="105" y="236" font-size="8" fill="#cbd5e1" text-anchor="middle">consensus lock</text>
  <line x1="105" y1="120" x2="105" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="105" y1="182" x2="105" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- durable job store -->
  <rect x="250" y="96" width="150" height="90" rx="8" fill="#64748b"/>
  <text x="325" y="126" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Durable job store</text>
  <text x="325" y="144" font-size="9" fill="#e2e8f0" text-anchor="middle">due_at, state,</text>
  <text x="325" y="158" font-size="9" fill="#e2e8f0" text-anchor="middle">attempt, lease</text>
  <text x="325" y="174" font-size="9" fill="#e2e8f0" text-anchor="middle">run_id (unique)</text>

  <line x1="180" y1="95" x2="250" y2="120" stroke="#0f766e" stroke-width="2" marker-end="url(#dsTeal)"/>
  <text x="215" y="100" font-size="8" fill="#0f766e" text-anchor="middle">poll due</text>

  <!-- worker pool -->
  <rect x="470" y="70" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="545" y="90" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Worker A</text>
  <text x="545" y="106" font-size="9" fill="#dcfce7" text-anchor="middle">lease held · renews</text>

  <rect x="470" y="132" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="545" y="152" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Worker B</text>
  <text x="545" y="168" font-size="9" fill="#dcfce7" text-anchor="middle">idempotent handler</text>

  <rect x="470" y="194" width="150" height="50" rx="8" fill="#dc2626"/>
  <text x="545" y="214" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Worker C (crashed)</text>
  <text x="545" y="230" font-size="9" fill="#fee2e2" text-anchor="middle">lease expires → reclaim</text>

  <line x1="400" y1="130" x2="470" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#dsSlate)"/>
  <line x1="400" y1="140" x2="470" y2="157" stroke="#64748b" stroke-width="2" marker-end="url(#dsSlate)"/>
  <line x1="400" y1="150" x2="470" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#dsSlate)"/>
  <text x="435" y="120" font-size="8" fill="#64748b" text-anchor="middle">claim + fence</text>

  <!-- reclaim arc -->
  <path d="M545 244 Q660 250 660 165 Q660 120 622 105" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#dsRed)"/>
  <text x="690" y="180" font-size="8" fill="#dc2626" text-anchor="middle">reassign</text>
  <text x="690" y="192" font-size="8" fill="#dc2626" text-anchor="middle">to A</text>

  <!-- bottom notes -->
  <rect x="30" y="286" width="345" height="72" rx="8" fill="none" stroke="#0f766e" stroke-width="1.5"/>
  <text x="202" y="308" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="600">At-least-once + idempotency</text>
  <text x="202" y="326" font-size="9" fill="#334155" text-anchor="middle">a slow worker can lose its lease and have</text>
  <text x="202" y="340" font-size="9" fill="#334155" text-anchor="middle">the run picked up twice — dedupe on run_id</text>

  <rect x="395" y="286" width="335" height="72" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="562" y="308" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="600">Missed-run &amp; thundering herd</text>
  <text x="562" y="326" font-size="9" fill="#334155" text-anchor="middle">after downtime, fire the next slot ONCE and</text>
  <text x="562" y="340" font-size="9" fill="#334155" text-anchor="middle">realign — don't replay every missed slot at once</text>

  <defs>
    <marker id="dsTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="dsSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="dsRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
