<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">A full bounded buffer signals demand upstream so a fast producer slows to the consumer's rate</text>

  <!-- producer -->
  <rect x="30" y="120" width="140" height="70" rx="8" fill="#1d4ed8"/>
  <text x="100" y="150" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Producer</text>
  <text x="100" y="168" font-size="9" fill="#dbeafe" text-anchor="middle">fast (1000/s)</text>

  <!-- bounded buffer -->
  <rect x="250" y="105" width="240" height="100" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="370" y="98" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">bounded buffer (capacity 4)</text>
  <rect x="266" y="130" width="45" height="50" rx="4" fill="#b45309"/>
  <rect x="316" y="130" width="45" height="50" rx="4" fill="#b45309"/>
  <rect x="366" y="130" width="45" height="50" rx="4" fill="#b45309"/>
  <rect x="416" y="130" width="45" height="50" rx="4" fill="#b45309"/>
  <text x="370" y="197" font-size="9" fill="#b45309" text-anchor="middle">FULL</text>

  <!-- consumer -->
  <rect x="570" y="120" width="140" height="70" rx="8" fill="#0f766e"/>
  <text x="640" y="150" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Consumer</text>
  <text x="640" y="168" font-size="9" fill="#ccfbf1" text-anchor="middle">slow (100/s)</text>

  <!-- producer -> buffer -->
  <line x1="170" y1="155" x2="248" y2="155" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#bpArrowBlue)"/>
  <!-- buffer -> consumer -->
  <line x1="490" y1="155" x2="568" y2="155" stroke="#0f766e" stroke-width="2.5" marker-end="url(#bpArrowTeal)"/>

  <!-- demand signal (credit) upstream -->
  <path d="M568 190 Q 370 265 172 190" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#bpArrowSlate)"/>
  <text x="370" y="258" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">demand / credit signal: "send only what I can take"</text>

  <!-- block-on-full -->
  <rect x="30" y="215" width="140" height="40" rx="6" fill="#dc2626"/>
  <text x="100" y="233" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">send() blocks</text>
  <text x="100" y="247" font-size="8" fill="#fee2e2" text-anchor="middle">until a slot frees</text>

  <!-- last resort -->
  <rect x="250" y="285" width="240" height="38" rx="6" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="370" y="308" font-size="9" fill="#dc2626" text-anchor="middle">last resort: drop / sample / shed load if backpressure can't propagate</text>

  <defs>
    <marker id="bpArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="bpArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="bpArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
