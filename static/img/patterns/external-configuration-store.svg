<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Config lives outside the deployment package</text>

  <!-- app instances -->
  <rect x="30" y="60" width="130" height="55" rx="6" fill="#1d4ed8"/>
  <text x="95" y="83" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">App Instance A</text>
  <text x="95" y="100" font-size="9" fill="#dbeafe" text-anchor="middle">reads config at boot</text>

  <rect x="30" y="135" width="130" height="55" rx="6" fill="#1d4ed8"/>
  <text x="95" y="158" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">App Instance B</text>
  <text x="95" y="175" font-size="9" fill="#dbeafe" text-anchor="middle">polls for changes</text>

  <rect x="30" y="210" width="130" height="55" rx="6" fill="#1d4ed8"/>
  <text x="95" y="233" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">App Instance C</text>
  <text x="95" y="250" font-size="9" fill="#dbeafe" text-anchor="middle">live reload, no restart</text>

  <!-- config store -->
  <rect x="330" y="110" width="170" height="80" rx="8" fill="#0f766e"/>
  <text x="415" y="140" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Config Store</text>
  <text x="415" y="158" font-size="9" fill="#ccfbf1" text-anchor="middle">connection strings,</text>
  <text x="415" y="172" font-size="9" fill="#ccfbf1" text-anchor="middle">timeouts, tunables</text>

  <line x1="160" y1="88" x2="330" y2="130" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowEcs1)"/>
  <line x1="160" y1="162" x2="330" y2="155" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowEcs1)"/>
  <line x1="160" y1="237" x2="330" y2="175" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowEcs1)"/>

  <!-- operator updates live -->
  <rect x="590" y="110" width="140" height="60" rx="8" fill="#334155"/>
  <text x="660" y="136" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Operator</text>
  <text x="660" y="153" font-size="9" fill="#cbd5e1" text-anchor="middle">updates a value —</text>
  <text x="660" y="165" font-size="9" fill="#cbd5e1" text-anchor="middle">no redeploy needed</text>

  <line x1="590" y1="145" x2="502" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrowEcsSlate)"/>

  <!-- risk callout: critical dependency -->
  <rect x="270" y="230" width="290" height="55" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="415" y="252" font-size="10" fill="#b45309" text-anchor="middle">Store is now a critical runtime dependency —</text>
  <text x="415" y="267" font-size="10" fill="#b45309" text-anchor="middle">every instance depends on its availability</text>
  <line x1="415" y1="190" x2="415" y2="228" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>

  <defs>
    <marker id="arrowEcs1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowEcsSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
