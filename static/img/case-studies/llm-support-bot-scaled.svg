<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">LLM Support Bot: scaled design</text>

  <!-- Customers -->
  <rect x="20" y="190" width="100" height="55" rx="8" fill="#1d4ed8"/>
  <text x="70" y="213" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Customers</text>
  <text x="70" y="229" font-size="8" fill="#dbeafe" text-anchor="middle">multi-tenant</text>

  <!-- Semantic cache -->
  <rect x="160" y="190" width="130" height="55" rx="8" fill="#b45309"/>
  <text x="225" y="211" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Semantic Cache</text>
  <text x="225" y="226" font-size="8" fill="#fde68a" text-anchor="middle">per-tenant scoped</text>

  <line x1="120" y1="217" x2="158" y2="217" stroke="#1d4ed8" stroke-width="2" marker-end="url(#lsssArrowBlue)"/>

  <!-- Tenant shards -->
  <rect x="330" y="80" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="405" y="101" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Tenant A Index</text>
  <text x="405" y="116" font-size="8" fill="#dcfce7" text-anchor="middle">isolated shard</text>

  <rect x="330" y="150" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="405" y="171" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Tenant B Index</text>
  <text x="405" y="186" font-size="8" fill="#dcfce7" text-anchor="middle">isolated shard</text>

  <rect x="330" y="220" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="405" y="241" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Tenant N Index</text>
  <text x="405" y="256" font-size="8" fill="#dcfce7" text-anchor="middle">isolated shard</text>

  <line x1="290" y1="215" x2="330" y2="105" stroke="#0f766e" stroke-width="2" marker-end="url(#lsssArrowTeal)"/>
  <line x1="290" y1="217" x2="330" y2="175" stroke="#0f766e" stroke-width="2" marker-end="url(#lsssArrowTeal)"/>
  <line x1="290" y1="220" x2="330" y2="245" stroke="#0f766e" stroke-width="2" marker-end="url(#lsssArrowTeal)"/>

  <!-- Generation tier -->
  <rect x="540" y="150" width="140" height="50" rx="8" fill="#0f766e"/>
  <text x="610" y="171" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Generation Tier</text>
  <text x="610" y="186" font-size="8" fill="#ccfbf1" text-anchor="middle">steady, modest fleet</text>

  <line x1="480" y1="175" x2="538" y2="175" stroke="#0f766e" stroke-width="2" marker-end="url(#lsssArrowTeal)"/>

  <!-- Escalation, fail-safe -->
  <rect x="540" y="280" width="140" height="60" rx="8" fill="#b45309"/>
  <text x="610" y="303" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Escalation Queue</text>
  <text x="610" y="318" font-size="8" fill="#fde68a" text-anchor="middle">fails safe, not silent</text>
  <text x="610" y="331" font-size="8" fill="#fde68a" text-anchor="middle">never auto-answers</text>

  <line x1="610" y1="200" x2="610" y2="278" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#lsssArrowAmber)"/>

  <!-- Re-index pipeline -->
  <rect x="330" y="330" width="150" height="50" rx="8" fill="#334155"/>
  <text x="405" y="351" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Re-index Pipeline</text>
  <text x="405" y="366" font-size="8" fill="#cbd5e1" text-anchor="middle">incremental, continuous</text>

  <line x1="405" y1="330" x2="405" y2="272" stroke="#334155" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#lsssArrowSlate)"/>

  <rect x="700" y="60" width="140" height="220" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="770" y="80" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Green = per-tenant</text>
  <text x="770" y="94" font-size="9" fill="#334155" text-anchor="middle">shard: same key used</text>
  <text x="770" y="108" font-size="9" fill="#334155" text-anchor="middle">for both capacity and</text>
  <text x="770" y="122" font-size="9" fill="#334155" text-anchor="middle">strict isolation — one</text>
  <text x="770" y="136" font-size="9" fill="#334155" text-anchor="middle">tenant's docs must</text>
  <text x="770" y="150" font-size="9" fill="#334155" text-anchor="middle">never surface in</text>
  <text x="770" y="164" font-size="9" fill="#334155" text-anchor="middle">another tenant's</text>
  <text x="770" y="178" font-size="9" fill="#334155" text-anchor="middle">retrieval results</text>

  <defs>
    <marker id="lsssArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="lsssArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="lsssArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="lsssArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
