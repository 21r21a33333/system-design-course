<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Clients only ever see the proxy — never a backend's real address</text>

  <!-- Client -->
  <rect x="30" y="130" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="95" y="156" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="95" y="174" font-size="9" fill="#dbeafe" text-anchor="middle">HTTPS to public host</text>

  <!-- Reverse proxy (the pattern) -->
  <rect x="280" y="120" width="180" height="80" rx="8" fill="#0f766e"/>
  <text x="370" y="148" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Reverse Proxy</text>
  <text x="370" y="166" font-size="9" fill="#ccfbf1" text-anchor="middle">TLS termination, caching,</text>
  <text x="370" y="180" font-size="9" fill="#ccfbf1" text-anchor="middle">routing by host/path</text>

  <line x1="160" y1="160" x2="278" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#rpArrowBlue)"/>

  <!-- backend 1 -->
  <rect x="590" y="60" width="140" height="55" rx="8" fill="#334155"/>
  <text x="660" y="84" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Backend A</text>
  <text x="660" y="101" font-size="9" fill="#cbd5e1" text-anchor="middle">10.0.1.4 (private)</text>

  <!-- backend 2 -->
  <rect x="590" y="130" width="140" height="55" rx="8" fill="#334155"/>
  <text x="660" y="154" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Backend B</text>
  <text x="660" y="171" font-size="9" fill="#cbd5e1" text-anchor="middle">10.0.1.5 (private)</text>

  <!-- static cache hit path -->
  <rect x="590" y="210" width="140" height="55" rx="8" fill="#b45309"/>
  <text x="660" y="234" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Cache</text>
  <text x="660" y="251" font-size="9" fill="#fde68a" text-anchor="middle">served, backend skipped</text>

  <line x1="460" y1="150" x2="588" y2="95" stroke="#0f766e" stroke-width="2" marker-end="url(#rpArrowTeal)"/>
  <line x1="460" y1="160" x2="588" y2="157" stroke="#0f766e" stroke-width="2" marker-end="url(#rpArrowTeal)"/>
  <line x1="460" y1="175" x2="588" y2="230" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="30" y="260" width="410" height="40" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="235" y="277" font-size="9" fill="#334155" text-anchor="middle">backend address, count, and health are hidden</text>
  <text x="235" y="292" font-size="9" fill="#334155" text-anchor="middle">from the client entirely — proxy is the only public face</text>

  <defs>
    <marker id="rpArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="rpArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
