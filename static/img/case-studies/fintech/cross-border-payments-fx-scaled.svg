<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="460" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Cross-border FX platform at scale: many local rails, one internal FX position book</text>

  <!-- clients -->
  <rect x="20" y="70" width="130" height="52" rx="8" fill="#1d4ed8"/>
  <text x="85" y="92" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Merchant / payer</text>
  <text x="85" y="108" font-size="9" fill="#dbeafe" text-anchor="middle">API-first checkout</text>

  <rect x="20" y="140" width="130" height="52" rx="8" fill="#1d4ed8"/>
  <text x="85" y="162" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Beneficiary</text>
  <text x="85" y="178" font-size="9" fill="#dbeafe" text-anchor="middle">local payout target</text>

  <!-- API gateway -->
  <rect x="200" y="100" width="120" height="64" rx="8" fill="#0f766e"/>
  <text x="260" y="126" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">API gateway</text>
  <text x="260" y="142" font-size="9" fill="#ccfbf1" text-anchor="middle">region-routed,</text>
  <text x="260" y="154" font-size="9" fill="#ccfbf1" text-anchor="middle">idempotent quotes</text>

  <!-- Quote/FX service -->
  <rect x="370" y="60" width="150" height="60" rx="8" fill="#6d28d9"/>
  <text x="445" y="84" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Quote + FX service</text>
  <text x="445" y="100" font-size="9" fill="#ede9fe" text-anchor="middle">mid-rate feed,</text>
  <text x="445" y="112" font-size="9" fill="#ede9fe" text-anchor="middle">spread, rate lock</text>

  <!-- Ledger / FX book -->
  <rect x="370" y="150" width="150" height="64" rx="8" fill="#6d28d9"/>
  <text x="445" y="176" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Ledger + FX book</text>
  <text x="445" y="192" font-size="9" fill="#ede9fe" text-anchor="middle">double-entry, integer</text>
  <text x="445" y="204" font-size="9" fill="#ede9fe" text-anchor="middle">minor units, position</text>

  <!-- Compliance -->
  <rect x="370" y="244" width="150" height="56" rx="8" fill="#be123c"/>
  <text x="445" y="268" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Compliance / AML</text>
  <text x="445" y="284" font-size="9" fill="#fecdd3" text-anchor="middle">screening, limits</text>

  <!-- Local rail adapters -->
  <rect x="580" y="60" width="210" height="46" rx="8" fill="#b45309"/>
  <text x="685" y="80" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">GBP rail adapter (UK, FPS)</text>
  <text x="685" y="96" font-size="9" fill="#fde68a" text-anchor="middle">pre-funded local account</text>

  <rect x="580" y="120" width="210" height="46" rx="8" fill="#b45309"/>
  <text x="685" y="140" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">USD rail adapter (US, ACH/RTP)</text>
  <text x="685" y="156" font-size="9" fill="#fde68a" text-anchor="middle">pre-funded local account</text>

  <rect x="580" y="180" width="210" height="46" rx="8" fill="#b45309"/>
  <text x="685" y="200" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">EUR rail adapter (EU, SEPA)</text>
  <text x="685" y="216" font-size="9" fill="#fde68a" text-anchor="middle">pre-funded local account</text>

  <!-- Rebalance / settlement -->
  <rect x="580" y="244" width="210" height="56" rx="8" fill="#0f766e"/>
  <text x="685" y="268" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Treasury rebalancing</text>
  <text x="685" y="284" font-size="9" fill="#ccfbf1" text-anchor="middle">tops up drifting local pools</text>

  <!-- Reconciliation bar -->
  <rect x="200" y="340" width="590" height="52" rx="8" fill="#334155"/>
  <text x="495" y="362" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Reconciliation: bank statements vs internal ledger, PvP settlement risk checks (CLS-style)</text>
  <text x="495" y="378" font-size="9" fill="#cbd5e1" text-anchor="middle">FX book must net to zero across currencies at the mid-rate; spread is booked as margin, not created money</text>

  <!-- arrows -->
  <line x1="150" y1="96" x2="198" y2="120" stroke="#1d4ed8" stroke-width="2" marker-end="url(#cbxsArrowBlue)"/>
  <line x1="150" y1="166" x2="198" y2="144" stroke="#1d4ed8" stroke-width="2" marker-end="url(#cbxsArrowBlue)"/>
  <line x1="320" y1="120" x2="368" y2="96" stroke="#0f766e" stroke-width="2" marker-end="url(#cbxsArrowTeal)"/>
  <line x1="320" y1="140" x2="368" y2="176" stroke="#0f766e" stroke-width="2" marker-end="url(#cbxsArrowTeal)"/>
  <line x1="445" y1="120" x2="445" y2="148" stroke="#6d28d9" stroke-width="2" marker-end="url(#cbxsArrowViolet)"/>
  <line x1="445" y1="214" x2="445" y2="242" stroke="#be123c" stroke-width="2" marker-end="url(#cbxsArrowRose)"/>
  <line x1="520" y1="176" x2="578" y2="90" stroke="#b45309" stroke-width="2" marker-end="url(#cbxsArrowAmber)"/>
  <line x1="520" y1="182" x2="578" y2="150" stroke="#b45309" stroke-width="2" marker-end="url(#cbxsArrowAmber)"/>
  <line x1="520" y1="196" x2="578" y2="203" stroke="#b45309" stroke-width="2" marker-end="url(#cbxsArrowAmber)"/>
  <line x1="520" y1="272" x2="578" y2="272" stroke="#0f766e" stroke-width="2" marker-end="url(#cbxsArrowTeal)"/>

  <!-- reconciliation feeds -->
  <line x1="445" y1="214" x2="445" y2="338" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#cbxsArrowSlate)"/>
  <line x1="685" y1="300" x2="685" y2="338" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#cbxsArrowSlate)"/>

  <defs>
    <marker id="cbxsArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="cbxsArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="cbxsArrowViolet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6d28d9"/>
    </marker>
    <marker id="cbxsArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="cbxsArrowRose" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#be123c"/>
    </marker>
    <marker id="cbxsArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
