<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>

  <defs>
    <marker id="tadArrowGray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="380" y="22" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">No technique is free: stronger cross-datacenter consistency costs write latency</text>

  <!-- Axes -->
  <line x1="90" y1="300" x2="700" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#tadArrowGray)"/>
  <line x1="90" y1="300" x2="90" y2="55" stroke="#64748b" stroke-width="1.5" marker-end="url(#tadArrowGray)"/>
  <text x="395" y="325" font-size="10" fill="#475569" text-anchor="middle">cross-datacenter consistency &amp; transaction support -&gt;</text>
  <text x="68" y="175" font-size="10" fill="#475569" text-anchor="middle" transform="rotate(-90 68 175)">write latency cost -&gt;</text>

  <!-- Backups -->
  <rect x="105" y="272" width="120" height="42" rx="6" fill="#334155"/>
  <text x="165" y="290" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Backups</text>
  <text x="165" y="304" font-size="8" fill="#cbd5e1" text-anchor="middle">offline, weak</text>

  <!-- Primary-Replica -->
  <rect x="255" y="248" width="150" height="46" rx="6" fill="#0f766e"/>
  <text x="330" y="267" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Primary-Replica</text>
  <text x="330" y="282" font-size="8" fill="#ccfbf1" text-anchor="middle">async, one writer</text>

  <!-- Multi-Master -->
  <rect x="255" y="185" width="150" height="46" rx="6" fill="#0f766e"/>
  <text x="330" y="204" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Multi-Master</text>
  <text x="330" y="219" font-size="8" fill="#ccfbf1" text-anchor="middle">async, every writer</text>

  <!-- Two-Phase Commit -->
  <rect x="470" y="100" width="150" height="46" rx="6" fill="#1d4ed8"/>
  <text x="545" y="119" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Two-Phase Commit</text>
  <text x="545" y="134" font-size="8" fill="#dbeafe" text-anchor="middle">sync, one coordinator</text>

  <!-- Paxos -->
  <rect x="470" y="62" width="150" height="30" rx="6" fill="#1d4ed8"/>
  <text x="545" y="81" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Paxos: sync, quorum</text>

  <text x="700" y="290" font-size="8" fill="#94400e" text-anchor="end" fill-opacity="0.8">stronger &amp; slower -&gt;</text>
</svg>
