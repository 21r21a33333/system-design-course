<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="780" height="380" fill="#ffffff"/>

  <text x="390" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Pull-based metrics: server scrapes instances → time-series DB → rules → alerts/dashboards</text>

  <!-- instrumented instances -->
  <rect x="24" y="70" width="140" height="44" rx="8" fill="#1d4ed8"/>
  <text x="94" y="90" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Instance /metrics</text>
  <text x="94" y="105" font-size="9" fill="#dbeafe" text-anchor="middle">counters, gauges</text>

  <rect x="24" y="128" width="140" height="44" rx="8" fill="#1d4ed8"/>
  <text x="94" y="148" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Instance /metrics</text>
  <text x="94" y="163" font-size="9" fill="#dbeafe" text-anchor="middle">histograms</text>

  <rect x="24" y="186" width="140" height="44" rx="8" fill="#1d4ed8"/>
  <text x="94" y="206" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Instance /metrics</text>
  <text x="94" y="221" font-size="9" fill="#dbeafe" text-anchor="middle">labels = name+tags</text>

  <!-- monitoring server -->
  <rect x="222" y="118" width="140" height="94" rx="8" fill="#0f766e"/>
  <text x="292" y="150" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Monitoring server</text>
  <text x="292" y="168" font-size="9" fill="#ccfbf1" text-anchor="middle">pull / scrape</text>
  <text x="292" y="182" font-size="9" fill="#ccfbf1" text-anchor="middle">every 15s</text>
  <text x="292" y="200" font-size="9" fill="#ccfbf1" text-anchor="middle">service discovery</text>

  <line x1="222" y1="150" x2="164" y2="92" stroke="#0f766e" stroke-width="2" marker-end="url(#dmBlueA)"/>
  <line x1="222" y1="165" x2="164" y2="150" stroke="#0f766e" stroke-width="2" marker-end="url(#dmBlueA)"/>
  <line x1="222" y1="180" x2="164" y2="208" stroke="#0f766e" stroke-width="2" marker-end="url(#dmBlueA)"/>
  <text x="193" y="112" font-size="8" fill="#0f766e" text-anchor="middle">scrape</text>

  <!-- TSDB -->
  <rect x="420" y="70" width="150" height="70" rx="8" fill="#334155"/>
  <text x="495" y="96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Time-series DB</text>
  <text x="495" y="113" font-size="9" fill="#cbd5e1" text-anchor="middle">1 series per</text>
  <text x="495" y="127" font-size="9" fill="#cbd5e1" text-anchor="middle">name+label set</text>

  <!-- downsample -->
  <rect x="420" y="160" width="150" height="52" rx="8" fill="#64748b"/>
  <text x="495" y="182" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Downsample</text>
  <text x="495" y="197" font-size="8" fill="#e2e8f0" text-anchor="middle">raw→5m→1h rollups</text>

  <line x1="362" y1="150" x2="420" y2="110" stroke="#0f766e" stroke-width="2" marker-end="url(#dmTeal)"/>
  <line x1="495" y1="140" x2="495" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#dmSlate)"/>

  <!-- alerting -->
  <rect x="620" y="70" width="140" height="70" rx="8" fill="#b45309"/>
  <text x="690" y="96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Alerting rules</text>
  <text x="690" y="113" font-size="8" fill="#fde68a" text-anchor="middle">RED / USE thresholds</text>
  <text x="690" y="127" font-size="8" fill="#fde68a" text-anchor="middle">for-duration guard</text>

  <rect x="620" y="160" width="140" height="52" rx="8" fill="#dc2626"/>
  <text x="690" y="182" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Fire → notify</text>
  <text x="690" y="197" font-size="8" fill="#fee2e2" text-anchor="middle">page / dashboard</text>

  <line x1="570" y1="105" x2="620" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#dmSlate)"/>
  <line x1="690" y1="140" x2="690" y2="160" stroke="#b45309" stroke-width="2" marker-end="url(#dmAmber)"/>

  <!-- three pillars strip -->
  <rect x="24" y="264" width="736" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="60" y="288" font-size="10" fill="#0f766e" text-anchor="start" font-weight="600">Three pillars:</text>
  <text x="170" y="288" font-size="10" fill="#334155" text-anchor="start">metrics (what/how much)  ·  logs (what happened)  ·  traces (where in the request path)</text>

  <!-- cardinality warning -->
  <rect x="24" y="316" width="736" height="44" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="392" y="335" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="600">Cardinality explosion: a high-cardinality label (user_id, request_id) creates a new series per value</text>
  <text x="392" y="351" font-size="9" fill="#334155" text-anchor="middle">memory and index cost grow with the product of all label cardinalities — keep labels bounded</text>

  <defs>
    <marker id="dmBlueA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="dmTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="dmSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
    <marker id="dmAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
  </defs>
</svg>
