<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>

  <text x="380" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Waterfall view: each span offset by start time, width by duration</text>

  <!-- time axis -->
  <line x1="230" y1="52" x2="730" y2="52" stroke="#cbd5e1" stroke-width="1"/>
  <text x="230" y="46" font-size="8" fill="#64748b" text-anchor="middle">0 ms</text>
  <text x="480" y="46" font-size="8" fill="#64748b" text-anchor="middle">150 ms</text>
  <text x="730" y="46" font-size="8" fill="#64748b" text-anchor="middle">300 ms</text>

  <!-- rows: label left, bar right. scale: 300ms over 500px => 1.667 px/ms, x0=230 -->
  <!-- root: GET /checkout 0..300 -->
  <text x="20" y="74" font-size="10" fill="#334155">GET /checkout</text>
  <rect x="230" y="64" width="500" height="16" rx="3" fill="#1d4ed8"/>
  <text x="238" y="76" font-size="9" fill="#ffffff">root span · 300 ms</text>

  <!-- auth 5..45 -->
  <text x="30" y="98" font-size="10" fill="#334155">auth-service</text>
  <rect x="238" y="88" width="67" height="16" rx="3" fill="#0f766e"/>
  <text x="246" y="100" font-size="9" fill="#ffffff">40 ms</text>

  <!-- cart 50..270 -->
  <text x="30" y="122" font-size="10" fill="#334155">cart-service</text>
  <rect x="313" y="112" width="367" height="16" rx="3" fill="#0f766e"/>
  <text x="321" y="124" font-size="9" fill="#ffffff">220 ms</text>

  <!-- db.query 60..250 (child of cart) -->
  <text x="40" y="146" font-size="10" fill="#334155">db.query</text>
  <rect x="330" y="136" width="317" height="16" rx="3" fill="#b45309"/>
  <text x="338" y="148" font-size="9" fill="#ffffff">190 ms · self-time (bottleneck)</text>

  <!-- callout -->
  <rect x="30" y="176" width="700" height="52" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1"/>
  <text x="46" y="196" font-size="10" fill="#b45309" font-weight="600">Reading the waterfall</text>
  <text x="46" y="212" font-size="9" fill="#334155">The amber db.query bar dominates cart-service's width: its high self-time means the latency lives in the query,</text>
  <text x="46" y="224" font-size="9" fill="#334155">not the network hops. auth-service ran early and off the critical path, so speeding it up would not help.</text>

  <rect x="30" y="246" width="700" height="40" rx="8" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="380" y="264" font-size="9" fill="#64748b" text-anchor="middle">Clock skew across hosts can make a child appear to start before its parent —</text>
  <text x="380" y="277" font-size="9" fill="#64748b" text-anchor="middle">collectors normalize timestamps to the trace start to keep the tree consistent.</text>
</svg>
