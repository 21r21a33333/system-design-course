<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Cache owns the loader — application only ever calls get()</text>

  <!-- Application -->
  <rect x="30" y="130" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="95" y="156" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Application</text>
  <text x="95" y="174" font-size="9" fill="#dbeafe" text-anchor="middle">calls get(key) only</text>

  <!-- Cache (contains loader) -->
  <rect x="300" y="90" width="220" height="140" rx="10" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="410" y="112" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">Cache</text>

  <rect x="320" y="125" width="180" height="40" rx="6" fill="#0f766e"/>
  <text x="410" y="150" font-size="10" fill="#ffffff" text-anchor="middle">key-value storage</text>

  <rect x="320" y="180" width="180" height="40" rx="6" fill="#b45309"/>
  <text x="410" y="200" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">loader (on miss)</text>
  <text x="410" y="213" font-size="8" fill="#fef3c7" text-anchor="middle">configured once, at construction</text>

  <!-- Store -->
  <rect x="590" y="150" width="140" height="60" rx="8" fill="#334155"/>
  <text x="660" y="176" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Store</text>
  <text x="660" y="194" font-size="9" fill="#cbd5e1" text-anchor="middle">source of truth</text>

  <!-- app -> cache -->
  <line x1="160" y1="160" x2="298" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowRt1)"/>
  <text x="230" y="150" font-size="9" fill="#1d4ed8" text-anchor="middle">get(key)</text>

  <!-- cache -> app return -->
  <line x1="298" y1="175" x2="160" y2="175" stroke="#0f766e" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRtTeal)"/>
  <text x="230" y="192" font-size="9" fill="#0f766e" text-anchor="middle">value (hit or resolved miss)</text>

  <!-- loader -> store -->
  <line x1="500" y1="200" x2="588" y2="188" stroke="#b45309" stroke-width="2" marker-end="url(#arrowRtAmber)"/>
  <text x="555" y="222" font-size="9" fill="#b45309" text-anchor="middle">on miss</text>

  <line x1="588" y1="175" x2="500" y2="190" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- coalescing note -->
  <rect x="30" y="240" width="700" height="55" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="262" font-size="10" fill="#64748b" text-anchor="middle">Because the loader is centralized, concurrent misses for the same key can be</text>
  <text x="380" y="277" font-size="10" fill="#64748b" text-anchor="middle">coalesced into one load — a natural fit for cache stampede prevention</text>

  <defs>
    <marker id="arrowRt1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowRtTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowRtAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
