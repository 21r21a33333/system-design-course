<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Google Maps: initial high-level design</text>

  <!-- Navigating client -->
  <rect x="20" y="150" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="85" y="175" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Navigating Client</text>
  <text x="85" y="192" font-size="9" fill="#dbeafe" text-anchor="middle">route request, pings</text>

  <!-- Tile service -->
  <rect x="220" y="60" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="295" y="85" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Tile Service</text>
  <text x="295" y="102" font-size="9" fill="#ccfbf1" text-anchor="middle">static map rendering</text>

  <!-- Routing service -->
  <rect x="220" y="150" width="150" height="65" rx="8" fill="#0f766e"/>
  <text x="295" y="175" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Routing Service</text>
  <text x="295" y="192" font-size="9" fill="#ccfbf1" text-anchor="middle">shortest-path search</text>
  <text x="295" y="205" font-size="9" fill="#ccfbf1" text-anchor="middle">over road graph</text>

  <!-- ETA / re-route monitor -->
  <rect x="220" y="245" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="295" y="270" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">ETA / Re-route</text>
  <text x="295" y="287" font-size="9" fill="#ccfbf1" text-anchor="middle">Monitor</text>

  <line x1="150" y1="170" x2="218" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#gmArrowBlue)"/>
  <line x1="150" y1="180" x2="218" y2="182" stroke="#1d4ed8" stroke-width="2" marker-end="url(#gmArrowBlue)"/>
  <line x1="150" y1="195" x2="218" y2="270" stroke="#1d4ed8" stroke-width="2" marker-end="url(#gmArrowBlue)"/>

  <!-- Road graph store -->
  <rect x="440" y="60" width="150" height="55" rx="8" fill="#334155"/>
  <text x="515" y="83" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Road Graph</text>
  <text x="515" y="100" font-size="9" fill="#cbd5e1" text-anchor="middle">nodes + edges, in-memory</text>

  <!-- Traffic layer -->
  <rect x="440" y="150" width="150" height="55" rx="8" fill="#b45309"/>
  <text x="515" y="173" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Traffic Layer</text>
  <text x="515" y="190" font-size="9" fill="#fde68a" text-anchor="middle">live per-edge speeds</text>

  <!-- Traffic ingestion pipeline -->
  <rect x="440" y="240" width="150" height="60" rx="8" fill="#b45309"/>
  <text x="515" y="263" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Traffic Ingestion</text>
  <text x="515" y="280" font-size="9" fill="#fde68a" text-anchor="middle">async ping aggregation</text>

  <line x1="370" y1="90" x2="438" y2="88" stroke="#0f766e" stroke-width="2" marker-end="url(#gmArrowTeal)"/>
  <line x1="370" y1="175" x2="438" y2="85" stroke="#0f766e" stroke-width="2" marker-end="url(#gmArrowTeal)"/>
  <line x1="370" y1="182" x2="438" y2="177" stroke="#0f766e" stroke-width="2" marker-end="url(#gmArrowTeal)"/>
  <line x1="370" y1="270" x2="438" y2="270" stroke="#0f766e" stroke-width="2" marker-end="url(#gmArrowTeal)"/>

  <line x1="150" y1="200" x2="440" y2="265" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#gmArrowAmber)"/>
  <text x="230" y="235" font-size="9" fill="#b45309">position pings</text>

  <line x1="515" y1="205" x2="515" y2="238" stroke="#b45309" stroke-width="2" marker-end="url(#gmArrowAmber)"/>
  <text x="540" y="225" font-size="9" fill="#b45309">updates</text>

  <!-- Map data / tile blob -->
  <rect x="650" y="60" width="140" height="55" rx="8" fill="#334155"/>
  <text x="720" y="83" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Tile Blob Store</text>
  <text x="720" y="100" font-size="9" fill="#cbd5e1" text-anchor="middle">behind CDN</text>

  <line x1="590" y1="88" x2="648" y2="88" stroke="#334155" stroke-width="2" marker-end="url(#gmArrowSlate)"/>

  <rect x="620" y="150" width="170" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="705" y="170" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Routing reads graph +</text>
  <text x="705" y="184" font-size="9" fill="#334155" text-anchor="middle">traffic layer together per</text>
  <text x="705" y="198" font-size="9" fill="#334155" text-anchor="middle">query, both in memory</text>

  <defs>
    <marker id="gmArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="gmArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="gmArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="gmArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
