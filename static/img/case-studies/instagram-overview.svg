<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Instagram: initial high-level design</text>

  <!-- Client -->
  <rect x="20" y="150" width="120" height="55" rx="8" fill="#1d4ed8"/>
  <text x="80" y="173" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="80" y="190" font-size="9" fill="#dbeafe" text-anchor="middle">upload / view feed</text>

  <!-- Post service -->
  <rect x="190" y="90" width="140" height="55" rx="8" fill="#0f766e"/>
  <text x="260" y="113" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Post Service</text>
  <text x="260" y="130" font-size="9" fill="#ccfbf1" text-anchor="middle">upload, metadata</text>

  <!-- Feed service -->
  <rect x="190" y="210" width="140" height="55" rx="8" fill="#0f766e"/>
  <text x="260" y="233" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Feed Service</text>
  <text x="260" y="250" font-size="9" fill="#ccfbf1" text-anchor="middle">read feed store</text>

  <line x1="140" y1="165" x2="188" y2="130" stroke="#1d4ed8" stroke-width="2" marker-end="url(#igArrowBlue)"/>
  <line x1="140" y1="185" x2="188" y2="235" stroke="#1d4ed8" stroke-width="2" marker-end="url(#igArrowBlue)"/>

  <!-- Fan-out service -->
  <rect x="380" y="90" width="140" height="55" rx="8" fill="#0f766e"/>
  <text x="450" y="113" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Fan-Out Service</text>
  <text x="450" y="130" font-size="9" fill="#ccfbf1" text-anchor="middle">push post refs</text>

  <line x1="330" y1="117" x2="378" y2="117" stroke="#0f766e" stroke-width="2" marker-end="url(#igArrowTeal)"/>

  <!-- Social graph -->
  <rect x="380" y="210" width="140" height="55" rx="8" fill="#334155"/>
  <text x="450" y="233" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Social Graph</text>
  <text x="450" y="250" font-size="9" fill="#cbd5e1" text-anchor="middle">follower lists</text>

  <line x1="450" y1="145" x2="450" y2="208" stroke="#0f766e" stroke-width="2" marker-end="url(#igArrowTeal)"/>

  <!-- Feed store -->
  <rect x="570" y="150" width="140" height="55" rx="8" fill="#334155"/>
  <text x="640" y="173" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Feed Store</text>
  <text x="640" y="190" font-size="9" fill="#cbd5e1" text-anchor="middle">precomputed lists</text>

  <line x1="520" y1="117" x2="640" y2="148" stroke="#0f766e" stroke-width="2" marker-end="url(#igArrowTeal)"/>
  <line x1="330" y1="235" x2="568" y2="185" stroke="#0f766e" stroke-width="2" marker-end="url(#igArrowTeal)"/>

  <!-- Post store -->
  <rect x="190" y="300" width="140" height="55" rx="8" fill="#334155"/>
  <text x="260" y="323" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Post Store</text>
  <text x="260" y="340" font-size="9" fill="#cbd5e1" text-anchor="middle">metadata rows</text>

  <line x1="260" y1="145" x2="260" y2="298" stroke="#0f766e" stroke-width="2" marker-end="url(#igArrowTeal)"/>

  <!-- Blob store + CDN -->
  <rect x="570" y="60" width="140" height="55" rx="8" fill="#b45309"/>
  <text x="640" y="83" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Blob Store + CDN</text>
  <text x="640" y="100" font-size="9" fill="#fde68a" text-anchor="middle">image variants</text>

  <line x1="330" y1="105" x2="568" y2="90" stroke="#b45309" stroke-width="2" marker-end="url(#igArrowAmber)"/>

  <!-- Counters -->
  <rect x="570" y="300" width="140" height="55" rx="8" fill="#334155"/>
  <text x="640" y="323" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Counters</text>
  <text x="640" y="340" font-size="9" fill="#cbd5e1" text-anchor="middle">sharded likes/comments</text>

  <rect x="20" y="300" width="140" height="55" rx="8" fill="#1d4ed8" opacity="0.001"/>

  <rect x="20" y="365" width="750" height="28" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="395" y="384" font-size="9" fill="#334155" text-anchor="middle">Write path: post -&gt; blob+metadata -&gt; fan-out to followers' feed store. Read path: feed store lookup only.</text>

  <defs>
    <marker id="igArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="igArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="igArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
