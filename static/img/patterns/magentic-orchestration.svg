<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Orchestrator plans, delegates, observes results, and re-plans — roster and order are not fixed</text>

  <!-- Client -->
  <rect x="20" y="135" width="90" height="50" rx="8" fill="#1d4ed8"/>
  <text x="65" y="157" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="65" y="173" font-size="8" fill="#dbeafe" text-anchor="middle">open task</text>

  <!-- Orchestrator (central, retains control) -->
  <circle cx="290" cy="160" r="60" fill="#334155"/>
  <text x="290" y="150" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Orchestrator</text>
  <text x="290" y="165" font-size="8" fill="#cbd5e1" text-anchor="middle">plan +</text>
  <text x="290" y="177" font-size="8" fill="#cbd5e1" text-anchor="middle">re-plan loop</text>

  <line x1="110" y1="160" x2="228" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#maArrowBlue)"/>

  <!-- Specialist 1 - always engaged first -->
  <rect x="470" y="40" width="140" height="50" rx="8" fill="#0f766e"/>
  <text x="540" y="61" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Diagnostics</text>
  <text x="540" y="76" font-size="8" fill="#ccfbf1" text-anchor="middle">specialist</text>

  <!-- Specialist 2 - dynamically added -->
  <rect x="470" y="135" width="140" height="50" rx="8" fill="#0f766e"/>
  <text x="540" y="156" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Code Review</text>
  <text x="540" y="171" font-size="8" fill="#ccfbf1" text-anchor="middle">added after re-plan</text>

  <!-- Specialist 3 - dynamically added, dashed = uncertain / conditional -->
  <rect x="470" y="230" width="140" height="50" rx="8" fill="#0f766e" opacity="0.6"/>
  <text x="540" y="251" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Capacity</text>
  <text x="540" y="266" font-size="8" fill="#ccfbf1" text-anchor="middle">may not be invoked</text>

  <!-- Dynamic dashed delegation lines -->
  <line x1="350" y1="130" x2="468" y2="70" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#maArrowAmber)"/>
  <text x="410" y="90" font-size="8" fill="#b45309" text-anchor="middle">delegate</text>

  <line x1="468" y1="80" x2="350" y2="145" stroke="#0f766e" stroke-width="2" marker-end="url(#maArrowTeal)"/>
  <text x="430" y="115" font-size="8" fill="#0f766e" text-anchor="middle">result → re-plan</text>

  <line x1="350" y1="165" x2="468" y2="160" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#maArrowAmber)"/>

  <line x1="350" y1="190" x2="468" y2="255" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="410" y="215" font-size="8" fill="#94a3b8" text-anchor="middle" font-style="italic">only if plan requires it</text>

  <rect x="20" y="270" width="700" height="35" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="370" y="292" font-size="9" fill="#334155" text-anchor="middle">orchestrator never relinquishes control — it delegates and receives results back, bounded by a max re-plan count</text>

  <defs>
    <marker id="maArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="maArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="maArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
