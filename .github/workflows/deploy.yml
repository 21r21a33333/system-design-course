name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # package-lock.json was generated with npm 11 locally. Node 20's
      # bundled npm (~10.x) fails `npm ci`'s package.json/lockfile
      # sync-check on it immediately (in ~1s, before installing anything)
      # even though the dependency graph itself is fine — pin a matching
      # npm major version explicitly rather than relying on whatever
      # setup-node's Node version happens to bundle.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
