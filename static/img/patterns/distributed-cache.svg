<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>

  <text x="380" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Keys hash to one owning node; a local L1 shields the cluster from hot keys</text>

  <!-- App instance with L1 -->
  <rect x="24" y="120" width="150" height="90" rx="8" fill="#1d4ed8"/>
  <text x="99" y="146" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">App instance</text>
  <rect x="40" y="158" width="118" height="40" rx="6" fill="#ffffff" opacity="0.9"/>
  <text x="99" y="176" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="600">L1 local cache</text>
  <text x="99" y="190" font-size="8" fill="#1e40af" text-anchor="middle">hottest keys only</text>

  <!-- routing layer -->
  <rect x="250" y="140" width="120" height="60" rx="8" fill="#334155"/>
  <text x="310" y="166" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Hash router</text>
  <text x="310" y="184" font-size="8" fill="#cbd5e1" text-anchor="middle">consistent hashing</text>

  <line x1="174" y1="170" x2="248" y2="170" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#dcBlue)"/>
  <text x="211" y="160" font-size="8" fill="#1d4ed8" text-anchor="middle">L1 miss</text>

  <!-- cluster nodes -->
  <rect x="470" y="60" width="130" height="50" rx="7" fill="#0f766e"/>
  <text x="535" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Cache node 1</text>
  <text x="535" y="98" font-size="8" fill="#ccfbf1" text-anchor="middle">slice of keyspace</text>

  <rect x="470" y="128" width="130" height="50" rx="7" fill="#dc2626"/>
  <text x="535" y="150" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Cache node 2</text>
  <text x="535" y="166" font-size="8" fill="#fee2e2" text-anchor="middle">holds the hot key</text>

  <rect x="470" y="196" width="130" height="50" rx="7" fill="#0f766e"/>
  <text x="535" y="218" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Cache node 3</text>
  <text x="535" y="234" font-size="8" fill="#ccfbf1" text-anchor="middle">slice of keyspace</text>

  <line x1="370" y1="160" x2="468" y2="88" stroke="#334155" stroke-width="2" marker-end="url(#dcSlate)"/>
  <line x1="370" y1="170" x2="468" y2="152" stroke="#dc2626" stroke-width="2.5" marker-end="url(#dcRed)"/>
  <line x1="370" y1="180" x2="468" y2="218" stroke="#334155" stroke-width="2" marker-end="url(#dcSlate)"/>
  <text x="420" y="130" font-size="8" fill="#dc2626" text-anchor="middle">skewed load</text>

  <!-- hot-key replica -->
  <rect x="470" y="264" width="130" height="42" rx="7" fill="#15803d"/>
  <text x="535" y="284" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">hot-key replica</text>
  <text x="535" y="298" font-size="8" fill="#dcfce7" text-anchor="middle">spreads read load</text>
  <line x1="600" y1="153" x2="600" y2="264" stroke="#15803d" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#dcGreen)"/>

  <rect x="24" y="320" width="712" height="30" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="339" font-size="9" fill="#334155" text-anchor="middle">One key per node keeps coherence trivial; on a node loss its keys are missing (a miss), not stale</text>

  <defs>
    <marker id="dcBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
    <marker id="dcSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
    <marker id="dcRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
    <marker id="dcGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/></marker>
  </defs>
</svg>
