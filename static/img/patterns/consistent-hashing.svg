<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="480" height="480" fill="#ffffff"/>

  <text x="240" y="26" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">A key is owned by the first node clockwise on the ring</text>

  <!-- ring -->
  <circle cx="240" cy="250" r="150" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- clockwise arrow hint -->
  <path d="M 240 92 A 158 158 0 0 1 300 108" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#chArrowSlate)"/>
  <text x="330" y="120" font-size="9" fill="#94a3b8" text-anchor="middle">clockwise</text>

  <!-- Node A (top) teal -->
  <circle cx="240" cy="100" r="13" fill="#0f766e"/>
  <text x="240" y="82" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="600">Node A</text>

  <!-- Node B (bottom-right) teal -->
  <circle cx="370" cy="325" r="13" fill="#0f766e"/>
  <text x="404" y="330" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="600">Node B</text>

  <!-- Node C (bottom-left) teal -->
  <circle cx="110" cy="325" r="13" fill="#0f766e"/>
  <text x="76" y="330" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="600">Node C</text>

  <!-- Key k1 (upper right) blue -> owned by B -->
  <circle cx="352" cy="175" r="8" fill="#1d4ed8"/>
  <text x="372" y="168" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="600">k1</text>
  <path d="M 358 181 A 150 150 0 0 1 375 312" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#chArrowBlue)"/>

  <!-- Key k2 (bottom) blue -> owned by C -->
  <circle cx="200" cy="396" r="8" fill="#1d4ed8"/>
  <text x="200" y="418" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="600">k2</text>
  <path d="M 191 393 A 150 150 0 0 1 120 336" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#chArrowBlue)"/>

  <!-- new Node D (left) amber, added -->
  <circle cx="90" cy="230" r="13" fill="#b45309"/>
  <text x="52" y="234" font-size="11" fill="#b45309" text-anchor="middle" font-weight="600">Node D</text>
  <text x="52" y="250" font-size="8.5" fill="#b45309" text-anchor="middle">(added)</text>

  <!-- key k3 near D, only these keys move -->
  <circle cx="98" cy="175" r="8" fill="#b45309"/>
  <text x="82" y="165" font-size="10" fill="#b45309" text-anchor="middle" font-weight="600">k3</text>
  <path d="M 96 183 A 150 150 0 0 0 84 218" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#chArrowAmber)"/>

  <!-- legend / caption box -->
  <rect x="40" y="446" width="400" height="26" rx="6" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <text x="240" y="463" font-size="9" fill="#334155" text-anchor="middle">Adding Node D reassigns only the arc between it and Node C (k3) — everything else is untouched</text>

  <defs>
    <marker id="chArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
    <marker id="chArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="chArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
