<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">A thread blocks on each I/O call in sequence instead of yielding while it waits</text>

  <rect x="30" y="55" width="150" height="115" rx="8" fill="#dc2626"/>
  <text x="105" y="76" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Thread (blocked)</text>
  <text x="105" y="96" font-size="9" fill="#fee2e2" text-anchor="middle">fetch profile — wait</text>
  <text x="105" y="112" font-size="9" fill="#fee2e2" text-anchor="middle">fetch orders — wait</text>
  <text x="105" y="128" font-size="9" fill="#fee2e2" text-anchor="middle">fetch recs — wait</text>
  <text x="105" y="150" font-size="9" fill="#ffe4b5" text-anchor="middle" font-weight="600">sum of all 3 waits</text>

  <line x1="180" y1="112" x2="230" y2="112" stroke="#dc2626" stroke-width="2" marker-end="url(#sioArrowRed)"/>

  <rect x="232" y="90" width="150" height="70" rx="8" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="307" y="110" font-size="9" fill="#b45309" text-anchor="middle" font-weight="600">Thread Pool</text>
  <text x="307" y="128" font-size="8" fill="#334155" text-anchor="middle">CPU idle, threads</text>
  <text x="307" y="141" font-size="8" fill="#334155" text-anchor="middle">pinned near 100%</text>

  <rect x="420" y="55" width="290" height="115" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="565" y="76" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">Sequential blocking calls</text>
  <rect x="435" y="88" width="80" height="18" rx="3" fill="#dc2626"/>
  <text x="475" y="101" font-size="7" fill="#ffffff" text-anchor="middle">profile</text>
  <rect x="520" y="88" width="80" height="18" rx="3" fill="#dc2626"/>
  <text x="560" y="101" font-size="7" fill="#ffffff" text-anchor="middle">orders</text>
  <rect x="605" y="88" width="90" height="18" rx="3" fill="#dc2626"/>
  <text x="650" y="101" font-size="7" fill="#ffffff" text-anchor="middle">recs</text>
  <text x="565" y="120" font-size="8" fill="#334155" text-anchor="middle">total latency = t1 + t2 + t3</text>
  <text x="565" y="135" font-size="8" fill="#334155" text-anchor="middle">even though none depends</text>
  <text x="565" y="148" font-size="8" fill="#334155" text-anchor="middle">on the others' results</text>

  <!-- fix inset -->
  <rect x="30" y="195" width="700" height="105" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="380" y="214" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="600">THE FIX — concurrent async calls</text>

  <rect x="55" y="228" width="120" height="55" rx="6" fill="#0f766e"/>
  <text x="115" y="250" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">async fn</text>
  <text x="115" y="264" font-size="7" fill="#ccfbf1" text-anchor="middle">thread free to</text>
  <text x="115" y="275" font-size="7" fill="#ccfbf1" text-anchor="middle">serve others</text>

  <line x1="175" y1="242" x2="240" y2="235" stroke="#0f766e" stroke-width="1.5" marker-end="url(#sioArrowTeal)"/>
  <line x1="175" y1="255" x2="240" y2="255" stroke="#0f766e" stroke-width="1.5" marker-end="url(#sioArrowTeal)"/>
  <line x1="175" y1="268" x2="240" y2="275" stroke="#0f766e" stroke-width="1.5" marker-end="url(#sioArrowTeal)"/>

  <rect x="242" y="228" width="100" height="20" rx="3" fill="#0f766e"/>
  <text x="292" y="242" font-size="7" fill="#ffffff" text-anchor="middle">profile fut</text>
  <rect x="242" y="252" width="100" height="20" rx="3" fill="#0f766e"/>
  <text x="292" y="266" font-size="7" fill="#ffffff" text-anchor="middle">orders fut</text>
  <rect x="242" y="276" width="100" height="20" rx="3" fill="#0f766e"/>
  <text x="292" y="290" font-size="7" fill="#ffffff" text-anchor="middle">recs fut</text>

  <text x="480" y="245" font-size="8" fill="#334155" text-anchor="middle">all three run concurrently —</text>
  <text x="480" y="258" font-size="8" fill="#334155" text-anchor="middle">total latency ≈ max(t1, t2, t3)</text>
  <text x="480" y="271" font-size="8" fill="#334155" text-anchor="middle">not the sum</text>

  <defs>
    <marker id="sioArrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="sioArrowTeal" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
