<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="460" fill="#ffffff"/>

  <text x="410" y="24" font-size="13" fill="#334155" text-anchor="middle" font-weight="600">Scaled: many independent narrow fast paths, one per venue, colocated</text>

  <!-- Venue A feeds -->
  <rect x="20" y="70" width="120" height="70" rx="8" fill="#1d4ed8"/>
  <text x="80" y="94" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Venue A</text>
  <text x="80" y="110" font-size="9" fill="#dbeafe" text-anchor="middle">feed A + feed B</text>
  <text x="80" y="124" font-size="9" fill="#dbeafe" text-anchor="middle">redundant multicast</text>

  <!-- Venue B feeds -->
  <rect x="20" y="200" width="120" height="70" rx="8" fill="#1d4ed8"/>
  <text x="80" y="224" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Venue B</text>
  <text x="80" y="240" font-size="9" fill="#dbeafe" text-anchor="middle">feed A + feed B</text>
  <text x="80" y="254" font-size="9" fill="#dbeafe" text-anchor="middle">redundant multicast</text>

  <!-- Colo boundary -->
  <rect x="175" y="55" width="400" height="330" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="375" y="74" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">Colocation cage at the exchange</text>

  <!-- FPGA card A -->
  <rect x="200" y="90" width="350" height="58" rx="8" fill="#6d28d9"/>
  <text x="375" y="112" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">FPGA card A: parse to book to strategy to risk to emit</text>
  <text x="375" y="128" font-size="8" fill="#ede9fe" text-anchor="middle">independent tick-to-trade pipeline for Venue A instruments</text>
  <text x="375" y="140" font-size="8" fill="#ede9fe" text-anchor="middle">A/B gap arbitration inline</text>

  <!-- FPGA card B -->
  <rect x="200" y="200" width="350" height="58" rx="8" fill="#6d28d9"/>
  <text x="375" y="222" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">FPGA card B: parse to book to strategy to risk to emit</text>
  <text x="375" y="238" font-size="8" fill="#ede9fe" text-anchor="middle">independent tick-to-trade pipeline for Venue B instruments</text>
  <text x="375" y="250" font-size="8" fill="#ede9fe" text-anchor="middle">A/B gap arbitration inline</text>

  <!-- risk kill-switch bar -->
  <rect x="200" y="300" width="350" height="46" rx="8" fill="#be123c"/>
  <text x="375" y="320" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Hardware kill-switch + price/size/position gates (circuit breaker)</text>
  <text x="375" y="335" font-size="8" fill="#fecdd3" text-anchor="middle">host can halt all outbound orders in a single register write</text>

  <!-- Exchange match engines out -->
  <rect x="610" y="90" width="120" height="58" rx="8" fill="#b45309"/>
  <text x="670" y="114" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Venue A match</text>
  <text x="670" y="131" font-size="8" fill="#fde68a" text-anchor="middle">order entry</text>

  <rect x="610" y="200" width="120" height="58" rx="8" fill="#b45309"/>
  <text x="670" y="224" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Venue B match</text>
  <text x="670" y="241" font-size="8" fill="#fde68a" text-anchor="middle">order entry</text>

  <!-- Host fleet -->
  <rect x="610" y="300" width="180" height="82" rx="8" fill="#0f766e"/>
  <text x="700" y="322" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Host fleet (slow path)</text>
  <text x="700" y="338" font-size="8" fill="#ccfbf1" text-anchor="middle">position + P&amp;L, portfolio risk</text>
  <text x="700" y="351" font-size="8" fill="#ccfbf1" text-anchor="middle">capture + PTP timestamps</text>
  <text x="700" y="364" font-size="8" fill="#ccfbf1" text-anchor="middle">bitstream mgmt (canary)</text>

  <!-- arrows feed -> card -->
  <line x1="140" y1="105" x2="198" y2="115" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fpgaScaleBlue)"/>
  <line x1="140" y1="235" x2="198" y2="225" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fpgaScaleBlue)"/>

  <!-- card -> exchange out -->
  <line x1="550" y1="119" x2="608" y2="119" stroke="#b45309" stroke-width="2" marker-end="url(#fpgaScaleAmber)"/>
  <line x1="550" y1="229" x2="608" y2="229" stroke="#b45309" stroke-width="2" marker-end="url(#fpgaScaleAmber)"/>

  <!-- cards -> risk bar -->
  <line x1="375" y1="148" x2="375" y2="200" stroke="#be123c" stroke-width="1.5" marker-end="url(#fpgaScaleRed)"/>
  <line x1="420" y1="258" x2="420" y2="298" stroke="#be123c" stroke-width="1.5" marker-end="url(#fpgaScaleRed)"/>

  <!-- host -> cards config (PCIe) -->
  <line x1="610" y1="330" x2="552" y2="322" stroke="#0f766e" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#fpgaScaleTeal)"/>
  <text x="580" y="316" font-size="8" fill="#0f766e" text-anchor="middle">params, limits, capture (PCIe)</text>

  <!-- note -->
  <rect x="20" y="400" width="780" height="48" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="410" y="420" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Scale is more venues, instruments, and strategies, each a bounded fast path, not more throughput on one path.</text>
  <text x="410" y="436" font-size="9" fill="#334155" text-anchor="middle">Parameter changes are instant register writes; a new strategy is a slow bitstream release, canaried against captured market data first.</text>

  <defs>
    <marker id="fpgaScaleBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="fpgaScaleTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="fpgaScaleAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="fpgaScaleRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#be123c"/>
    </marker>
  </defs>
</svg>
