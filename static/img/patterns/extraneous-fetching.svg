<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Fetching an entire wide row when only a couple of fields are used</text>

  <rect x="30" y="55" width="120" height="50" rx="8" fill="#1d4ed8"/>
  <text x="90" y="77" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Dashboard</text>
  <text x="90" y="93" font-size="9" fill="#dbeafe" text-anchor="middle">needs name + id</text>

  <line x1="150" y1="80" x2="288" y2="80" stroke="#dc2626" stroke-width="2.5" marker-end="url(#efArrowRed)"/>
  <text x="219" y="70" font-size="9" fill="#dc2626" text-anchor="middle">SELECT *</text>

  <rect x="290" y="45" width="200" height="140" rx="8" fill="#dc2626"/>
  <text x="390" y="66" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Full Row</text>
  <text x="390" y="83" font-size="9" fill="#ffe4b5" text-anchor="middle">id ✓ used</text>
  <text x="390" y="97" font-size="9" fill="#ffe4b5" text-anchor="middle">name ✓ used</text>
  <text x="390" y="112" font-size="9" fill="#fecaca" text-anchor="middle">bio ✗ unused</text>
  <text x="390" y="127" font-size="9" fill="#fecaca" text-anchor="middle">address ✗ unused</text>
  <text x="390" y="142" font-size="9" fill="#fecaca" text-anchor="middle">preferences_json ✗ unused</text>
  <text x="390" y="157" font-size="9" fill="#fecaca" text-anchor="middle">login_history[] ✗ unused</text>
  <text x="390" y="175" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="600">most of the payload discarded</text>

  <rect x="530" y="70" width="190" height="90" rx="8" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="625" y="90" font-size="10" fill="#b45309" text-anchor="middle" font-weight="600">Payload Size</text>
  <rect x="545" y="102" width="160" height="14" rx="3" fill="#fee2e2"/>
  <rect x="545" y="102" width="24" height="14" rx="3" fill="#0f766e"/>
  <text x="625" y="132" font-size="8" fill="#334155" text-anchor="middle">~12% of bytes transferred</text>
  <text x="625" y="145" font-size="8" fill="#334155" text-anchor="middle">actually rendered</text>

  <!-- fix inset -->
  <rect x="30" y="200" width="700" height="100" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="380" y="220" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="600">THE FIX — a narrow projection matched to the call site</text>

  <rect x="55" y="235" width="130" height="45" rx="6" fill="#1d4ed8"/>
  <text x="120" y="255" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Dashboard</text>
  <text x="120" y="269" font-size="8" fill="#dbeafe" text-anchor="middle">needs name + id</text>

  <line x1="185" y1="257" x2="290" y2="257" stroke="#0f766e" stroke-width="2" marker-end="url(#efArrowTeal)"/>
  <text x="237" y="248" font-size="8" fill="#0f766e" text-anchor="middle">SELECT id, name</text>

  <rect x="292" y="235" width="180" height="45" rx="6" fill="#0f766e"/>
  <text x="382" y="255" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">UserSummary</text>
  <text x="382" y="269" font-size="8" fill="#ccfbf1" text-anchor="middle">only the 2 fields used</text>

  <defs>
    <marker id="efArrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <marker id="efArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
