<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Money rarely moves: banks update ledgers, then settle net at the central bank</text>

  <!-- Bank A -->
  <rect x="40" y="70" width="150" height="66" rx="8" fill="#1d4ed8"/>
  <text x="115" y="96" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Bank A</text>
  <text x="115" y="113" font-size="9" fill="#dbeafe" text-anchor="middle">records: owes Bank B</text>
  <text x="115" y="126" font-size="9" fill="#dbeafe" text-anchor="middle">100 today</text>

  <!-- Bank B -->
  <rect x="630" y="70" width="150" height="66" rx="8" fill="#1d4ed8"/>
  <text x="705" y="96" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Bank B</text>
  <text x="705" y="113" font-size="9" fill="#dbeafe" text-anchor="middle">records: owes Bank A</text>
  <text x="705" y="126" font-size="9" fill="#dbeafe" text-anchor="middle">90 today</text>

  <!-- Payment flow all day -->
  <line x1="192" y1="90" x2="628" y2="90" stroke="#0f766e" stroke-width="2" marker-end="url(#bnkArrowTeal)"/>
  <line x1="628" y1="116" x2="192" y2="116" stroke="#0f766e" stroke-width="2" marker-end="url(#bnkArrowTeal)"/>
  <text x="410" y="84" font-size="9" fill="#0f766e" text-anchor="middle">thousands of payments each way, all day (no money moves)</text>

  <!-- Netting box -->
  <rect x="285" y="180" width="250" height="60" rx="8" fill="#6d28d9"/>
  <text x="410" y="205" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Multilateral netting</text>
  <text x="410" y="222" font-size="9" fill="#ede9fe" text-anchor="middle">A owes 100, B owes 90 to net 10 A owes B</text>

  <line x1="115" y1="136" x2="330" y2="178" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#bnkArrowViolet)"/>
  <line x1="705" y1="136" x2="490" y2="178" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#bnkArrowViolet)"/>

  <!-- Central bank -->
  <rect x="285" y="300" width="250" height="72" rx="8" fill="#b45309"/>
  <text x="410" y="328" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Central bank (the Fed)</text>
  <text x="410" y="345" font-size="9" fill="#fde68a" text-anchor="middle">holds each bank's master account</text>
  <text x="410" y="358" font-size="9" fill="#fde68a" text-anchor="middle">debit A's balance 10, credit B's balance 10 to final</text>

  <line x1="410" y1="240" x2="410" y2="298" stroke="#b45309" stroke-width="2" marker-end="url(#bnkArrowAmber)"/>
  <text x="500" y="272" font-size="9" fill="#b45309" text-anchor="middle">settle only the net difference, once</text>

  <!-- note box -->
  <rect x="40" y="300" width="215" height="100" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="147" y="322" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Book transfer: if payer and payee</text>
  <text x="147" y="336" font-size="9" fill="#334155" text-anchor="middle">bank at the SAME bank, no rail is</text>
  <text x="147" y="350" font-size="9" fill="#334155" text-anchor="middle">used at all: two internal ledger</text>
  <text x="147" y="364" font-size="9" fill="#334155" text-anchor="middle">updates. Gross rails (Fedwire) skip</text>
  <text x="147" y="378" font-size="9" fill="#334155" text-anchor="middle">netting and settle each payment.</text>

  <rect x="565" y="300" width="215" height="100" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="672" y="322" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">No direct relationship or cross</text>
  <text x="672" y="336" font-size="9" fill="#334155" text-anchor="middle">border: a correspondent bank in the</text>
  <text x="672" y="350" font-size="9" fill="#334155" text-anchor="middle">middle holds nostro/vostro accounts.</text>
  <text x="672" y="364" font-size="9" fill="#334155" text-anchor="middle">SWIFT carries the instruction; money</text>
  <text x="672" y="378" font-size="9" fill="#334155" text-anchor="middle">moves link by link, not end to end.</text>

  <defs>
    <marker id="bnkArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="bnkArrowViolet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6d28d9"/>
    </marker>
    <marker id="bnkArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
