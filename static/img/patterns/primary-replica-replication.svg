<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">All writes hit the primary; replicas apply the same log to converge behind it</text>

  <!-- Client -->
  <rect x="30" y="120" width="120" height="60" rx="8" fill="#1d4ed8"/>
  <text x="90" y="146" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="90" y="164" font-size="9" fill="#dbeafe" text-anchor="middle">writes + reads</text>

  <!-- Primary -->
  <rect x="280" y="120" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="355" y="146" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Primary</text>
  <text x="355" y="164" font-size="9" fill="#ccfbf1" text-anchor="middle">accepts all writes</text>

  <!-- Replica 1 -->
  <rect x="560" y="50" width="150" height="55" rx="8" fill="#334155"/>
  <text x="635" y="74" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Replica 1</text>
  <text x="635" y="92" font-size="9" fill="#cbd5e1" text-anchor="middle">read traffic</text>

  <!-- Replica 2 -->
  <rect x="560" y="200" width="150" height="55" rx="8" fill="#334155"/>
  <text x="635" y="224" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Replica 2</text>
  <text x="635" y="242" font-size="9" fill="#cbd5e1" text-anchor="middle">read traffic</text>

  <!-- client -> primary -->
  <line x1="150" y1="140" x2="278" y2="140" stroke="#1d4ed8" stroke-width="2" marker-end="url(#prArrowBlue)"/>
  <text x="215" y="130" font-size="9" fill="#1d4ed8" text-anchor="middle">write</text>

  <!-- primary -> replica1 async -->
  <line x1="430" y1="130" x2="558" y2="85" stroke="#b45309" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#prArrowAmber)"/>
  <text x="500" y="98" font-size="9" fill="#b45309" text-anchor="middle">replicate (async)</text>

  <!-- primary -> replica2 async -->
  <line x1="430" y1="155" x2="558" y2="215" stroke="#b45309" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#prArrowAmber)"/>
  <text x="500" y="205" font-size="9" fill="#b45309" text-anchor="middle">replicate (async)</text>

  <!-- client reads from replica -->
  <line x1="90" y1="182" x2="620" y2="248" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="380" y="290" font-size="9" fill="#64748b" text-anchor="middle">reads may be spread across replicas — each may lag the primary slightly</text>

  <defs>
    <marker id="prArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="prArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
