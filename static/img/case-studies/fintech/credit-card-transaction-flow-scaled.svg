<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ccsArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="ccsArrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#be123c"/>
    </marker>
  </defs>

  <rect width="820" height="470" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Scaled card authorization: parallel auth path plus a nightly clearing and settlement batch</text>

  <!-- Terminals -->
  <rect x="24" y="70" width="120" height="54" rx="8" fill="#0f766e"/>
  <text x="84" y="92" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Terminals + POS</text>
  <text x="84" y="108" font-size="9" fill="#ccfbf1" text-anchor="middle">tap, chip, online</text>

  <!-- Acquirer processor -->
  <rect x="188" y="70" width="132" height="54" rx="8" fill="#b45309"/>
  <text x="254" y="92" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Acquirer processor</text>
  <text x="254" y="108" font-size="9" fill="#fde68a" text-anchor="middle">ISO 8583 endpoint, routes by BIN</text>

  <!-- Network switch cluster -->
  <rect x="360" y="60" width="150" height="74" rx="8" fill="#6d28d9"/>
  <text x="435" y="86" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Network switch</text>
  <text x="435" y="102" font-size="9" fill="#ede9fe" text-anchor="middle">regionally sharded,</text>
  <text x="435" y="114" font-size="9" fill="#ede9fe" text-anchor="middle">2 to 3 s timeout budget</text>

  <!-- Issuer auth systems -->
  <rect x="556" y="60" width="140" height="74" rx="8" fill="#be123c"/>
  <text x="626" y="84" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Issuer auth core</text>
  <text x="626" y="100" font-size="9" fill="#fecdd3" text-anchor="middle">verifies ARQC, credit,</text>
  <text x="626" y="112" font-size="9" fill="#fecdd3" text-anchor="middle">fraud scoring, holds funds</text>

  <!-- STIP -->
  <rect x="556" y="164" width="140" height="52" rx="8" fill="#334155"/>
  <text x="626" y="186" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Stand-in (STIP)</text>
  <text x="626" y="202" font-size="9" fill="#cbd5e1" text-anchor="middle">answers when issuer is down</text>

  <!-- flow arrows auth -->
  <line x1="144" y1="97" x2="186" y2="97" stroke="#475569" stroke-width="2" marker-end="url(#ccsArrowSlate)"/>
  <line x1="320" y1="97" x2="358" y2="97" stroke="#475569" stroke-width="2" marker-end="url(#ccsArrowSlate)"/>
  <line x1="510" y1="97" x2="554" y2="97" stroke="#475569" stroke-width="2" marker-end="url(#ccsArrowSlate)"/>
  <line x1="510" y1="120" x2="556" y2="180" stroke="#be123c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ccsArrowRed)"/>
  <text x="512" y="158" font-size="8.5" fill="#be123c" text-anchor="middle">issuer timeout</text>

  <!-- risk / fraud sidecar -->
  <rect x="360" y="164" width="150" height="52" rx="8" fill="#1d4ed8"/>
  <text x="435" y="186" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Fraud / risk models</text>
  <text x="435" y="202" font-size="9" fill="#dbeafe" text-anchor="middle">real-time scoring in budget</text>
  <line x1="435" y1="134" x2="435" y2="162" stroke="#475569" stroke-width="1.6" marker-end="url(#ccsArrowSlate)"/>

  <!-- Clearing/settlement batch band -->
  <rect x="24" y="270" width="672" height="170" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="360" y="294" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Nightly clearing and settlement batch (T+1 to T+2)</text>

  <rect x="48" y="312" width="150" height="52" rx="8" fill="#0f766e"/>
  <text x="123" y="334" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Capture / presentment</text>
  <text x="123" y="350" font-size="8.5" fill="#ccfbf1" text-anchor="middle">merchant batches captures</text>

  <rect x="238" y="312" width="150" height="52" rx="8" fill="#6d28d9"/>
  <text x="313" y="334" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Netting engine</text>
  <text x="313" y="350" font-size="8.5" fill="#ede9fe" text-anchor="middle">nets issuer vs acquirer</text>

  <rect x="428" y="312" width="150" height="52" rx="8" fill="#b45309"/>
  <text x="503" y="334" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Settlement bank</text>
  <text x="503" y="350" font-size="8.5" fill="#fde68a" text-anchor="middle">moves net funds</text>

  <rect x="238" y="384" width="340" height="44" rx="8" fill="#be123c"/>
  <text x="408" y="404" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Merchant is paid: amount minus interchange minus scheme and acquirer fees</text>
  <text x="408" y="418" font-size="8.5" fill="#fecdd3" text-anchor="middle">reconciliation matches auth holds to captured clearing records</text>

  <line x1="198" y1="338" x2="236" y2="338" stroke="#475569" stroke-width="2" marker-end="url(#ccsArrowSlate)"/>
  <line x1="388" y1="338" x2="426" y2="338" stroke="#475569" stroke-width="2" marker-end="url(#ccsArrowSlate)"/>
  <line x1="313" y1="364" x2="360" y2="382" stroke="#475569" stroke-width="1.8" marker-end="url(#ccsArrowSlate)"/>

  <line x1="254" y1="124" x2="150" y2="310" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="150" y="250" font-size="8.5" fill="#64748b" text-anchor="middle">approved auths flow into the batch later</text>
</svg>
