<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="180" y="28" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700">Choreography</text>
  <text x="540" y="28" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700">Orchestration (for contrast)</text>
  <line x1="360" y1="15" x2="360" y2="345" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Choreography side: services react to events, no coordinator -->
  <rect x="30" y="55" width="90" height="55" rx="8" fill="#0f766e"/>
  <text x="75" y="86" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Service A</text>

  <rect x="140" y="140" width="90" height="55" rx="8" fill="#0f766e"/>
  <text x="185" y="171" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Service B</text>

  <rect x="30" y="225" width="90" height="55" rx="8" fill="#0f766e"/>
  <text x="75" y="256" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Service C</text>

  <!-- event bus in the middle-left -->
  <rect x="140" y="55" width="90" height="55" rx="6" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="185" y="78" font-size="9" fill="#334155" text-anchor="middle">event:</text>
  <text x="185" y="92" font-size="9" fill="#334155" text-anchor="middle">"A done"</text>

  <rect x="30" y="140" width="90" height="55" rx="6" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="75" y="163" font-size="9" fill="#334155" text-anchor="middle">event:</text>
  <text x="75" y="177" font-size="9" fill="#334155" text-anchor="middle">"B done"</text>

  <!-- arrows: A publishes -> B subscribes; B publishes -> C subscribes -->
  <line x1="120" y1="82" x2="138" y2="82" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowChTeal)"/>
  <line x1="185" y1="110" x2="185" y2="138" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowChTeal)"/>
  <line x1="140" y1="167" x2="122" y2="167" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowChTeal)"/>
  <line x1="75" y1="195" x2="75" y2="223" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowChTeal)"/>

  <text x="180" y="310" font-size="9" fill="#0f766e" text-anchor="middle">no central coordinator —</text>
  <text x="180" y="323" font-size="9" fill="#0f766e" text-anchor="middle">each service reacts to the last event</text>

  <!-- Orchestration side: central coordinator calls each service -->
  <rect x="490" y="140" width="100" height="55" rx="8" fill="#334155"/>
  <text x="540" y="163" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Orchestrator</text>
  <text x="540" y="178" font-size="8" fill="#cbd5e1" text-anchor="middle">tracks state</text>

  <rect x="400" y="55" width="80" height="50" rx="8" fill="#94a3b8"/>
  <text x="440" y="84" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Service X</text>

  <rect x="630" y="55" width="80" height="50" rx="8" fill="#94a3b8"/>
  <text x="670" y="84" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Service Y</text>

  <rect x="490" y="245" width="100" height="50" rx="8" fill="#94a3b8"/>
  <text x="540" y="274" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Service Z</text>

  <line x1="500" y1="140" x2="450" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#arrowChGray)"/>
  <line x1="580" y1="140" x2="660" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#arrowChGray)"/>
  <line x1="540" y1="195" x2="540" y2="243" stroke="#334155" stroke-width="2" marker-end="url(#arrowChGray)"/>

  <text x="540" y="325" font-size="9" fill="#334155" text-anchor="middle">one component calls each step and</text>
  <text x="540" y="338" font-size="9" fill="#334155" text-anchor="middle">knows the whole sequence — a shared dependency</text>

  <defs>
    <marker id="arrowChTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowChGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
