<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="460" fill="#ffffff"/>

  <defs>
    <marker id="s10msArrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="s10msArrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="s10msArrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="s10msArrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text x="410" y="22" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">5-10 million users: multi-AZ, service-oriented, event-driven</text>

  <!-- Clients -->
  <rect x="20" y="60" width="100" height="50" rx="8" fill="#1d4ed8"/>
  <text x="70" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Clients</text>
  <text x="70" y="97" font-size="8" fill="#dbeafe" text-anchor="middle">web / mobile</text>

  <!-- CloudFront -->
  <rect x="160" y="60" width="120" height="50" rx="8" fill="#1d4ed8"/>
  <text x="220" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">CloudFront</text>
  <text x="220" y="97" font-size="8" fill="#dbeafe" text-anchor="middle">CDN, ~199 PoPs</text>
  <line x1="120" y1="85" x2="158" y2="85" stroke="#1d4ed8" stroke-width="2" marker-end="url(#s10msArrowBlue)"/>

  <!-- S3 static -->
  <rect x="160" y="130" width="120" height="45" rx="8" fill="#334155"/>
  <text x="220" y="150" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">S3</text>
  <text x="220" y="164" font-size="8" fill="#cbd5e1" text-anchor="middle">static assets</text>
  <line x1="220" y1="110" x2="220" y2="128" stroke="#334155" stroke-width="1.5" marker-end="url(#s10msArrowSlate)"/>

  <!-- ALB -->
  <rect x="330" y="60" width="130" height="50" rx="8" fill="#1d4ed8"/>
  <text x="395" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">App Load Balancer</text>
  <text x="395" y="97" font-size="8" fill="#dbeafe" text-anchor="middle">content-based routing</text>
  <line x1="280" y1="85" x2="328" y2="85" stroke="#1d4ed8" stroke-width="2" marker-end="url(#s10msArrowBlue)"/>

  <!-- AZ A -->
  <rect x="500" y="45" width="290" height="130" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="645" y="58" font-size="9" fill="#64748b" text-anchor="middle">Availability Zone A</text>
  <rect x="515" y="68" width="120" height="45" rx="6" fill="#0f766e"/>
  <text x="575" y="88" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Web ASG</text>
  <text x="575" y="102" font-size="8" fill="#ccfbf1" text-anchor="middle">auto scaling</text>
  <rect x="655" y="68" width="120" height="45" rx="6" fill="#0f766e"/>
  <text x="715" y="88" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Worker ASG</text>
  <text x="715" y="102" font-size="8" fill="#ccfbf1" text-anchor="middle">background jobs</text>
  <rect x="515" y="128" width="260" height="35" rx="6" fill="#0f766e" fill-opacity="0.55"/>
  <text x="645" y="150" font-size="8" fill="#ffffff" text-anchor="middle">min/max sized by CloudWatch metrics</text>

  <line x1="460" y1="85" x2="498" y2="85" stroke="#1d4ed8" stroke-width="2" marker-end="url(#s10msArrowBlue)"/>

  <!-- AZ B -->
  <rect x="500" y="185" width="290" height="90" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="645" y="198" font-size="9" fill="#64748b" text-anchor="middle">Availability Zone B (mirrors AZ A)</text>
  <rect x="515" y="208" width="120" height="45" rx="6" fill="#0f766e" fill-opacity="0.85"/>
  <text x="575" y="228" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Web ASG</text>
  <text x="575" y="242" font-size="8" fill="#ccfbf1" text-anchor="middle">auto scaling</text>
  <rect x="655" y="208" width="120" height="45" rx="6" fill="#0f766e" fill-opacity="0.85"/>
  <text x="715" y="228" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Worker ASG</text>
  <text x="715" y="242" font-size="8" fill="#ccfbf1" text-anchor="middle">background jobs</text>

  <line x1="395" y1="110" x2="395" y2="205" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="395" y1="205" x2="498" y2="230" stroke="#1d4ed8" stroke-width="2" marker-end="url(#s10msArrowBlue)"/>

  <!-- ElastiCache -->
  <rect x="20" y="215" width="130" height="55" rx="8" fill="#334155"/>
  <text x="85" y="238" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">ElastiCache</text>
  <text x="85" y="252" font-size="8" fill="#cbd5e1" text-anchor="middle">Redis / Memcached</text>
  <text x="85" y="264" font-size="8" fill="#cbd5e1" text-anchor="middle">cache-aside</text>

  <!-- Aurora/RDS -->
  <rect x="20" y="290" width="130" height="60" rx="8" fill="#334155"/>
  <text x="85" y="311" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Aurora / RDS</text>
  <text x="85" y="325" font-size="8" fill="#cbd5e1" text-anchor="middle">primary + up to</text>
  <text x="85" y="337" font-size="8" fill="#cbd5e1" text-anchor="middle">15 read replicas</text>

  <!-- DynamoDB -->
  <rect x="170" y="290" width="130" height="60" rx="8" fill="#334155"/>
  <text x="235" y="311" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">DynamoDB</text>
  <text x="235" y="325" font-size="8" fill="#cbd5e1" text-anchor="middle">schema-less /</text>
  <text x="235" y="337" font-size="8" fill="#cbd5e1" text-anchor="middle">high-throughput data</text>

  <!-- sharded/federated DB row -->
  <rect x="20" y="365" width="280" height="40" rx="6" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="160" y="389" font-size="8" fill="#334155" text-anchor="middle">at 5-10M: federated or sharded across many clusters</text>

  <line x1="575" y1="253" x2="150" y2="242" stroke="#334155" stroke-width="1.5" marker-end="url(#s10msArrowSlate)"/>
  <line x1="85" y1="270" x2="85" y2="288" stroke="#334155" stroke-width="1.5" marker-end="url(#s10msArrowSlate)"/>

  <!-- API Gateway + Lambda -->
  <rect x="500" y="300" width="150" height="55" rx="8" fill="#7c3aed"/>
  <text x="575" y="322" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">API Gateway</text>
  <text x="575" y="336" font-size="8" fill="#ede9fe" text-anchor="middle">+ Lambda / Fargate</text>
  <text x="575" y="348" font-size="8" fill="#ede9fe" text-anchor="middle">microservices</text>

  <line x1="645" y1="253" x2="590" y2="298" stroke="#7c3aed" stroke-width="2" marker-end="url(#s10msArrowPurple)"/>

  <!-- SQS/SNS -->
  <rect x="670" y="300" width="120" height="55" rx="8" fill="#7c3aed" fill-opacity="0.8"/>
  <text x="730" y="322" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">SQS / SNS</text>
  <text x="730" y="336" font-size="8" fill="#ede9fe" text-anchor="middle">loose coupling,</text>
  <text x="730" y="348" font-size="8" fill="#ede9fe" text-anchor="middle">event-driven</text>

  <line x1="650" y1="327" x2="668" y2="327" stroke="#7c3aed" stroke-width="2" marker-end="url(#s10msArrowPurple)"/>
  <line x1="575" y1="300" x2="235" y2="292" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#s10msArrowPurple)"/>

  <!-- X-Ray note -->
  <rect x="500" y="375" width="290" height="35" rx="6" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="645" y="397" font-size="8" fill="#5b21b6" text-anchor="middle">X-Ray traces requests across every service above</text>
</svg>
