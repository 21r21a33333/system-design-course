<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Phase 1: everyone votes ready. Phase 2: coordinator commits only if all voted yes.</text>

  <!-- Coordinator -->
  <rect x="300" y="45" width="160" height="50" rx="8" fill="#334155"/>
  <text x="380" y="66" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Coordinator</text>
  <text x="380" y="82" font-size="9" fill="#cbd5e1" text-anchor="middle">drives both phases</text>

  <!-- Participants -->
  <rect x="60" y="150" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="135" y="173" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Participant A</text>
  <text x="135" y="190" font-size="9" fill="#ccfbf1" text-anchor="middle">voted yes, locked</text>

  <rect x="305" y="150" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="380" y="173" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Participant B</text>
  <text x="380" y="190" font-size="9" fill="#ccfbf1" text-anchor="middle">voted yes, locked</text>

  <rect x="550" y="150" width="150" height="55" rx="8" fill="#b45309"/>
  <text x="625" y="173" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Participant C</text>
  <text x="625" y="190" font-size="9" fill="#fef3c7" text-anchor="middle">crashed after "yes"</text>

  <line x1="330" y1="95" x2="150" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#tpcArrowGray)"/>
  <line x1="380" y1="95" x2="380" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#tpcArrowGray)"/>
  <line x1="430" y1="95" x2="610" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#tpcArrowGray)"/>
  <text x="380" y="115" font-size="8.5" fill="#334155" text-anchor="middle">prepare: vote yes/no</text>

  <rect x="230" y="240" width="300" height="55" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="260" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="600">A and B already voted yes and hold locks —</text>
  <text x="380" y="274" font-size="9.5" fill="#b45309" text-anchor="middle">they cannot commit or abort on their own,</text>
  <text x="380" y="288" font-size="9.5" fill="#b45309" text-anchor="middle">they block until C recovers or times out</text>

  <defs>
    <marker id="tpcArrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
