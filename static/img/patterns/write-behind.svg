<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Write returns immediately — store flush happens later, asynchronously</text>

  <!-- Application -->
  <rect x="30" y="110" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="95" y="136" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Application</text>
  <text x="95" y="154" font-size="9" fill="#dbeafe" text-anchor="middle">set(key, value)</text>

  <!-- Cache + queue -->
  <rect x="270" y="70" width="200" height="140" rx="10" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="370" y="92" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">Cache</text>

  <rect x="290" y="105" width="160" height="35" rx="6" fill="#0f766e"/>
  <text x="370" y="127" font-size="10" fill="#ffffff" text-anchor="middle">entries (returned instantly)</text>

  <rect x="290" y="155" width="160" height="40" rx="6" fill="#b45309"/>
  <text x="370" y="175" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">pending queue (dirty)</text>
  <text x="370" y="188" font-size="8" fill="#fef3c7" text-anchor="middle">at risk until flushed</text>

  <!-- Store -->
  <rect x="580" y="110" width="150" height="60" rx="8" fill="#334155"/>
  <text x="655" y="136" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Store</text>
  <text x="655" y="154" font-size="9" fill="#cbd5e1" text-anchor="middle">batched flush</text>

  <!-- app -> cache -->
  <line x1="160" y1="140" x2="268" y2="140" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowWb1)"/>
  <text x="215" y="130" font-size="9" fill="#1d4ed8" text-anchor="middle">write</text>

  <!-- cache -> app instant ack -->
  <line x1="268" y1="120" x2="160" y2="118" stroke="#15803d" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowWbGreen)"/>
  <text x="215" y="105" font-size="9" fill="#15803d" text-anchor="middle">returns immediately</text>

  <!-- queue -> store async flush -->
  <line x1="450" y1="175" x2="578" y2="150" stroke="#b45309" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowWbAmber)"/>
  <text x="530" y="205" font-size="9" fill="#b45309" text-anchor="middle">async, on timer / threshold</text>

  <!-- crash risk box -->
  <rect x="30" y="235" width="700" height="65" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="258" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="600">If the process crashes while the pending queue is non-empty,</text>
  <text x="380" y="273" font-size="10" fill="#dc2626" text-anchor="middle">every unflushed write is lost — not stale, gone</text>
  <text x="380" y="288" font-size="9" fill="#dc2626" text-anchor="middle">contrast with write-through, which never has an unflushed window</text>

  <defs>
    <marker id="arrowWb1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowWbGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
    <marker id="arrowWbAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
