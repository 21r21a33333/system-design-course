<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Each page is anchored to the last row's key, not a shifting position count</text>

  <!-- Client -->
  <rect x="30" y="130" width="130" height="45" rx="8" fill="#1d4ed8"/>
  <text x="95" y="150" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="95" y="165" font-size="9" fill="#dbeafe" text-anchor="middle">cursor: id=118</text>

  <line x1="160" y1="152" x2="278" y2="152" stroke="#1d4ed8" stroke-width="2" marker-end="url(#cpArrowBlue)"/>
  <text x="220" y="142" font-size="8.5" fill="#1d4ed8" text-anchor="middle">WHERE id &gt; 118</text>

  <!-- Server -->
  <rect x="280" y="120" width="200" height="65" rx="8" fill="#0f766e"/>
  <text x="380" y="145" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Query server</text>
  <text x="380" y="163" font-size="9" fill="#ccfbf1" text-anchor="middle">ORDER BY id LIMIT 20</text>
  <text x="380" y="176" font-size="9" fill="#ccfbf1" text-anchor="middle">index seek, no scan</text>

  <line x1="480" y1="152" x2="598" y2="152" stroke="#0f766e" stroke-width="2" marker-end="url(#cpArrowTeal)"/>
  <text x="540" y="142" font-size="8.5" fill="#0f766e" text-anchor="middle">rows + next cursor</text>

  <!-- Result -->
  <rect x="600" y="120" width="130" height="65" rx="8" fill="#334155"/>
  <text x="665" y="145" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Page result</text>
  <text x="665" y="163" font-size="9" fill="#cbd5e1" text-anchor="middle">20 rows</text>
  <text x="665" y="176" font-size="9" fill="#cbd5e1" text-anchor="middle">next: id=138</text>

  <!-- Row sequence at bottom -->
  <text x="380" y="220" font-size="9" fill="#334155" text-anchor="middle">underlying rows: ...115, 116, 117, [118 = cursor], 119...138, 139...</text>

  <rect x="180" y="245" width="400" height="55" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="264" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="600">Offset pagination re-numbers every page after an</text>
  <text x="380" y="278" font-size="9.5" fill="#b45309" text-anchor="middle">insert/delete — rows can be skipped or duplicated</text>
  <text x="380" y="292" font-size="9.5" fill="#b45309" text-anchor="middle">a cursor anchored to id=118 never shifts</text>

  <defs>
    <marker id="cpArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="cpArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
