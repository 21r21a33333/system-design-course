<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Control transfers fully to one specialist at a time — like a call-center transfer</text>

  <!-- Client -->
  <rect x="20" y="130" width="100" height="55" rx="8" fill="#1d4ed8"/>
  <text x="70" y="154" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="70" y="171" font-size="9" fill="#dbeafe" text-anchor="middle">one interaction</text>

  <!-- Generalist (in control, then steps out) -->
  <rect x="180" y="130" width="160" height="60" rx="8" fill="#0f766e"/>
  <text x="260" y="153" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Generalist</text>
  <text x="260" y="169" font-size="9" fill="#ccfbf1" text-anchor="middle">in control, then exits</text>
  <text x="260" y="182" font-size="8" fill="#99f6e4" text-anchor="middle">recognizes it's out of depth</text>

  <!-- Specialist (receives control) -->
  <rect x="450" y="130" width="160" height="60" rx="8" fill="#0f766e"/>
  <text x="530" y="153" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Billing Specialist</text>
  <text x="530" y="169" font-size="9" fill="#ccfbf1" text-anchor="middle">now in control</text>
  <text x="530" y="182" font-size="8" fill="#99f6e4" text-anchor="middle">generalist no longer involved</text>

  <line x1="120" y1="157" x2="178" y2="157" stroke="#1d4ed8" stroke-width="2" marker-end="url(#hoArrowBlue)"/>

  <!-- Baton pass -->
  <line x1="340" y1="157" x2="448" y2="157" stroke="#b45309" stroke-width="3" marker-end="url(#hoArrowAmber)"/>
  <text x="394" y="140" font-size="9" fill="#b45309" text-anchor="middle" font-weight="600">handoff</text>
  <rect x="352" y="95" width="90" height="30" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
  <text x="397" y="114" font-size="8" fill="#b45309" text-anchor="middle">scoped context:</text>
  <text x="397" y="124" font-size="7" fill="#b45309" text-anchor="middle">summary + fields</text>

  <!-- generalist exit marker -->
  <line x1="260" y1="190" x2="260" y2="230" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="260" y="245" font-size="9" fill="#94a3b8" text-anchor="middle">steps out —</text>
  <text x="260" y="257" font-size="9" fill="#94a3b8" text-anchor="middle">not present after transfer</text>

  <rect x="20" y="270" width="700" height="35" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="370" y="292" font-size="9" fill="#334155" text-anchor="middle">only one agent holds control at any moment — nothing runs in parallel, no shared thread persists</text>

  <defs>
    <marker id="hoArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="hoArrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
