<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">LLM Support Bot: initial high-level design</text>

  <!-- Customer -->
  <rect x="20" y="165" width="110" height="55" rx="8" fill="#1d4ed8"/>
  <text x="75" y="188" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Customer</text>
  <text x="75" y="204" font-size="9" fill="#dbeafe" text-anchor="middle">per tenant</text>

  <!-- Conversation service -->
  <rect x="190" y="165" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="265" y="188" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Conversation Svc</text>
  <text x="265" y="204" font-size="9" fill="#ccfbf1" text-anchor="middle">resolves tenant</text>

  <line x1="130" y1="185" x2="188" y2="185" stroke="#1d4ed8" stroke-width="2" marker-end="url(#lsbArrowBlue)"/>
  <line x1="188" y1="203" x2="130" y2="203" stroke="#1d4ed8" stroke-width="2" marker-end="url(#lsbArrowBlue)"/>

  <!-- Retrieval / doc index -->
  <rect x="400" y="70" width="150" height="55" rx="8" fill="#334155"/>
  <text x="475" y="93" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Doc Index (RAG)</text>
  <text x="475" y="109" font-size="8" fill="#cbd5e1" text-anchor="middle">per-tenant chunks</text>

  <!-- Account lookup -->
  <rect x="400" y="165" width="150" height="55" rx="8" fill="#334155"/>
  <text x="475" y="188" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Account Lookup</text>
  <text x="475" y="204" font-size="8" fill="#cbd5e1" text-anchor="middle">exact, scoped fields</text>

  <line x1="340" y1="180" x2="398" y2="105" stroke="#0f766e" stroke-width="2" marker-end="url(#lsbArrowTeal)"/>
  <line x1="340" y1="192" x2="398" y2="192" stroke="#0f766e" stroke-width="2" marker-end="url(#lsbArrowTeal)"/>

  <!-- Model generation -->
  <rect x="610" y="120" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="685" y="143" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Generation</text>
  <text x="685" y="159" font-size="8" fill="#ccfbf1" text-anchor="middle">grounded response</text>

  <line x1="550" y1="100" x2="608" y2="140" stroke="#0f766e" stroke-width="2" marker-end="url(#lsbArrowTeal)"/>
  <line x1="550" y1="190" x2="608" y2="155" stroke="#0f766e" stroke-width="2" marker-end="url(#lsbArrowTeal)"/>

  <!-- Escalation queue -->
  <rect x="610" y="230" width="150" height="55" rx="8" fill="#b45309"/>
  <text x="685" y="253" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Escalation Queue</text>
  <text x="685" y="269" font-size="8" fill="#fde68a" text-anchor="middle">confidence check fails</text>

  <line x1="685" y1="175" x2="685" y2="228" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#lsbArrowAmber)"/>
  <text x="720" y="205" font-size="7" fill="#b45309">low confidence</text>

  <rect x="20" y="250" width="330" height="110" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="185" y="270" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Escalation is a first-class,</text>
  <text x="185" y="284" font-size="9" fill="#334155" text-anchor="middle">successful outcome, not a</text>
  <text x="185" y="298" font-size="9" fill="#334155" text-anchor="middle">failure — a confidently wrong</text>
  <text x="185" y="312" font-size="9" fill="#334155" text-anchor="middle">answer about an account or</text>
  <text x="185" y="326" font-size="9" fill="#334155" text-anchor="middle">policy is worse than handing</text>
  <text x="185" y="340" font-size="9" fill="#334155" text-anchor="middle">off to a human agent</text>

  <defs>
    <marker id="lsbArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="lsbArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="lsbArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
