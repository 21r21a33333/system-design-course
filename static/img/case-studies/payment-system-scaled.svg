<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Payment System: scaled design</text>

  <!-- Merchant -->
  <rect x="20" y="180" width="110" height="55" rx="8" fill="#1d4ed8"/>
  <text x="75" y="203" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Merchant</text>
  <text x="75" y="219" font-size="8" fill="#dbeafe" text-anchor="middle">retries safely</text>

  <!-- Payment service fleet -->
  <rect x="170" y="150" width="140" height="50" rx="8" fill="#0f766e"/>
  <text x="240" y="171" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Payment Svc</text>
  <text x="240" y="186" font-size="8" fill="#ccfbf1" text-anchor="middle">instance A</text>

  <rect x="170" y="215" width="140" height="50" rx="8" fill="#0f766e"/>
  <text x="240" y="236" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Payment Svc</text>
  <text x="240" y="251" font-size="8" fill="#ccfbf1" text-anchor="middle">instance B</text>

  <line x1="130" y1="200" x2="170" y2="175" stroke="#1d4ed8" stroke-width="2" marker-end="url(#pssArrowBlue)"/>
  <line x1="130" y1="215" x2="170" y2="240" stroke="#1d4ed8" stroke-width="2" marker-end="url(#pssArrowBlue)"/>

  <!-- Idempotency store: strongly consistent -->
  <rect x="360" y="60" width="160" height="55" rx="8" fill="#b45309"/>
  <text x="440" y="83" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Idempotency Store</text>
  <text x="440" y="99" font-size="8" fill="#fde68a" text-anchor="middle">atomic conditional insert</text>

  <line x1="310" y1="170" x2="358" y2="105" stroke="#b45309" stroke-width="2" marker-end="url(#pssArrowAmber)"/>
  <line x1="310" y1="235" x2="358" y2="100" stroke="#b45309" stroke-width="2" marker-end="url(#pssArrowAmber)"/>

  <!-- Ledger, sharded -->
  <rect x="360" y="150" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="435" y="171" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Ledger Shard 1</text>
  <text x="435" y="186" font-size="8" fill="#dcfce7" text-anchor="middle">by payment_id</text>

  <rect x="360" y="215" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="435" y="236" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Ledger Shard 2</text>
  <text x="435" y="251" font-size="8" fill="#dcfce7" text-anchor="middle">by payment_id</text>

  <line x1="310" y1="175" x2="358" y2="175" stroke="#0f766e" stroke-width="2" marker-end="url(#pssArrowTeal)"/>
  <line x1="310" y1="240" x2="358" y2="240" stroke="#0f766e" stroke-width="2" marker-end="url(#pssArrowTeal)"/>

  <!-- Read replicas for status queries -->
  <rect x="360" y="300" width="150" height="50" rx="8" fill="#334155"/>
  <text x="435" y="321" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Read Replicas</text>
  <text x="435" y="336" font-size="8" fill="#cbd5e1" text-anchor="middle">status queries</text>

  <line x1="435" y1="265" x2="435" y2="298" stroke="#334155" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Circuit breaker + gateway -->
  <rect x="580" y="150" width="150" height="50" rx="8" fill="#0f766e"/>
  <text x="655" y="171" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Circuit Breaker</text>
  <text x="655" y="186" font-size="8" fill="#ccfbf1" text-anchor="middle">+ backoff</text>

  <rect x="580" y="215" width="150" height="50" rx="8" fill="#0f766e"/>
  <text x="655" y="236" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Gateway /</text>
  <text x="655" y="251" font-size="8" fill="#ccfbf1" text-anchor="middle">Processor</text>

  <line x1="510" y1="175" x2="578" y2="175" stroke="#0f766e" stroke-width="2" marker-end="url(#pssArrowTeal)"/>
  <line x1="655" y1="200" x2="655" y2="213" stroke="#0f766e" stroke-width="2" marker-end="url(#pssArrowTeal)"/>

  <rect x="20" y="300" width="290" height="90" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="320" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Correctness over throughput:</text>
  <text x="165" y="334" font-size="9" fill="#334155" text-anchor="middle">idempotency + ledger writes</text>
  <text x="165" y="348" font-size="9" fill="#334155" text-anchor="middle">stay synchronous and strongly</text>
  <text x="165" y="362" font-size="9" fill="#334155" text-anchor="middle">consistent even as read replicas</text>
  <text x="165" y="376" font-size="9" fill="#334155" text-anchor="middle">scale the status-query path</text>

  <defs>
    <marker id="pssArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="pssArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="pssArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
