<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="780" height="320" fill="#ffffff"/>

  <text x="390" y="22" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Any geode can serve any client — routed to nearest</text>

  <!-- clients -->
  <rect x="30" y="60" width="110" height="45" rx="6" fill="#1d4ed8"/>
  <text x="85" y="88" font-size="10" fill="#ffffff" text-anchor="middle">Client (US)</text>

  <rect x="30" y="140" width="110" height="45" rx="6" fill="#1d4ed8"/>
  <text x="85" y="168" font-size="10" fill="#ffffff" text-anchor="middle">Client (EU)</text>

  <rect x="30" y="220" width="110" height="45" rx="6" fill="#1d4ed8"/>
  <text x="85" y="248" font-size="10" fill="#ffffff" text-anchor="middle">Client (APAC)</text>

  <!-- geodes -->
  <rect x="260" y="55" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="335" y="80" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Geode: US</text>
  <text x="335" y="97" font-size="9" fill="#ccfbf1" text-anchor="middle">full stack + data</text>

  <rect x="260" y="140" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="335" y="165" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Geode: EU</text>
  <text x="335" y="182" font-size="9" fill="#ccfbf1" text-anchor="middle">full stack + data</text>

  <rect x="260" y="225" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="335" y="250" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Geode: APAC</text>
  <text x="335" y="267" font-size="9" fill="#ccfbf1" text-anchor="middle">full stack + data</text>

  <line x1="140" y1="82" x2="258" y2="82" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowGe1)"/>
  <line x1="140" y1="162" x2="258" y2="168" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowGe1)"/>
  <line x1="140" y1="242" x2="258" y2="252" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowGe1)"/>

  <text x="200" y="72" font-size="8" fill="#1d4ed8" text-anchor="middle">nearest</text>
  <text x="200" y="152" font-size="8" fill="#1d4ed8" text-anchor="middle">nearest</text>
  <text x="200" y="232" font-size="8" fill="#1d4ed8" text-anchor="middle">nearest</text>

  <!-- replication between geodes -->
  <line x1="410" y1="85" x2="410" y2="140" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGeTeal)" marker-start="url(#arrowGeTeal)"/>
  <line x1="410" y1="200" x2="410" y2="225" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGeTeal)" marker-start="url(#arrowGeTeal)"/>
  <text x="460" y="113" font-size="8" fill="#0d9488" text-anchor="middle">async</text>
  <text x="460" y="123" font-size="8" fill="#0d9488" text-anchor="middle">replication</text>

  <!-- contrast box: stamps partition customers -->
  <rect x="520" y="80" width="220" height="150" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="630" y="102" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Contrast: Deployment Stamps</text>
  <text x="630" y="122" font-size="9" fill="#64748b" text-anchor="middle">partitions customers —</text>
  <text x="630" y="137" font-size="9" fill="#64748b" text-anchor="middle">each tenant bound to ONE stamp,</text>
  <text x="630" y="152" font-size="9" fill="#64748b" text-anchor="middle">no cross-serving between them.</text>
  <text x="630" y="172" font-size="9" fill="#64748b" text-anchor="middle">Geodes replicate the SAME</text>
  <text x="630" y="187" font-size="9" fill="#64748b" text-anchor="middle">capability everywhere instead —</text>
  <text x="630" y="202" font-size="9" fill="#64748b" text-anchor="middle">optimizing latency over isolation.</text>

  <defs>
    <marker id="arrowGe1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGeTeal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0d9488"/>
    </marker>
  </defs>
</svg>
