<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">A deadline propagates down the call chain; each hop inherits only the budget that is left</text>

  <!-- Services in a chain -->
  <rect x="30" y="70" width="130" height="56" rx="8" fill="#1d4ed8"/>
  <text x="95" y="94" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Gateway</text>
  <text x="95" y="112" font-size="9" fill="#dbeafe" text-anchor="middle">budget 1000ms</text>

  <rect x="220" y="70" width="130" height="56" rx="8" fill="#0f766e"/>
  <text x="285" y="94" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Service A</text>
  <text x="285" y="112" font-size="9" fill="#ccfbf1" text-anchor="middle">700ms left</text>

  <rect x="410" y="70" width="130" height="56" rx="8" fill="#0f766e"/>
  <text x="475" y="94" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Service B</text>
  <text x="475" y="112" font-size="9" fill="#ccfbf1" text-anchor="middle">200ms left</text>

  <rect x="600" y="70" width="130" height="56" rx="8" fill="#dc2626"/>
  <text x="665" y="94" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Service C</text>
  <text x="665" y="112" font-size="9" fill="#fee2e2" text-anchor="middle">needs 400ms</text>

  <line x1="160" y1="98" x2="218" y2="98" stroke="#334155" stroke-width="2" marker-end="url(#toArrow)"/>
  <line x1="350" y1="98" x2="408" y2="98" stroke="#334155" stroke-width="2" marker-end="url(#toArrow)"/>
  <line x1="540" y1="98" x2="598" y2="98" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#toArrowRed)"/>
  <text x="569" y="60" font-size="9" fill="#dc2626" text-anchor="middle">times out: 400 &gt; 200</text>

  <!-- budget bars -->
  <text x="30" y="180" font-size="10" fill="#334155" font-weight="600">Remaining budget as the request flows right</text>

  <rect x="30" y="195" width="640" height="20" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="350" y="209" font-size="9" fill="#15803d" text-anchor="middle">1000ms total</text>

  <rect x="30" y="222" width="448" height="20" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <text x="254" y="236" font-size="9" fill="#0f766e" text-anchor="middle">700ms after A's 300ms of work</text>

  <rect x="30" y="249" width="128" height="20" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <text x="94" y="263" font-size="9" fill="#b45309" text-anchor="middle">200ms left</text>

  <rect x="30" y="290" width="700" height="34" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="311" font-size="9" fill="#334155" text-anchor="middle">C is bounded by the 200ms that remains, not a fresh local timeout — deadline propagation prevents the chain from overrunning</text>

  <defs>
    <marker id="toArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
    <marker id="toArrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
