<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="28" font-size="15" fill="#334155" text-anchor="middle" font-weight="600">What the gatekeeper holds &#8212; and what it does not</text>

  <!-- Untrusted zone label -->
  <text x="130" y="60" font-size="12" fill="#64748b" text-anchor="middle">Untrusted zone</text>
  <!-- Trusted zone shaded band -->
  <rect x="470" y="50" width="230" height="260" rx="10" fill="#eff6ff"/>
  <text x="585" y="70" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="600">Trusted zone</text>

  <!-- External client -->
  <rect x="55" y="140" width="150" height="70" rx="8" fill="#dc2626"/>
  <text x="130" y="170" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">External Client</text>
  <text x="130" y="190" font-size="11" fill="#fecaca" text-anchor="middle">raw, untrusted input</text>

  <!-- Gatekeeper -->
  <rect x="270" y="105" width="150" height="150" rx="8" fill="#0f766e"/>
  <text x="345" y="132" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Gatekeeper</text>
  <text x="345" y="158" font-size="11" fill="#ccfbf1" text-anchor="middle">HOLDS:</text>
  <text x="345" y="176" font-size="10.5" fill="#ccfbf1" text-anchor="middle">validation rules</text>
  <text x="345" y="192" font-size="10.5" fill="#ccfbf1" text-anchor="middle">no secrets, no data</text>
  <text x="345" y="216" font-size="11" fill="#fde68a" text-anchor="middle" font-weight="600">DOES NOT HOLD:</text>
  <text x="345" y="234" font-size="10.5" fill="#fde68a" text-anchor="middle">DB / API credentials</text>

  <!-- Backend + secrets -->
  <rect x="500" y="105" width="170" height="70" rx="8" fill="#1d4ed8"/>
  <text x="585" y="135" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Backend</text>
  <text x="585" y="155" font-size="11" fill="#dbeafe" text-anchor="middle">business logic + data</text>

  <rect x="500" y="200" width="170" height="80" rx="8" fill="#334155"/>
  <text x="585" y="228" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Secret store</text>
  <text x="585" y="248" font-size="10.5" fill="#cbd5e1" text-anchor="middle">tokens, keys, creds</text>
  <text x="585" y="266" font-size="10.5" fill="#cbd5e1" text-anchor="middle">gatekeeper cannot reach</text>

  <!-- raw request arrow -->
  <line x1="205" y1="175" x2="268" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#gkArr)"/>
  <text x="210" y="165" font-size="10.5" fill="#334155">raw request</text>

  <!-- sanitized-only arrow crossing boundary -->
  <line x1="420" y1="140" x2="498" y2="140" stroke="#15803d" stroke-width="2" marker-end="url(#gkArrGreen)"/>
  <text x="424" y="130" font-size="10.5" fill="#15803d">sanitized only</text>

  <!-- backend fetches its own secrets (gatekeeper never touches this) -->
  <line x1="585" y1="175" x2="585" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#gkArr)"/>

  <!-- rejected -->
  <line x1="300" y1="255" x2="300" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#gkArrRed)"/>
  <text x="255" y="295" font-size="10.5" fill="#dc2626">rejected here</text>

  <defs>
    <marker id="gkArr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="gkArrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <marker id="gkArrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
