<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Newsfeed: initial high-level design</text>

  <!-- Activity producers -->
  <rect x="20" y="50" width="130" height="45" rx="8" fill="#1d4ed8"/>
  <text x="85" y="68" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Status Producer</text>
  <text x="85" y="82" font-size="8" fill="#dbeafe" text-anchor="middle">activity type A</text>

  <rect x="20" y="105" width="130" height="45" rx="8" fill="#1d4ed8"/>
  <text x="85" y="123" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Share Producer</text>
  <text x="85" y="137" font-size="8" fill="#dbeafe" text-anchor="middle">activity type B</text>

  <rect x="20" y="160" width="130" height="45" rx="8" fill="#1d4ed8"/>
  <text x="85" y="178" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Page Producer</text>
  <text x="85" y="192" font-size="8" fill="#dbeafe" text-anchor="middle">activity type C</text>

  <!-- Viewing client -->
  <rect x="20" y="260" width="130" height="50" rx="8" fill="#1d4ed8"/>
  <text x="85" y="281" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Viewing Client</text>
  <text x="85" y="297" font-size="8" fill="#dbeafe" text-anchor="middle">opens feed</text>

  <!-- Activity ingestion -->
  <rect x="210" y="105" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="285" y="128" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Activity Ingestion</text>
  <text x="285" y="145" font-size="9" fill="#ccfbf1" text-anchor="middle">normalize to envelope</text>

  <line x1="150" y1="72" x2="208" y2="120" stroke="#1d4ed8" stroke-width="2" marker-end="url(#nfArrowBlue)"/>
  <line x1="150" y1="128" x2="208" y2="130" stroke="#1d4ed8" stroke-width="2" marker-end="url(#nfArrowBlue)"/>
  <line x1="150" y1="182" x2="208" y2="145" stroke="#1d4ed8" stroke-width="2" marker-end="url(#nfArrowBlue)"/>

  <!-- Fan-out service -->
  <rect x="420" y="105" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="495" y="128" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Fan-out Service</text>
  <text x="495" y="145" font-size="9" fill="#ccfbf1" text-anchor="middle">push / pull split</text>

  <line x1="360" y1="132" x2="418" y2="132" stroke="#0f766e" stroke-width="2" marker-end="url(#nfArrowTeal)"/>

  <!-- Social graph store -->
  <rect x="420" y="30" width="150" height="50" rx="8" fill="#334155"/>
  <text x="495" y="51" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Social Graph Store</text>
  <text x="495" y="67" font-size="8" fill="#cbd5e1" text-anchor="middle">who follows whom</text>

  <line x1="495" y1="80" x2="495" y2="103" stroke="#334155" stroke-width="2" marker-end="url(#nfArrowSlate)"/>

  <!-- Feed store -->
  <rect x="630" y="105" width="150" height="55" rx="8" fill="#334155"/>
  <text x="705" y="128" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Feed Store</text>
  <text x="705" y="145" font-size="9" fill="#cbd5e1" text-anchor="middle">per-user envelope lists</text>

  <line x1="570" y1="132" x2="628" y2="132" stroke="#0f766e" stroke-width="2" marker-end="url(#nfArrowTeal)"/>

  <!-- Feed service -->
  <rect x="420" y="230" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="495" y="253" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Feed Service</text>
  <text x="495" y="270" font-size="9" fill="#ccfbf1" text-anchor="middle">merge + rank</text>

  <line x1="150" y1="280" x2="418" y2="260" stroke="#1d4ed8" stroke-width="2" marker-end="url(#nfArrowBlue)"/>
  <line x1="705" y1="160" x2="530" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#nfArrowSlate)"/>
  <text x="620" y="200" font-size="8" fill="#334155">read precomputed entries</text>

  <rect x="620" y="240" width="170" height="70" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="705" y="260" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Envelope is a uniform,</text>
  <text x="705" y="274" font-size="9" fill="#334155" text-anchor="middle">typed pointer — full content</text>
  <text x="705" y="288" font-size="9" fill="#334155" text-anchor="middle">lives with its own producer</text>

  <defs>
    <marker id="nfArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="nfArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="nfArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
