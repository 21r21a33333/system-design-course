<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">WhatsApp: initial high-level design</text>

  <!-- Sender client -->
  <rect x="20" y="70" width="120" height="55" rx="8" fill="#1d4ed8"/>
  <text x="80" y="93" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Sender</text>
  <text x="80" y="110" font-size="9" fill="#dbeafe" text-anchor="middle">open connection</text>

  <!-- Recipient client -->
  <rect x="20" y="200" width="120" height="55" rx="8" fill="#1d4ed8"/>
  <text x="80" y="223" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Recipient</text>
  <text x="80" y="240" font-size="9" fill="#dbeafe" text-anchor="middle">online or offline</text>

  <!-- Gateway -->
  <rect x="190" y="130" width="140" height="65" rx="8" fill="#1d4ed8"/>
  <text x="260" y="155" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Gateway Layer</text>
  <text x="260" y="172" font-size="9" fill="#dbeafe" text-anchor="middle">persistent connections,</text>
  <text x="260" y="185" font-size="9" fill="#dbeafe" text-anchor="middle">push delivery</text>

  <line x1="140" y1="97" x2="188" y2="155" stroke="#1d4ed8" stroke-width="2" marker-end="url(#wArrowBlue)"/>
  <line x1="140" y1="227" x2="188" y2="175" stroke="#1d4ed8" stroke-width="2" marker-end="url(#wArrowBlue)"/>

  <!-- Message service -->
  <rect x="380" y="130" width="150" height="65" rx="8" fill="#0f766e"/>
  <text x="455" y="155" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Message Service</text>
  <text x="455" y="172" font-size="9" fill="#ccfbf1" text-anchor="middle">write-ahead then</text>
  <text x="455" y="185" font-size="9" fill="#ccfbf1" text-anchor="middle">route or queue</text>

  <line x1="330" y1="162" x2="378" y2="162" stroke="#1d4ed8" stroke-width="2" marker-end="url(#wArrowBlue)"/>

  <!-- Presence/session directory -->
  <rect x="570" y="60" width="170" height="60" rx="8" fill="#b45309"/>
  <text x="655" y="83" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Presence / Session</text>
  <text x="655" y="100" font-size="9" fill="#fde68a" text-anchor="middle">user_id -&gt; gateway node</text>

  <!-- Pending delivery store -->
  <rect x="570" y="140" width="170" height="60" rx="8" fill="#334155"/>
  <text x="655" y="163" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Pending-Delivery</text>
  <text x="655" y="180" font-size="9" fill="#cbd5e1" text-anchor="middle">per-recipient queue</text>

  <!-- History store -->
  <rect x="570" y="220" width="170" height="60" rx="8" fill="#334155"/>
  <text x="655" y="243" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Message History</text>
  <text x="655" y="260" font-size="9" fill="#cbd5e1" text-anchor="middle">sequential, bulk sync</text>

  <line x1="530" y1="150" x2="568" y2="100" stroke="#0f766e" stroke-width="2" marker-end="url(#wArrowTeal)"/>
  <line x1="530" y1="165" x2="568" y2="168" stroke="#0f766e" stroke-width="2" marker-end="url(#wArrowTeal)"/>
  <line x1="530" y1="180" x2="568" y2="245" stroke="#0f766e" stroke-width="2" marker-end="url(#wArrowTeal)"/>

  <rect x="20" y="330" width="720" height="55" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="350" font-size="9" fill="#334155" text-anchor="middle">Delivery path (online): gateway -&gt; message service -&gt; presence lookup -&gt; push to recipient's gateway node.</text>
  <text x="380" y="366" font-size="9" fill="#334155" text-anchor="middle">Deferred path (offline): message written to the per-recipient pending queue, drained on reconnect.</text>

  <defs>
    <marker id="wArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="wArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
