<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="780" height="360" fill="#ffffff"/>

  <text x="390" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Aggregation pipeline: agent → buffer/transport → index → hot/warm/cold store</text>

  <!-- Service instances with agents -->
  <rect x="24" y="70" width="130" height="44" rx="8" fill="#1d4ed8"/>
  <text x="89" y="90" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Service + agent</text>
  <text x="89" y="105" font-size="9" fill="#dbeafe" text-anchor="middle">structured JSON</text>

  <rect x="24" y="128" width="130" height="44" rx="8" fill="#1d4ed8"/>
  <text x="89" y="148" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Service + agent</text>
  <text x="89" y="163" font-size="9" fill="#dbeafe" text-anchor="middle">trace_id threaded</text>

  <rect x="24" y="186" width="130" height="44" rx="8" fill="#1d4ed8"/>
  <text x="89" y="206" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Service + agent</text>
  <text x="89" y="221" font-size="9" fill="#dbeafe" text-anchor="middle">tails + batches</text>

  <!-- Buffer / transport -->
  <rect x="210" y="120" width="120" height="70" rx="8" fill="#b45309"/>
  <text x="270" y="145" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Buffer /</text>
  <text x="270" y="160" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">transport</text>
  <text x="270" y="178" font-size="8" fill="#fde68a" text-anchor="middle">bounded queue</text>

  <line x1="154" y1="92" x2="210" y2="140" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dlBlue)"/>
  <line x1="154" y1="150" x2="210" y2="155" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dlBlue)"/>
  <line x1="154" y1="208" x2="210" y2="170" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dlBlue)"/>

  <!-- overflow policy note -->
  <text x="270" y="228" font-size="8" fill="#dc2626" text-anchor="middle">overflow: block (durable)</text>
  <text x="270" y="240" font-size="8" fill="#dc2626" text-anchor="middle">or drop (lossy) + count</text>

  <!-- Indexer -->
  <rect x="386" y="120" width="120" height="70" rx="8" fill="#0f766e"/>
  <text x="446" y="148" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Indexer</text>
  <text x="446" y="165" font-size="9" fill="#ccfbf1" text-anchor="middle">inverted index</text>
  <text x="446" y="179" font-size="9" fill="#ccfbf1" text-anchor="middle">by field/label</text>

  <line x1="330" y1="155" x2="386" y2="155" stroke="#b45309" stroke-width="2" marker-end="url(#dlAmber)"/>

  <!-- Retention tiers -->
  <rect x="560" y="70" width="196" height="40" rx="8" fill="#15803d"/>
  <text x="658" y="88" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Hot (SSD, fast query)</text>
  <text x="658" y="102" font-size="8" fill="#dcfce7" text-anchor="middle">recent · days</text>

  <rect x="560" y="140" width="196" height="40" rx="8" fill="#334155"/>
  <text x="658" y="158" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Warm (cheaper disk)</text>
  <text x="658" y="172" font-size="8" fill="#cbd5e1" text-anchor="middle">weeks</text>

  <rect x="560" y="210" width="196" height="40" rx="8" fill="#64748b"/>
  <text x="658" y="228" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Cold (object storage)</text>
  <text x="658" y="242" font-size="8" fill="#e2e8f0" text-anchor="middle">months · slow restore</text>

  <line x1="506" y1="145" x2="560" y2="95" stroke="#0f766e" stroke-width="2" marker-end="url(#dlTeal)"/>
  <line x1="506" y1="155" x2="560" y2="160" stroke="#0f766e" stroke-width="2" marker-end="url(#dlTeal)"/>
  <line x1="506" y1="165" x2="560" y2="225" stroke="#0f766e" stroke-width="2" marker-end="url(#dlTeal)"/>
  <text x="533" y="120" font-size="8" fill="#64748b" text-anchor="middle">age-out</text>

  <!-- Query -->
  <rect x="560" y="290" width="196" height="44" rx="8" fill="#1d4ed8"/>
  <text x="658" y="310" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Query across fleet</text>
  <text x="658" y="325" font-size="8" fill="#dbeafe" text-anchor="middle">by time · service · trace_id</text>
  <line x1="658" y1="250" x2="658" y2="290" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dlBlue)"/>

  <rect x="24" y="290" width="482" height="44" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="265" y="309" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="600">Failure mode: high-cardinality fields inflate the index; a buffer that blocks can stall the app</text>
  <text x="265" y="325" font-size="9" fill="#334155" text-anchor="middle">sample/downsample verbose logs; cap buffer and expose a drop counter</text>

  <defs>
    <marker id="dlBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
    <marker id="dlAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
    <marker id="dlTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
  </defs>
</svg>
