<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">A small slice goes to the canary first; analysis promotes it stage by stage or rolls back</text>

  <!-- Router -->
  <rect x="24" y="150" width="120" height="60" rx="8" fill="#1d4ed8"/>
  <text x="84" y="176" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Weighted LB</text>
  <text x="84" y="194" font-size="9" fill="#dbeafe" text-anchor="middle">sticky by user-hash</text>

  <!-- Baseline -->
  <rect x="240" y="70" width="180" height="60" rx="8" fill="#0f766e"/>
  <text x="330" y="96" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Baseline v1</text>
  <text x="330" y="114" font-size="9" fill="#ccfbf1" text-anchor="middle">stable, most traffic</text>

  <!-- Canary -->
  <rect x="240" y="230" width="180" height="60" rx="8" fill="#b45309"/>
  <text x="330" y="256" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Canary v2</text>
  <text x="330" y="274" font-size="9" fill="#fef3c7" text-anchor="middle">small slice, watched</text>

  <!-- router -> baseline -->
  <line x1="144" y1="168" x2="238" y2="104" stroke="#0f766e" stroke-width="4" marker-end="url(#cArrowTeal)"/>
  <text x="188" y="128" font-size="9" fill="#0f766e" text-anchor="middle" font-weight="600">95%</text>

  <!-- router -> canary -->
  <line x1="144" y1="192" x2="238" y2="256" stroke="#b45309" stroke-width="2" marker-end="url(#cArrowAmber)"/>
  <text x="188" y="240" font-size="9" fill="#b45309" text-anchor="middle" font-weight="600">5%</text>

  <!-- Analysis -->
  <rect x="500" y="150" width="196" height="60" rx="8" fill="#334155"/>
  <text x="598" y="176" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Canary Analysis</text>
  <text x="598" y="194" font-size="9" fill="#cbd5e1" text-anchor="middle">error rate · latency · KPIs</text>

  <line x1="420" y1="100" x2="500" y2="165" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="3,3"/>
  <line x1="420" y1="260" x2="500" y2="195" stroke="#b45309" stroke-width="1.6" stroke-dasharray="3,3"/>
  <text x="470" y="150" font-size="8.5" fill="#64748b" text-anchor="middle">compare</text>

  <!-- ramp bar -->
  <text x="118" y="300" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">ramp:</text>
  <rect x="150" y="291" width="70" height="16" rx="3" fill="#b45309"/><text x="185" y="303" font-size="9" fill="#ffffff" text-anchor="middle">1%</text>
  <rect x="228" y="291" width="70" height="16" rx="3" fill="#b45309"/><text x="263" y="303" font-size="9" fill="#ffffff" text-anchor="middle">5%</text>
  <rect x="306" y="291" width="70" height="16" rx="3" fill="#b45309"/><text x="341" y="303" font-size="9" fill="#ffffff" text-anchor="middle">25%</text>
  <rect x="384" y="291" width="70" height="16" rx="3" fill="#15803d"/><text x="419" y="303" font-size="9" fill="#ffffff" text-anchor="middle">100%</text>
  <rect x="470" y="291" width="120" height="16" rx="3" fill="none" stroke="#dc2626" stroke-width="1.5"/><text x="530" y="303" font-size="9" fill="#dc2626" text-anchor="middle">metrics bad → rollback</text>

  <defs>
    <marker id="cArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="cArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
  </defs>
</svg>
