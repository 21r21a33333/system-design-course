<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <!-- Client -->
  <rect x="30" y="130" width="140" height="70" rx="8" fill="#1d4ed8"/>
  <text x="100" y="160" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="100" y="178" font-size="10" fill="#dbeafe" text-anchor="middle">typed .proto stubs</text>

  <!-- HTTP/2 connection boundary -->
  <rect x="220" y="60" width="280" height="210" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="360" y="48" font-size="11" fill="#64748b" text-anchor="middle">single HTTP/2 connection (multiplexed)</text>

  <!-- Stream 1 (this RPC) -->
  <rect x="245" y="80" width="230" height="70" rx="6" fill="#0f766e"/>
  <text x="360" y="103" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Stream: Chat RPC</text>
  <text x="360" y="120" font-size="9" fill="#ccfbf1" text-anchor="middle">stream ClientMessage &#8596; stream ServerMessage</text>
  <text x="360" y="135" font-size="9" fill="#ccfbf1" text-anchor="middle">flow-controlled, independent read/write</text>

  <!-- Other streams (multiplexed) -->
  <rect x="245" y="165" width="230" height="30" rx="6" fill="#94a3b8"/>
  <text x="360" y="184" font-size="10" fill="#ffffff" text-anchor="middle">other RPC stream (same connection)</text>

  <rect x="245" y="205" width="230" height="30" rx="6" fill="#94a3b8"/>
  <text x="360" y="224" font-size="10" fill="#ffffff" text-anchor="middle">other RPC stream (same connection)</text>

  <!-- Server -->
  <rect x="550" y="130" width="140" height="70" rx="8" fill="#1d4ed8"/>
  <text x="620" y="160" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Server</text>
  <text x="620" y="178" font-size="10" fill="#dbeafe" text-anchor="middle">typed .proto handler</text>

  <!-- client -> stream -->
  <line x1="172" y1="140" x2="243" y2="105" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowGb)"/>
  <text x="205" y="112" font-size="9" fill="#0f766e" text-anchor="middle">send ClientMessage</text>

  <!-- stream -> server -->
  <line x1="477" y1="105" x2="548" y2="140" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowGb)"/>

  <!-- server -> stream (reply direction) -->
  <line x1="548" y1="165" x2="477" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#arrowGbGray)"/>

  <!-- stream -> client -->
  <line x1="243" y1="130" x2="172" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrowGbGray)"/>
  <text x="205" y="185" font-size="9" fill="#334155" text-anchor="middle">recv ServerMessage</text>

  <text x="360" y="300" font-size="11" fill="#64748b" text-anchor="middle">Unlike a WebSocket's single opaque byte channel, each direction carries typed,</text>
  <text x="360" y="316" font-size="11" fill="#64748b" text-anchor="middle">schema-defined Protobuf messages, and many such streams share one connection.</text>

  <defs>
    <marker id="arrowGb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowGbGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
