<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Requests are micro-batched and routed across two live model versions during a canary rollout</text>

  <!-- Clients -->
  <rect x="30" y="130" width="130" height="55" rx="8" fill="#1d4ed8"/>
  <text x="95" y="153" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Clients</text>
  <text x="95" y="171" font-size="9" fill="#dbeafe" text-anchor="middle">concurrent requests</text>

  <!-- Batcher -->
  <rect x="230" y="130" width="150" height="55" rx="8" fill="#334155"/>
  <text x="305" y="153" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Micro-batcher</text>
  <text x="305" y="171" font-size="9" fill="#cbd5e1" text-anchor="middle">groups within a window</text>

  <line x1="160" y1="157" x2="228" y2="157" stroke="#1d4ed8" stroke-width="2" marker-end="url(#msArrowBlue)"/>

  <!-- v1 stable -->
  <rect x="470" y="55" width="180" height="60" rx="8" fill="#0f766e"/>
  <text x="560" y="80" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Model v1 (stable)</text>
  <text x="560" y="98" font-size="9" fill="#ccfbf1" text-anchor="middle">95% of traffic</text>

  <!-- v2 canary -->
  <rect x="470" y="200" width="180" height="60" rx="8" fill="#b45309"/>
  <text x="560" y="225" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Model v2 (canary)</text>
  <text x="560" y="243" font-size="9" fill="#fef3c7" text-anchor="middle">5% of traffic, monitored</text>

  <line x1="380" y1="140" x2="468" y2="90" stroke="#0f766e" stroke-width="2.5" marker-end="url(#msArrowTeal)"/>
  <text x="425" y="105" font-size="9" fill="#0f766e" text-anchor="middle">95%</text>

  <line x1="380" y1="175" x2="468" y2="222" stroke="#b45309" stroke-width="1.5" marker-end="url(#msArrowAmber)"/>
  <text x="425" y="200" font-size="9" fill="#b45309" text-anchor="middle">5%</text>

  <rect x="230" y="255" width="400" height="45" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="430" y="273" font-size="9.5" fill="#334155" text-anchor="middle" font-weight="600">Batching amortizes fixed per-call GPU overhead;</text>
  <text x="430" y="287" font-size="9.5" fill="#334155" text-anchor="middle">traffic split lets v2's error rate be checked before full rollout</text>

  <defs>
    <marker id="msArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="msArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="msArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
