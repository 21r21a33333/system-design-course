<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Yelp: scaled design</text>

  <!-- Clients -->
  <rect x="20" y="180" width="120" height="50" rx="8" fill="#1d4ed8"/>
  <text x="80" y="201" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Clients</text>
  <text x="80" y="217" font-size="8" fill="#dbeafe" text-anchor="middle">30M DAU</text>

  <!-- Rate limiter -->
  <rect x="175" y="180" width="110" height="50" rx="8" fill="#15803d"/>
  <text x="230" y="201" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Rate Limiter</text>
  <text x="230" y="217" font-size="8" fill="#dcfce7" text-anchor="middle">anti-scrape</text>

  <line x1="140" y1="205" x2="173" y2="205" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ysArrowBlue)"/>

  <!-- Query result cache -->
  <rect x="330" y="120" width="150" height="55" rx="8" fill="#15803d"/>
  <text x="405" y="143" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Search Result Cache</text>
  <text x="405" y="159" font-size="8" fill="#dcfce7" text-anchor="middle">popular-area queries</text>

  <line x1="285" y1="195" x2="328" y2="155" stroke="#15803d" stroke-width="2" marker-end="url(#ysArrowGreen)"/>

  <!-- Spatial index shards -->
  <rect x="540" y="55" width="150" height="45" rx="8" fill="#b45309"/>
  <text x="615" y="74" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Spatial Shard — Metro A</text>
  <text x="615" y="89" font-size="8" fill="#fde68a" text-anchor="middle">in-memory, replicated</text>

  <rect x="540" y="105" width="150" height="45" rx="8" fill="#b45309"/>
  <text x="615" y="124" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Spatial Shard — Metro B</text>
  <text x="615" y="139" font-size="8" fill="#fde68a" text-anchor="middle">in-memory, replicated</text>

  <line x1="480" y1="145" x2="538" y2="80" stroke="#0f766e" stroke-width="2" marker-end="url(#ysArrowTeal)"/>
  <line x1="480" y1="150" x2="538" y2="128" stroke="#0f766e" stroke-width="2" marker-end="url(#ysArrowTeal)"/>

  <!-- Search service -->
  <rect x="330" y="195" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="405" y="218" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Search Service</text>
  <text x="405" y="234" font-size="8" fill="#ccfbf1" text-anchor="middle">rank by distance + rating</text>

  <line x1="285" y1="215" x2="328" y2="220" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ysArrowBlue)"/>
  <line x1="405" y1="195" x2="405" y2="177" stroke="#0f766e" stroke-width="2"/>
  <line x1="480" y1="215" x2="538" y2="115" stroke="#0f766e" stroke-width="2" marker-end="url(#ysArrowTeal)"/>

  <!-- Review store shards + replicas -->
  <rect x="330" y="290" width="140" height="55" rx="8" fill="#334155"/>
  <text x="400" y="312" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Review Store</text>
  <text x="400" y="328" font-size="8" fill="#cbd5e1" text-anchor="middle">sharded by business_id</text>

  <rect x="500" y="290" width="140" height="55" rx="8" fill="#15803d"/>
  <text x="570" y="312" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Read Replicas</text>
  <text x="570" y="328" font-size="8" fill="#dcfce7" text-anchor="middle">rating reads</text>

  <line x1="470" y1="317" x2="498" y2="317" stroke="#15803d" stroke-width="2" marker-end="url(#ysArrowGreen)"/>
  <line x1="405" y1="250" x2="400" y2="288" stroke="#0f766e" stroke-width="2" marker-end="url(#ysArrowTeal)"/>

  <!-- CDN for listing photos/detail -->
  <rect x="700" y="195" width="130" height="55" rx="8" fill="#334155"/>
  <text x="765" y="218" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">CDN</text>
  <text x="765" y="234" font-size="8" fill="#cbd5e1" text-anchor="middle">static listing assets</text>

  <line x1="640" y1="90" x2="698" y2="215" stroke="#334155" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="20" y="350" width="290" height="65" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="368" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Green = scaled/redundant additions</text>
  <text x="165" y="383" font-size="9" fill="#334155" text-anchor="middle">Index shards are read-heavy and</text>
  <text x="165" y="397" font-size="9" fill="#334155" text-anchor="middle">replicate freely — writes are rare</text>

  <defs>
    <marker id="ysArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="ysArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="ysArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
  </defs>
</svg>
