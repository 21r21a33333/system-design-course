<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Same task fanned out to isolated agents, results fanned in to one aggregator</text>

  <!-- Client -->
  <rect x="20" y="130" width="100" height="55" rx="8" fill="#1d4ed8"/>
  <text x="70" y="154" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="70" y="171" font-size="9" fill="#dbeafe" text-anchor="middle">one task</text>

  <!-- Agent A -->
  <rect x="220" y="40" width="130" height="50" rx="8" fill="#0f766e"/>
  <text x="285" y="62" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Agent A</text>
  <text x="285" y="78" font-size="9" fill="#ccfbf1" text-anchor="middle">isolated context</text>

  <!-- Agent B -->
  <rect x="220" y="135" width="130" height="50" rx="8" fill="#0f766e"/>
  <text x="285" y="157" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Agent B</text>
  <text x="285" y="173" font-size="9" fill="#ccfbf1" text-anchor="middle">isolated context</text>

  <!-- Agent C -->
  <rect x="220" y="230" width="130" height="50" rx="8" fill="#0f766e"/>
  <text x="285" y="252" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Agent C</text>
  <text x="285" y="268" font-size="9" fill="#ccfbf1" text-anchor="middle">isolated context</text>

  <!-- Aggregator -->
  <rect x="500" y="135" width="150" height="55" rx="8" fill="#334155"/>
  <text x="575" y="158" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Aggregator</text>
  <text x="575" y="176" font-size="9" fill="#cbd5e1" text-anchor="middle">vote / merge / judge</text>

  <!-- fan out -->
  <line x1="120" y1="145" x2="218" y2="70" stroke="#1d4ed8" stroke-width="2" marker-end="url(#coArrow)"/>
  <line x1="120" y1="157" x2="218" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#coArrow)"/>
  <line x1="120" y1="169" x2="218" y2="250" stroke="#1d4ed8" stroke-width="2" marker-end="url(#coArrow)"/>

  <!-- fan in -->
  <line x1="350" y1="70" x2="498" y2="150" stroke="#0f766e" stroke-width="2" marker-end="url(#coArrowTeal)"/>
  <line x1="350" y1="160" x2="498" y2="162" stroke="#0f766e" stroke-width="2" marker-end="url(#coArrowTeal)"/>
  <line x1="350" y1="250" x2="498" y2="175" stroke="#0f766e" stroke-width="2" marker-end="url(#coArrowTeal)"/>

  <!-- no cross-agent lines, explicitly noted -->
  <text x="285" y="115" font-size="9" fill="#94a3b8" text-anchor="middle" font-style="italic">no communication between agents while running</text>
  <text x="285" y="212" font-size="9" fill="#94a3b8" text-anchor="middle" font-style="italic">no communication between agents while running</text>

  <rect x="20" y="270" width="700" height="35" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="370" y="292" font-size="9" fill="#334155" text-anchor="middle">disagreement among agents is surfaced by the aggregator, not silently resolved by an arbitrary tie-break</text>

  <defs>
    <marker id="coArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="coArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
