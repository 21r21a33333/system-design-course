<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Warm minimum pool absorbs baseline load; slow predictive scale-out handles sustained growth</text>

  <!-- Autoscaler controller -->
  <rect x="300" y="35" width="160" height="55" rx="8" fill="#334155"/>
  <text x="380" y="58" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">GPU Autoscaler</text>
  <text x="380" y="76" font-size="9" fill="#cbd5e1" text-anchor="middle">watches queue depth, VRAM</text>

  <!-- Warm pool -->
  <rect x="60" y="150" width="200" height="70" rx="8" fill="#0f766e"/>
  <text x="160" y="174" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Warm minimum pool</text>
  <text x="160" y="192" font-size="9" fill="#ccfbf1" text-anchor="middle">always running</text>
  <text x="160" y="206" font-size="9" fill="#ccfbf1" text-anchor="middle">absorbs baseline + spikes</text>

  <!-- Scale-out (amber, slow/at-risk) -->
  <rect x="500" y="150" width="200" height="70" rx="8" fill="#b45309"/>
  <text x="600" y="174" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Predictive scale-out</text>
  <text x="600" y="192" font-size="9" fill="#fef3c7" text-anchor="middle">minutes: image pull +</text>
  <text x="600" y="206" font-size="9" fill="#fef3c7" text-anchor="middle">weight load onto device</text>

  <line x1="340" y1="90" x2="200" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#gpuArrowGray)"/>
  <line x1="420" y1="90" x2="560" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#gpuArrowGray)"/>
  <text x="250" y="115" font-size="9" fill="#334155" text-anchor="middle">keep sized to baseline</text>
  <text x="510" y="115" font-size="9" fill="#334155" text-anchor="middle">sustained load only</text>

  <!-- Client requests -->
  <rect x="30" y="255" width="130" height="45" rx="8" fill="#1d4ed8"/>
  <text x="95" y="275" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Inference request</text>
  <text x="95" y="290" font-size="9" fill="#dbeafe" text-anchor="middle">interactive latency</text>
  <line x1="120" y1="255" x2="140" y2="222" stroke="#1d4ed8" stroke-width="2" marker-end="url(#gpuArrowBlue)"/>

  <rect x="300" y="255" width="420" height="45" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="510" y="272" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="600">Reactive scale-to-zero, unlike CPU tiers, stalls requests</text>
  <text x="510" y="286" font-size="9.5" fill="#b45309" text-anchor="middle">for minutes waiting on cold GPU capacity</text>

  <defs>
    <marker id="gpuArrowGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="gpuArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
</svg>
