<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Zero-Downtime Deployment: scaled design</text>

  <!-- Orchestrator, sharded per service -->
  <rect x="30" y="170" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="105" y="192" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Orchestrator</text>
  <text x="105" y="208" font-size="8" fill="#ccfbf1" text-anchor="middle">rollout for Service A</text>

  <rect x="30" y="270" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="105" y="292" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Orchestrator</text>
  <text x="105" y="308" font-size="8" fill="#ccfbf1" text-anchor="middle">rollout for Service B</text>

  <!-- Batches -->
  <rect x="230" y="130" width="130" height="45" rx="8" fill="#15803d"/>
  <text x="295" y="149" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Batch 1 (10%)</text>
  <text x="295" y="163" font-size="8" fill="#dcfce7" text-anchor="middle">healthy, promoted</text>

  <rect x="230" y="185" width="130" height="45" rx="8" fill="#b45309"/>
  <text x="295" y="204" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Batch 2 (10%)</text>
  <text x="295" y="218" font-size="8" fill="#fde68a" text-anchor="middle">soaking, watched</text>

  <rect x="230" y="240" width="130" height="45" rx="8" fill="#334155"/>
  <text x="295" y="259" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Batches 3-10</text>
  <text x="295" y="273" font-size="8" fill="#cbd5e1" text-anchor="middle">not yet started</text>

  <line x1="180" y1="190" x2="230" y2="155" stroke="#0f766e" stroke-width="2" marker-end="url(#dssArrowTeal)"/>
  <line x1="180" y1="197" x2="230" y2="207" stroke="#0f766e" stroke-width="2" marker-end="url(#dssArrowTeal)"/>
  <line x1="180" y1="205" x2="230" y2="262" stroke="#0f766e" stroke-width="2" marker-end="url(#dssArrowTeal)"/>

  <!-- Metrics comparing batch vs baseline -->
  <rect x="420" y="150" width="150" height="60" rx="8" fill="#b45309"/>
  <text x="495" y="172" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Tagged Metrics</text>
  <text x="495" y="188" font-size="8" fill="#fde68a" text-anchor="middle">by version + batch,</text>
  <text x="495" y="200" font-size="8" fill="#fde68a" text-anchor="middle">vs. old-version baseline</text>

  <line x1="360" y1="185" x2="418" y2="180" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#dssArrowAmber)"/>
  <line x1="418" y1="195" x2="360" y2="252" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#dssArrowAmber)"/>

  <!-- Load balancer -->
  <rect x="620" y="150" width="140" height="60" rx="8" fill="#1d4ed8"/>
  <text x="690" y="172" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Load Balancer</text>
  <text x="690" y="188" font-size="8" fill="#dbeafe" text-anchor="middle">fine-grained %</text>
  <text x="690" y="200" font-size="8" fill="#dbeafe" text-anchor="middle">traffic control</text>

  <line x1="570" y1="180" x2="618" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#dssArrowSlate)"/>

  <!-- Feature flag service, separate axis -->
  <rect x="420" y="30" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="495" y="52" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Feature Flag Svc</text>
  <text x="495" y="68" font-size="8" fill="#ccfbf1" text-anchor="middle">independent axis</text>

  <line x1="495" y1="85" x2="495" y2="148" stroke="#0f766e" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="620" y="250" width="180" height="110" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="710" y="270" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Rollback = shift traffic</text>
  <text x="710" y="284" font-size="9" fill="#334155" text-anchor="middle">back to old-version, which</text>
  <text x="710" y="298" font-size="9" fill="#334155" text-anchor="middle">was never torn down.</text>
  <text x="710" y="312" font-size="9" fill="#334155" text-anchor="middle">Feature flags gate product</text>
  <text x="710" y="326" font-size="9" fill="#334155" text-anchor="middle">risk separately from code-</text>
  <text x="710" y="340" font-size="9" fill="#334155" text-anchor="middle">deployment risk</text>

  <defs>
    <marker id="dssArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="dssArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="dssArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
