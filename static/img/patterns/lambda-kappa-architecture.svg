<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="780" height="400" fill="#ffffff"/>

  <!-- Divider -->
  <line x1="390" y1="40" x2="390" y2="380" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="195" y="26" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">Lambda: batch + speed layers merged</text>
  <text x="585" y="26" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">Kappa: one stream, replay to reprocess</text>

  <!-- ===== LAMBDA ===== -->
  <!-- Ingest -->
  <rect x="20" y="180" width="90" height="46" rx="7" fill="#334155"/>
  <text x="65" y="200" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Incoming</text>
  <text x="65" y="215" font-size="9" fill="#cbd5e1" text-anchor="middle">data</text>

  <!-- Batch layer -->
  <rect x="150" y="70" width="150" height="56" rx="8" fill="#0f766e"/>
  <text x="225" y="92" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Batch layer</text>
  <text x="225" y="108" font-size="8" fill="#ccfbf1" text-anchor="middle">accurate, high-latency</text>
  <text x="225" y="120" font-size="8" fill="#ccfbf1" text-anchor="middle">recompute from master</text>

  <!-- Speed layer -->
  <rect x="150" y="280" width="150" height="56" rx="8" fill="#b45309"/>
  <text x="225" y="302" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Speed layer</text>
  <text x="225" y="318" font-size="8" fill="#fde68a" text-anchor="middle">approximate, low-latency</text>
  <text x="225" y="330" font-size="8" fill="#fde68a" text-anchor="middle">recent window only</text>

  <!-- Serving layer -->
  <rect x="150" y="175" width="150" height="56" rx="8" fill="#1d4ed8"/>
  <text x="225" y="197" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Serving layer</text>
  <text x="225" y="213" font-size="8" fill="#dbeafe" text-anchor="middle">merge batch + speed</text>
  <text x="225" y="225" font-size="8" fill="#dbeafe" text-anchor="middle">at query time</text>

  <!-- ingest fans to batch + speed -->
  <line x1="110" y1="196" x2="148" y2="108" stroke="#0f766e" stroke-width="2" marker-end="url(#lkTeal)"/>
  <line x1="110" y1="210" x2="148" y2="304" stroke="#b45309" stroke-width="2" marker-end="url(#lkAmber)"/>
  <!-- batch + speed -> serving -->
  <line x1="225" y1="126" x2="225" y2="173" stroke="#1d4ed8" stroke-width="2" marker-end="url(#lkBlue)"/>
  <line x1="225" y1="280" x2="225" y2="233" stroke="#1d4ed8" stroke-width="2" marker-end="url(#lkBlue)"/>

  <text x="150" y="360" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="600">two codebases for one logic</text>

  <!-- ===== KAPPA ===== -->
  <!-- Immutable log -->
  <rect x="430" y="160" width="120" height="90" rx="8" fill="#0f766e"/>
  <text x="490" y="182" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Immutable</text>
  <text x="490" y="197" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">replayable log</text>
  <text x="490" y="216" font-size="8" fill="#ccfbf1" text-anchor="middle">offset 0 ... N</text>
  <line x1="446" y1="228" x2="534" y2="228" stroke="#ccfbf1" stroke-width="1"/>
  <text x="490" y="242" font-size="8" fill="#ccfbf1" text-anchor="middle">single source of truth</text>

  <!-- Stream job v1 -->
  <rect x="600" y="120" width="150" height="50" rx="8" fill="#1d4ed8"/>
  <text x="675" y="140" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Stream job (live)</text>
  <text x="675" y="156" font-size="8" fill="#dbeafe" text-anchor="middle">consume from tip</text>

  <!-- Stream job v2 replay -->
  <rect x="600" y="240" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="675" y="260" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Replay (v2 logic)</text>
  <text x="675" y="276" font-size="8" fill="#dcfce7" text-anchor="middle">re-read from offset 0</text>

  <!-- log -> jobs -->
  <line x1="550" y1="185" x2="598" y2="150" stroke="#1d4ed8" stroke-width="2" marker-end="url(#lkBlue)"/>
  <line x1="550" y1="220" x2="598" y2="262" stroke="#15803d" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lkGreen)"/>
  <text x="583" y="300" font-size="8" fill="#15803d" text-anchor="middle">reprocess = replay</text>

  <text x="590" y="360" font-size="8.5" fill="#15803d" text-anchor="middle" font-weight="600">one codebase, no batch layer</text>

  <defs>
    <marker id="lkTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="lkAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
    <marker id="lkBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
    <marker id="lkGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/></marker>
  </defs>
</svg>
