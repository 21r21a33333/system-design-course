<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Log-based CDC: tail the transaction log, stream committed row changes downstream</text>

  <!-- Application writes -->
  <rect x="24" y="130" width="120" height="60" rx="8" fill="#1d4ed8"/>
  <text x="84" y="156" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Application</text>
  <text x="84" y="174" font-size="9" fill="#dbeafe" text-anchor="middle">INSERT / UPDATE / DELETE</text>

  <!-- Source DB with WAL -->
  <rect x="200" y="100" width="150" height="120" rx="8" fill="#0f766e"/>
  <text x="275" y="126" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Source DB</text>
  <rect x="216" y="140" width="118" height="64" rx="5" fill="#0b5c55"/>
  <text x="275" y="160" font-size="10" fill="#ccfbf1" text-anchor="middle" font-weight="600">WAL / binlog</text>
  <text x="275" y="177" font-size="8" fill="#ccfbf1" text-anchor="middle">lsn 41: upd row 7</text>
  <text x="275" y="190" font-size="8" fill="#ccfbf1" text-anchor="middle">lsn 42: del row 3</text>

  <!-- Application -> DB -->
  <line x1="144" y1="160" x2="198" y2="160" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#cdcBlue)"/>

  <!-- CDC connector -->
  <rect x="410" y="120" width="140" height="80" rx="8" fill="#b45309"/>
  <text x="480" y="150" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">CDC connector</text>
  <text x="480" y="168" font-size="8.5" fill="#fde68a" text-anchor="middle">tails log in commit order</text>
  <text x="480" y="182" font-size="8.5" fill="#fde68a" text-anchor="middle">snapshot then stream</text>

  <!-- DB -> connector (tail) -->
  <line x1="350" y1="160" x2="408" y2="160" stroke="#b45309" stroke-width="2.5" marker-end="url(#cdcAmber)"/>
  <text x="379" y="150" font-size="8" fill="#b45309" text-anchor="middle">tail</text>

  <!-- Change-event stream / broker -->
  <rect x="410" y="240" width="140" height="46" rx="8" fill="#334155"/>
  <text x="480" y="262" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Change stream</text>
  <text x="480" y="277" font-size="8" fill="#cbd5e1" text-anchor="middle">ordered {op, pk, before, after}</text>

  <!-- connector -> stream -->
  <line x1="480" y1="200" x2="480" y2="238" stroke="#334155" stroke-width="2.5" marker-end="url(#cdcSlate)"/>

  <!-- Consumers -->
  <rect x="612" y="70" width="126" height="42" rx="7" fill="#15803d"/>
  <text x="675" y="88" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Search index</text>
  <text x="675" y="103" font-size="8" fill="#dcfce7" text-anchor="middle">sync</text>

  <rect x="612" y="132" width="126" height="42" rx="7" fill="#15803d"/>
  <text x="675" y="150" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Cache</text>
  <text x="675" y="165" font-size="8" fill="#dcfce7" text-anchor="middle">invalidate</text>

  <rect x="612" y="194" width="126" height="42" rx="7" fill="#15803d"/>
  <text x="675" y="212" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Data warehouse</text>
  <text x="675" y="227" font-size="8" fill="#dcfce7" text-anchor="middle">replicate</text>

  <!-- stream -> consumers -->
  <line x1="550" y1="255" x2="608" y2="98" stroke="#15803d" stroke-width="2" marker-end="url(#cdcGreen)"/>
  <line x1="550" y1="258" x2="608" y2="155" stroke="#15803d" stroke-width="2" marker-end="url(#cdcGreen)"/>
  <line x1="550" y1="262" x2="608" y2="212" stroke="#15803d" stroke-width="2" marker-end="url(#cdcGreen)"/>

  <rect x="24" y="300" width="714" height="30" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="381" y="319" font-size="9" fill="#334155" text-anchor="middle">Consumers are idempotent by LSN — redelivered events are skipped, so at-least-once delivery stays correct</text>

  <defs>
    <marker id="cdcBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
    <marker id="cdcAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
    <marker id="cdcSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
    <marker id="cdcGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/></marker>
  </defs>
</svg>
