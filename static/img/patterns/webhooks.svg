<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="360" y="26" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Provider POSTs a signed event to a URL the consumer registered — a "reverse API"</text>

  <!-- Provider -->
  <rect x="40" y="120" width="150" height="90" rx="8" fill="#0f766e"/>
  <text x="115" y="150" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Provider</text>
  <text x="115" y="170" font-size="9" fill="#ccfbf1" text-anchor="middle">event occurs</text>
  <text x="115" y="186" font-size="9" fill="#ccfbf1" text-anchor="middle">signs + POSTs</text>

  <!-- Consumer -->
  <rect x="530" y="120" width="150" height="90" rx="8" fill="#1d4ed8"/>
  <text x="605" y="146" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Consumer</text>
  <text x="605" y="166" font-size="9" fill="#dbeafe" text-anchor="middle">public HTTPS URL</text>
  <text x="605" y="182" font-size="9" fill="#dbeafe" text-anchor="middle">verify → 200 fast</text>

  <!-- register (setup) -->
  <line x1="530" y1="132" x2="192" y2="132" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#whArrowSlate)"/>
  <text x="360" y="126" font-size="9" fill="#64748b" text-anchor="middle">1. register callback URL + shared secret (once)</text>

  <!-- POST -->
  <line x1="190" y1="158" x2="530" y2="158" stroke="#0f766e" stroke-width="2.5" marker-end="url(#whArrowTeal)"/>
  <text x="360" y="152" font-size="9" fill="#0f766e" text-anchor="middle">2. POST /hook  X-Signature: t=…,v1=HMAC(body)</text>

  <!-- 200 -->
  <line x1="530" y1="180" x2="190" y2="180" stroke="#15803d" stroke-width="2" marker-end="url(#whArrowGreen)"/>
  <text x="360" y="174" font-size="9" fill="#15803d" text-anchor="middle">3. 200 OK (ack fast, process async)</text>

  <!-- retry -->
  <line x1="190" y1="202" x2="530" y2="202" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#whArrowAmber)"/>
  <text x="360" y="215" font-size="9" fill="#b45309" text-anchor="middle">on timeout / 5xx: retry with backoff (at-least-once)</text>

  <!-- consumer internals -->
  <rect x="530" y="238" width="150" height="46" rx="8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="605" y="257" font-size="9" fill="#1d4ed8" text-anchor="middle">enqueue</text>
  <text x="605" y="271" font-size="9" fill="#1d4ed8" text-anchor="middle">then process idempotently</text>
  <line x1="605" y1="210" x2="605" y2="238" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#whArrowBlue)"/>

  <!-- notes -->
  <rect x="40" y="300" width="640" height="52" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="320" font-size="9" fill="#334155" text-anchor="middle">Signature covers timestamp + body → forgery and replay are rejected.</text>
  <text x="360" y="336" font-size="9" fill="#334155" text-anchor="middle">Ordering is not guaranteed; retries mean duplicates — the consumer must dedupe on an event id.</text>

  <defs>
    <marker id="whArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="whArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="whArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/></marker>
    <marker id="whArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
    <marker id="whArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
  </defs>
</svg>
