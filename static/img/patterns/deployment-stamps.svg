<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="780" height="320" fill="#ffffff"/>

  <!-- router -->
  <rect x="320" y="20" width="140" height="50" rx="8" fill="#1d4ed8"/>
  <text x="390" y="42" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Router</text>
  <text x="390" y="58" font-size="9" fill="#dbeafe" text-anchor="middle">tenant → stamp lookup</text>

  <!-- Stamp 1 -->
  <rect x="40" y="120" width="200" height="150" rx="8" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="140" y="140" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="600">Stamp 1</text>
  <rect x="60" y="155" width="160" height="40" rx="6" fill="#0f766e"/>
  <text x="140" y="179" font-size="10" fill="#ffffff" text-anchor="middle">Compute</text>
  <rect x="60" y="205" width="160" height="40" rx="6" fill="#0d9488"/>
  <text x="140" y="229" font-size="10" fill="#ffffff" text-anchor="middle">Data</text>
  <text x="140" y="260" font-size="9" fill="#0f766e" text-anchor="middle">tenants A, B</text>

  <!-- Stamp 2 -->
  <rect x="290" y="120" width="200" height="150" rx="8" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="390" y="140" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="600">Stamp 2</text>
  <rect x="310" y="155" width="160" height="40" rx="6" fill="#0f766e"/>
  <text x="390" y="179" font-size="10" fill="#ffffff" text-anchor="middle">Compute</text>
  <rect x="310" y="205" width="160" height="40" rx="6" fill="#0d9488"/>
  <text x="390" y="229" font-size="10" fill="#ffffff" text-anchor="middle">Data</text>
  <text x="390" y="260" font-size="9" fill="#0f766e" text-anchor="middle">tenant C</text>

  <!-- Stamp 3 -->
  <rect x="540" y="120" width="200" height="150" rx="8" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="640" y="140" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="600">Stamp 3</text>
  <rect x="560" y="155" width="160" height="40" rx="6" fill="#0f766e"/>
  <text x="640" y="179" font-size="10" fill="#ffffff" text-anchor="middle">Compute</text>
  <rect x="560" y="205" width="160" height="40" rx="6" fill="#0d9488"/>
  <text x="640" y="229" font-size="10" fill="#ffffff" text-anchor="middle">Data</text>
  <text x="640" y="260" font-size="9" fill="#0f766e" text-anchor="middle">tenants D, E, F</text>

  <line x1="360" y1="70" x2="150" y2="118" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowDs1)"/>
  <line x1="390" y1="70" x2="390" y2="118" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowDs1)"/>
  <line x1="420" y1="70" x2="630" y2="118" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowDs1)"/>

  <!-- isolation note -->
  <rect x="250" y="284" width="280" height="28" rx="6" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="390" y="302" font-size="9" fill="#64748b" text-anchor="middle">no shared infrastructure between stamps — a problem in one can't cross over</text>

  <defs>
    <marker id="arrowDs1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
</svg>
