<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Two ways to move money across a currency border</text>

  <!-- Traditional lane label -->
  <text x="410" y="52" font-size="11" fill="#be123c" text-anchor="middle" font-weight="600">Traditional: SWIFT message hops a correspondent chain (each hop a fee + FX spread + delay)</text>

  <!-- Sender bank -->
  <rect x="20" y="66" width="120" height="56" rx="8" fill="#1d4ed8"/>
  <text x="80" y="90" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Sender bank</text>
  <text x="80" y="107" font-size="9" fill="#dbeafe" text-anchor="middle">UK, holds GBP</text>

  <!-- Correspondent 1 -->
  <rect x="200" y="66" width="130" height="56" rx="8" fill="#b45309"/>
  <text x="265" y="86" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Correspondent A</text>
  <text x="265" y="101" font-size="9" fill="#fde68a" text-anchor="middle">nostro/vostro,</text>
  <text x="265" y="113" font-size="9" fill="#fde68a" text-anchor="middle">does the FX leg</text>

  <!-- Correspondent 2 -->
  <rect x="390" y="66" width="130" height="56" rx="8" fill="#b45309"/>
  <text x="455" y="86" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Correspondent B</text>
  <text x="455" y="101" font-size="9" fill="#fde68a" text-anchor="middle">another hop,</text>
  <text x="455" y="113" font-size="9" fill="#fde68a" text-anchor="middle">another cut</text>

  <!-- Beneficiary bank -->
  <rect x="580" y="66" width="130" height="56" rx="8" fill="#1d4ed8"/>
  <text x="645" y="90" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Beneficiary bank</text>
  <text x="645" y="107" font-size="9" fill="#dbeafe" text-anchor="middle">US, holds USD</text>

  <!-- traditional arrows -->
  <line x1="140" y1="94" x2="198" y2="94" stroke="#be123c" stroke-width="2" marker-end="url(#cbxArrowRose)"/>
  <line x1="330" y1="94" x2="388" y2="94" stroke="#be123c" stroke-width="2" marker-end="url(#cbxArrowRose)"/>
  <line x1="520" y1="94" x2="578" y2="94" stroke="#be123c" stroke-width="2" marker-end="url(#cbxArrowRose)"/>
  <text x="410" y="140" font-size="9" fill="#be123c" text-anchor="middle">days end to end, opaque fee taken inside a bad FX rate</text>

  <!-- divider -->
  <line x1="20" y1="160" x2="800" y2="160" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Modern lane label -->
  <text x="410" y="184" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="600">Modern local rails: two local transfers plus one internal FX position (money never crosses)</text>

  <!-- Payer -->
  <rect x="20" y="206" width="120" height="56" rx="8" fill="#1d4ed8"/>
  <text x="80" y="230" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Payer</text>
  <text x="80" y="247" font-size="9" fill="#dbeafe" text-anchor="middle">pays GBP locally</text>

  <!-- Provider UK account -->
  <rect x="200" y="206" width="150" height="56" rx="8" fill="#0f766e"/>
  <text x="275" y="226" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Provider GBP account</text>
  <text x="275" y="241" font-size="9" fill="#ccfbf1" text-anchor="middle">pre-funded, in-country</text>
  <text x="275" y="253" font-size="9" fill="#ccfbf1" text-anchor="middle">local rail receives</text>

  <!-- Internal FX book -->
  <rect x="330" y="300" width="160" height="70" rx="8" fill="#6d28d9"/>
  <text x="410" y="326" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Internal FX book</text>
  <text x="410" y="343" font-size="9" fill="#ede9fe" text-anchor="middle">mid-rate + explicit spread;</text>
  <text x="410" y="356" font-size="9" fill="#ede9fe" text-anchor="middle">nets GBP in vs USD out</text>

  <!-- Provider US account -->
  <rect x="470" y="206" width="150" height="56" rx="8" fill="#0f766e"/>
  <text x="545" y="226" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Provider USD account</text>
  <text x="545" y="241" font-size="9" fill="#ccfbf1" text-anchor="middle">pre-funded, in-country</text>
  <text x="545" y="253" font-size="9" fill="#ccfbf1" text-anchor="middle">local rail pays out</text>

  <!-- Beneficiary -->
  <rect x="680" y="206" width="120" height="56" rx="8" fill="#1d4ed8"/>
  <text x="740" y="230" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Beneficiary</text>
  <text x="740" y="247" font-size="9" fill="#dbeafe" text-anchor="middle">gets USD locally</text>

  <!-- modern arrows -->
  <line x1="140" y1="234" x2="198" y2="234" stroke="#0f766e" stroke-width="2" marker-end="url(#cbxArrowTeal)"/>
  <line x1="620" y1="234" x2="678" y2="234" stroke="#0f766e" stroke-width="2" marker-end="url(#cbxArrowTeal)"/>
  <line x1="290" y1="262" x2="378" y2="300" stroke="#6d28d9" stroke-width="2" marker-end="url(#cbxArrowViolet)"/>
  <line x1="450" y1="300" x2="530" y2="262" stroke="#6d28d9" stroke-width="2" marker-end="url(#cbxArrowViolet)"/>

  <!-- note box -->
  <rect x="30" y="386" width="360" height="44" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="210" y="404" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">The FX leg is an internal book entry, not a wire.</text>
  <text x="210" y="418" font-size="9" fill="#334155" text-anchor="middle">The provider's two currency accounts drift and are rebalanced.</text>

  <defs>
    <marker id="cbxArrowRose" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#be123c"/>
    </marker>
    <marker id="cbxArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="cbxArrowViolet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6d28d9"/>
    </marker>
  </defs>
</svg>
