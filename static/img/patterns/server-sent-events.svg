<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="26" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">One long-lived HTTP response the server never finishes — text/event-stream, one direction</text>

  <!-- Client -->
  <rect x="40" y="120" width="150" height="90" rx="8" fill="#1d4ed8"/>
  <text x="115" y="150" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="115" y="170" font-size="9" fill="#dbeafe" text-anchor="middle">EventSource</text>
  <text x="115" y="186" font-size="9" fill="#dbeafe" text-anchor="middle">receive only</text>

  <!-- Server -->
  <rect x="530" y="120" width="150" height="90" rx="8" fill="#0f766e"/>
  <text x="605" y="150" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Server</text>
  <text x="605" y="170" font-size="9" fill="#ccfbf1" text-anchor="middle">writes events</text>
  <text x="605" y="186" font-size="9" fill="#ccfbf1" text-anchor="middle">as they occur</text>

  <!-- single request -->
  <line x1="190" y1="138" x2="530" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#sseArrowSlate)"/>
  <text x="360" y="131" font-size="9" fill="#334155" text-anchor="middle">GET /stream  Accept: text/event-stream</text>

  <!-- stream of events, all one direction -->
  <line x1="530" y1="160" x2="190" y2="160" stroke="#0f766e" stroke-width="2.5" marker-end="url(#sseArrowTeal)"/>
  <text x="360" y="154" font-size="9" fill="#0f766e" text-anchor="middle">id: 41  data: {...}</text>
  <line x1="530" y1="182" x2="190" y2="182" stroke="#0f766e" stroke-width="2.5" marker-end="url(#sseArrowTeal)"/>
  <text x="360" y="176" font-size="9" fill="#0f766e" text-anchor="middle">id: 42  event: price  data: {...}</text>
  <line x1="530" y1="204" x2="190" y2="204" stroke="#0f766e" stroke-width="2.5" marker-end="url(#sseArrowTeal)"/>
  <text x="360" y="198" font-size="9" fill="#0f766e" text-anchor="middle">id: 43  data: {...}</text>

  <!-- reconnect box -->
  <rect x="40" y="240" width="640" height="78" rx="8" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="360" y="262" font-size="10" fill="#b45309" text-anchor="middle" font-weight="600">Connection drops</text>
  <text x="360" y="280" font-size="9" fill="#334155" text-anchor="middle">EventSource reconnects automatically and sends Last-Event-ID: 43</text>
  <text x="360" y="296" font-size="9" fill="#334155" text-anchor="middle">Server resumes from id 44 — no reconnect logic in application code, no lost events</text>
  <text x="360" y="311" font-size="9" fill="#64748b" text-anchor="middle">Plain HTTP: passes through proxies and load balancers without an upgrade handshake</text>

  <defs>
    <marker id="sseArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="sseArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
  </defs>
</svg>
