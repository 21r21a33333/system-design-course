<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Uber: initial high-level design</text>

  <!-- Rider client -->
  <rect x="20" y="60" width="130" height="55" rx="8" fill="#1d4ed8"/>
  <text x="85" y="83" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Rider Client</text>
  <text x="85" y="100" font-size="9" fill="#dbeafe" text-anchor="middle">request, track trip</text>

  <!-- Driver client -->
  <rect x="20" y="200" width="130" height="55" rx="8" fill="#1d4ed8"/>
  <text x="85" y="223" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Driver Client</text>
  <text x="85" y="240" font-size="9" fill="#dbeafe" text-anchor="middle">location pings (~4s)</text>

  <!-- API / edge layer -->
  <rect x="200" y="130" width="140" height="60" rx="8" fill="#1d4ed8"/>
  <text x="270" y="155" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">API Layer</text>
  <text x="270" y="172" font-size="9" fill="#dbeafe" text-anchor="middle">persistent connections</text>

  <line x1="150" y1="87" x2="198" y2="150" stroke="#1d4ed8" stroke-width="2" marker-end="url(#uArrowBlue)"/>
  <line x1="150" y1="227" x2="198" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#uArrowBlue)"/>

  <!-- Dispatch service -->
  <rect x="390" y="60" width="150" height="65" rx="8" fill="#0f766e"/>
  <text x="465" y="86" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Dispatch Service</text>
  <text x="465" y="103" font-size="9" fill="#ccfbf1" text-anchor="middle">match rider &lt;-&gt; driver</text>
  <text x="465" y="116" font-size="9" fill="#ccfbf1" text-anchor="middle">rank by ETA</text>

  <!-- Trip service -->
  <rect x="390" y="150" width="150" height="65" rx="8" fill="#0f766e"/>
  <text x="465" y="176" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Trip Service</text>
  <text x="465" y="193" font-size="9" fill="#ccfbf1" text-anchor="middle">trip lifecycle,</text>
  <text x="465" y="206" font-size="9" fill="#ccfbf1" text-anchor="middle">idempotent state changes</text>

  <!-- Pricing service -->
  <rect x="390" y="240" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="465" y="264" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Pricing Service</text>
  <text x="465" y="281" font-size="9" fill="#ccfbf1" text-anchor="middle">fare + surge multiplier</text>

  <line x1="340" y1="155" x2="388" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#uArrowBlue)"/>
  <line x1="340" y1="165" x2="388" y2="185" stroke="#1d4ed8" stroke-width="2" marker-end="url(#uArrowBlue)"/>
  <line x1="340" y1="175" x2="388" y2="265" stroke="#1d4ed8" stroke-width="2" marker-end="url(#uArrowBlue)"/>

  <!-- Location index -->
  <rect x="600" y="60" width="170" height="65" rx="8" fill="#b45309"/>
  <text x="685" y="83" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Location Index</text>
  <text x="685" y="100" font-size="9" fill="#fde68a" text-anchor="middle">in-memory, geo-cell keyed</text>
  <text x="685" y="114" font-size="9" fill="#fde68a" text-anchor="middle">stale-tolerant</text>

  <!-- Trip store -->
  <rect x="600" y="150" width="170" height="65" rx="8" fill="#334155"/>
  <text x="685" y="176" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Trip Store</text>
  <text x="685" y="193" font-size="9" fill="#cbd5e1" text-anchor="middle">durable, strongly</text>
  <text x="685" y="206" font-size="9" fill="#cbd5e1" text-anchor="middle">consistent</text>

  <!-- Route/polyline blob store -->
  <rect x="600" y="240" width="170" height="60" rx="8" fill="#334155"/>
  <text x="685" y="264" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Route Blob Store</text>
  <text x="685" y="281" font-size="9" fill="#cbd5e1" text-anchor="middle">trip polylines</text>

  <line x1="540" y1="92" x2="598" y2="92" stroke="#0f766e" stroke-width="2" marker-end="url(#uArrowTeal)"/>
  <line x1="540" y1="182" x2="598" y2="182" stroke="#0f766e" stroke-width="2" marker-end="url(#uArrowTeal)"/>
  <line x1="540" y1="200" x2="598" y2="265" stroke="#0f766e" stroke-width="2" marker-end="url(#uArrowTeal)"/>

  <!-- driver ping ingest to location index -->
  <path d="M270,130 C270,60 550,20 600,80" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#uArrowAmber)"/>
  <text x="430" y="35" font-size="9" fill="#b45309" text-anchor="middle">location pings feed the index directly</text>

  <rect x="20" y="330" width="750" height="55" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="395" y="350" font-size="9" fill="#334155" text-anchor="middle">Location index is optimized for write throughput and fast "nearby" queries, tolerant of a few seconds of staleness.</text>
  <text x="395" y="366" font-size="9" fill="#334155" text-anchor="middle">Trip store is optimized for durability and correctness — a trip is never lost or double-assigned.</text>

  <defs>
    <marker id="uArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="uArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="uArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
