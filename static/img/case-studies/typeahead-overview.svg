<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Typeahead: initial high-level design</text>

  <!-- Client -->
  <rect x="20" y="160" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="85" y="185" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="85" y="202" font-size="9" fill="#dbeafe" text-anchor="middle">debounced keystrokes</text>

  <!-- Suggestion service -->
  <rect x="220" y="160" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="295" y="185" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Suggestion Service</text>
  <text x="295" y="202" font-size="9" fill="#ccfbf1" text-anchor="middle">stateless, in-memory</text>

  <line x1="150" y1="180" x2="218" y2="180" stroke="#1d4ed8" stroke-width="2" marker-end="url(#taArrowBlue)"/>
  <line x1="218" y1="200" x2="150" y2="200" stroke="#1d4ed8" stroke-width="2" marker-end="url(#taArrowBlue)"/>
  <text x="184" y="195" font-size="8" fill="#1d4ed8" text-anchor="middle">prefix</text>
  <text x="184" y="215" font-size="8" fill="#1d4ed8" text-anchor="middle">top-K</text>

  <!-- Prefix index (trie) -->
  <rect x="440" y="160" width="160" height="60" rx="8" fill="#0f766e"/>
  <text x="520" y="185" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Prefix Index (Trie)</text>
  <text x="520" y="202" font-size="9" fill="#ccfbf1" text-anchor="middle">cached top-K per node</text>

  <line x1="370" y1="180" x2="438" y2="180" stroke="#0f766e" stroke-width="2" marker-end="url(#taArrowTeal)"/>
  <text x="404" y="172" font-size="8" fill="#0f766e" text-anchor="middle">lookup</text>

  <!-- Aggregation pipeline -->
  <rect x="440" y="60" width="160" height="55" rx="8" fill="#b45309"/>
  <text x="520" y="83" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Aggregation Pipeline</text>
  <text x="520" y="99" font-size="9" fill="#fde68a" text-anchor="middle">batch rebuild, hourly+</text>

  <line x1="520" y1="115" x2="520" y2="158" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#taArrowAmber)"/>
  <text x="600" y="135" font-size="8" fill="#b45309" text-anchor="start">atomic swap</text>

  <!-- Query log -->
  <rect x="440" y="270" width="160" height="55" rx="8" fill="#334155"/>
  <text x="520" y="293" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Query Log</text>
  <text x="520" y="309" font-size="9" fill="#cbd5e1" text-anchor="middle">completed searches</text>

  <line x1="520" y1="270" x2="520" y2="118" stroke="#334155" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#taArrowSlate)"/>
  <text x="440" y="200" font-size="8" fill="#64748b" text-anchor="middle">read by</text>
  <text x="440" y="212" font-size="8" fill="#64748b" text-anchor="middle">pipeline</text>

  <rect x="630" y="160" width="160" height="90" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="710" y="180" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Small data, huge</text>
  <text x="710" y="194" font-size="9" fill="#334155" text-anchor="middle">request rate: index</text>
  <text x="710" y="208" font-size="9" fill="#334155" text-anchor="middle">fits in memory, read</text>
  <text x="710" y="222" font-size="9" fill="#334155" text-anchor="middle">~28k req/s at peak,</text>
  <text x="710" y="236" font-size="9" fill="#334155" text-anchor="middle">rebuilt rarely</text>

  <defs>
    <marker id="taArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="taArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="taArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="taArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
