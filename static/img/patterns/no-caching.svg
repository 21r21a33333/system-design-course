<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Every request recomputes an answer that hasn't changed since the last one</text>

  <rect x="30" y="55" width="90" height="40" rx="6" fill="#1d4ed8"/>
  <text x="75" y="79" font-size="9" fill="#ffffff" text-anchor="middle">Visitor 1</text>
  <rect x="30" y="105" width="90" height="40" rx="6" fill="#1d4ed8"/>
  <text x="75" y="129" font-size="9" fill="#ffffff" text-anchor="middle">Visitor 2</text>
  <rect x="30" y="155" width="90" height="40" rx="6" fill="#1d4ed8"/>
  <text x="75" y="179" font-size="9" fill="#ffffff" text-anchor="middle">Visitor 3</text>

  <line x1="120" y1="75" x2="238" y2="90" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ncArrowRed)"/>
  <line x1="120" y1="125" x2="238" y2="110" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ncArrowRed)"/>
  <line x1="120" y1="175" x2="238" y2="130" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ncArrowRed)"/>

  <rect x="240" y="65" width="220" height="90" rx="8" fill="#dc2626"/>
  <text x="350" y="88" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Recompute Trending List</text>
  <text x="350" y="106" font-size="9" fill="#fee2e2" text-anchor="middle">scan recent orders</text>
  <text x="350" y="121" font-size="9" fill="#fee2e2" text-anchor="middle">aggregate + sort</text>
  <text x="350" y="136" font-size="9" fill="#ffe4b5" text-anchor="middle" font-weight="600">same answer, every time</text>

  <rect x="500" y="70" width="220" height="80" rx="8" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="610" y="90" font-size="10" fill="#b45309" text-anchor="middle" font-weight="600">Query Log</text>
  <text x="610" y="108" font-size="8" fill="#334155" text-anchor="middle">identical query text,</text>
  <text x="610" y="122" font-size="8" fill="#334155" text-anchor="middle">executed dozens of times</text>
  <text x="610" y="136" font-size="8" fill="#334155" text-anchor="middle">per second, full cost each time</text>

  <!-- fix inset -->
  <rect x="30" y="200" width="700" height="100" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="380" y="219" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="600">THE FIX — cache-aside with a TTL</text>

  <rect x="55" y="233" width="90" height="45" rx="6" fill="#1d4ed8"/>
  <text x="100" y="259" font-size="9" fill="#ffffff" text-anchor="middle">Visitors</text>

  <line x1="145" y1="255" x2="230" y2="255" stroke="#0f766e" stroke-width="2" marker-end="url(#ncArrowTeal)"/>

  <rect x="232" y="233" width="130" height="45" rx="6" fill="#0f766e"/>
  <text x="297" y="252" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Cache (TTL)</text>
  <text x="297" y="266" font-size="8" fill="#ccfbf1" text-anchor="middle">hit → return instantly</text>

  <line x1="362" y1="265" x2="430" y2="265" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ncArrowGray)"/>
  <text x="396" y="280" font-size="7" fill="#64748b" text-anchor="middle">miss only</text>

  <rect x="432" y="233" width="150" height="45" rx="6" fill="#334155"/>
  <text x="507" y="252" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Recompute</text>
  <text x="507" y="266" font-size="8" fill="#cbd5e1" text-anchor="middle">once per TTL window</text>

  <defs>
    <marker id="ncArrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="ncArrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f766e"/>
    </marker>
    <marker id="ncArrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
