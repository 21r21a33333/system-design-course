<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Zelle at scale: many banks behind one directory and messaging network, settlement decoupled off the hot path</text>

  <!-- Bank apps column -->
  <rect x="20" y="70" width="150" height="46" rx="8" fill="#1d4ed8"/>
  <text x="95" y="92" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Bank app A</text>
  <text x="95" y="107" font-size="9" fill="#dbeafe" text-anchor="middle">sender side</text>

  <rect x="20" y="126" width="150" height="46" rx="8" fill="#1d4ed8"/>
  <text x="95" y="148" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Bank app B</text>
  <text x="95" y="163" font-size="9" fill="#dbeafe" text-anchor="middle">2,300+ enrolled FIs</text>

  <rect x="20" y="182" width="150" height="46" rx="8" fill="#1d4ed8"/>
  <text x="95" y="204" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Standalone Zelle app</text>
  <text x="95" y="219" font-size="9" fill="#dbeafe" text-anchor="middle">for smaller banks</text>

  <!-- Network API gateway -->
  <rect x="240" y="110" width="150" height="70" rx="8" fill="#0f766e"/>
  <text x="315" y="138" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Network API</text>
  <text x="315" y="154" font-size="9" fill="#ccfbf1" text-anchor="middle">signed bank requests,</text>
  <text x="315" y="166" font-size="9" fill="#ccfbf1" text-anchor="middle">idempotency keys</text>

  <!-- Directory store -->
  <rect x="450" y="70" width="150" height="60" rx="8" fill="#6d28d9"/>
  <text x="525" y="94" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Token directory</text>
  <text x="525" y="110" font-size="9" fill="#ede9fe" text-anchor="middle">token to bank binding,</text>
  <text x="525" y="122" font-size="9" fill="#ede9fe" text-anchor="middle">one active per token</text>

  <!-- Routing / risk core -->
  <rect x="450" y="150" width="150" height="70" rx="8" fill="#6d28d9"/>
  <text x="525" y="176" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Routing and risk</text>
  <text x="525" y="192" font-size="9" fill="#ede9fe" text-anchor="middle">fraud and AML checks,</text>
  <text x="525" y="204" font-size="9" fill="#ede9fe" text-anchor="middle">sharded by token</text>

  <!-- Transfer log -->
  <rect x="450" y="240" width="150" height="60" rx="8" fill="#be123c"/>
  <text x="525" y="264" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Transfer log</text>
  <text x="525" y="280" font-size="9" fill="#fecdd3" text-anchor="middle">append-only, debit and</text>
  <text x="525" y="292" font-size="9" fill="#fecdd3" text-anchor="middle">credit legs, idempotent</text>

  <!-- Bank adapters -->
  <rect x="650" y="150" width="150" height="70" rx="8" fill="#b45309"/>
  <text x="725" y="176" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Per-bank adapters</text>
  <text x="725" y="192" font-size="9" fill="#fde68a" text-anchor="middle">circuit breaker,</text>
  <text x="725" y="204" font-size="9" fill="#fde68a" text-anchor="middle">retry with backoff</text>

  <!-- Settlement engine -->
  <rect x="240" y="330" width="360" height="70" rx="8" fill="#0f766e"/>
  <text x="420" y="358" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Deferred settlement engine (off the hot path)</text>
  <text x="420" y="376" font-size="9" fill="#ccfbf1" text-anchor="middle">nets each bank-pair position, posts to ACH batch or RTP,</text>
  <text x="420" y="388" font-size="9" fill="#ccfbf1" text-anchor="middle">reconciled against the transfer log</text>

  <!-- edges -->
  <line x1="170" y1="93" x2="238" y2="130" stroke="#1d4ed8" stroke-width="2" marker-end="url(#zsclArrowBlue)"/>
  <line x1="170" y1="149" x2="238" y2="145" stroke="#1d4ed8" stroke-width="2" marker-end="url(#zsclArrowBlue)"/>
  <line x1="170" y1="205" x2="238" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#zsclArrowBlue)"/>
  <line x1="390" y1="135" x2="448" y2="105" stroke="#0f766e" stroke-width="2" marker-end="url(#zsclArrowTeal)"/>
  <line x1="390" y1="155" x2="448" y2="180" stroke="#0f766e" stroke-width="2" marker-end="url(#zsclArrowTeal)"/>
  <line x1="600" y1="185" x2="648" y2="185" stroke="#6d28d9" stroke-width="2" marker-end="url(#zsclArrowViolet)"/>
  <line x1="525" y1="220" x2="525" y2="238" stroke="#be123c" stroke-width="2" marker-end="url(#zsclArrowRose)"/>
  <line x1="490" y1="300" x2="440" y2="328" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#zsclArrowTeal)"/>

  <defs>
    <marker id="zsclArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="zsclArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="zsclArrowViolet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6d28d9"/>
    </marker>
    <marker id="zsclArrowRose" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#be123c"/>
    </marker>
  </defs>
</svg>
