<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <!-- Client -->
  <rect x="20" y="130" width="120" height="60" rx="8" fill="#1d4ed8"/>
  <text x="80" y="165" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Query by</text>
  <text x="80" y="180" font-size="11" fill="#dbeafe" text-anchor="middle">"town"</text>

  <!-- Without index: full scan across fact table -->
  <text x="380" y="24" font-size="11" fill="#b45309" text-anchor="middle" font-weight="600">Without an index table: scan every partition</text>
  <rect x="250" y="40" width="90" height="55" rx="6" fill="#b45309"/>
  <text x="295" y="72" font-size="10" fill="#ffffff" text-anchor="middle">Partition 1</text>
  <rect x="350" y="40" width="90" height="55" rx="6" fill="#b45309"/>
  <text x="395" y="72" font-size="10" fill="#ffffff" text-anchor="middle">Partition 2</text>
  <rect x="450" y="40" width="90" height="55" rx="6" fill="#b45309"/>
  <text x="495" y="72" font-size="10" fill="#ffffff" text-anchor="middle">Partition 3</text>
  <rect x="550" y="40" width="90" height="55" rx="6" fill="#b45309"/>
  <text x="595" y="72" font-size="10" fill="#ffffff" text-anchor="middle">Partition N</text>

  <!-- Index table path -->
  <rect x="230" y="130" width="180" height="70" rx="8" fill="#0f766e"/>
  <text x="320" y="158" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Index Table</text>
  <text x="320" y="176" font-size="10" fill="#ccfbf1" text-anchor="middle">town -&gt; primary keys</text>
  <text x="320" y="190" font-size="10" fill="#ccfbf1" text-anchor="middle">kept in sync on write</text>

  <rect x="500" y="130" width="150" height="70" rx="8" fill="#334155"/>
  <text x="575" y="158" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Fact Table</text>
  <text x="575" y="176" font-size="10" fill="#cbd5e1" text-anchor="middle">rows keyed by</text>
  <text x="575" y="190" font-size="10" fill="#cbd5e1" text-anchor="middle">primary key</text>

  <!-- arrows -->
  <line x1="140" y1="160" x2="228" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrowIdx)"/>
  <text x="185" y="150" font-size="9" fill="#334155" text-anchor="middle">1 lookup</text>
  <line x1="410" y1="160" x2="498" y2="160" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowIdxGreen)"/>
  <text x="455" y="150" font-size="9" fill="#0f766e" text-anchor="middle">reference</text>

  <line x1="80" y1="128" x2="80" y2="100" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="80" y1="100" x2="248" y2="68" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowIdxGray)"/>
  <text x="150" y="105" font-size="9" fill="#64748b" text-anchor="middle">(avoided)</text>

  <!-- write sync -->
  <rect x="230" y="240" width="420" height="55" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="440" y="262" font-size="10" fill="#64748b" text-anchor="middle">Every write to an indexed field updates both tables —</text>
  <text x="440" y="278" font-size="10" fill="#64748b" text-anchor="middle">transactionally, or eventually via async propagation</text>

  <line x1="320" y1="200" x2="320" y2="238" stroke="#64748b" stroke-width="1.5"/>
  <line x1="575" y1="200" x2="575" y2="238" stroke="#64748b" stroke-width="1.5"/>

  <defs>
    <marker id="arrowIdx" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowIdxGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowIdxGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
