<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Business logic pushed into the database instead of the application tier</text>

  <!-- App tier (thin) -->
  <rect x="30" y="70" width="150" height="55" rx="8" fill="#94a3b8"/>
  <text x="105" y="93" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">App Server</text>
  <text x="105" y="111" font-size="9" fill="#f1f5f9" text-anchor="middle">thin relay only</text>

  <!-- arrow to DB -->
  <line x1="180" y1="97" x2="288" y2="97" stroke="#dc2626" stroke-width="2.5" marker-end="url(#bdArrowRed)"/>
  <text x="234" y="88" font-size="9" fill="#dc2626" text-anchor="middle">CALL process_order()</text>

  <!-- busy DB -->
  <rect x="290" y="55" width="200" height="115" rx="8" fill="#dc2626"/>
  <text x="390" y="78" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Database</text>
  <text x="390" y="96" font-size="9" fill="#fee2e2" text-anchor="middle">pricing rules engine</text>
  <text x="390" y="111" font-size="9" fill="#fee2e2" text-anchor="middle">inventory workflow</text>
  <text x="390" y="126" font-size="9" fill="#fee2e2" text-anchor="middle">audit trail writer</text>
  <text x="390" y="141" font-size="9" fill="#fee2e2" text-anchor="middle">CPU-bound, not storage</text>

  <!-- CPU gauge -->
  <rect x="550" y="65" width="170" height="95" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="635" y="83" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="600">DB CPU</text>
  <rect x="565" y="95" width="140" height="14" rx="3" fill="#fee2e2"/>
  <rect x="565" y="95" width="128" height="14" rx="3" fill="#dc2626"/>
  <text x="635" y="125" font-size="9" fill="#334155" text-anchor="middle">redlines before disk</text>
  <text x="635" y="140" font-size="9" fill="#334155" text-anchor="middle">or network saturate</text>

  <!-- fix inset -->
  <rect x="30" y="195" width="700" height="105" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="380" y="215" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="600">THE FIX — logic moves to the application tier</text>

  <rect x="55" y="230" width="140" height="50" rx="6" fill="#0f766e"/>
  <text x="125" y="251" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">App Server</text>
  <text x="125" y="267" font-size="8" fill="#ccfbf1" text-anchor="middle">pricing + inventory logic</text>

  <line x1="195" y1="255" x2="290" y2="255" stroke="#0f766e" stroke-width="2" marker-end="url(#bdArrowTeal)"/>
  <text x="242" y="246" font-size="8" fill="#0f766e" text-anchor="middle">simple read / write</text>

  <rect x="292" y="230" width="140" height="50" rx="6" fill="#334155"/>
  <text x="362" y="251" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Database</text>
  <text x="362" y="267" font-size="8" fill="#cbd5e1" text-anchor="middle">stores &amp; retrieves only</text>

  <text x="600" y="260" font-size="9" fill="#334155" text-anchor="middle">scales horizontally</text>
  <text x="600" y="273" font-size="9" fill="#334155" text-anchor="middle">with app servers</text>

  <defs>
    <marker id="bdArrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <marker id="bdArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
