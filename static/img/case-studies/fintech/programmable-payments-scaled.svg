<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="460" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Programmable card platform at scale</text>

  <!-- Developer services -->
  <rect x="20" y="60" width="140" height="52" rx="8" fill="#0f766e"/>
  <text x="90" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Developer services</text>
  <text x="90" y="99" font-size="9" fill="#ccfbf1" text-anchor="middle">webhooks + rules</text>

  <!-- Auth gateway -->
  <rect x="20" y="180" width="140" height="52" rx="8" fill="#1d4ed8"/>
  <text x="90" y="202" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Auth gateway</text>
  <text x="90" y="219" font-size="9" fill="#dbeafe" text-anchor="middle">signed, per-dev SLOs</text>

  <!-- Breaker / timeout / stand-in -->
  <rect x="20" y="290" width="140" height="66" rx="8" fill="#b45309"/>
  <text x="90" y="313" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Breaker + timeout</text>
  <text x="90" y="329" font-size="9" fill="#fde68a" text-anchor="middle">drops to stand-in</text>
  <text x="90" y="343" font-size="9" fill="#fde68a" text-anchor="middle">default on failure</text>

  <!-- Auth core (sharded) -->
  <rect x="300" y="150" width="200" height="140" rx="8" fill="#6d28d9"/>
  <text x="400" y="176" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Authorization core</text>
  <text x="400" y="193" font-size="9" fill="#ede9fe" text-anchor="middle">sharded by card token</text>
  <line x1="320" y1="205" x2="480" y2="205" stroke="#c4b5fd" stroke-width="1"/>
  <text x="400" y="222" font-size="9" fill="#ede9fe" text-anchor="middle">idempotency on network ref</text>
  <text x="400" y="238" font-size="9" fill="#ede9fe" text-anchor="middle">decide + fund + hold</text>
  <text x="400" y="254" font-size="9" fill="#ede9fe" text-anchor="middle">deadline &#8804; network window</text>
  <text x="400" y="270" font-size="9" fill="#ede9fe" text-anchor="middle">low-latency single-key writes</text>

  <!-- Spend-control cache -->
  <rect x="300" y="330" width="200" height="52" rx="8" fill="#0f766e"/>
  <text x="400" y="352" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Spend-control cache</text>
  <text x="400" y="369" font-size="9" fill="#ccfbf1" text-anchor="middle">tight invalidation</text>

  <!-- Auth + idempotency store -->
  <rect x="620" y="70" width="180" height="66" rx="8" fill="#334155"/>
  <text x="710" y="93" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Auth + idempotency store</text>
  <text x="710" y="109" font-size="9" fill="#cbd5e1" text-anchor="middle">strongly consistent,</text>
  <text x="710" y="123" font-size="9" fill="#cbd5e1" text-anchor="middle">sharded by card token</text>

  <!-- Funding ledger -->
  <rect x="620" y="170" width="180" height="60" rx="8" fill="#be123c"/>
  <text x="710" y="193" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Funding ledger</text>
  <text x="710" y="210" font-size="9" fill="#fecdd3" text-anchor="middle">append-only double-entry</text>
  <text x="710" y="223" font-size="9" fill="#fecdd3" text-anchor="middle">HOLD / CLEAR / REVERSE legs</text>

  <!-- Clearing + reconcile -->
  <rect x="620" y="300" width="180" height="72" rx="8" fill="#b45309"/>
  <text x="710" y="324" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Clearing + reconcile</text>
  <text x="710" y="341" font-size="9" fill="#fde68a" text-anchor="middle">batched, off hot path</text>
  <text x="710" y="355" font-size="9" fill="#fde68a" text-anchor="middle">settle real amount,</text>
  <text x="710" y="368" font-size="9" fill="#fde68a" text-anchor="middle">reverse surplus holds</text>

  <!-- edges -->
  <line x1="160" y1="86" x2="298" y2="170" stroke="#0f766e" stroke-width="2" marker-end="url(#prgsArrowTeal)"/>
  <line x1="160" y1="206" x2="298" y2="206" stroke="#1d4ed8" stroke-width="2" marker-end="url(#prgsArrowBlue)"/>
  <line x1="160" y1="318" x2="298" y2="250" stroke="#b45309" stroke-width="2" marker-end="url(#prgsArrowAmber)"/>
  <line x1="400" y1="290" x2="400" y2="328" stroke="#0f766e" stroke-width="2" marker-end="url(#prgsArrowTeal)"/>
  <line x1="500" y1="180" x2="618" y2="110" stroke="#334155" stroke-width="2" marker-end="url(#prgsArrowSlate)"/>
  <line x1="500" y1="215" x2="618" y2="200" stroke="#be123c" stroke-width="2" marker-end="url(#prgsArrowRose)"/>
  <line x1="710" y1="230" x2="710" y2="298" stroke="#b45309" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#prgsArrowAmber)"/>

  <!-- note -->
  <rect x="300" y="398" width="500" height="48" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="550" y="418" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Hot path is latency-bound: decide + fund within the deadline, replay repeats, drop to stand-in on webhook failure.</text>
  <text x="550" y="433" font-size="9" fill="#334155" text-anchor="middle">Clearing runs as a batch that reconciles settled amounts against the original holds and corrects derived spend counters.</text>

  <defs>
    <marker id="prgsArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="prgsArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="prgsArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="prgsArrowRose" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#be123c"/>
    </marker>
    <marker id="prgsArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
