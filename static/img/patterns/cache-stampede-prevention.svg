<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="190" y="24" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Without coalescing</text>
  <text x="570" y="24" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">With single-flight coalescing</text>
  <line x1="380" y1="12" x2="380" y2="300" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- LEFT: many concurrent requests all hit store -->
  <circle cx="60" cy="60" r="16" fill="#1d4ed8"/>
  <circle cx="60" cy="105" r="16" fill="#1d4ed8"/>
  <circle cx="60" cy="150" r="16" fill="#1d4ed8"/>
  <circle cx="60" cy="195" r="16" fill="#1d4ed8"/>
  <text x="60" y="225" font-size="8" fill="#334155" text-anchor="middle">N requests</text>

  <rect x="150" y="110" width="80" height="45" rx="6" fill="#b45309"/>
  <text x="190" y="137" font-size="9" fill="#ffffff" text-anchor="middle">key K</text>
  <text x="190" y="149" font-size="7" fill="#fef3c7" text-anchor="middle">expired</text>

  <line x1="76" y1="60" x2="150" y2="118" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowSt1)"/>
  <line x1="76" y1="105" x2="150" y2="128" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowSt1)"/>
  <line x1="76" y1="150" x2="150" y2="140" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowSt1)"/>
  <line x1="76" y1="195" x2="150" y2="150" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowSt1)"/>

  <rect x="270" y="90" width="90" height="90" rx="8" fill="#dc2626"/>
  <text x="315" y="125" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Store</text>
  <text x="315" y="142" font-size="8" fill="#fecaca" text-anchor="middle">N simultaneous</text>
  <text x="315" y="154" font-size="8" fill="#fecaca" text-anchor="middle">identical queries</text>

  <line x1="230" y1="132" x2="268" y2="132" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowSt1)"/>
  <line x1="230" y1="140" x2="268" y2="140" stroke="#dc2626" stroke-width="3"/>
  <line x1="230" y1="148" x2="268" y2="148" stroke="#dc2626" stroke-width="3"/>

  <!-- RIGHT: single-flight -->
  <circle cx="440" cy="60" r="16" fill="#1d4ed8"/>
  <circle cx="440" cy="105" r="16" fill="#1d4ed8"/>
  <circle cx="440" cy="150" r="16" fill="#1d4ed8"/>
  <circle cx="440" cy="195" r="16" fill="#1d4ed8"/>
  <text x="440" y="225" font-size="8" fill="#334155" text-anchor="middle">N requests</text>

  <rect x="530" y="110" width="90" height="45" rx="6" fill="#0f766e"/>
  <text x="575" y="130" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">single-flight</text>
  <text x="575" y="143" font-size="8" fill="#ccfbf1" text-anchor="middle">lock on key K</text>

  <line x1="456" y1="60" x2="530" y2="122" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowStTeal)"/>
  <line x1="456" y1="105" x2="530" y2="128" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowStTeal)"/>
  <line x1="456" y1="150" x2="530" y2="140" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowStTeal)"/>
  <line x1="456" y1="195" x2="530" y2="148" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowStTeal)"/>
  <text x="490" y="90" font-size="8" fill="#0f766e" text-anchor="middle">3 wait, 1 loads</text>

  <rect x="660" y="112" width="70" height="45" rx="8" fill="#334155"/>
  <text x="695" y="132" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Store</text>
  <text x="695" y="147" font-size="8" fill="#cbd5e1" text-anchor="middle">1 query</text>

  <line x1="620" y1="132" x2="658" y2="132" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowStTeal)"/>

  <rect x="410" y="240" width="330" height="55" rx="8" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="575" y="262" font-size="10" fill="#0f766e" text-anchor="middle">Waiting requests share the one in-flight</text>
  <text x="575" y="277" font-size="10" fill="#0f766e" text-anchor="middle">result once it returns — no redundant load</text>

  <defs>
    <marker id="arrowSt1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowStTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
