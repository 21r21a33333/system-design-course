<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mpsScaledArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="mpsScaledArrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Scaled tokenization platform: device tier, TSP vault, network de-tokenization</text>

  <!-- Device tier -->
  <rect x="24" y="52" width="200" height="360" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="124" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Millions of devices</text>

  <rect x="42" y="88" width="164" height="66" rx="9" fill="#1d4ed8"/>
  <text x="124" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Secure Element</text>
  <text x="124" y="132" text-anchor="middle" font-size="9.5" fill="#dbeafe">DPAN + device key,</text>
  <text x="124" y="146" text-anchor="middle" font-size="9.5" fill="#dbeafe">offline cryptogram</text>

  <rect x="42" y="166" width="164" height="66" rx="9" fill="#1d4ed8"/>
  <text x="124" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">HCE + cloud keys</text>
  <text x="124" y="210" text-anchor="middle" font-size="9.5" fill="#dbeafe">fetch limited-use keys,</text>
  <text x="124" y="224" text-anchor="middle" font-size="9.5" fill="#dbeafe">online per session</text>

  <rect x="42" y="252" width="164" height="60" rx="9" fill="#0f766e"/>
  <text x="124" y="276" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Device biometric /</text>
  <text x="124" y="294" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">passcode gate</text>

  <rect x="42" y="326" width="164" height="66" rx="9" fill="#be123c"/>
  <text x="124" y="350" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Lifecycle: suspend /</text>
  <text x="124" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">resume / delete token</text>
  <text x="124" y="384" text-anchor="middle" font-size="9" fill="#fecdd3">on lost device</text>

  <!-- TSP tier -->
  <rect x="300" y="52" width="220" height="360" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.3"/>
  <text x="410" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">Token Service Provider</text>

  <rect x="318" y="88" width="184" height="70" rx="9" fill="#6d28d9"/>
  <text x="410" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Sharded token vault</text>
  <text x="410" y="132" text-anchor="middle" font-size="9.5" fill="#ddd6fe">PAN to DPAN mapping,</text>
  <text x="410" y="146" text-anchor="middle" font-size="9.5" fill="#ddd6fe">sharded by token</text>

  <rect x="318" y="170" width="184" height="66" rx="9" fill="#6d28d9"/>
  <text x="410" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Provisioning service</text>
  <text x="410" y="214" text-anchor="middle" font-size="9.5" fill="#ddd6fe">idempotent state machine</text>
  <text x="410" y="228" text-anchor="middle" font-size="9.5" fill="#ddd6fe">per provisioning request</text>

  <rect x="318" y="248" width="184" height="66" rx="9" fill="#6d28d9"/>
  <text x="410" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Cryptogram verify</text>
  <text x="410" y="292" text-anchor="middle" font-size="9.5" fill="#ddd6fe">check single-use nonce,</text>
  <text x="410" y="306" text-anchor="middle" font-size="9.5" fill="#ddd6fe">reject replays</text>

  <rect x="318" y="326" width="184" height="66" rx="9" fill="#b45309"/>
  <text x="410" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">HSM key store</text>
  <text x="410" y="370" text-anchor="middle" font-size="9.5" fill="#fde68a">token keys never leave</text>
  <text x="410" y="384" text-anchor="middle" font-size="9.5" fill="#fde68a">the hardware boundary</text>

  <!-- Network + issuer tier -->
  <rect x="596" y="52" width="200" height="360" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="696" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">Network + issuers</text>

  <rect x="614" y="88" width="164" height="76" rx="9" fill="#0f766e"/>
  <text x="696" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Auth switch</text>
  <text x="696" y="132" text-anchor="middle" font-size="9.5" fill="#ccfbf1">de-tokenize DPAN to PAN</text>
  <text x="696" y="146" text-anchor="middle" font-size="9.5" fill="#ccfbf1">inside the vault boundary</text>

  <rect x="614" y="176" width="164" height="70" rx="9" fill="#b45309"/>
  <text x="696" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Issuer authorization</text>
  <text x="696" y="220" text-anchor="middle" font-size="9.5" fill="#fde68a">approve / decline on the</text>
  <text x="696" y="234" text-anchor="middle" font-size="9.5" fill="#fde68a">real account</text>

  <rect x="614" y="258" width="164" height="60" rx="9" fill="#0f766e"/>
  <text x="696" y="282" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Reconciliation +</text>
  <text x="696" y="300" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">clearing/settlement</text>

  <rect x="614" y="330" width="164" height="62" rx="9" fill="#be123c"/>
  <text x="696" y="354" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">PCI-DSS scope:</text>
  <text x="696" y="372" text-anchor="middle" font-size="9.5" fill="#fecdd3">PAN confined to vault +</text>
  <text x="696" y="386" text-anchor="middle" font-size="9.5" fill="#fecdd3">issuer, not the merchant</text>

  <!-- inter-tier arrows -->
  <line x1="224" y1="200" x2="298" y2="200" stroke="#0f766e" stroke-width="2" marker-end="url(#mpsScaledArrowTeal)"/>
  <text x="261" y="192" text-anchor="middle" font-size="9" fill="#0f766e">provision +</text>
  <text x="261" y="216" text-anchor="middle" font-size="9" fill="#0f766e">pay traffic</text>

  <line x1="520" y1="126" x2="612" y2="126" stroke="#334155" stroke-width="2" marker-end="url(#mpsScaledArrow)"/>
  <text x="566" y="118" text-anchor="middle" font-size="9" fill="#334155">detok'd PAN</text>

  <line x1="612" y1="210" x2="522" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#mpsScaledArrow)"/>
  <text x="566" y="230" text-anchor="middle" font-size="9" fill="#334155">auth result</text>

  <text x="410" y="438" text-anchor="middle" font-size="10.5" fill="#475569">Real PAN lives only in the token vault and at the issuer; the device holds a DPAN, the merchant sees a DPAN.</text>
  <text x="410" y="456" text-anchor="middle" font-size="10.5" fill="#475569">A per-tap cryptogram makes a captured DPAN non-replayable, so a merchant breach yields no reusable data.</text>
</svg>
