<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="baasArrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="baasArrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="baasArrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#be123c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="430" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Banking-as-a-Service stack: UX on top, chartered bank holds the money</text>

  <!-- Layer 1: end user + fintech app -->
  <rect x="40" y="58" width="200" height="66" rx="10" fill="#1d4ed8"/>
  <text x="140" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Fintech app (UX layer)</text>
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#dbeafe">Cash App / Chime / Mercury</text>

  <rect x="40" y="150" width="200" height="60" rx="10" fill="#6d28d9"/>
  <text x="140" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">BaaS middleware</text>
  <text x="140" y="194" text-anchor="middle" font-size="11" fill="#ede9fe">card issuing / KYC / sub-ledger</text>

  <rect x="40" y="236" width="200" height="60" rx="10" fill="#0f766e"/>
  <text x="140" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Sponsor / partner bank</text>
  <text x="140" y="280" text-anchor="middle" font-size="11" fill="#ccfbf1">holds the charter + the funds</text>

  <rect x="40" y="322" width="200" height="58" rx="10" fill="#b45309"/>
  <text x="140" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Payment networks</text>
  <text x="140" y="365" text-anchor="middle" font-size="11" fill="#fde68a">Visa / ACH / FedNow / RTP</text>

  <!-- vertical arrows down the stack -->
  <line x1="140" y1="124" x2="140" y2="148" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#baasArrowBlue)"/>
  <line x1="140" y1="210" x2="140" y2="234" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#baasArrowBlue)"/>
  <line x1="140" y1="296" x2="140" y2="320" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#baasArrowBlue)"/>

  <!-- Right side: FBO account holding pooled funds + sub-ledger -->
  <rect x="360" y="150" width="220" height="146" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="470" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">FBO account at the bank</text>
  <text x="470" y="194" text-anchor="middle" font-size="11" fill="#334155">one pooled "for benefit of" account</text>
  <rect x="380" y="208" width="180" height="30" rx="6" fill="#0f766e"/>
  <text x="470" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">bank_balance = $1,000,000</text>
  <text x="470" y="258" text-anchor="middle" font-size="11" fill="#334155">the bank sees ONE big balance,</text>
  <text x="470" y="276" text-anchor="middle" font-size="11" fill="#334155">not the individual customers</text>

  <!-- Sub-ledger -->
  <rect x="620" y="150" width="160" height="146" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="700" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Sub-ledger</text>
  <text x="700" y="194" text-anchor="middle" font-size="11" fill="#334155">who owns what</text>
  <text x="700" y="220" text-anchor="middle" font-size="11" fill="#334155">alice: $420,000</text>
  <text x="700" y="238" text-anchor="middle" font-size="11" fill="#334155">bob:   $315,000</text>
  <text x="700" y="256" text-anchor="middle" font-size="11" fill="#334155">carol: $265,000</text>
  <line x1="640" y1="268" x2="760" y2="268" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">sum = $1,000,000</text>

  <!-- middleware maintains sub-ledger -->
  <path d="M240,180 C300,180 320,223 358,223" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#baasArrowTeal)"/>
  <text x="300" y="150" text-anchor="middle" font-size="10" fill="#6d28d9">maintains</text>

  <!-- reconciliation link between FBO balance and sub-ledger -->
  <line x1="582" y1="223" x2="618" y2="223" stroke="#be123c" stroke-width="2.5" marker-end="url(#baasArrowRed)" marker-start="url(#baasArrowRed)"/>
  <text x="600" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">reconcile daily</text>
  <text x="600" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">sum(sub_ledger) must equal bank_balance</text>

  <!-- footnote -->
  <text x="470" y="352" text-anchor="middle" font-size="11" fill="#334155">When the two drift and nobody can reconcile them,</text>
  <text x="470" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">no one can prove who owns what — the Synapse failure mode.</text>
</svg>
