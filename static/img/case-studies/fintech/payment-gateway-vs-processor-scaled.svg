<svg viewBox="0 0 880 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pgpsArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="pgpsArrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Gateway and processor at scale</text>

  <!-- Merchant tier -->
  <rect x="20" y="70" width="140" height="90" rx="10" fill="#1d4ed8"/>
  <text x="90" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Merchant sites</text>
  <text x="90" y="118" text-anchor="middle" font-size="10" fill="#dbeafe">hosted fields /</text>
  <text x="90" y="132" text-anchor="middle" font-size="10" fill="#dbeafe">iframe collect</text>
  <text x="90" y="150" text-anchor="middle" font-size="10" fill="#dbeafe">card never hits their server</text>

  <!-- Gateway edge -->
  <rect x="205" y="55" width="170" height="120" rx="10" fill="#0f766e"/>
  <text x="290" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Gateway edge</text>
  <text x="290" y="100" text-anchor="middle" font-size="10" fill="#ccfbf1">TLS termination</text>
  <text x="290" y="116" text-anchor="middle" font-size="10" fill="#ccfbf1">tokenize to vault</text>
  <text x="290" y="132" text-anchor="middle" font-size="10" fill="#ccfbf1">3-D Secure step-up</text>
  <text x="290" y="148" text-anchor="middle" font-size="10" fill="#ccfbf1">idempotency keys</text>
  <text x="290" y="164" text-anchor="middle" font-size="10" fill="#ccfbf1">fraud pre-screen</text>

  <!-- Token vault -->
  <rect x="205" y="205" width="170" height="70" rx="10" fill="#334155"/>
  <text x="290" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Token vault (HSM)</text>
  <text x="290" y="252" text-anchor="middle" font-size="10" fill="#cbd5e1">PAN ↔ token map, PCI zone</text>

  <!-- Processor core -->
  <rect x="420" y="55" width="180" height="120" rx="10" fill="#b45309"/>
  <text x="510" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Processor core</text>
  <text x="510" y="100" text-anchor="middle" font-size="10" fill="#fde68a">ISO 8583 encode</text>
  <text x="510" y="116" text-anchor="middle" font-size="10" fill="#fde68a">network routing</text>
  <text x="510" y="132" text-anchor="middle" font-size="10" fill="#fde68a">per-network circuit breakers</text>
  <text x="510" y="148" text-anchor="middle" font-size="10" fill="#fde68a">auth / capture state machine</text>
  <text x="510" y="164" text-anchor="middle" font-size="10" fill="#fde68a">sharded by merchant</text>

  <!-- Networks -->
  <rect x="655" y="60" width="200" height="50" rx="10" fill="#6d28d9"/>
  <text x="755" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Card networks</text>
  <text x="755" y="99" text-anchor="middle" font-size="10" fill="#ede9fe">Visa / Mastercard / Amex</text>

  <!-- Issuers -->
  <rect x="655" y="135" width="200" height="50" rx="10" fill="#be123c"/>
  <text x="755" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Issuing banks</text>
  <text x="755" y="174" text-anchor="middle" font-size="10" fill="#ffe4e6">approve / decline, hold funds</text>

  <!-- Settlement batch -->
  <rect x="420" y="330" width="200" height="90" rx="10" fill="#b45309"/>
  <text x="520" y="357" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Settlement engine</text>
  <text x="520" y="377" text-anchor="middle" font-size="10" fill="#fde68a">nightly clearing files</text>
  <text x="520" y="393" text-anchor="middle" font-size="10" fill="#fde68a">interchange netting</text>
  <text x="520" y="409" text-anchor="middle" font-size="10" fill="#fde68a">T+1 / T+2 payout to merchant</text>

  <!-- Ledger -->
  <rect x="205" y="330" width="170" height="90" rx="10" fill="#334155"/>
  <text x="290" y="357" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Transaction ledger</text>
  <text x="290" y="377" text-anchor="middle" font-size="10" fill="#cbd5e1">auth / capture / refund</text>
  <text x="290" y="393" text-anchor="middle" font-size="10" fill="#cbd5e1">append-only, sharded</text>
  <text x="290" y="409" text-anchor="middle" font-size="10" fill="#cbd5e1">reconciled vs network files</text>

  <!-- arrows -->
  <line x1="160" y1="115" x2="203" y2="115" stroke="#334155" stroke-width="2" marker-end="url(#pgpsArrow)"/>
  <line x1="375" y1="115" x2="418" y2="115" stroke="#334155" stroke-width="2" marker-end="url(#pgpsArrow)"/>
  <line x1="290" y1="175" x2="290" y2="203" stroke="#334155" stroke-width="2" marker-end="url(#pgpsArrow)"/>
  <line x1="600" y1="100" x2="653" y2="90" stroke="#334155" stroke-width="2" marker-end="url(#pgpsArrow)"/>
  <line x1="755" y1="110" x2="755" y2="133" stroke="#334155" stroke-width="2" marker-end="url(#pgpsArrow)"/>

  <!-- auth response back green -->
  <path d="M655,160 C620,200 620,150 602,150" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pgpsArrowGreen)"/>
  <text x="628" y="205" text-anchor="middle" font-size="9" fill="#0f766e">approval</text>

  <!-- processor to ledger + settlement -->
  <line x1="510" y1="175" x2="510" y2="328" stroke="#334155" stroke-width="2" marker-end="url(#pgpsArrow)"/>
  <text x="548" y="255" text-anchor="middle" font-size="9" fill="#475569">capture batch</text>
  <line x1="420" y1="375" x2="377" y2="375" stroke="#334155" stroke-width="2" marker-end="url(#pgpsArrow)"/>

  <text x="440" y="450" text-anchor="middle" font-size="11" fill="#334155">The real-time authorization path (top) is decoupled from the deferred clearing and settlement path (bottom).</text>
</svg>
