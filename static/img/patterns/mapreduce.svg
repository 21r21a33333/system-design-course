<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="380" fill="#ffffff"/>

  <text x="410" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Word count: map emits (word,1) in parallel, shuffle groups by key, reduce sums per key</text>

  <!-- Phase labels -->
  <text x="95" y="52" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">INPUT SPLITS</text>
  <text x="290" y="52" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">MAP (parallel)</text>
  <text x="500" y="52" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">SHUFFLE (group by key)</text>
  <text x="720" y="52" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">REDUCE</text>

  <!-- Splits -->
  <rect x="30" y="70" width="130" height="40" rx="6" fill="#334155"/>
  <text x="95" y="94" font-size="10" fill="#ffffff" text-anchor="middle">"the cat sat"</text>
  <rect x="30" y="170" width="130" height="40" rx="6" fill="#334155"/>
  <text x="95" y="194" font-size="10" fill="#ffffff" text-anchor="middle">"the dog sat"</text>
  <rect x="30" y="270" width="130" height="40" rx="6" fill="#334155"/>
  <text x="95" y="294" font-size="10" fill="#ffffff" text-anchor="middle">"the cat ran"</text>

  <!-- Map tasks -->
  <rect x="220" y="70" width="140" height="40" rx="6" fill="#1d4ed8"/>
  <text x="290" y="88" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">map 1</text>
  <text x="290" y="102" font-size="8" fill="#dbeafe" text-anchor="middle">(the,1)(cat,1)(sat,1)</text>
  <rect x="220" y="170" width="140" height="40" rx="6" fill="#1d4ed8"/>
  <text x="290" y="188" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">map 2</text>
  <text x="290" y="202" font-size="8" fill="#dbeafe" text-anchor="middle">(the,1)(dog,1)(sat,1)</text>
  <rect x="220" y="270" width="140" height="40" rx="6" fill="#1d4ed8"/>
  <text x="290" y="288" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">map 3</text>
  <text x="290" y="302" font-size="8" fill="#dbeafe" text-anchor="middle">(the,1)(cat,1)(ran,1)</text>

  <!-- split -> map -->
  <line x1="160" y1="90" x2="218" y2="90" stroke="#334155" stroke-width="2" marker-end="url(#mrSlate)"/>
  <line x1="160" y1="190" x2="218" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#mrSlate)"/>
  <line x1="160" y1="290" x2="218" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#mrSlate)"/>

  <!-- Shuffle buckets -->
  <rect x="430" y="66" width="140" height="34" rx="6" fill="#b45309"/>
  <text x="500" y="88" font-size="9" fill="#ffffff" text-anchor="middle">the: [1,1,1]</text>
  <rect x="430" y="118" width="140" height="34" rx="6" fill="#b45309"/>
  <text x="500" y="140" font-size="9" fill="#ffffff" text-anchor="middle">cat: [1,1]</text>
  <rect x="430" y="170" width="140" height="34" rx="6" fill="#b45309"/>
  <text x="500" y="192" font-size="9" fill="#ffffff" text-anchor="middle">sat: [1,1]</text>
  <rect x="430" y="222" width="140" height="34" rx="6" fill="#b45309"/>
  <text x="500" y="244" font-size="9" fill="#ffffff" text-anchor="middle">dog: [1]</text>
  <rect x="430" y="274" width="140" height="34" rx="6" fill="#b45309"/>
  <text x="500" y="296" font-size="9" fill="#ffffff" text-anchor="middle">ran: [1]</text>

  <!-- map -> shuffle (fan) -->
  <line x1="360" y1="88" x2="428" y2="83" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mrGray)"/>
  <line x1="360" y1="92" x2="428" y2="135" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mrGray)"/>
  <line x1="360" y1="98" x2="428" y2="187" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mrGray)"/>
  <line x1="360" y1="188" x2="428" y2="88" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mrGray)"/>
  <line x1="360" y1="192" x2="428" y2="239" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mrGray)"/>
  <line x1="360" y1="288" x2="428" y2="291" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mrGray)"/>

  <!-- Reduce outputs -->
  <rect x="650" y="66" width="140" height="34" rx="6" fill="#15803d"/>
  <text x="720" y="88" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">the → 3</text>
  <rect x="650" y="118" width="140" height="34" rx="6" fill="#15803d"/>
  <text x="720" y="140" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">cat → 2</text>
  <rect x="650" y="170" width="140" height="34" rx="6" fill="#15803d"/>
  <text x="720" y="192" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">sat → 2</text>
  <rect x="650" y="222" width="140" height="34" rx="6" fill="#15803d"/>
  <text x="720" y="244" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">dog → 1</text>
  <rect x="650" y="274" width="140" height="34" rx="6" fill="#15803d"/>
  <text x="720" y="296" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">ran → 1</text>

  <!-- shuffle -> reduce -->
  <line x1="570" y1="83" x2="648" y2="83" stroke="#15803d" stroke-width="2" marker-end="url(#mrGreen)"/>
  <line x1="570" y1="135" x2="648" y2="135" stroke="#15803d" stroke-width="2" marker-end="url(#mrGreen)"/>
  <line x1="570" y1="187" x2="648" y2="187" stroke="#15803d" stroke-width="2" marker-end="url(#mrGreen)"/>
  <line x1="570" y1="239" x2="648" y2="239" stroke="#15803d" stroke-width="2" marker-end="url(#mrGreen)"/>
  <line x1="570" y1="291" x2="648" y2="291" stroke="#15803d" stroke-width="2" marker-end="url(#mrGreen)"/>

  <rect x="30" y="335" width="760" height="30" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="410" y="354" font-size="9" fill="#334155" text-anchor="middle">A failed map or reduce task is deterministically re-run on another node; stragglers are duplicated speculatively</text>

  <defs>
    <marker id="mrSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
    <marker id="mrGray" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
    <marker id="mrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/></marker>
  </defs>
</svg>
