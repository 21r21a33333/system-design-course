<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">TinyURL: scaled design</text>

  <!-- Visiting clients -->
  <rect x="20" y="180" width="120" height="50" rx="8" fill="#1d4ed8"/>
  <text x="80" y="201" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Visiting Clients</text>
  <text x="80" y="217" font-size="8" fill="#dbeafe" text-anchor="middle">~16K redirects/sec peak</text>

  <!-- Load balancer -->
  <rect x="175" y="180" width="110" height="50" rx="8" fill="#1d4ed8"/>
  <text x="230" y="201" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Load Balancer</text>
  <text x="230" y="217" font-size="8" fill="#dbeafe" text-anchor="middle">stateless redirect tier</text>

  <line x1="140" y1="205" x2="173" y2="205" stroke="#1d4ed8" stroke-width="2" marker-end="url(#tusArrowBlue)"/>

  <!-- Redirect service instances -->
  <rect x="330" y="150" width="140" height="45" rx="8" fill="#0f766e"/>
  <text x="400" y="169" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Redirect Instance A</text>
  <text x="400" y="184" font-size="8" fill="#ccfbf1" text-anchor="middle">stateless</text>

  <rect x="330" y="205" width="140" height="45" rx="8" fill="#0f766e"/>
  <text x="400" y="224" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Redirect Instance B</text>
  <text x="400" y="239" font-size="8" fill="#ccfbf1" text-anchor="middle">stateless</text>

  <line x1="285" y1="200" x2="328" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#tusArrowBlue)"/>
  <line x1="285" y1="210" x2="328" y2="227" stroke="#1d4ed8" stroke-width="2" marker-end="url(#tusArrowBlue)"/>

  <!-- Distributed cache -->
  <rect x="530" y="120" width="150" height="55" rx="8" fill="#15803d"/>
  <text x="605" y="143" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Mapping Cache</text>
  <text x="605" y="159" font-size="8" fill="#dcfce7" text-anchor="middle">immutable, long TTL</text>

  <line x1="470" y1="175" x2="528" y2="155" stroke="#15803d" stroke-width="2" marker-end="url(#tusArrowGreen)"/>

  <!-- Mapping store shards -->
  <rect x="530" y="210" width="150" height="45" rx="8" fill="#334155"/>
  <text x="605" y="229" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Mapping Store Shard 1</text>
  <text x="605" y="244" font-size="8" fill="#cbd5e1" text-anchor="middle">by short code</text>

  <rect x="530" y="260" width="150" height="45" rx="8" fill="#334155"/>
  <text x="605" y="279" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Mapping Store Shard 2</text>
  <text x="605" y="294" font-size="8" fill="#cbd5e1" text-anchor="middle">by short code</text>

  <line x1="470" y1="220" x2="528" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#tusArrowSlate)"/>
  <line x1="605" y1="175" x2="605" y2="208" stroke="#15803d" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Code generator, isolated -->
  <rect x="330" y="70" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="405" y="93" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Code Generator</text>
  <text x="405" y="109" font-size="8" fill="#ccfbf1" text-anchor="middle">low-volume, isolated</text>

  <line x1="400" y1="150" x2="405" y2="127" stroke="#0f766e" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="420" y="140" font-size="8" fill="#0f766e">range request, rare</text>

  <!-- Click event stream + counter -->
  <rect x="530" y="330" width="150" height="55" rx="8" fill="#b45309"/>
  <text x="605" y="353" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Click Counting</text>
  <text x="605" y="369" font-size="8" fill="#fde68a" text-anchor="middle">sharded counters</text>

  <line x1="400" y1="250" x2="605" y2="328" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#tusArrowAmber)"/>

  <rect x="20" y="330" width="290" height="65" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="348" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Green = scaled/redundant additions</text>
  <text x="165" y="363" font-size="9" fill="#334155" text-anchor="middle">Immutability lets caching absorb</text>
  <text x="165" y="377" font-size="9" fill="#334155" text-anchor="middle">nearly all redirect traffic</text>

  <defs>
    <marker id="tusArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="tusArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="tusArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
    <marker id="tusArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="tusArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
