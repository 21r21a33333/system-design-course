<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>

  <text x="380" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">A query scatters to every shard in parallel, then top matches are gathered and re-ranked</text>

  <!-- Client -->
  <rect x="24" y="150" width="110" height="56" rx="8" fill="#1d4ed8"/>
  <text x="79" y="174" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="79" y="192" font-size="8" fill="#dbeafe" text-anchor="middle">query "quick"</text>

  <!-- Coordinator -->
  <rect x="190" y="140" width="130" height="76" rx="8" fill="#0f766e"/>
  <text x="255" y="166" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Coordinator</text>
  <text x="255" y="184" font-size="8" fill="#ccfbf1" text-anchor="middle">scatter → gather</text>
  <text x="255" y="198" font-size="8" fill="#ccfbf1" text-anchor="middle">merge + re-rank</text>

  <line x1="134" y1="178" x2="188" y2="178" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#dsBlue)"/>

  <!-- Shards -->
  <g>
    <rect x="450" y="50" width="180" height="52" rx="7" fill="#334155"/>
    <text x="540" y="72" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Shard 1 — inverted index</text>
    <text x="540" y="88" font-size="8" fill="#cbd5e1" text-anchor="middle">docs 0–999k · term → postings</text>

    <rect x="450" y="118" width="180" height="52" rx="7" fill="#334155"/>
    <text x="540" y="140" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Shard 2 — inverted index</text>
    <text x="540" y="156" font-size="8" fill="#cbd5e1" text-anchor="middle">docs 1m–2m · term → postings</text>

    <rect x="450" y="186" width="180" height="52" rx="7" fill="#334155"/>
    <text x="540" y="208" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Shard 3 — inverted index</text>
    <text x="540" y="224" font-size="8" fill="#cbd5e1" text-anchor="middle">docs 2m–3m · term → postings</text>

    <rect x="450" y="254" width="180" height="52" rx="7" fill="#334155"/>
    <text x="540" y="276" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Shard 4 — inverted index</text>
    <text x="540" y="292" font-size="8" fill="#cbd5e1" text-anchor="middle">docs 3m–4m · term → postings</text>
  </g>

  <!-- replica marker on shard 2 -->
  <rect x="640" y="118" width="14" height="52" rx="3" fill="#15803d"/>
  <text x="700" y="140" font-size="8" fill="#15803d" text-anchor="middle">each shard</text>
  <text x="700" y="152" font-size="8" fill="#15803d" text-anchor="middle">replicated</text>

  <!-- scatter (teal, out) -->
  <line x1="320" y1="165" x2="448" y2="76" stroke="#0f766e" stroke-width="2" marker-end="url(#dsTeal)"/>
  <line x1="320" y1="172" x2="448" y2="144" stroke="#0f766e" stroke-width="2" marker-end="url(#dsTeal)"/>
  <line x1="320" y1="184" x2="448" y2="212" stroke="#0f766e" stroke-width="2" marker-end="url(#dsTeal)"/>
  <line x1="320" y1="191" x2="448" y2="280" stroke="#0f766e" stroke-width="2" marker-end="url(#dsTeal)"/>
  <text x="384" y="120" font-size="8" fill="#0f766e" text-anchor="middle">scatter (parallel)</text>

  <!-- gather (amber, back, local top-k) -->
  <line x1="448" y1="90" x2="322" y2="200" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dsAmber)"/>
  <line x1="448" y1="230" x2="322" y2="205" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dsAmber)"/>
  <text x="384" y="250" font-size="8" fill="#b45309" text-anchor="middle">gather local top-k</text>

  <rect x="24" y="320" width="712" height="30" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="339" font-size="9" fill="#334155" text-anchor="middle">Latency tracks the slowest shard, not their sum — so a straggler shard bounds the whole query</text>

  <defs>
    <marker id="dsBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
    <marker id="dsTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="dsAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
  </defs>
</svg>
