<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="300" fill="#ffffff"/>

  <defs>
    <marker id="s10mArrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="s10mArrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Day 1: one user, two EC2 instances</text>

  <!-- Client -->
  <rect x="20" y="115" width="110" height="55" rx="8" fill="#1d4ed8"/>
  <text x="75" y="138" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="75" y="155" font-size="9" fill="#dbeafe" text-anchor="middle">browser / app</text>

  <!-- Route 53 -->
  <rect x="190" y="115" width="120" height="55" rx="8" fill="#1d4ed8"/>
  <text x="250" y="138" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Route 53</text>
  <text x="250" y="155" font-size="9" fill="#dbeafe" text-anchor="middle">DNS</text>

  <line x1="130" y1="142" x2="188" y2="142" stroke="#1d4ed8" stroke-width="2" marker-end="url(#s10mArrowBlue)"/>

  <!-- EC2 web -->
  <rect x="370" y="115" width="150" height="65" rx="8" fill="#0f766e"/>
  <text x="445" y="141" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">EC2: Web App</text>
  <text x="445" y="158" font-size="9" fill="#ccfbf1" text-anchor="middle">single instance</text>

  <line x1="310" y1="142" x2="368" y2="142" stroke="#1d4ed8" stroke-width="2" marker-end="url(#s10mArrowBlue)"/>

  <!-- EC2 db -->
  <rect x="580" y="115" width="180" height="65" rx="8" fill="#334155"/>
  <text x="670" y="141" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">EC2: Database</text>
  <text x="670" y="158" font-size="9" fill="#cbd5e1" text-anchor="middle">self-managed engine</text>

  <line x1="520" y1="147" x2="578" y2="147" stroke="#0f766e" stroke-width="2" marker-end="url(#s10mArrowTeal)"/>

  <!-- Lightsail callout -->
  <rect x="370" y="215" width="390" height="55" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="565" y="236" font-size="11" fill="#92400e" text-anchor="middle" font-weight="600">Or: Amazon Lightsail</text>
  <text x="565" y="252" font-size="9" fill="#92400e" text-anchor="middle">bundles compute + storage + networking to get a first version running in minutes</text>

  <line x1="565" y1="180" x2="565" y2="213" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
