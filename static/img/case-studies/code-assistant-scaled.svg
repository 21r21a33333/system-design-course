<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">AI Code Assistant: scaled design</text>

  <!-- Developers -->
  <rect x="20" y="185" width="100" height="55" rx="8" fill="#1d4ed8"/>
  <text x="70" y="208" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Developers</text>
  <text x="70" y="224" font-size="8" fill="#dbeafe" text-anchor="middle">2M DAU</text>

  <!-- Completion tier -->
  <rect x="170" y="100" width="150" height="55" rx="8" fill="#b45309"/>
  <text x="245" y="123" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Completion Tier</text>
  <text x="245" y="139" font-size="8" fill="#fde68a" text-anchor="middle">peak ~28k/sec, short batch</text>

  <!-- Chat/agentic tier -->
  <rect x="170" y="230" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="245" y="253" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Chat/Agentic Tier</text>
  <text x="245" y="269" font-size="8" fill="#ccfbf1" text-anchor="middle">~347/sec, tool-using</text>

  <line x1="120" y1="200" x2="170" y2="140" stroke="#1d4ed8" stroke-width="2" marker-end="url(#cassArrowBlue)"/>
  <line x1="120" y1="215" x2="170" y2="255" stroke="#1d4ed8" stroke-width="2" marker-end="url(#cassArrowBlue)"/>

  <!-- Repo shards -->
  <rect x="370" y="230" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="445" y="251" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Repo Index Shards</text>
  <text x="445" y="266" font-size="8" fill="#dcfce7" text-anchor="middle">by repository</text>

  <line x1="320" y1="257" x2="370" y2="257" stroke="#0f766e" stroke-width="2" marker-end="url(#cassArrowTeal)"/>

  <!-- Semantic cache for chat only -->
  <rect x="370" y="300" width="150" height="50" rx="8" fill="#b45309"/>
  <text x="445" y="321" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Semantic Cache</text>
  <text x="445" y="336" font-size="8" fill="#fde68a" text-anchor="middle">chat only, not completions</text>

  <line x1="245" y1="285" x2="400" y2="300" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#cassArrowAmber)"/>

  <!-- Structure extraction pipeline -->
  <rect x="370" y="80" width="150" height="55" rx="8" fill="#334155"/>
  <text x="445" y="103" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Structure Extraction</text>
  <text x="445" y="119" font-size="8" fill="#cbd5e1" text-anchor="middle">parse + call graph</text>

  <line x1="445" y1="135" x2="445" y2="228" stroke="#334155" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#cassArrowSlate)"/>

  <!-- Model serving replicas -->
  <rect x="580" y="100" width="140" height="45" rx="8" fill="#0f766e"/>
  <text x="650" y="118" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Completion Model</text>
  <text x="650" y="132" font-size="8" fill="#ccfbf1" text-anchor="middle">tight batch window</text>

  <rect x="580" y="230" width="140" height="45" rx="8" fill="#0f766e"/>
  <text x="650" y="248" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Chat/Agent Model</text>
  <text x="650" y="262" font-size="8" fill="#ccfbf1" text-anchor="middle">multi-step, slower</text>

  <line x1="320" y1="125" x2="580" y2="122" stroke="#0f766e" stroke-width="2" marker-end="url(#cassArrowTeal)"/>
  <line x1="520" y1="255" x2="580" y2="252" stroke="#0f766e" stroke-width="2" marker-end="url(#cassArrowTeal)"/>

  <rect x="20" y="300" width="290" height="90" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="320" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Re-indexing is a data-</text>
  <text x="165" y="334" font-size="9" fill="#334155" text-anchor="middle">pipeline-shaped background</text>
  <text x="165" y="348" font-size="9" fill="#334155" text-anchor="middle">workload across 3M repos —</text>
  <text x="165" y="362" font-size="9" fill="#334155" text-anchor="middle">durable queue, never blocks</text>
  <text x="165" y="376" font-size="9" fill="#334155" text-anchor="middle">a developer's next completion</text>

  <defs>
    <marker id="cassArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="cassArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="cassArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="cassArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
