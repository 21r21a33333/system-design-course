<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="hftArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="hftArrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#be123c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Tick-to-trade path inside a colocated HFT stack</text>
  <text x="410" y="44" text-anchor="middle" font-size="11" fill="#64748b">Everything left of the exchange runs in one colocation cage, on pinned cores, kernel-bypass NIC</text>

  <!-- Exchange (source) -->
  <rect x="24" y="90" width="120" height="66" rx="8" fill="#1d4ed8"/>
  <text x="84" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Exchange</text>
  <text x="84" y="134" text-anchor="middle" font-size="10" fill="#dbeafe">multicast feed</text>
  <text x="84" y="147" text-anchor="middle" font-size="10" fill="#dbeafe">ITCH / market data</text>

  <!-- Feed handler -->
  <rect x="196" y="90" width="120" height="66" rx="8" fill="#0f766e"/>
  <text x="256" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Feed handler</text>
  <text x="256" y="130" text-anchor="middle" font-size="10" fill="#ccfbf1">decode ITCH</text>
  <text x="256" y="143" text-anchor="middle" font-size="10" fill="#ccfbf1">kernel bypass NIC</text>

  <!-- Order book -->
  <rect x="368" y="90" width="120" height="66" rx="8" fill="#0f766e"/>
  <text x="428" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Order book</text>
  <text x="428" y="130" text-anchor="middle" font-size="10" fill="#ccfbf1">in-memory, per symbol</text>
  <text x="428" y="143" text-anchor="middle" font-size="10" fill="#ccfbf1">price-time priority</text>

  <!-- Strategy -->
  <rect x="368" y="210" width="120" height="66" rx="8" fill="#6d28d9"/>
  <text x="428" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Strategy engine</text>
  <text x="428" y="250" text-anchor="middle" font-size="10" fill="#ede9fe">signal + quoting</text>
  <text x="428" y="263" text-anchor="middle" font-size="10" fill="#ede9fe">no allocation, no GC</text>

  <!-- Risk gate -->
  <rect x="540" y="210" width="120" height="66" rx="8" fill="#b45309"/>
  <text x="600" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Pre-trade risk</text>
  <text x="600" y="250" text-anchor="middle" font-size="10" fill="#fef3c7">SEC 15c3-5 gate</text>
  <text x="600" y="263" text-anchor="middle" font-size="10" fill="#fef3c7">mandatory, in-line</text>

  <!-- Order gateway -->
  <rect x="540" y="90" width="120" height="66" rx="8" fill="#0f766e"/>
  <text x="600" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Order gateway</text>
  <text x="600" y="130" text-anchor="middle" font-size="10" fill="#ccfbf1">OUCH / FIX out</text>
  <text x="600" y="143" text-anchor="middle" font-size="10" fill="#ccfbf1">smart routing</text>

  <!-- Exchange match (return) -->
  <rect x="700" y="90" width="96" height="66" rx="8" fill="#1d4ed8"/>
  <text x="748" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Exchange</text>
  <text x="748" y="130" text-anchor="middle" font-size="10" fill="#dbeafe">matching</text>
  <text x="748" y="143" text-anchor="middle" font-size="10" fill="#dbeafe">engine</text>

  <!-- OMS / monitoring (off hot path) -->
  <rect x="700" y="210" width="96" height="66" rx="8" fill="#334155"/>
  <text x="748" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">OMS +</text>
  <text x="748" y="250" text-anchor="middle" font-size="10" fill="#e2e8f0">monitoring</text>
  <text x="748" y="263" text-anchor="middle" font-size="10" fill="#e2e8f0">off hot path</text>

  <!-- flow arrows: exchange -> feed -> book -->
  <line x1="144" y1="123" x2="192" y2="123" stroke="#334155" stroke-width="2" marker-end="url(#hftArrow)"/>
  <line x1="316" y1="123" x2="364" y2="123" stroke="#334155" stroke-width="2" marker-end="url(#hftArrow)"/>

  <!-- book -> strategy (down) -->
  <line x1="428" y1="156" x2="428" y2="206" stroke="#334155" stroke-width="2" marker-end="url(#hftArrow)"/>
  <!-- strategy -> risk -->
  <line x1="488" y1="243" x2="536" y2="243" stroke="#334155" stroke-width="2" marker-end="url(#hftArrow)"/>
  <!-- risk -> gateway (up) -->
  <line x1="600" y1="206" x2="600" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#hftArrow)"/>
  <!-- gateway -> exchange -->
  <line x1="660" y1="123" x2="696" y2="123" stroke="#334155" stroke-width="2" marker-end="url(#hftArrow)"/>
  <!-- exchange match -> OMS (fills back) -->
  <line x1="748" y1="156" x2="748" y2="206" stroke="#334155" stroke-width="2" marker-end="url(#hftArrow)"/>

  <!-- risk reject arrow -->
  <path d="M600,276 L600,300 L428,300 L428,280" fill="none" stroke="#be123c" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#hftArrowRed)"/>
  <text x="512" y="316" text-anchor="middle" font-size="10" fill="#be123c">reject before wire (over-size, over-position, bad price)</text>

  <!-- latency band -->
  <text x="256" y="352" text-anchor="middle" font-size="10" fill="#64748b">wire + decode: single-digit microseconds</text>
  <text x="600" y="352" text-anchor="middle" font-size="10" fill="#64748b">book to gateway (tick-to-trade): hundreds of ns to low us</text>
  <text x="410" y="374" text-anchor="middle" font-size="10" fill="#64748b">Lock-free ring buffers hand events between stages; every stage on a pinned, NUMA-local core</text>
</svg>
