<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Two updates neither dominates the other's vector — a genuine, undetected-by-timestamp conflict</text>

  <!-- Node A timeline -->
  <text x="60" y="70" font-size="10" fill="#1d4ed8" font-weight="600">Replica A</text>
  <circle cx="90" cy="100" r="6" fill="#1d4ed8"/>
  <text x="90" y="122" font-size="8" fill="#1d4ed8" text-anchor="middle">{A:1,B:0}</text>
  <line x1="96" y1="100" x2="230" y2="100" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#vcArrowBlue)"/>
  <circle cx="240" cy="100" r="6" fill="#1d4ed8"/>
  <text x="240" y="122" font-size="8" fill="#1d4ed8" text-anchor="middle">{A:2,B:0}</text>

  <!-- Node B timeline -->
  <text x="60" y="175" font-size="10" fill="#0f766e" font-weight="600">Replica B</text>
  <circle cx="90" cy="205" r="6" fill="#0f766e"/>
  <text x="90" y="227" font-size="8" fill="#0f766e" text-anchor="middle">{A:0,B:1}</text>
  <line x1="96" y1="205" x2="230" y2="205" stroke="#0f766e" stroke-width="1.5" marker-end="url(#vcArrowTeal)"/>
  <circle cx="240" cy="205" r="6" fill="#0f766e"/>
  <text x="240" y="227" font-size="8" fill="#0f766e" text-anchor="middle">{A:0,B:2}</text>

  <!-- Comparison at quorum read -->
  <rect x="420" y="130" width="220" height="60" rx="8" fill="#b45309"/>
  <text x="530" y="152" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Quorum read compares</text>
  <text x="530" y="168" font-size="9" fill="#fef3c7" text-anchor="middle">{A:2,B:0} vs {A:0,B:2}</text>
  <text x="530" y="182" font-size="9" fill="#fef3c7" text-anchor="middle">neither &le; the other</text>

  <line x1="246" y1="100" x2="418" y2="150" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="2,2"/>
  <line x1="246" y1="205" x2="418" y2="170" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="2,2"/>

  <rect x="430" y="255" width="300" height="45" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="580" y="273" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="600">CONCURRENT — app-level merge needed,</text>
  <text x="580" y="287" font-size="9.5" fill="#b45309" text-anchor="middle">not a simple last-writer-wins pick</text>

  <defs>
    <marker id="vcArrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="vcArrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
