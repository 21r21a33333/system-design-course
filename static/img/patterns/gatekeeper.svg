<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>

  <!-- Untrusted client -->
  <rect x="40" y="110" width="150" height="70" rx="8" fill="#b91c1c"/>
  <text x="115" y="140" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">External Client</text>
  <text x="115" y="160" font-size="11" fill="#fecaca" text-anchor="middle">untrusted input</text>

  <!-- Gatekeeper -->
  <rect x="280" y="90" width="180" height="110" rx="8" fill="#0f766e"/>
  <text x="370" y="130" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">Gatekeeper</text>
  <text x="370" y="152" font-size="11" fill="#ccfbf1" text-anchor="middle">validate + sanitize</text>
  <text x="370" y="170" font-size="11" fill="#ccfbf1" text-anchor="middle">minimal attack surface</text>

  <!-- Trusted backend -->
  <rect x="520" y="110" width="160" height="70" rx="8" fill="#1d4ed8"/>
  <text x="600" y="140" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Backend</text>
  <text x="600" y="160" font-size="11" fill="#dbeafe" text-anchor="middle">trusted zone</text>

  <!-- arrows -->
  <line x1="190" y1="145" x2="278" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="192" y="135" font-size="11" fill="#334155">raw request</text>

  <line x1="460" y1="145" x2="518" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="465" y="135" font-size="11" fill="#334155">sanitized only</text>

  <!-- rejected path -->
  <line x1="330" y1="200" x2="330" y2="240" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <text x="340" y="230" font-size="11" fill="#b91c1c">rejected</text>

  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
  </defs>
</svg>
