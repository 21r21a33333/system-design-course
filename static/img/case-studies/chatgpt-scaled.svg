<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Conversational AI System: scaled design</text>

  <!-- Users -->
  <rect x="20" y="185" width="100" height="55" rx="8" fill="#1d4ed8"/>
  <text x="70" y="208" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Users</text>
  <text x="70" y="224" font-size="8" fill="#dbeafe" text-anchor="middle">peak ~14k msg/s</text>

  <!-- Safety filter tier -->
  <rect x="160" y="185" width="130" height="55" rx="8" fill="#b45309"/>
  <text x="225" y="206" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Safety Filter</text>
  <text x="225" y="221" font-size="8" fill="#fde68a" text-anchor="middle">horizontally scaled</text>

  <line x1="120" y1="212" x2="158" y2="212" stroke="#1d4ed8" stroke-width="2" marker-end="url(#cgsArrowBlue)"/>

  <!-- Context assembly tier -->
  <rect x="330" y="120" width="130" height="50" rx="8" fill="#0f766e"/>
  <text x="395" y="141" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Context Assembly</text>
  <text x="395" y="156" font-size="8" fill="#ccfbf1" text-anchor="middle">cheap, elastic</text>

  <line x1="290" y1="205" x2="330" y2="155" stroke="#0f766e" stroke-width="2" marker-end="url(#cgsArrowTeal)"/>

  <!-- GPU auto-scaled fleet -->
  <rect x="520" y="70" width="140" height="50" rx="8" fill="#15803d"/>
  <text x="590" y="91" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Serving Replica 1</text>
  <text x="590" y="106" font-size="8" fill="#dcfce7" text-anchor="middle">warm minimum</text>

  <rect x="520" y="135" width="140" height="50" rx="8" fill="#15803d"/>
  <text x="590" y="156" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Serving Replica 2</text>
  <text x="590" y="171" font-size="8" fill="#dcfce7" text-anchor="middle">micro-batched</text>

  <rect x="520" y="200" width="140" height="50" rx="8" fill="#15803d"/>
  <text x="590" y="221" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Serving Replica N</text>
  <text x="590" y="236" font-size="8" fill="#dcfce7" text-anchor="middle">~2,100 @ peak</text>

  <line x1="460" y1="145" x2="518" y2="95" stroke="#0f766e" stroke-width="2" marker-end="url(#cgsArrowTeal)"/>
  <line x1="460" y1="145" x2="518" y2="160" stroke="#0f766e" stroke-width="2" marker-end="url(#cgsArrowTeal)"/>
  <line x1="460" y1="145" x2="518" y2="225" stroke="#0f766e" stroke-width="2" marker-end="url(#cgsArrowTeal)"/>

  <!-- Conversation store sharded -->
  <rect x="330" y="290" width="130" height="50" rx="8" fill="#334155"/>
  <text x="395" y="311" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Conv. Store</text>
  <text x="395" y="326" font-size="8" fill="#cbd5e1" text-anchor="middle">shard by conv_id</text>

  <line x1="395" y1="170" x2="395" y2="288" stroke="#334155" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#cgsArrowSlate)"/>

  <rect x="680" y="60" width="150" height="200" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="755" y="80" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">GPU auto-scaling:</text>
  <text x="755" y="94" font-size="9" fill="#334155" text-anchor="middle">warm pool absorbs</text>
  <text x="755" y="108" font-size="9" fill="#334155" text-anchor="middle">baseline + fluctuation;</text>
  <text x="755" y="122" font-size="9" fill="#334155" text-anchor="middle">scale-out only on</text>
  <text x="755" y="136" font-size="9" fill="#334155" text-anchor="middle">sustained load, since</text>
  <text x="755" y="150" font-size="9" fill="#334155" text-anchor="middle">provisioning a replica</text>
  <text x="755" y="164" font-size="9" fill="#334155" text-anchor="middle">(load weights onto</text>
  <text x="755" y="178" font-size="9" fill="#334155" text-anchor="middle">hardware) takes real</text>
  <text x="755" y="192" font-size="9" fill="#334155" text-anchor="middle">time a reactive-only</text>
  <text x="755" y="206" font-size="9" fill="#334155" text-anchor="middle">policy can't absorb</text>

  <rect x="20" y="290" width="290" height="90" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="310" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Diurnal traffic: fleet size</text>
  <text x="165" y="324" font-size="9" fill="#334155" text-anchor="middle">tracks the day's demand</text>
  <text x="165" y="338" font-size="9" fill="#334155" text-anchor="middle">curve, not held flat at</text>
  <text x="165" y="352" font-size="9" fill="#334155" text-anchor="middle">peak size around the clock</text>

  <defs>
    <marker id="cgsArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="cgsArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="cgsArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
