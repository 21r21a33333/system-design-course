<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="22" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Leader election: randomized timeouts avoid split votes</text>

  <!-- Leader -->
  <rect x="300" y="45" width="120" height="60" rx="8" fill="#0f766e"/>
  <text x="360" y="72" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Leader</text>
  <text x="360" y="90" font-size="9" fill="#ccfbf1" text-anchor="middle">sends heartbeats</text>

  <!-- Followers -->
  <rect x="80" y="180" width="120" height="60" rx="8" fill="#1d4ed8"/>
  <text x="140" y="207" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Follower A</text>
  <text x="140" y="224" font-size="8" fill="#dbeafe" text-anchor="middle">timeout: 220ms</text>

  <rect x="300" y="180" width="120" height="60" rx="8" fill="#1d4ed8"/>
  <text x="360" y="207" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Follower B</text>
  <text x="360" y="224" font-size="8" fill="#dbeafe" text-anchor="middle">timeout: 265ms</text>

  <!-- Candidate: timed out first, requests votes -->
  <rect x="520" y="180" width="120" height="60" rx="8" fill="#b45309"/>
  <text x="580" y="207" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Candidate C</text>
  <text x="580" y="224" font-size="8" fill="#fef3c7" text-anchor="middle">timeout: 160ms (first!)</text>

  <!-- leader heartbeats to A and B (dashed = about to stop, leader crashing) -->
  <line x1="320" y1="103" x2="150" y2="178" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRfGray)"/>
  <line x1="360" y1="105" x2="360" y2="178" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRfGray)"/>
  <text x="230" y="140" font-size="9" fill="#94a3b8" text-anchor="middle">heartbeats stop (leader crashes)</text>

  <!-- Candidate requests votes -->
  <line x1="522" y1="200" x2="422" y2="200" stroke="#b45309" stroke-width="2" marker-end="url(#arrowRfOrange)"/>
  <text x="470" y="190" font-size="8" fill="#b45309" text-anchor="middle">RequestVote</text>
  <line x1="518" y1="215" x2="202" y2="215" stroke="#b45309" stroke-width="2" marker-end="url(#arrowRfOrange)"/>
  <text x="360" y="255" font-size="8" fill="#b45309" text-anchor="middle">RequestVote (term+1)</text>

  <!-- votes back -->
  <line x1="420" y1="230" x2="520" y2="230" stroke="#15803d" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowRfGreen)"/>
  <text x="470" y="285" font-size="8" fill="#15803d" text-anchor="middle">votes granted</text>

  <text x="360" y="300" font-size="10" fill="#334155" text-anchor="middle">C's timeout fired first -&gt; becomes candidate -&gt; wins majority -&gt; new Leader</text>

  <defs>
    <marker id="arrowRfGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRfOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <marker id="arrowRfGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
  </defs>
</svg>
