<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Application drives both the cache check and the store query</text>

  <!-- Application -->
  <rect x="30" y="120" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="95" y="146" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Application</text>
  <text x="95" y="164" font-size="9" fill="#dbeafe" text-anchor="middle">owns the miss logic</text>

  <!-- Cache -->
  <rect x="300" y="55" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="375" y="80" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Cache</text>
  <text x="375" y="98" font-size="9" fill="#ccfbf1" text-anchor="middle">passive key-value store</text>

  <!-- Store -->
  <rect x="580" y="120" width="150" height="60" rx="8" fill="#334155"/>
  <text x="655" y="146" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Store</text>
  <text x="655" y="164" font-size="9" fill="#cbd5e1" text-anchor="middle">source of truth</text>

  <!-- step 1: check cache -->
  <line x1="160" y1="135" x2="298" y2="95" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowCa1)"/>
  <text x="215" y="105" font-size="9" fill="#1d4ed8" text-anchor="middle">1. check cache</text>

  <!-- step 2: miss -->
  <line x1="298" y1="105" x2="160" y2="150" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowCa2)"/>
  <text x="215" y="128" font-size="9" fill="#b45309" text-anchor="middle">2. miss</text>

  <!-- step 3: query store -->
  <line x1="160" y1="165" x2="578" y2="150" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowCa1)"/>
  <text x="380" y="195" font-size="9" fill="#1d4ed8" text-anchor="middle">3. query store directly</text>

  <!-- step 4: populate cache -->
  <line x1="450" y1="110" x2="655" y2="118" stroke="#0f766e" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowCaTeal)"/>
  <line x1="600" y1="118" x2="450" y2="105" stroke="#0f766e" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="530" y="70" font-size="9" fill="#0f766e" text-anchor="middle">4. app populates cache with result</text>

  <!-- race note -->
  <rect x="150" y="225" width="460" height="65" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="248" font-size="10" fill="#b45309" text-anchor="middle" font-weight="600">Race: a concurrent write + invalidate between</text>
  <text x="380" y="263" font-size="10" fill="#b45309" text-anchor="middle">steps 3 and 4 can let a stale value win step 4</text>
  <text x="380" y="278" font-size="10" fill="#b45309" text-anchor="middle">— cache-aside bounds this with TTL, not by preventing it</text>

  <defs>
    <marker id="arrowCa1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowCa2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="arrowCaTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
