<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">A non-critical dependency is down: serve a reduced-but-useful response, not an error</text>

  <!-- Request handler -->
  <rect x="30" y="130" width="140" height="80" rx="8" fill="#1d4ed8"/>
  <text x="100" y="162" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Request</text>
  <text x="100" y="180" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">handler</text>
  <text x="100" y="198" font-size="9" fill="#dbeafe" text-anchor="middle">aggregate deps</text>

  <!-- Critical dep (product) -->
  <rect x="250" y="40" width="180" height="52" rx="8" fill="#15803d"/>
  <text x="340" y="63" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Product record (critical)</text>
  <text x="340" y="80" font-size="9" fill="#dcfce7" text-anchor="middle">healthy → required</text>

  <!-- Non-critical dep DOWN (recommendations) -->
  <rect x="250" y="130" width="180" height="52" rx="8" fill="#dc2626"/>
  <text x="340" y="153" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Recommendations (down)</text>
  <text x="340" y="170" font-size="9" fill="#fee2e2" text-anchor="middle">circuit open · times out</text>

  <!-- Fallback -->
  <rect x="250" y="220" width="180" height="70" rx="8" fill="#b45309"/>
  <text x="340" y="246" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Fallback</text>
  <text x="340" y="264" font-size="9" fill="#fde68a" text-anchor="middle">cached → default → omit</text>
  <text x="340" y="280" font-size="9" fill="#fde68a" text-anchor="middle">fail-open</text>

  <!-- Reduced response -->
  <rect x="520" y="115" width="170" height="90" rx="8" fill="#0f766e"/>
  <text x="605" y="145" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Reduced response</text>
  <text x="605" y="167" font-size="9" fill="#ccfbf1" text-anchor="middle">product shown,</text>
  <text x="605" y="183" font-size="9" fill="#ccfbf1" text-anchor="middle">recs section hidden</text>
  <text x="605" y="199" font-size="9" fill="#ccfbf1" text-anchor="middle">request still succeeds</text>

  <!-- handler -> critical -->
  <line x1="170" y1="150" x2="248" y2="80" stroke="#15803d" stroke-width="2.5" marker-end="url(#gdArrowGreen)"/>
  <text x="205" y="105" font-size="9" fill="#15803d" text-anchor="middle">ok</text>

  <!-- handler -> non-critical (fails) -->
  <line x1="170" y1="165" x2="248" y2="156" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#gdArrowRed)"/>
  <text x="205" y="150" font-size="9" fill="#dc2626" text-anchor="middle">fails fast</text>

  <!-- non-critical -> fallback -->
  <line x1="340" y1="182" x2="340" y2="218" stroke="#b45309" stroke-width="2.5" marker-end="url(#gdArrowAmber)"/>
  <text x="405" y="205" font-size="9" fill="#b45309" text-anchor="middle">degrade</text>

  <!-- critical + fallback -> reduced response -->
  <line x1="430" y1="66" x2="518" y2="135" stroke="#0f766e" stroke-width="2.5" marker-end="url(#gdArrowTeal)"/>
  <line x1="430" y1="250" x2="518" y2="185" stroke="#0f766e" stroke-width="2.5" marker-end="url(#gdArrowTeal)"/>

  <rect x="30" y="270" width="440" height="35" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="250" y="292" font-size="9" fill="#334155" text-anchor="middle">degrade = reduce the response · vs failover (replace) · vs circuit breaker (stop calling)</text>

  <defs>
    <marker id="gdArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
    <marker id="gdArrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <marker id="gdArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="gdArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
