<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Each filter knows only its own input and output shape</text>

  <!-- Filter 1 -->
  <rect x="30" y="110" width="140" height="60" rx="8" fill="#0f766e"/>
  <text x="100" y="136" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Parse</text>
  <text x="100" y="154" font-size="9" fill="#ccfbf1" text-anchor="middle">filter</text>

  <!-- Filter 2 -->
  <rect x="230" y="110" width="140" height="60" rx="8" fill="#0f766e"/>
  <text x="300" y="136" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Validate</text>
  <text x="300" y="154" font-size="9" fill="#ccfbf1" text-anchor="middle">filter</text>

  <!-- Filter 3 -->
  <rect x="430" y="110" width="140" height="60" rx="8" fill="#0f766e"/>
  <text x="500" y="136" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Enrich</text>
  <text x="500" y="154" font-size="9" fill="#ccfbf1" text-anchor="middle">filter</text>

  <!-- Filter 4 -->
  <rect x="600" y="110" width="140" height="60" rx="8" fill="#1d4ed8"/>
  <text x="670" y="136" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Write</text>
  <text x="670" y="154" font-size="9" fill="#dbeafe" text-anchor="middle">filter</text>

  <!-- pipes -->
  <line x1="170" y1="140" x2="228" y2="140" stroke="#334155" stroke-width="3" marker-end="url(#pfArrow)"/>
  <text x="199" y="130" font-size="9" fill="#334155" text-anchor="middle">pipe</text>

  <line x1="370" y1="140" x2="428" y2="140" stroke="#334155" stroke-width="3" marker-end="url(#pfArrow)"/>
  <text x="399" y="130" font-size="9" fill="#334155" text-anchor="middle">pipe</text>

  <line x1="570" y1="140" x2="598" y2="140" stroke="#334155" stroke-width="3" marker-end="url(#pfArrow)"/>
  <text x="584" y="130" font-size="9" fill="#334155" text-anchor="middle"></text>

  <!-- dead-letter branch from validate -->
  <line x1="300" y1="170" x2="300" y2="230" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#pfArrowAmber)"/>
  <rect x="200" y="230" width="200" height="40" rx="8" fill="#b45309"/>
  <text x="300" y="255" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Dead Letter Queue</text>

  <text x="300" y="285" font-size="9" fill="#b45309" text-anchor="middle">a unit that fails one filter is routed aside, not lost</text>

  <defs>
    <marker id="pfArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="pfArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
