<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="22" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Log replication: an entry commits once stored on a majority</text>

  <!-- column headers: index -->
  <text x="120" y="58" font-size="9" fill="#64748b" text-anchor="middle">idx 1</text>
  <text x="180" y="58" font-size="9" fill="#64748b" text-anchor="middle">idx 2</text>
  <text x="240" y="58" font-size="9" fill="#64748b" text-anchor="middle">idx 3</text>
  <text x="300" y="58" font-size="9" fill="#64748b" text-anchor="middle">idx 4</text>

  <!-- Leader -->
  <text x="20" y="82" font-size="10" fill="#0f766e" font-weight="600">Leader</text>
  <rect x="90" y="68" width="60" height="26" rx="4" fill="#0f766e"/><text x="120" y="85" font-size="9" fill="#fff" text-anchor="middle">t1</text>
  <rect x="150" y="68" width="60" height="26" rx="4" fill="#0f766e"/><text x="180" y="85" font-size="9" fill="#fff" text-anchor="middle">t1</text>
  <rect x="210" y="68" width="60" height="26" rx="4" fill="#0f766e"/><text x="240" y="85" font-size="9" fill="#fff" text-anchor="middle">t2</text>
  <rect x="270" y="68" width="60" height="26" rx="4" fill="#b45309"/><text x="300" y="85" font-size="9" fill="#fff" text-anchor="middle">t2</text>

  <!-- Follower A -->
  <text x="20" y="122" font-size="10" fill="#1d4ed8" font-weight="600">Follower A</text>
  <rect x="90" y="108" width="60" height="26" rx="4" fill="#1d4ed8"/><text x="120" y="125" font-size="9" fill="#fff" text-anchor="middle">t1</text>
  <rect x="150" y="108" width="60" height="26" rx="4" fill="#1d4ed8"/><text x="180" y="125" font-size="9" fill="#fff" text-anchor="middle">t1</text>
  <rect x="210" y="108" width="60" height="26" rx="4" fill="#1d4ed8"/><text x="240" y="125" font-size="9" fill="#fff" text-anchor="middle">t2</text>
  <rect x="270" y="108" width="60" height="26" rx="4" fill="#e2e8f0"/><text x="300" y="125" font-size="9" fill="#94a3b8" text-anchor="middle">—</text>

  <!-- Follower B -->
  <text x="20" y="162" font-size="10" fill="#1d4ed8" font-weight="600">Follower B</text>
  <rect x="90" y="148" width="60" height="26" rx="4" fill="#1d4ed8"/><text x="120" y="165" font-size="9" fill="#fff" text-anchor="middle">t1</text>
  <rect x="150" y="148" width="60" height="26" rx="4" fill="#1d4ed8"/><text x="180" y="165" font-size="9" fill="#fff" text-anchor="middle">t1</text>
  <rect x="210" y="148" width="60" height="26" rx="4" fill="#1d4ed8"/><text x="240" y="165" font-size="9" fill="#fff" text-anchor="middle">t2</text>
  <rect x="270" y="148" width="60" height="26" rx="4" fill="#e2e8f0"/><text x="300" y="165" font-size="9" fill="#94a3b8" text-anchor="middle">—</text>

  <!-- commit line -->
  <line x1="270" y1="62" x2="270" y2="180" stroke="#15803d" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="215" y="196" font-size="9" fill="#15803d" text-anchor="middle" font-weight="600">commitIndex = 3</text>
  <text x="215" y="210" font-size="8" fill="#64748b" text-anchor="middle">idx 1–3 on a majority → committed</text>

  <text x="450" y="196" font-size="9" fill="#b45309" text-anchor="middle" font-weight="600">idx 4 not yet on a majority</text>
  <text x="450" y="210" font-size="8" fill="#64748b" text-anchor="middle">still uncommitted (leader-only)</text>

  <!-- AppendEntries arrows -->
  <line x1="130" y1="98" x2="130" y2="106" stroke="#334155" stroke-width="1.2" marker-end="url(#rlArr)"/>
  <line x1="130" y1="138" x2="130" y2="146" stroke="#334155" stroke-width="1.2" marker-end="url(#rlArr)"/>

  <!-- Log Matching note box -->
  <rect x="90" y="238" width="540" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="104" y="258" font-size="10" fill="#334155" font-weight="600">Log Matching property</text>
  <text x="104" y="276" font-size="9" fill="#475569">If two logs share an entry at the same index and term, they are identical up to that index.</text>
  <text x="104" y="292" font-size="9" fill="#475569">AppendEntries carries the preceding (index, term) so a follower rejects a mismatch and back-fills,</text>
  <text x="104" y="305" font-size="9" fill="#475569">keeping every follower's log a prefix-consistent copy of the leader's.</text>

  <defs>
    <marker id="rlArr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
