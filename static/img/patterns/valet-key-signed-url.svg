<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">A signed URL binds resource + permission + expiry, and storage verifies the signature itself</text>

  <!-- Client -->
  <rect x="30" y="140" width="120" height="60" rx="8" fill="#1d4ed8"/>
  <text x="90" y="170" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="90" y="187" font-size="9" fill="#dbeafe" text-anchor="middle">holds the URL</text>

  <!-- Application (issuer) -->
  <rect x="250" y="50" width="200" height="70" rx="8" fill="#0f766e"/>
  <text x="350" y="78" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Application (trusted issuer)</text>
  <text x="350" y="96" font-size="9" fill="#ccfbf1" text-anchor="middle">signs with shared secret</text>
  <text x="350" y="110" font-size="9" fill="#ccfbf1" text-anchor="middle">holds no bytes in transit</text>

  <!-- Storage (verifier) -->
  <rect x="520" y="140" width="170" height="70" rx="8" fill="#334155"/>
  <text x="605" y="168" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Object Storage</text>
  <text x="605" y="186" font-size="9" fill="#cbd5e1" text-anchor="middle">verifies signature,</text>
  <text x="605" y="199" font-size="9" fill="#cbd5e1" text-anchor="middle">scope, and expiry</text>

  <!-- 1 request key -->
  <line x1="150" y1="150" x2="248" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#vkArrow)"/>
  <text x="185" y="128" font-size="9" fill="#334155" text-anchor="middle">1. request access</text>

  <!-- 2 signed url returned -->
  <line x1="248" y1="112" x2="152" y2="158" stroke="#0f766e" stroke-width="2" marker-end="url(#vkArrowTeal)"/>
  <text x="205" y="150" font-size="9" fill="#0f766e" text-anchor="middle">2. signed URL</text>

  <!-- signed url content box -->
  <rect x="205" y="235" width="310" height="72" rx="8" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="360" y="255" font-size="10" fill="#b45309" text-anchor="middle" font-weight="600">signed URL = fields + signature</text>
  <text x="360" y="272" font-size="9" fill="#334155" text-anchor="middle">resource=/uploads/9f3.jpg &#183; op=PUT &#183; exp=T+300s</text>
  <text x="360" y="288" font-size="9" fill="#334155" text-anchor="middle">sig = MAC(secret, resource | op | exp)</text>
  <text x="360" y="302" font-size="9" fill="#64748b" text-anchor="middle">tamper any field and the signature no longer matches</text>

  <!-- 3 direct transfer -->
  <line x1="150" y1="185" x2="518" y2="180" stroke="#b45309" stroke-width="2.5" marker-end="url(#vkArrowOrange)"/>
  <text x="335" y="172" font-size="10" fill="#b45309" text-anchor="middle" font-weight="600">3. direct read/write — bypasses the application</text>

  <defs>
    <marker id="vkArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="vkArrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="vkArrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
