<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>

  <text x="380" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Partitioned log: keyed producers append; consumer groups read independently by offset</text>

  <!-- Producers -->
  <rect x="24" y="90" width="120" height="46" rx="8" fill="#1d4ed8"/>
  <text x="84" y="112" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Producer</text>
  <text x="84" y="128" font-size="9" fill="#dbeafe" text-anchor="middle">key = user-42</text>

  <rect x="24" y="230" width="120" height="46" rx="8" fill="#1d4ed8"/>
  <text x="84" y="252" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Producer</text>
  <text x="84" y="268" font-size="9" fill="#dbeafe" text-anchor="middle">key = user-7</text>

  <!-- hash router -->
  <rect x="176" y="158" width="86" height="52" rx="8" fill="#334155"/>
  <text x="219" y="180" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">hash(key)</text>
  <text x="219" y="196" font-size="9" fill="#cbd5e1" text-anchor="middle">% partitions</text>

  <line x1="144" y1="113" x2="176" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dmqBlue)"/>
  <line x1="144" y1="253" x2="176" y2="196" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dmqBlue)"/>

  <!-- Partitions (append-only logs) -->
  <text x="420" y="76" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Topic (append-only, offset-indexed)</text>

  <!-- partition 0 -->
  <g>
    <rect x="300" y="90" width="240" height="40" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="288" y="114" font-size="9" fill="#0f766e" text-anchor="end" font-weight="600">P0</text>
    <rect x="308" y="98" width="34" height="24" rx="3" fill="#0f766e"/><text x="325" y="114" font-size="9" fill="#fff" text-anchor="middle">0</text>
    <rect x="346" y="98" width="34" height="24" rx="3" fill="#0f766e"/><text x="363" y="114" font-size="9" fill="#fff" text-anchor="middle">1</text>
    <rect x="384" y="98" width="34" height="24" rx="3" fill="#0f766e"/><text x="401" y="114" font-size="9" fill="#fff" text-anchor="middle">2</text>
    <rect x="422" y="98" width="34" height="24" rx="3" fill="#0f766e"/><text x="439" y="114" font-size="9" fill="#fff" text-anchor="middle">3</text>
    <rect x="460" y="98" width="34" height="24" rx="3" fill="#5eead4"/><text x="477" y="114" font-size="9" fill="#134e4a" text-anchor="middle">4</text>
    <text x="516" y="114" font-size="14" fill="#64748b" text-anchor="middle">→</text>
  </g>

  <!-- partition 1 -->
  <g>
    <rect x="300" y="144" width="240" height="40" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="288" y="168" font-size="9" fill="#0f766e" text-anchor="end" font-weight="600">P1</text>
    <rect x="308" y="152" width="34" height="24" rx="3" fill="#0f766e"/><text x="325" y="168" font-size="9" fill="#fff" text-anchor="middle">0</text>
    <rect x="346" y="152" width="34" height="24" rx="3" fill="#0f766e"/><text x="363" y="168" font-size="9" fill="#fff" text-anchor="middle">1</text>
    <rect x="384" y="152" width="34" height="24" rx="3" fill="#5eead4"/><text x="401" y="168" font-size="9" fill="#134e4a" text-anchor="middle">2</text>
    <text x="516" y="168" font-size="14" fill="#64748b" text-anchor="middle">→</text>
  </g>

  <line x1="262" y1="180" x2="300" y2="120" stroke="#0f766e" stroke-width="2" marker-end="url(#dmqTeal)"/>
  <line x1="262" y1="188" x2="300" y2="164" stroke="#0f766e" stroke-width="2" marker-end="url(#dmqTeal)"/>
  <text x="278" y="140" font-size="8" fill="#0f766e" text-anchor="middle">append</text>

  <!-- Consumer group A -->
  <rect x="596" y="86" width="140" height="52" rx="8" fill="#15803d"/>
  <text x="666" y="107" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Group A</text>
  <text x="666" y="122" font-size="9" fill="#dcfce7" text-anchor="middle">P0 offset=4</text>
  <line x1="540" y1="110" x2="596" y2="108" stroke="#15803d" stroke-width="2" marker-end="url(#dmqGreen)"/>

  <!-- Consumer group B (lagging) -->
  <rect x="596" y="150" width="140" height="52" rx="8" fill="#b45309"/>
  <text x="666" y="171" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Group B (lagging)</text>
  <text x="666" y="186" font-size="9" fill="#fde68a" text-anchor="middle">P0 offset=2 · replays</text>
  <line x1="540" y1="110" x2="596" y2="168" stroke="#b45309" stroke-width="2" marker-end="url(#dmqAmber)"/>

  <!-- retention / dlq note -->
  <rect x="300" y="300" width="240" height="64" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="420" y="322" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="600">Retention trims oldest</text>
  <text x="420" y="338" font-size="9" fill="#334155" text-anchor="middle">by time/size — even if</text>
  <text x="420" y="352" font-size="9" fill="#334155" text-anchor="middle">a group hasn't read it</text>

  <rect x="596" y="300" width="140" height="64" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="666" y="322" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">Dead-letter queue</text>
  <text x="666" y="338" font-size="9" fill="#64748b" text-anchor="middle">poison messages after</text>
  <text x="666" y="352" font-size="9" fill="#64748b" text-anchor="middle">max redelivery</text>

  <rect x="24" y="300" width="240" height="64" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="144" y="322" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">Order guaranteed</text>
  <text x="144" y="338" font-size="9" fill="#64748b" text-anchor="middle">within a partition only</text>
  <text x="144" y="352" font-size="9" fill="#64748b" text-anchor="middle">(same key → same P)</text>

  <defs>
    <marker id="dmqBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
    <marker id="dmqTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="dmqGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/></marker>
    <marker id="dmqAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
  </defs>
</svg>
