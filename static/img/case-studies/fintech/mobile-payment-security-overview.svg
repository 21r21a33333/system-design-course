<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mpsArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="mpsArrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#be123c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="430" fill="#ffffff"/>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Tokenized mobile payment: the merchant never sees the real PAN</text>

  <!-- Provisioning band label -->
  <text x="24" y="62" font-size="12" font-weight="700" fill="#6d28d9">Provisioning (once, at card add)</text>
  <text x="24" y="242" font-size="12" font-weight="700" fill="#0f766e">Payment (every tap, dynamic)</text>

  <!-- Device / Secure Element -->
  <rect x="30" y="74" width="170" height="120" rx="10" fill="#1d4ed8"/>
  <text x="115" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Wallet + device</text>
  <text x="115" y="122" text-anchor="middle" font-size="11" fill="#dbeafe">Secure Element / HCE</text>
  <text x="115" y="142" text-anchor="middle" font-size="11" fill="#dbeafe">holds DPAN + device key</text>
  <text x="115" y="166" text-anchor="middle" font-size="10.5" fill="#bfdbfe">Real PAN entered once,</text>
  <text x="115" y="182" text-anchor="middle" font-size="10.5" fill="#bfdbfe">encrypted, then discarded</text>

  <!-- Token Service Provider -->
  <rect x="325" y="74" width="180" height="120" rx="10" fill="#6d28d9"/>
  <text x="415" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Token Service Provider</text>
  <text x="415" y="120" text-anchor="middle" font-size="11" fill="#ede9fe">(network TSP: VTS / MDES)</text>
  <text x="415" y="146" text-anchor="middle" font-size="10.5" fill="#ddd6fe">Token vault: PAN to DPAN</text>
  <text x="415" y="162" text-anchor="middle" font-size="10.5" fill="#ddd6fe">mapping + PAR</text>
  <text x="415" y="182" text-anchor="middle" font-size="10.5" fill="#ddd6fe">Approves + provisions token</text>

  <!-- Issuer -->
  <rect x="630" y="74" width="160" height="120" rx="10" fill="#b45309"/>
  <text x="710" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Issuing bank</text>
  <text x="710" y="126" text-anchor="middle" font-size="10.5" fill="#fde68a">Owns the real account</text>
  <text x="710" y="146" text-anchor="middle" font-size="10.5" fill="#fde68a">Answers "is this card</text>
  <text x="710" y="162" text-anchor="middle" font-size="10.5" fill="#fde68a">eligible to tokenize?"</text>
  <text x="710" y="182" text-anchor="middle" font-size="10.5" fill="#fde68a">(ID and V decision)</text>

  <!-- Provisioning arrows -->
  <line x1="200" y1="120" x2="323" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#mpsArrow)"/>
  <text x="262" y="112" text-anchor="middle" font-size="9.5" fill="#334155">encrypted PAN</text>
  <line x1="505" y1="110" x2="628" y2="110" stroke="#334155" stroke-width="2" marker-end="url(#mpsArrow)"/>
  <text x="566" y="102" text-anchor="middle" font-size="9.5" fill="#334155">eligibility check</text>
  <line x1="628" y1="150" x2="507" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#mpsArrow)"/>
  <text x="566" y="166" text-anchor="middle" font-size="9.5" fill="#334155">approve</text>
  <path d="M415,194 C415,214 200,214 200,168" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#mpsArrow)"/>
  <text x="300" y="228" text-anchor="middle" font-size="9.5" fill="#334155">provisions DPAN into Secure Element</text>

  <!-- divider -->
  <line x1="24" y1="252" x2="796" y2="252" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Payment row nodes -->
  <rect x="30" y="266" width="150" height="96" rx="10" fill="#1d4ed8"/>
  <text x="105" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Device at terminal</text>
  <text x="105" y="314" text-anchor="middle" font-size="10.5" fill="#dbeafe">NFC / EMV contactless</text>
  <text x="105" y="334" text-anchor="middle" font-size="10.5" fill="#dbeafe">sends DPAN +</text>
  <text x="105" y="350" text-anchor="middle" font-size="10.5" fill="#dbeafe">one-time cryptogram</text>

  <rect x="230" y="266" width="140" height="96" rx="10" fill="#0f766e"/>
  <text x="300" y="298" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Merchant /</text>
  <text x="300" y="316" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">acquirer</text>
  <text x="300" y="340" text-anchor="middle" font-size="10.5" fill="#ccfbf1">sees only DPAN,</text>
  <text x="300" y="356" text-anchor="middle" font-size="10.5" fill="#ccfbf1">never the PAN</text>

  <rect x="420" y="266" width="150" height="96" rx="10" fill="#6d28d9"/>
  <text x="495" y="298" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Network + TSP</text>
  <text x="495" y="320" text-anchor="middle" font-size="10.5" fill="#ddd6fe">verify cryptogram,</text>
  <text x="495" y="336" text-anchor="middle" font-size="10.5" fill="#ddd6fe">de-tokenize DPAN</text>
  <text x="495" y="352" text-anchor="middle" font-size="10.5" fill="#ddd6fe">back to real PAN</text>

  <rect x="620" y="266" width="170" height="96" rx="10" fill="#b45309"/>
  <text x="705" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Issuer authorizes</text>
  <text x="705" y="326" text-anchor="middle" font-size="10.5" fill="#fde68a">on the real account,</text>
  <text x="705" y="342" text-anchor="middle" font-size="10.5" fill="#fde68a">approve / decline</text>

  <!-- Payment arrows -->
  <line x1="180" y1="314" x2="228" y2="314" stroke="#334155" stroke-width="2" marker-end="url(#mpsArrow)"/>
  <line x1="370" y1="314" x2="418" y2="314" stroke="#334155" stroke-width="2" marker-end="url(#mpsArrow)"/>
  <line x1="570" y1="314" x2="618" y2="314" stroke="#334155" stroke-width="2" marker-end="url(#mpsArrow)"/>

  <!-- breach callout -->
  <rect x="230" y="378" width="140" height="40" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
  <text x="300" y="396" text-anchor="middle" font-size="9.5" fill="#be123c">Breach here leaks only a</text>
  <text x="300" y="410" text-anchor="middle" font-size="9.5" fill="#be123c">merchant-scoped DPAN: useless</text>
</svg>
