<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>

  <!-- Client -->
  <rect x="40" y="130" width="140" height="60" rx="8" fill="#1d4ed8"/>
  <text x="110" y="165" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>

  <!-- Facade / router -->
  <rect x="260" y="110" width="180" height="100" rx="8" fill="#334155"/>
  <text x="350" y="150" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">Routing Facade</text>
  <text x="350" y="172" font-size="11" fill="#cbd5e1" text-anchor="middle">per-request decision</text>

  <!-- arrow client -> facade -->
  <line x1="180" y1="160" x2="258" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- New service (growing) -->
  <rect x="520" y="50" width="160" height="70" rx="8" fill="#0f766e"/>
  <text x="600" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">New Service</text>
  <text x="600" y="100" font-size="11" fill="#ccfbf1" text-anchor="middle">growing share</text>

  <!-- Legacy service (shrinking) -->
  <rect x="520" y="210" width="160" height="55" rx="8" fill="#b45309"/>
  <text x="600" y="235" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Legacy System</text>
  <text x="600" y="253" font-size="11" fill="#ffedd5" text-anchor="middle">shrinking share</text>

  <!-- arrows facade -> both -->
  <line x1="440" y1="140" x2="518" y2="95" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="440" y1="180" x2="518" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>

  <text x="440" y="120" font-size="11" fill="#334155">migrated routes</text>
  <text x="440" y="205" font-size="11" fill="#334155">remaining routes</text>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
