<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Snowflake ID: timestamp in the high bits gives coordination-free, roughly time-ordered IDs</text>

  <!-- workers -->
  <rect x="30" y="70" width="150" height="50" rx="8" fill="#1d4ed8"/>
  <text x="105" y="92" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Worker 1</text>
  <text x="105" y="108" font-size="9" fill="#dbeafe" text-anchor="middle">own clock + worker id</text>

  <rect x="30" y="145" width="150" height="50" rx="8" fill="#0f766e"/>
  <text x="105" y="167" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Worker 2</text>
  <text x="105" y="183" font-size="9" fill="#ccfbf1" text-anchor="middle">no coordination</text>

  <rect x="30" y="220" width="150" height="50" rx="8" fill="#b45309"/>
  <text x="105" y="242" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Worker 3</text>
  <text x="105" y="258" font-size="9" fill="#fef3c7" text-anchor="middle">generates locally</text>

  <!-- bit layout -->
  <text x="470" y="70" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">64-bit ID layout</text>

  <rect x="250" y="82" width="30" height="46" rx="3" fill="#e2e8f0" stroke="#64748b"/>
  <text x="265" y="110" font-size="9" fill="#334155" text-anchor="middle">0</text>
  <text x="265" y="142" font-size="8" fill="#64748b" text-anchor="middle">1 sign</text>

  <rect x="280" y="82" width="230" height="46" rx="3" fill="#1d4ed8"/>
  <text x="395" y="110" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">timestamp (ms)</text>
  <text x="395" y="142" font-size="8" fill="#64748b" text-anchor="middle">41 bits · high bits → sortable</text>

  <rect x="510" y="82" width="90" height="46" rx="3" fill="#0f766e"/>
  <text x="555" y="110" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">worker</text>
  <text x="555" y="142" font-size="8" fill="#64748b" text-anchor="middle">10 bits</text>

  <rect x="600" y="82" width="110" height="46" rx="3" fill="#b45309"/>
  <text x="655" y="110" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">sequence</text>
  <text x="655" y="142" font-size="8" fill="#64748b" text-anchor="middle">12 bits · per-ms</text>

  <!-- worker arrows -->
  <line x1="180" y1="95" x2="248" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <line x1="180" y1="170" x2="248" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <line x1="180" y1="245" x2="248" y2="125" stroke="#64748b" stroke-width="1.5" marker-end="url(#seqArrow)"/>

  <!-- ordered output -->
  <rect x="250" y="200" width="460" height="90" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="222" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">Emitted IDs sort roughly by creation time</text>

  <rect x="275" y="235" width="120" height="34" rx="4" fill="#e2e8f0"/>
  <text x="335" y="256" font-size="9" fill="#334155" text-anchor="middle">t=100 · w1 · s0</text>
  <rect x="405" y="235" width="120" height="34" rx="4" fill="#e2e8f0"/>
  <text x="465" y="256" font-size="9" fill="#334155" text-anchor="middle">t=100 · w2 · s0</text>
  <rect x="535" y="235" width="120" height="34" rx="4" fill="#e2e8f0"/>
  <text x="595" y="256" font-size="9" fill="#334155" text-anchor="middle">t=101 · w1 · s0</text>

  <line x1="665" y1="252" x2="700" y2="252" stroke="#15803d" stroke-width="2" marker-end="url(#seqGreen)"/>
  <text x="683" y="285" font-size="9" fill="#15803d" text-anchor="middle">increasing</text>

  <defs>
    <marker id="seqArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="seqGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
  </defs>
</svg>
