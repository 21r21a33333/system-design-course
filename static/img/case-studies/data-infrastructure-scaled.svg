<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Data Infrastructure Platform: scaled design</text>

  <!-- Producers -->
  <rect x="20" y="190" width="110" height="55" rx="8" fill="#1d4ed8"/>
  <text x="75" y="213" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Producers</text>
  <text x="75" y="229" font-size="8" fill="#dbeafe" text-anchor="middle">10k sources</text>

  <!-- Ingestion partitions -->
  <rect x="170" y="140" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="245" y="161" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Ingestion Shard 1</text>
  <text x="245" y="176" font-size="8" fill="#dcfce7" text-anchor="middle">by event type</text>

  <rect x="170" y="205" width="150" height="50" rx="8" fill="#15803d"/>
  <text x="245" y="226" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Ingestion Shard 2</text>
  <text x="245" y="241" font-size="8" fill="#dcfce7" text-anchor="middle">by event type</text>

  <line x1="130" y1="205" x2="170" y2="170" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dssArrowBlue)"/>
  <line x1="130" y1="225" x2="170" y2="230" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dssArrowBlue)"/>

  <!-- Stream + batch -->
  <rect x="360" y="70" width="140" height="50" rx="8" fill="#0f766e"/>
  <text x="430" y="91" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Stream Tier</text>
  <text x="430" y="106" font-size="8" fill="#ccfbf1" text-anchor="middle">scales independently</text>

  <rect x="360" y="280" width="140" height="50" rx="8" fill="#0f766e"/>
  <text x="430" y="301" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Batch Tier</text>
  <text x="430" y="316" font-size="8" fill="#ccfbf1" text-anchor="middle">elastic, off-peak-heavy</text>

  <line x1="320" y1="160" x2="358" y2="100" stroke="#0f766e" stroke-width="2" marker-end="url(#dssArrowTeal)"/>
  <line x1="320" y1="235" x2="358" y2="300" stroke="#0f766e" stroke-width="2" marker-end="url(#dssArrowTeal)"/>

  <!-- Warehouse time-partitioned -->
  <rect x="580" y="140" width="150" height="50" rx="8" fill="#334155"/>
  <text x="655" y="161" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Warehouse</text>
  <text x="655" y="176" font-size="8" fill="#cbd5e1" text-anchor="middle">partitioned by time</text>

  <rect x="580" y="205" width="150" height="50" rx="8" fill="#334155"/>
  <text x="655" y="226" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Cold Storage Tier</text>
  <text x="655" y="241" font-size="8" fill="#cbd5e1" text-anchor="middle">older partitions</text>

  <line x1="500" y1="95" x2="578" y2="155" stroke="#0f766e" stroke-width="2" marker-end="url(#dssArrowTeal)"/>
  <line x1="500" y1="305" x2="578" y2="180" stroke="#0f766e" stroke-width="2" marker-end="url(#dssArrowTeal)"/>
  <line x1="655" y1="190" x2="655" y2="203" stroke="#334155" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#dssArrowSlate)"/>

  <!-- Dashboard cache -->
  <rect x="580" y="20" width="150" height="45" rx="8" fill="#b45309"/>
  <text x="655" y="40" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Dashboard Cache</text>
  <text x="655" y="54" font-size="8" fill="#fde68a" text-anchor="middle">~7 queries/sec avg</text>

  <line x1="655" y1="65" x2="655" y2="138" stroke="#334155" stroke-width="2" marker-end="url(#dssArrowSlate)"/>

  <rect x="20" y="280" width="290" height="120" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="300" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Backpressure flows toward</text>
  <text x="165" y="314" font-size="9" fill="#334155" text-anchor="middle">the log, never back to a</text>
  <text x="165" y="328" font-size="9" fill="#334155" text-anchor="middle">producer — batch/stream</text>
  <text x="165" y="342" font-size="9" fill="#334155" text-anchor="middle">tiers read at their own pace,</text>
  <text x="165" y="356" font-size="9" fill="#334155" text-anchor="middle">buffered by log retention,</text>
  <text x="165" y="370" font-size="9" fill="#334155" text-anchor="middle">so ingestion write latency</text>
  <text x="165" y="384" font-size="9" fill="#334155" text-anchor="middle">stays constant regardless</text>

  <defs>
    <marker id="dssArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="dssArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="dssArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
