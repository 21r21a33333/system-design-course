<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>

  <!-- Client -->
  <rect x="30" y="130" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="95" y="165" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>

  <!-- Gateway -->
  <rect x="260" y="110" width="180" height="100" rx="8" fill="#0f766e"/>
  <text x="350" y="150" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">Gateway</text>
  <text x="350" y="172" font-size="11" fill="#ccfbf1" text-anchor="middle">fan out + merge</text>

  <!-- single request/response -->
  <line x1="160" y1="150" x2="258" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrowAgg)"/>
  <text x="205" y="140" font-size="10" fill="#334155" text-anchor="middle">1 request</text>
  <line x1="258" y1="175" x2="160" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#arrowAgg)"/>
  <text x="205" y="195" font-size="10" fill="#334155" text-anchor="middle">1 merged response</text>

  <!-- Backend A -->
  <rect x="540" y="30" width="150" height="55" rx="8" fill="#334155"/>
  <text x="615" y="63" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Service A</text>

  <!-- Backend B -->
  <rect x="540" y="132" width="150" height="55" rx="8" fill="#334155"/>
  <text x="615" y="165" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Service B</text>

  <!-- Backend C -->
  <rect x="540" y="234" width="150" height="55" rx="8" fill="#334155"/>
  <text x="615" y="267" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Service C</text>

  <!-- fan-out arrows -->
  <line x1="440" y1="140" x2="538" y2="60" stroke="#334155" stroke-width="2" marker-end="url(#arrowAgg)"/>
  <line x1="440" y1="160" x2="538" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrowAgg)"/>
  <line x1="440" y1="180" x2="538" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arrowAgg)"/>

  <text x="345" y="248" font-size="11" fill="#334155" text-anchor="middle">parallel calls to backends</text>

  <defs>
    <marker id="arrowAgg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
