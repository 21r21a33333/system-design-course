<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <!-- Incoming stream -->
  <rect x="20" y="140" width="110" height="60" rx="8" fill="#1d4ed8"/>
  <text x="75" y="165" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Stream</text>
  <text x="75" y="182" font-size="9" fill="#dbeafe" text-anchor="middle">mixed keys</text>

  <!-- Router keyed by partition/session key -->
  <rect x="175" y="130" width="130" height="80" rx="8" fill="#334155"/>
  <text x="240" y="160" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Router</text>
  <text x="240" y="176" font-size="9" fill="#cbd5e1" text-anchor="middle">hash(key)</text>
  <text x="240" y="190" font-size="9" fill="#cbd5e1" text-anchor="middle">e.g. consistent hashing</text>

  <!-- Lane A: order-A, in order -->
  <rect x="345" y="35" width="330" height="70" rx="8" fill="none" stroke="#0f766e" stroke-width="1.5"/>
  <text x="360" y="25" font-size="10" fill="#0f766e">Lane: key = order-A</text>
  <rect x="355" y="55" width="45" height="30" rx="4" fill="#0f766e"/>
  <text x="377" y="75" font-size="10" fill="#ffffff" text-anchor="middle">A.1</text>
  <rect x="410" y="55" width="45" height="30" rx="4" fill="#0d9488"/>
  <text x="432" y="75" font-size="10" fill="#ffffff" text-anchor="middle">A.2</text>
  <rect x="465" y="55" width="45" height="30" rx="4" fill="#14b8a6"/>
  <text x="487" y="75" font-size="10" fill="#ffffff" text-anchor="middle">A.3</text>
  <text x="600" y="75" font-size="9" fill="#0f766e" text-anchor="middle">processed strictly in order</text>

  <!-- Lane B: order-B, in order, parallel to A -->
  <rect x="345" y="130" width="330" height="70" rx="8" fill="none" stroke="#0f766e" stroke-width="1.5"/>
  <text x="360" y="120" font-size="10" fill="#0f766e">Lane: key = order-B</text>
  <rect x="355" y="150" width="45" height="30" rx="4" fill="#0f766e"/>
  <text x="377" y="170" font-size="10" fill="#ffffff" text-anchor="middle">B.1</text>
  <rect x="410" y="150" width="45" height="30" rx="4" fill="#0d9488"/>
  <text x="432" y="170" font-size="10" fill="#ffffff" text-anchor="middle">B.2</text>
  <text x="600" y="170" font-size="9" fill="#0f766e" text-anchor="middle">runs fully in parallel with lane A</text>

  <!-- Lane C -->
  <rect x="345" y="225" width="330" height="70" rx="8" fill="none" stroke="#0f766e" stroke-width="1.5"/>
  <text x="360" y="215" font-size="10" fill="#0f766e">Lane: key = order-C</text>
  <rect x="355" y="245" width="45" height="30" rx="4" fill="#0f766e"/>
  <text x="377" y="265" font-size="10" fill="#ffffff" text-anchor="middle">C.1</text>
  <text x="600" y="265" font-size="9" fill="#0f766e" text-anchor="middle">no coordination with A or B</text>

  <!-- Stream -> Router -->
  <line x1="132" y1="170" x2="173" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrowSc)"/>

  <!-- Router -> Lanes -->
  <line x1="305" y1="150" x2="343" y2="80" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowScTeal)"/>
  <line x1="305" y1="170" x2="343" y2="170" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowScTeal)"/>
  <line x1="305" y1="190" x2="343" y2="260" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowScTeal)"/>

  <text x="360" y="320" font-size="11" fill="#64748b" text-anchor="middle">Order is preserved only within a lane (same key); unrelated keys' lanes run</text>
  <text x="360" y="334" font-size="11" fill="#64748b" text-anchor="middle">fully in parallel with no dependency on each other.</text>

  <defs>
    <marker id="arrowSc" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowScTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
