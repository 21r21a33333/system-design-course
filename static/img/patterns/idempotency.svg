<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Two requests share one idempotency key: the side effect runs exactly once</text>

  <!-- Client -->
  <rect x="30" y="120" width="120" height="100" rx="8" fill="#1d4ed8"/>
  <text x="90" y="150" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="90" y="170" font-size="9" fill="#dbeafe" text-anchor="middle">Key: abc</text>
  <text x="90" y="190" font-size="9" fill="#dbeafe" text-anchor="middle">req #1</text>
  <text x="90" y="204" font-size="9" fill="#dbeafe" text-anchor="middle">req #2 (retry)</text>

  <!-- Server / handler -->
  <rect x="290" y="115" width="150" height="110" rx="8" fill="#0f766e"/>
  <text x="365" y="150" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Handler</text>
  <text x="365" y="172" font-size="9" fill="#ccfbf1" text-anchor="middle">look up key</text>
  <text x="365" y="188" font-size="9" fill="#ccfbf1" text-anchor="middle">in dedup store</text>

  <!-- Dedup store -->
  <rect x="510" y="40" width="180" height="90" rx="8" fill="#334155"/>
  <text x="600" y="66" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Dedup store (TTL)</text>
  <text x="600" y="88" font-size="9" fill="#cbd5e1" text-anchor="middle">abc → {charge #1}</text>
  <text x="600" y="106" font-size="9" fill="#cbd5e1" text-anchor="middle">key → stored result</text>

  <!-- Side effect -->
  <rect x="510" y="210" width="180" height="90" rx="8" fill="#15803d"/>
  <text x="600" y="240" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Side effect</text>
  <text x="600" y="262" font-size="9" fill="#dcfce7" text-anchor="middle">charge card</text>
  <text x="600" y="280" font-size="9" fill="#dcfce7" text-anchor="middle">runs ONCE (req #1)</text>

  <!-- client -> handler req1 -->
  <line x1="150" y1="155" x2="288" y2="155" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#idArrowBlue)"/>
  <text x="219" y="147" font-size="9" fill="#1d4ed8" text-anchor="middle">req #1</text>

  <!-- client -> handler req2 -->
  <line x1="150" y1="195" x2="288" y2="195" stroke="#b45309" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#idArrowAmber)"/>
  <text x="219" y="212" font-size="9" fill="#b45309" text-anchor="middle">req #2 (retry)</text>

  <!-- handler -> store (miss then write) -->
  <line x1="440" y1="140" x2="508" y2="95" stroke="#334155" stroke-width="2" marker-end="url(#idArrowSlate)"/>
  <text x="474" y="108" font-size="9" fill="#334155" text-anchor="middle">read / write key</text>

  <!-- handler -> side effect (only req1) -->
  <line x1="440" y1="185" x2="508" y2="245" stroke="#15803d" stroke-width="2.5" marker-end="url(#idArrowGreen)"/>
  <text x="470" y="235" font-size="9" fill="#15803d" text-anchor="middle">only on miss</text>

  <!-- req2 short-circuits: store -> handler cached -->
  <path d="M 560 130 C 500 175, 470 175, 442 175" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#idArrowAmber)"/>
  <text x="500" y="160" font-size="9" fill="#b45309" text-anchor="middle">req #2: return cached, skip effect</text>

  <defs>
    <marker id="idArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="idArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="idArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="idArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
  </defs>
</svg>
