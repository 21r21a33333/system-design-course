<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Typeahead: scaled design</text>

  <!-- Client -->
  <rect x="20" y="180" width="120" height="55" rx="8" fill="#1d4ed8"/>
  <text x="80" y="203" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>
  <text x="80" y="219" font-size="8" fill="#dbeafe" text-anchor="middle">debounced</text>

  <!-- Load balancer -->
  <rect x="185" y="180" width="120" height="55" rx="8" fill="#1d4ed8"/>
  <text x="245" y="203" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Load Balancer</text>
  <text x="245" y="219" font-size="8" fill="#dbeafe" text-anchor="middle">/ edge cache</text>

  <line x1="140" y1="207" x2="183" y2="207" stroke="#1d4ed8" stroke-width="2" marker-end="url(#tsArrowBlue)"/>

  <!-- Suggestion service replicas -->
  <rect x="350" y="80" width="140" height="50" rx="8" fill="#15803d"/>
  <text x="420" y="101" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Suggestion Svc #1</text>
  <text x="420" y="116" font-size="8" fill="#dcfce7" text-anchor="middle">full trie replica</text>

  <rect x="350" y="180" width="140" height="50" rx="8" fill="#15803d"/>
  <text x="420" y="201" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Suggestion Svc #2</text>
  <text x="420" y="216" font-size="8" fill="#dcfce7" text-anchor="middle">full trie replica</text>

  <rect x="350" y="280" width="140" height="50" rx="8" fill="#15803d"/>
  <text x="420" y="301" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Suggestion Svc #N</text>
  <text x="420" y="316" font-size="8" fill="#dcfce7" text-anchor="middle">full trie replica</text>

  <line x1="305" y1="207" x2="348" y2="105" stroke="#1d4ed8" stroke-width="2" marker-end="url(#tsArrowBlue)"/>
  <line x1="305" y1="207" x2="348" y2="205" stroke="#1d4ed8" stroke-width="2" marker-end="url(#tsArrowBlue)"/>
  <line x1="305" y1="207" x2="348" y2="305" stroke="#1d4ed8" stroke-width="2" marker-end="url(#tsArrowBlue)"/>

  <!-- Short-prefix cache -->
  <rect x="540" y="180" width="140" height="55" rx="8" fill="#b45309"/>
  <text x="610" y="203" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Short-Prefix Cache</text>
  <text x="610" y="219" font-size="8" fill="#fde68a" text-anchor="middle">1-2 char prefixes</text>

  <line x1="490" y1="205" x2="538" y2="205" stroke="#b45309" stroke-width="2" marker-end="url(#tsArrowAmber)"/>

  <!-- Aggregation pipeline -->
  <rect x="540" y="60" width="140" height="55" rx="8" fill="#0f766e"/>
  <text x="610" y="83" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Aggregation</text>
  <text x="610" y="99" font-size="8" fill="#ccfbf1" text-anchor="middle">Pipeline (batch)</text>

  <line x1="610" y1="115" x2="490" y2="150" stroke="#0f766e" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#tsArrowTeal)"/>
  <text x="530" y="140" font-size="7" fill="#0f766e">rebuild + swap</text>

  <!-- Query log -->
  <rect x="540" y="290" width="140" height="55" rx="8" fill="#334155"/>
  <text x="610" y="313" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Query Log</text>
  <text x="610" y="329" font-size="8" fill="#cbd5e1" text-anchor="middle">append-only</text>

  <line x1="610" y1="290" x2="610" y2="118" stroke="#334155" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#tsArrowSlate)"/>

  <!-- Regional replica note -->
  <rect x="720" y="150" width="120" height="90" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="780" y="170" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Green = replicated</text>
  <text x="780" y="184" font-size="9" fill="#334155" text-anchor="middle">to every region;</text>
  <text x="780" y="198" font-size="9" fill="#334155" text-anchor="middle">identical index,</text>
  <text x="780" y="212" font-size="9" fill="#334155" text-anchor="middle">no data-locality</text>
  <text x="780" y="226" font-size="9" fill="#334155" text-anchor="middle">sharding needed</text>

  <rect x="20" y="340" width="290" height="70" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="358" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Sharding by prefix char</text>
  <text x="165" y="372" font-size="9" fill="#334155" text-anchor="middle">is kept in reserve — full</text>
  <text x="165" y="386" font-size="9" fill="#334155" text-anchor="middle">replication is simpler at</text>
  <text x="165" y="400" font-size="9" fill="#334155" text-anchor="middle">this design's data volume</text>

  <defs>
    <marker id="tsArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="tsArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="tsArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="tsArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
