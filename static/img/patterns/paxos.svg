<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <!-- Proposer -->
  <rect x="20" y="140" width="110" height="60" rx="8" fill="#1d4ed8"/>
  <text x="75" y="165" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Proposer</text>
  <text x="75" y="182" font-size="9" fill="#dbeafe" text-anchor="middle">proposal #7</text>

  <!-- Acceptors, 3 of 5 form a majority -->
  <rect x="330" y="30" width="110" height="55" rx="8" fill="#0f766e"/>
  <text x="385" y="55" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Acceptor 1</text>
  <text x="385" y="70" font-size="8" fill="#ccfbf1" text-anchor="middle">promised + accepted</text>

  <rect x="330" y="100" width="110" height="55" rx="8" fill="#0f766e"/>
  <text x="385" y="125" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Acceptor 2</text>
  <text x="385" y="140" font-size="8" fill="#ccfbf1" text-anchor="middle">promised + accepted</text>

  <rect x="330" y="170" width="110" height="55" rx="8" fill="#0f766e"/>
  <text x="385" y="195" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Acceptor 3</text>
  <text x="385" y="210" font-size="8" fill="#ccfbf1" text-anchor="middle">promised + accepted</text>

  <rect x="330" y="240" width="110" height="55" rx="8" fill="#94a3b8"/>
  <text x="385" y="265" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Acceptor 4</text>
  <text x="385" y="280" font-size="8" fill="#f1f5f9" text-anchor="middle">unreachable</text>

  <rect x="330" y="310" width="0" height="0"/>

  <!-- arrows: prepare then accept -->
  <line x1="132" y1="155" x2="328" y2="55" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrowPxBlue)"/>
  <line x1="132" y1="163" x2="328" y2="125" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrowPxBlue)"/>
  <line x1="132" y1="172" x2="328" y2="195" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrowPxBlue)"/>
  <text x="230" y="105" font-size="9" fill="#1d4ed8" text-anchor="middle">1. prepare(7)</text>

  <line x1="328" y1="65" x2="132" y2="150" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowPxGreen)"/>
  <line x1="328" y1="135" x2="132" y2="168" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowPxGreen)"/>
  <line x1="328" y1="205" x2="132" y2="185" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowPxGreen)"/>
  <text x="230" y="245" font-size="9" fill="#15803d" text-anchor="middle">2. promise (majority = quorum)</text>

  <text x="600" y="115" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="600">3. accept(7, v)</text>
  <text x="600" y="135" font-size="9" fill="#64748b" text-anchor="middle">sent to same majority;</text>
  <text x="600" y="150" font-size="9" fill="#64748b" text-anchor="middle">value chosen once a</text>
  <text x="600" y="165" font-size="9" fill="#64748b" text-anchor="middle">majority accepts it</text>

  <text x="360" y="15" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Agreement needs only a majority — one acceptor can be down</text>

  <defs>
    <marker id="arrowPxBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowPxGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
  </defs>
</svg>
