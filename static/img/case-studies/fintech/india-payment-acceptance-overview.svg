<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Merchant payment acceptance: printed QR pays over UPI, soundbox confirms audibly</text>

  <!-- Customer -->
  <rect x="20" y="70" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="85" y="95" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Customer</text>
  <text x="85" y="112" font-size="9" fill="#dbeafe" text-anchor="middle">scans QR, enters amount,</text>
  <text x="85" y="124" font-size="9" fill="#dbeafe" text-anchor="middle">approves with UPI PIN</text>

  <!-- Static QR -->
  <rect x="20" y="180" width="130" height="58" rx="8" fill="#0f766e"/>
  <text x="85" y="204" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Merchant QR</text>
  <text x="85" y="221" font-size="9" fill="#ccfbf1" text-anchor="middle">encodes payee VPA</text>

  <!-- UPI rails / NPCI -->
  <rect x="330" y="150" width="160" height="72" rx="8" fill="#6d28d9"/>
  <text x="410" y="177" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">UPI rails (NPCI)</text>
  <text x="410" y="194" font-size="9" fill="#ede9fe" text-anchor="middle">bank-to-bank transfer,</text>
  <text x="410" y="207" font-size="9" fill="#ede9fe" text-anchor="middle">see UPI case study</text>

  <!-- Merchant bank -->
  <rect x="330" y="300" width="160" height="58" rx="8" fill="#b45309"/>
  <text x="410" y="325" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Merchant bank</text>
  <text x="410" y="342" font-size="9" fill="#fde68a" text-anchor="middle">credits merchant account</text>

  <!-- Acquirer / Paytm platform -->
  <rect x="600" y="150" width="180" height="72" rx="8" fill="#be123c"/>
  <text x="690" y="173" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Acquirer platform</text>
  <text x="690" y="189" font-size="9" fill="#fecdd3" text-anchor="middle">receives paid event,</text>
  <text x="690" y="201" font-size="9" fill="#fecdd3" text-anchor="middle">dedupes, resolves device,</text>
  <text x="690" y="213" font-size="9" fill="#fecdd3" text-anchor="middle">pushes notification</text>

  <!-- Soundbox -->
  <rect x="600" y="300" width="180" height="72" rx="8" fill="#1d4ed8"/>
  <text x="690" y="325" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Soundbox (IoT)</text>
  <text x="690" y="342" font-size="9" fill="#dbeafe" text-anchor="middle">4G/2G, speaker, battery;</text>
  <text x="690" y="355" font-size="9" fill="#dbeafe" text-anchor="middle">speaks "Rupees 500 received"</text>

  <!-- Customer -> QR (scan) -->
  <line x1="85" y1="130" x2="85" y2="178" stroke="#0f766e" stroke-width="2" marker-end="url(#accArrowTeal)"/>
  <!-- Customer -> UPI rails (pays) -->
  <line x1="150" y1="90" x2="330" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#accArrowBlue)"/>
  <!-- UPI rails -> merchant bank (credit) -->
  <line x1="410" y1="222" x2="410" y2="298" stroke="#b45309" stroke-width="2" marker-end="url(#accArrowAmber)"/>
  <!-- UPI rails -> acquirer (paid event) -->
  <line x1="490" y1="186" x2="598" y2="186" stroke="#6d28d9" stroke-width="2" marker-end="url(#accArrowViolet)"/>
  <!-- acquirer -> soundbox (push) -->
  <line x1="690" y1="222" x2="690" y2="298" stroke="#be123c" stroke-width="2" marker-end="url(#accArrowRose)"/>

  <!-- note box -->
  <rect x="30" y="285" width="270" height="90" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="305" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Money moves bank-to-bank over free UPI</text>
  <text x="165" y="319" font-size="9" fill="#334155" text-anchor="middle">rails. The merchant needs no smartphone,</text>
  <text x="165" y="333" font-size="9" fill="#334155" text-anchor="middle">no card terminal, no online presence.</text>
  <text x="165" y="347" font-size="9" fill="#334155" text-anchor="middle">The soundbox is a separate confirmation</text>
  <text x="165" y="361" font-size="9" fill="#334155" text-anchor="middle">channel, not on the money path.</text>

  <defs>
    <marker id="accArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="accArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="accArrowViolet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6d28d9"/>
    </marker>
    <marker id="accArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="accArrowRose" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#be123c"/>
    </marker>
  </defs>
</svg>
