<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">At-least-once delivery + dedup on message id = effectively-once effect on the sink</text>

  <!-- source -->
  <rect x="30" y="130" width="130" height="70" rx="8" fill="#1d4ed8"/>
  <text x="95" y="160" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Source</text>
  <text x="95" y="178" font-size="9" fill="#dbeafe" text-anchor="middle">at-least-once</text>

  <!-- deliveries (with a duplicate) -->
  <line x1="160" y1="150" x2="258" y2="150" stroke="#15803d" stroke-width="2" marker-end="url(#eoArrowGreen)"/>
  <text x="209" y="143" font-size="8" fill="#15803d" text-anchor="middle">m1</text>
  <line x1="160" y1="170" x2="258" y2="170" stroke="#15803d" stroke-width="2" marker-end="url(#eoArrowGreen)"/>
  <text x="209" y="185" font-size="8" fill="#15803d" text-anchor="middle">m2</text>
  <line x1="160" y1="190" x2="258" y2="190" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#eoArrowAmber)"/>
  <text x="209" y="205" font-size="8" fill="#b45309" text-anchor="middle">m1 (redelivered)</text>

  <!-- consumer / dedup -->
  <rect x="260" y="110" width="200" height="110" rx="8" fill="#0f766e"/>
  <text x="360" y="135" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Consumer</text>
  <text x="360" y="153" font-size="9" fill="#ccfbf1" text-anchor="middle">dedup by message id</text>
  <rect x="278" y="165" width="164" height="42" rx="6" fill="#334155"/>
  <text x="360" y="182" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">seen ids: {m1, m2}</text>
  <text x="360" y="197" font-size="8" fill="#cbd5e1" text-anchor="middle">m1 already seen → skip</text>

  <!-- sink -->
  <rect x="580" y="110" width="150" height="70" rx="8" fill="#15803d"/>
  <text x="655" y="140" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Sink</text>
  <text x="655" y="158" font-size="9" fill="#dcfce7" text-anchor="middle">applied once</text>

  <line x1="460" y1="150" x2="578" y2="150" stroke="#0f766e" stroke-width="2.5" marker-end="url(#eoArrowTeal)"/>

  <!-- atomic commit note -->
  <rect x="280" y="245" width="360" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="460" y="267" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">Atomic commit</text>
  <text x="460" y="285" font-size="9" fill="#334155" text-anchor="middle">sink write + dedup record + offset advance</text>
  <text x="460" y="299" font-size="9" fill="#334155" text-anchor="middle">succeed together, or not at all</text>
  <line x1="460" y1="180" x2="460" y2="243" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <defs>
    <marker id="eoArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
    <marker id="eoArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="eoArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
