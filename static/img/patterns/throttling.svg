<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Shared resource under pressure</text>

  <!-- shared resource -->
  <rect x="290" y="40" width="180" height="55" rx="6" fill="#b45309"/>
  <text x="380" y="63" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">DB Connection Pool</text>
  <text x="380" y="80" font-size="9" fill="#fef3c7" text-anchor="middle">under load</text>

  <!-- foreground requests: protected -->
  <rect x="30" y="140" width="150" height="60" rx="8" fill="#1d4ed8"/>
  <text x="105" y="166" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Foreground</text>
  <text x="105" y="184" font-size="9" fill="#dbeafe" text-anchor="middle">latency-sensitive requests</text>

  <line x1="105" y1="140" x2="330" y2="97" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowThr1)"/>
  <text x="180" y="115" font-size="9" fill="#1d4ed8" text-anchor="middle">full priority</text>

  <!-- background work: throttled -->
  <rect x="580" y="140" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="655" y="166" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Background Job</text>
  <text x="655" y="184" font-size="9" fill="#ccfbf1" text-anchor="middle">export / reindex / retry</text>

  <line x1="655" y1="140" x2="440" y2="97" stroke="#0f766e" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowThrTeal)"/>
  <text x="580" y="115" font-size="9" fill="#0f766e" text-anchor="middle">throttled: slower pace</text>

  <!-- throttle control dial -->
  <rect x="580" y="230" width="150" height="55" rx="8" fill="#334155"/>
  <text x="655" y="253" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Throttle Control</text>
  <text x="655" y="270" font-size="9" fill="#cbd5e1" text-anchor="middle">reads pool pressure, turns dial</text>

  <line x1="440" y1="70" x2="580" y2="255" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowThrSlate)"/>

  <!-- contrast: rate limiter reject box -->
  <rect x="30" y="230" width="200" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="130" y="252" font-size="10" fill="#64748b" text-anchor="middle">Rate limiting (contrast): fixed</text>
  <text x="130" y="266" font-size="10" fill="#64748b" text-anchor="middle">per-client quota, hard reject (429)</text>
  <text x="130" y="280" font-size="10" fill="#64748b" text-anchor="middle">— not resource-pressure driven</text>

  <defs>
    <marker id="arrowThr1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowThrTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowThrSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
