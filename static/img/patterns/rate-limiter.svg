<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Token bucket at the edge: refill at a steady rate, admit while tokens remain</text>

  <!-- clients -->
  <rect x="30" y="70" width="120" height="44" rx="8" fill="#1d4ed8"/>
  <text x="90" y="90" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Client A</text>
  <text x="90" y="105" font-size="9" fill="#dbeafe" text-anchor="middle">api key a</text>

  <rect x="30" y="150" width="120" height="44" rx="8" fill="#1d4ed8"/>
  <text x="90" y="170" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Client B</text>
  <text x="90" y="185" font-size="9" fill="#dbeafe" text-anchor="middle">api key b</text>

  <rect x="30" y="230" width="120" height="44" rx="8" fill="#dc2626"/>
  <text x="90" y="250" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Client C</text>
  <text x="90" y="265" font-size="9" fill="#fee2e2" text-anchor="middle">runaway retries</text>

  <!-- limiter / gateway -->
  <rect x="250" y="105" width="180" height="130" rx="10" fill="#0f766e"/>
  <text x="340" y="132" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Rate Limiter</text>
  <text x="340" y="149" font-size="9" fill="#ccfbf1" text-anchor="middle">(at gateway / edge)</text>
  <!-- bucket -->
  <rect x="285" y="162" width="110" height="52" rx="4" fill="#ffffff" stroke="#ccfbf1" stroke-width="1.5"/>
  <circle cx="305" cy="188" r="6" fill="#b45309"/>
  <circle cx="323" cy="188" r="6" fill="#b45309"/>
  <circle cx="341" cy="188" r="6" fill="#b45309"/>
  <circle cx="359" cy="200" r="6" fill="#e2e8f0"/>
  <circle cx="377" cy="200" r="6" fill="#e2e8f0"/>
  <text x="340" y="152" font-size="8" fill="#0f766e" text-anchor="middle">per-key bucket</text>

  <!-- refill note -->
  <text x="340" y="255" font-size="9" fill="#0f766e" text-anchor="middle">+1 token / interval</text>

  <!-- client arrows to limiter -->
  <line x1="150" y1="92" x2="248" y2="140" stroke="#15803d" stroke-width="2" marker-end="url(#rlGreen)"/>
  <line x1="150" y1="172" x2="248" y2="170" stroke="#15803d" stroke-width="2" marker-end="url(#rlGreen)"/>
  <line x1="150" y1="252" x2="248" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#rlRed)"/>

  <!-- allowed to backend -->
  <rect x="580" y="90" width="150" height="60" rx="8" fill="#334155"/>
  <text x="655" y="116" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Backend</text>
  <text x="655" y="134" font-size="9" fill="#cbd5e1" text-anchor="middle">protected capacity</text>

  <line x1="430" y1="150" x2="578" y2="120" stroke="#15803d" stroke-width="2.5" marker-end="url(#rlGreen)"/>
  <text x="505" y="128" font-size="9" fill="#15803d" text-anchor="middle">token left → forward</text>

  <!-- rejected -->
  <rect x="580" y="200" width="150" height="60" rx="8" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="655" y="226" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">429 rejected</text>
  <text x="655" y="244" font-size="9" fill="#dc2626" text-anchor="middle">Retry-After: 2s</text>

  <line x1="430" y1="195" x2="578" y2="225" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#rlRed)"/>
  <text x="505" y="230" font-size="9" fill="#dc2626" text-anchor="middle">empty → reject early</text>

  <defs>
    <marker id="rlGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
    <marker id="rlRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
