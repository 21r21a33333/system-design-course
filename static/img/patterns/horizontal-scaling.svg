<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="26" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Scale OUT: add more identical, stateless instances behind a load balancer</text>

  <!-- Clients -->
  <rect x="24" y="140" width="110" height="56" rx="8" fill="#1d4ed8"/>
  <text x="79" y="164" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Clients</text>
  <text x="79" y="182" font-size="9" fill="#dbeafe" text-anchor="middle">requests</text>

  <!-- Load balancer -->
  <rect x="180" y="132" width="120" height="72" rx="8" fill="#1d4ed8"/>
  <text x="240" y="160" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Load</text>
  <text x="240" y="176" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Balancer</text>
  <text x="240" y="194" font-size="9" fill="#dbeafe" text-anchor="middle">any → any</text>

  <line x1="134" y1="168" x2="178" y2="168" stroke="#334155" stroke-width="2" marker-end="url(#hsArrow)"/>

  <!-- Instances (existing = teal) -->
  <rect x="360" y="60" width="120" height="46" rx="8" fill="#0f766e"/>
  <text x="420" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Instance 1</text>
  <text x="420" y="97" font-size="8.5" fill="#ccfbf1" text-anchor="middle">stateless</text>

  <rect x="360" y="116" width="120" height="46" rx="8" fill="#0f766e"/>
  <text x="420" y="138" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Instance 2</text>
  <text x="420" y="153" font-size="8.5" fill="#ccfbf1" text-anchor="middle">stateless</text>

  <rect x="360" y="172" width="120" height="46" rx="8" fill="#0f766e"/>
  <text x="420" y="194" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Instance 3</text>
  <text x="420" y="209" font-size="8.5" fill="#ccfbf1" text-anchor="middle">stateless</text>

  <!-- Added instance (green) -->
  <rect x="360" y="228" width="120" height="46" rx="8" fill="#15803d" stroke="#166534" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="420" y="250" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Instance 4</text>
  <text x="420" y="265" font-size="8.5" fill="#dcfce7" text-anchor="middle">added capacity</text>

  <line x1="300" y1="150" x2="358" y2="83" stroke="#0f766e" stroke-width="1.8" marker-end="url(#hsArrowT)"/>
  <line x1="300" y1="160" x2="358" y2="139" stroke="#0f766e" stroke-width="1.8" marker-end="url(#hsArrowT)"/>
  <line x1="300" y1="176" x2="358" y2="195" stroke="#0f766e" stroke-width="1.8" marker-end="url(#hsArrowT)"/>
  <line x1="300" y1="186" x2="358" y2="251" stroke="#15803d" stroke-width="1.8" marker-end="url(#hsArrowG)"/>

  <!-- Shared state store -->
  <rect x="548" y="116" width="148" height="102" rx="8" fill="#334155"/>
  <text x="622" y="150" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Shared state tier</text>
  <text x="622" y="170" font-size="9" fill="#cbd5e1" text-anchor="middle">sessions, cache,</text>
  <text x="622" y="184" font-size="9" fill="#cbd5e1" text-anchor="middle">sharded database</text>
  <text x="622" y="204" font-size="8.5" fill="#94a3b8" text-anchor="middle">state lives here, not in-process</text>

  <line x1="480" y1="139" x2="546" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#hsArrowS)"/>
  <line x1="480" y1="195" x2="546" y2="184" stroke="#64748b" stroke-width="1.6" marker-end="url(#hsArrowS)"/>

  <rect x="24" y="296" width="672" height="30" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="315" font-size="9" fill="#334155" text-anchor="middle">No hard ceiling — but shared bottlenecks + coordination bend the curve (Universal Scalability Law)</text>

  <defs>
    <marker id="hsArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
    <marker id="hsArrowT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="hsArrowG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/></marker>
    <marker id="hsArrowS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
  </defs>
</svg>
