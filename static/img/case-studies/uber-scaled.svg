<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Uber: scaled design</text>

  <!-- clients -->
  <rect x="20" y="150" width="120" height="50" rx="8" fill="#1d4ed8"/>
  <text x="80" y="171" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Rider Clients</text>
  <text x="80" y="187" font-size="8" fill="#dbeafe" text-anchor="middle">millions, per city</text>

  <rect x="20" y="220" width="120" height="50" rx="8" fill="#1d4ed8"/>
  <text x="80" y="241" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Driver Clients</text>
  <text x="80" y="257" font-size="8" fill="#dbeafe" text-anchor="middle">~4s ping interval</text>

  <!-- edge / LB -->
  <rect x="175" y="185" width="110" height="50" rx="8" fill="#1d4ed8"/>
  <text x="230" y="206" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Load Balancer</text>
  <text x="230" y="222" font-size="8" fill="#dbeafe" text-anchor="middle">per-region edge</text>

  <line x1="140" y1="175" x2="173" y2="200" stroke="#1d4ed8" stroke-width="2" marker-end="url(#usArrowBlue)"/>
  <line x1="140" y1="245" x2="173" y2="220" stroke="#1d4ed8" stroke-width="2" marker-end="url(#usArrowBlue)"/>

  <!-- Message queue for ping ingest -->
  <rect x="320" y="185" width="130" height="50" rx="8" fill="#15803d"/>
  <text x="385" y="206" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Ping Queue</text>
  <text x="385" y="222" font-size="8" fill="#dcfce7" text-anchor="middle">decouples ingest rate</text>

  <line x1="285" y1="210" x2="318" y2="210" stroke="#15803d" stroke-width="2" marker-end="url(#usArrowGreen)"/>

  <!-- Dispatch region A -->
  <rect x="490" y="70" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="565" y="93" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Dispatch — City A</text>
  <text x="565" y="109" font-size="8" fill="#ccfbf1" text-anchor="middle">independent deployment</text>

  <!-- Dispatch region B -->
  <rect x="490" y="140" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="565" y="163" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Dispatch — City B</text>
  <text x="565" y="179" font-size="8" fill="#ccfbf1" text-anchor="middle">independent deployment</text>

  <text x="565" y="212" font-size="10" fill="#64748b" text-anchor="middle">... per city ...</text>

  <line x1="450" y1="205" x2="488" y2="105" stroke="#15803d" stroke-width="2" marker-end="url(#usArrowGreen)"/>
  <line x1="450" y1="212" x2="488" y2="170" stroke="#15803d" stroke-width="2" marker-end="url(#usArrowGreen)"/>

  <!-- Location index shards -->
  <rect x="700" y="55" width="140" height="45" rx="8" fill="#b45309"/>
  <text x="770" y="74" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Location Shard A1</text>
  <text x="770" y="89" font-size="8" fill="#fde68a" text-anchor="middle">geo-cell range</text>

  <rect x="700" y="105" width="140" height="45" rx="8" fill="#b45309"/>
  <text x="770" y="124" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Location Shard A2</text>
  <text x="770" y="139" font-size="8" fill="#fde68a" text-anchor="middle">dense downtown cells</text>

  <rect x="700" y="155" width="140" height="45" rx="8" fill="#b45309"/>
  <text x="770" y="174" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Location Shard B1</text>
  <text x="770" y="189" font-size="8" fill="#fde68a" text-anchor="middle">geo-cell range</text>

  <line x1="640" y1="95" x2="698" y2="75" stroke="#0f766e" stroke-width="2" marker-end="url(#usArrowTeal)"/>
  <line x1="640" y1="100" x2="698" y2="128" stroke="#0f766e" stroke-width="2" marker-end="url(#usArrowTeal)"/>
  <line x1="640" y1="165" x2="698" y2="178" stroke="#0f766e" stroke-width="2" marker-end="url(#usArrowTeal)"/>

  <!-- Supply/demand materialized view -->
  <rect x="490" y="245" width="150" height="55" rx="8" fill="#15803d"/>
  <text x="565" y="268" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Per-Cell Supply/</text>
  <text x="565" y="283" font-size="9" fill="#dcfce7" text-anchor="middle">Demand View</text>

  <line x1="565" y1="195" x2="565" y2="243" stroke="#15803d" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#usArrowGreen)"/>
  <text x="600" y="222" font-size="8" fill="#15803d">feeds pricing</text>

  <!-- Trip store, sharded, with replicas -->
  <rect x="320" y="330" width="140" height="55" rx="8" fill="#334155"/>
  <text x="390" y="352" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Trip Store</text>
  <text x="390" y="368" font-size="8" fill="#cbd5e1" text-anchor="middle">sharded by trip_id</text>

  <rect x="490" y="330" width="140" height="55" rx="8" fill="#15803d"/>
  <text x="560" y="352" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Read Replicas</text>
  <text x="560" y="368" font-size="8" fill="#dcfce7" text-anchor="middle">trip status, history</text>

  <line x1="460" y1="357" x2="488" y2="357" stroke="#15803d" stroke-width="2" marker-end="url(#usArrowGreen)"/>

  <line x1="565" y1="195" x2="390" y2="328" stroke="#0f766e" stroke-width="2" marker-end="url(#usArrowTeal)"/>
  <text x="440" y="300" font-size="8" fill="#0f766e">accept + write trip</text>

  <rect x="20" y="330" width="270" height="80" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="155" y="350" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Green = scaled/redundant additions</text>
  <text x="155" y="366" font-size="9" fill="#334155" text-anchor="middle">Queue absorbs ping bursts; per-city</text>
  <text x="155" y="380" font-size="9" fill="#334155" text-anchor="middle">dispatch and location shards keep</text>
  <text x="155" y="394" font-size="9" fill="#334155" text-anchor="middle">an outage's blast radius local</text>

  <defs>
    <marker id="usArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="usArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="usArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
  </defs>
</svg>
