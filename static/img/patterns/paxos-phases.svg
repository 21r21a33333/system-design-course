<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="22" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Basic Paxos: two rounds, each needing a majority</text>

  <!-- Lifelines -->
  <text x="90" y="52" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="600">Proposer</text>
  <text x="90" y="66" font-size="8" fill="#64748b" text-anchor="middle">proposal #7</text>
  <line x1="90" y1="74" x2="90" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="330" y="52" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="600">Acceptors (majority)</text>
  <line x1="330" y1="74" x2="330" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="410" y1="74" x2="410" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="490" y1="74" x2="490" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="620" y="52" font-size="11" fill="#b45309" text-anchor="middle" font-weight="600">Learners</text>
  <line x1="620" y1="74" x2="620" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Phase 1: Prepare -->
  <text x="20" y="100" font-size="9" fill="#334155" font-weight="600">Phase 1</text>
  <line x1="90" y1="108" x2="486" y2="108" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#pxaBlue)"/>
  <text x="250" y="102" font-size="9" fill="#1d4ed8" text-anchor="middle">Prepare(7)</text>

  <line x1="486" y1="132" x2="94" y2="132" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#pxaGreen)"/>
  <text x="250" y="126" font-size="9" fill="#15803d" text-anchor="middle">Promise(7) + any accepted value</text>
  <text x="250" y="152" font-size="8" fill="#64748b" text-anchor="middle">acceptors promise: reject anything numbered &lt; 7</text>

  <!-- Phase 2: Accept -->
  <text x="20" y="196" font-size="9" fill="#334155" font-weight="600">Phase 2</text>
  <line x1="90" y1="204" x2="486" y2="204" stroke="#0f766e" stroke-width="1.8" marker-end="url(#pxaTeal)"/>
  <text x="250" y="198" font-size="9" fill="#0f766e" text-anchor="middle">Accept(7, v)</text>
  <text x="250" y="222" font-size="8" fill="#64748b" text-anchor="middle">v = highest already-accepted value, else proposer's own</text>

  <line x1="486" y1="246" x2="94" y2="246" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#pxaGreen)"/>
  <text x="250" y="240" font-size="9" fill="#15803d" text-anchor="middle">Accepted(7, v)</text>

  <!-- Chosen -> learners -->
  <line x1="490" y1="270" x2="616" y2="270" stroke="#b45309" stroke-width="1.8" marker-end="url(#pxaAmber)"/>
  <text x="555" y="264" font-size="8" fill="#b45309" text-anchor="middle">value chosen</text>

  <text x="360" y="322" font-size="10" fill="#334155" text-anchor="middle">Once a majority Accepts the same v, v is chosen permanently — majorities always overlap</text>

  <defs>
    <marker id="pxaBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="pxaGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <marker id="pxaTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="pxaAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
