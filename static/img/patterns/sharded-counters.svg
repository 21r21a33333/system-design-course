<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Split one hot counter into N shards: writes fan out, reads sum</text>

  <!-- writers -->
  <rect x="30" y="70" width="110" height="40" rx="8" fill="#1d4ed8"/>
  <text x="85" y="94" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">+1 event</text>
  <rect x="30" y="130" width="110" height="40" rx="8" fill="#1d4ed8"/>
  <text x="85" y="154" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">+1 event</text>
  <rect x="30" y="190" width="110" height="40" rx="8" fill="#1d4ed8"/>
  <text x="85" y="214" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">+1 event</text>
  <rect x="30" y="250" width="110" height="40" rx="8" fill="#1d4ed8"/>
  <text x="85" y="274" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">+1 event</text>
  <text x="85" y="55" font-size="9" fill="#64748b" text-anchor="middle">concurrent writers</text>

  <!-- selector -->
  <text x="230" y="55" font-size="9" fill="#64748b" text-anchor="middle">random / hash(key) % N</text>

  <!-- shards -->
  <rect x="300" y="70" width="150" height="40" rx="6" fill="#0f766e"/>
  <text x="375" y="94" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">shard 0 = 4210</text>
  <rect x="300" y="130" width="150" height="40" rx="6" fill="#0f766e"/>
  <text x="375" y="154" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">shard 1 = 4188</text>
  <rect x="300" y="190" width="150" height="40" rx="6" fill="#0f766e"/>
  <text x="375" y="214" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">shard 2 = 4205</text>
  <rect x="300" y="250" width="150" height="40" rx="6" fill="#0f766e"/>
  <text x="375" y="274" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">shard N = 4197</text>
  <text x="375" y="55" font-size="9" fill="#64748b" text-anchor="middle">N independent cells (no contention)</text>

  <!-- write arrows -->
  <line x1="140" y1="90" x2="298" y2="90" stroke="#15803d" stroke-width="1.8" marker-end="url(#shGreen)"/>
  <line x1="140" y1="150" x2="298" y2="150" stroke="#15803d" stroke-width="1.8" marker-end="url(#shGreen)"/>
  <line x1="140" y1="210" x2="298" y2="210" stroke="#15803d" stroke-width="1.8" marker-end="url(#shGreen)"/>
  <line x1="140" y1="270" x2="298" y2="270" stroke="#15803d" stroke-width="1.8" marker-end="url(#shGreen)"/>

  <!-- sum on read -->
  <path d="M450 90 L520 160" stroke="#b45309" stroke-width="1.6"/>
  <path d="M450 150 L520 168" stroke="#b45309" stroke-width="1.6"/>
  <path d="M450 210 L520 176" stroke="#b45309" stroke-width="1.6"/>
  <path d="M450 270 L520 184" stroke="#b45309" stroke-width="1.6"/>

  <rect x="520" y="150" width="90" height="44" rx="8" fill="#b45309"/>
  <text x="565" y="170" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Σ sum</text>
  <text x="565" y="186" font-size="9" fill="#fef3c7" text-anchor="middle">O(N) read</text>

  <!-- cached total -->
  <rect x="640" y="150" width="90" height="44" rx="8" fill="#334155"/>
  <text x="685" y="170" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">cached total</text>
  <text x="685" y="186" font-size="9" fill="#cbd5e1" text-anchor="middle">refreshed periodically</text>

  <line x1="610" y1="172" x2="638" y2="172" stroke="#334155" stroke-width="1.8" marker-end="url(#shSlate)"/>

  <rect x="300" y="300" width="430" height="28" rx="6" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <text x="515" y="318" font-size="9" fill="#334155" text-anchor="middle">more shards → less write contention, but a costlier sum on read</text>

  <defs>
    <marker id="shGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
    <marker id="shSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
