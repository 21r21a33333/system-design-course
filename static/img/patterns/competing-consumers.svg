<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>

  <!-- Producer -->
  <rect x="30" y="125" width="120" height="70" rx="8" fill="#1d4ed8"/>
  <text x="90" y="155" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Producer</text>
  <text x="90" y="173" font-size="10" fill="#dbeafe" text-anchor="middle">enqueues work</text>

  <!-- Queue -->
  <rect x="200" y="110" width="150" height="100" rx="8" fill="#0f766e"/>
  <text x="275" y="135" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Queue</text>
  <rect x="215" y="145" width="35" height="20" rx="3" fill="#ccfbf1"/>
  <text x="232" y="159" font-size="9" fill="#0f766e" text-anchor="middle">m4</text>
  <rect x="255" y="145" width="35" height="20" rx="3" fill="#ccfbf1"/>
  <text x="272" y="159" font-size="9" fill="#0f766e" text-anchor="middle">m3</text>
  <rect x="295" y="145" width="35" height="20" rx="3" fill="#ccfbf1"/>
  <text x="312" y="159" font-size="9" fill="#0f766e" text-anchor="middle">m2</text>
  <text x="275" y="185" font-size="9" fill="#ccfbf1" text-anchor="middle">each message goes to</text>
  <text x="275" y="197" font-size="9" fill="#ccfbf1" text-anchor="middle">exactly one consumer</text>

  <!-- Consumers -->
  <rect x="500" y="40" width="160" height="55" rx="8" fill="#1d4ed8"/>
  <text x="580" y="63" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Consumer A</text>
  <text x="580" y="80" font-size="9" fill="#dbeafe" text-anchor="middle">claimed m1</text>

  <rect x="500" y="132" width="160" height="55" rx="8" fill="#1d4ed8"/>
  <text x="580" y="155" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Consumer B</text>
  <text x="580" y="172" font-size="9" fill="#dbeafe" text-anchor="middle">idle, polling</text>

  <rect x="500" y="224" width="160" height="55" rx="8" fill="#1d4ed8"/>
  <text x="580" y="247" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Consumer C</text>
  <text x="580" y="264" font-size="9" fill="#dbeafe" text-anchor="middle">idle, polling</text>

  <!-- Producer -> Queue -->
  <line x1="152" y1="160" x2="197" y2="160" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowCc)"/>

  <!-- Queue -> Consumer A (only one gets each message) -->
  <line x1="352" y1="150" x2="497" y2="70" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrowCc)"/>
  <text x="430" y="95" font-size="9" fill="#0f766e" text-anchor="middle">m1 delivered once</text>

  <!-- Queue -> Consumer B/C dashed (competing, not yet claimed) -->
  <line x1="352" y1="165" x2="497" y2="158" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowCcGray)"/>
  <line x1="352" y1="178" x2="497" y2="245" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowCcGray)"/>
  <text x="430" y="215" font-size="9" fill="#64748b" text-anchor="middle">competing for next message</text>

  <text x="360" y="290" font-size="11" fill="#64748b" text-anchor="middle">Unlike pub-sub fan-out, each message is claimed by exactly one consumer —</text>
  <text x="360" y="306" font-size="11" fill="#64748b" text-anchor="middle">adding consumers scales throughput, it doesn't multiply delivery.</text>

  <defs>
    <marker id="arrowCc" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowCcGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
