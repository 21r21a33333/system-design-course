<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <!-- Before: dedicated, mostly-idle hosts -->
  <text x="150" y="24" font-size="11" fill="#b45309" text-anchor="middle" font-weight="600">Before: one dedicated, mostly-idle host per workload</text>
  <rect x="30" y="40" width="90" height="70" rx="8" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <rect x="40" y="85" width="70" height="18" rx="3" fill="#b45309"/>
  <text x="75" y="98" font-size="8" fill="#ffffff" text-anchor="middle">Task A</text>
  <text x="75" y="60" font-size="8" fill="#b45309" text-anchor="middle">mostly idle</text>

  <rect x="140" y="40" width="90" height="70" rx="8" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <rect x="150" y="85" width="70" height="18" rx="3" fill="#b45309"/>
  <text x="185" y="98" font-size="8" fill="#ffffff" text-anchor="middle">Task B</text>
  <text x="185" y="60" font-size="8" fill="#b45309" text-anchor="middle">mostly idle</text>

  <rect x="250" y="40" width="90" height="70" rx="8" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <rect x="260" y="85" width="70" height="18" rx="3" fill="#b45309"/>
  <text x="295" y="98" font-size="8" fill="#ffffff" text-anchor="middle">Task C</text>
  <text x="295" y="60" font-size="8" fill="#b45309" text-anchor="middle">mostly idle</text>

  <text x="420" y="80" font-size="16" fill="#94a3b8" text-anchor="middle">&#8594;</text>

  <!-- After: consolidated shared host -->
  <text x="600" y="24" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="600">After: consolidated on shared compute</text>
  <rect x="470" y="40" width="260" height="90" rx="10" fill="#0f766e"/>
  <text x="600" y="58" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Shared Host</text>
  <rect x="485" y="68" width="70" height="45" rx="4" fill="#0d9488"/>
  <text x="520" y="94" font-size="9" fill="#ffffff" text-anchor="middle">Task A</text>
  <rect x="565" y="68" width="70" height="45" rx="4" fill="#0d9488"/>
  <text x="600" y="94" font-size="9" fill="#ffffff" text-anchor="middle">Task B</text>
  <rect x="645" y="68" width="70" height="45" rx="4" fill="#0d9488"/>
  <text x="680" y="94" font-size="9" fill="#ffffff" text-anchor="middle">Task C</text>
  <text x="600" y="122" font-size="8" fill="#ccfbf1" text-anchor="middle">utilization: much higher</text>

  <!-- noisy neighbor risk -->
  <rect x="470" y="170" width="260" height="110" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="600" y="192" font-size="10" fill="#b45309" text-anchor="middle" font-weight="600">Noisy neighbor risk</text>
  <text x="600" y="212" font-size="9" fill="#334155" text-anchor="middle">Task B spikes CPU/memory/IO</text>
  <text x="600" y="228" font-size="9" fill="#334155" text-anchor="middle">and degrades A and C too —</text>
  <text x="600" y="244" font-size="9" fill="#334155" text-anchor="middle">unless quotas/limits are</text>
  <text x="600" y="260" font-size="9" fill="#334155" text-anchor="middle">enforced per workload</text>
  <line x1="600" y1="113" x2="600" y2="168" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- quota enforcement box -->
  <rect x="30" y="170" width="380" height="110" rx="8" fill="#334155"/>
  <text x="220" y="192" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Resource quotas per workload</text>
  <text x="220" y="214" font-size="9" fill="#cbd5e1" text-anchor="middle">CPU shares, memory limits, I/O throttling</text>
  <text x="220" y="232" font-size="9" fill="#cbd5e1" text-anchor="middle">cap what any single workload can consume,</text>
  <text x="220" y="250" font-size="9" fill="#cbd5e1" text-anchor="middle">bounding the blast radius of a spike and</text>
  <text x="220" y="266" font-size="9" fill="#cbd5e1" text-anchor="middle">keeping the consolidation win intact</text>

  <line x1="410" y1="220" x2="468" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrowCrc)"/>
  <text x="440" y="210" font-size="8" fill="#334155" text-anchor="middle">mitigates</text>

  <defs>
    <marker id="arrowCrc" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
