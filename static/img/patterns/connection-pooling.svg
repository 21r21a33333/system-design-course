<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Many requests reuse a bounded pool of connections; overflow waits in a queue</text>

  <!-- Requests -->
  <text x="90" y="52" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="600">Requests</text>
  <rect x="30" y="62" width="120" height="26" rx="5" fill="#1d4ed8"/>
  <text x="90" y="79" font-size="9" fill="#ffffff" text-anchor="middle">req 1 (in use)</text>
  <rect x="30" y="94" width="120" height="26" rx="5" fill="#1d4ed8"/>
  <text x="90" y="111" font-size="9" fill="#ffffff" text-anchor="middle">req 2 (in use)</text>
  <rect x="30" y="126" width="120" height="26" rx="5" fill="#1d4ed8"/>
  <text x="90" y="143" font-size="9" fill="#ffffff" text-anchor="middle">req 3 (in use)</text>

  <!-- Wait queue -->
  <rect x="30" y="176" width="120" height="120" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="90" y="196" font-size="9" fill="#b45309" text-anchor="middle" font-weight="600">Wait queue</text>
  <rect x="42" y="206" width="96" height="22" rx="4" fill="#fdba74"/>
  <text x="90" y="221" font-size="8" fill="#7c2d12" text-anchor="middle">req 4 (waiting)</text>
  <rect x="42" y="234" width="96" height="22" rx="4" fill="#fdba74"/>
  <text x="90" y="249" font-size="8" fill="#7c2d12" text-anchor="middle">req 5 (waiting)</text>
  <text x="90" y="278" font-size="8" fill="#b45309" text-anchor="middle">block up to</text>
  <text x="90" y="290" font-size="8" fill="#b45309" text-anchor="middle">acquire timeout</text>

  <!-- Pool -->
  <rect x="270" y="60" width="200" height="236" rx="10" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="370" y="82" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="600">Connection Pool (max = 3)</text>
  <rect x="290" y="96" width="160" height="30" rx="5" fill="#0f766e"/>
  <text x="370" y="115" font-size="9" fill="#ffffff" text-anchor="middle">conn A — leased</text>
  <rect x="290" y="132" width="160" height="30" rx="5" fill="#0f766e"/>
  <text x="370" y="151" font-size="9" fill="#ffffff" text-anchor="middle">conn B — leased</text>
  <rect x="290" y="168" width="160" height="30" rx="5" fill="#0f766e"/>
  <text x="370" y="187" font-size="9" fill="#ffffff" text-anchor="middle">conn C — leased</text>
  <text x="370" y="224" font-size="8" fill="#334155" text-anchor="middle">acquire() → lease · release() → return</text>
  <text x="370" y="240" font-size="8" fill="#334155" text-anchor="middle">idle conns validated before reuse</text>
  <text x="370" y="256" font-size="8" fill="#334155" text-anchor="middle">leak detection reclaims unreturned leases</text>

  <!-- Backend -->
  <rect x="590" y="120" width="140" height="90" rx="8" fill="#334155"/>
  <text x="660" y="158" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Database</text>
  <text x="660" y="178" font-size="8" fill="#cbd5e1" text-anchor="middle">hard cap on total</text>
  <text x="660" y="190" font-size="8" fill="#cbd5e1" text-anchor="middle">connections</text>

  <!-- arrows: requests to pool -->
  <line x1="150" y1="75" x2="268" y2="111" stroke="#1d4ed8" stroke-width="2" marker-end="url(#cpBlue)"/>
  <line x1="150" y1="139" x2="268" y2="147" stroke="#1d4ed8" stroke-width="2" marker-end="url(#cpBlue)"/>
  <!-- queue to pool -->
  <line x1="150" y1="217" x2="268" y2="183" stroke="#b45309" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#cpAmber)"/>

  <!-- pool to backend -->
  <line x1="470" y1="150" x2="588" y2="160" stroke="#0f766e" stroke-width="2.5" marker-end="url(#cpTeal)"/>
  <text x="530" y="145" font-size="8" fill="#0f766e" text-anchor="middle">3 real conns</text>

  <rect x="270" y="308" width="460" height="24" rx="6" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <text x="500" y="324" font-size="8" fill="#334155" text-anchor="middle">per-instance pool × instance count = total load on the database — size for the sum, not one box</text>

  <defs>
    <marker id="cpBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
    <marker id="cpAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
    <marker id="cpTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
  </defs>
</svg>
