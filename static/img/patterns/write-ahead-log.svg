<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>

  <text x="380" y="26" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Append to the log and fsync first, then apply — a crash is recovered by replay</text>

  <!-- lane labels -->
  <text x="70" y="92" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Client</text>
  <text x="70" y="176" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">WAL (disk)</text>
  <text x="70" y="262" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Data structure</text>

  <!-- step 1: write request -->
  <rect x="140" y="60" width="150" height="52" rx="8" fill="#1d4ed8"/>
  <text x="215" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">1. write(x=90)</text>
  <text x="215" y="99" font-size="9" fill="#dbeafe" text-anchor="middle">not yet acked</text>

  <!-- step 2: append + fsync -->
  <rect x="140" y="148" width="150" height="52" rx="8" fill="#0f766e"/>
  <text x="215" y="170" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">2. append+fsync</text>
  <text x="215" y="187" font-size="9" fill="#ccfbf1" text-anchor="middle">now durable → ack</text>
  <line x1="215" y1="112" x2="215" y2="146" stroke="#334155" stroke-width="1.6" marker-end="url(#walArrow)"/>

  <!-- step 3: apply -->
  <rect x="330" y="234" width="150" height="52" rx="8" fill="#0f766e"/>
  <text x="405" y="256" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">3. apply x=90</text>
  <text x="405" y="273" font-size="9" fill="#ccfbf1" text-anchor="middle">in-memory / B-tree</text>
  <line x1="290" y1="180" x2="328" y2="252" stroke="#334155" stroke-width="1.6" marker-end="url(#walArrow)"/>

  <!-- crash bolt -->
  <path d="M 545 232 l -22 34 l 14 0 l -10 30 l 30 -40 l -14 0 l 12 -24 Z" fill="#dc2626"/>
  <text x="548" y="312" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="600">CRASH</text>
  <text x="548" y="326" font-size="8.5" fill="#dc2626" text-anchor="middle">table lost</text>

  <!-- recovery -->
  <rect x="600" y="148" width="130" height="52" rx="8" fill="#15803d"/>
  <text x="665" y="170" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">4. recover()</text>
  <text x="665" y="187" font-size="9" fill="#dcfce7" text-anchor="middle">replay the log</text>
  <line x1="290" y1="174" x2="598" y2="174" stroke="#15803d" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#walArrowGreen)"/>

  <rect x="600" y="234" width="130" height="52" rx="8" fill="#15803d"/>
  <text x="665" y="256" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">x=90 restored</text>
  <text x="665" y="273" font-size="9" fill="#dcfce7" text-anchor="middle">state reconstructed</text>
  <line x1="665" y1="200" x2="665" y2="232" stroke="#15803d" stroke-width="1.6" marker-end="url(#walArrowGreen)"/>

  <!-- log tape -->
  <text x="380" y="342" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">Sequential append-only log (each record carries an LSN; checkpoints bound how far replay must go)</text>
  <g>
    <rect x="120" y="352" width="90" height="22" rx="3" fill="#0f766e"/><text x="165" y="367" font-size="9" fill="#ffffff" text-anchor="middle">LSN 41 set</text>
    <rect x="214" y="352" width="90" height="22" rx="3" fill="#0f766e"/><text x="259" y="367" font-size="9" fill="#ffffff" text-anchor="middle">LSN 42 set</text>
    <rect x="308" y="352" width="110" height="22" rx="3" fill="#334155"/><text x="363" y="367" font-size="9" fill="#ffffff" text-anchor="middle">LSN 43 checkpoint</text>
    <rect x="422" y="352" width="90" height="22" rx="3" fill="#0f766e"/><text x="467" y="367" font-size="9" fill="#ffffff" text-anchor="middle">LSN 44 set</text>
    <rect x="516" y="352" width="90" height="22" rx="3" fill="#b45309"/><text x="561" y="367" font-size="9" fill="#ffffff" text-anchor="middle">LSN 45 tail</text>
  </g>

  <defs>
    <marker id="walArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="walArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
  </defs>
</svg>
