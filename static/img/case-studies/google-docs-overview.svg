<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Google Docs: initial high-level design</text>

  <!-- Client A -->
  <rect x="20" y="90" width="130" height="55" rx="8" fill="#1d4ed8"/>
  <text x="85" y="112" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Editor A</text>
  <text x="85" y="128" font-size="9" fill="#dbeafe" text-anchor="middle">local optimistic apply</text>

  <!-- Client B -->
  <rect x="20" y="240" width="130" height="55" rx="8" fill="#1d4ed8"/>
  <text x="85" y="262" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Editor B</text>
  <text x="85" y="278" font-size="9" fill="#dbeafe" text-anchor="middle">local optimistic apply</text>

  <!-- Collaboration service -->
  <rect x="220" y="160" width="170" height="65" rx="8" fill="#0f766e"/>
  <text x="305" y="185" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Collaboration Service</text>
  <text x="305" y="202" font-size="9" fill="#ccfbf1" text-anchor="middle">OT transform + broadcast</text>
  <text x="305" y="215" font-size="9" fill="#ccfbf1" text-anchor="middle">sharded by doc_id</text>

  <line x1="150" y1="118" x2="240" y2="162" stroke="#1d4ed8" stroke-width="2" marker-end="url(#gdArrowBlue)"/>
  <line x1="240" y1="180" x2="150" y2="130" stroke="#1d4ed8" stroke-width="2" marker-end="url(#gdArrowBlue)"/>
  <line x1="150" y1="265" x2="240" y2="222" stroke="#1d4ed8" stroke-width="2" marker-end="url(#gdArrowBlue)"/>
  <line x1="240" y1="205" x2="150" y2="253" stroke="#1d4ed8" stroke-width="2" marker-end="url(#gdArrowBlue)"/>

  <!-- Presence service -->
  <rect x="220" y="30" width="170" height="55" rx="8" fill="#b45309"/>
  <text x="305" y="52" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Presence Service</text>
  <text x="305" y="68" font-size="9" fill="#fde68a" text-anchor="middle">cursors, ephemeral</text>

  <line x1="305" y1="85" x2="305" y2="158" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Document store -->
  <rect x="460" y="120" width="150" height="55" rx="8" fill="#334155"/>
  <text x="535" y="142" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Document Store</text>
  <text x="535" y="158" font-size="9" fill="#cbd5e1" text-anchor="middle">checkpointed state</text>

  <!-- Edit history log -->
  <rect x="460" y="210" width="150" height="55" rx="8" fill="#334155"/>
  <text x="535" y="232" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Edit History Log</text>
  <text x="535" y="248" font-size="9" fill="#cbd5e1" text-anchor="middle">append-only, per doc</text>

  <line x1="390" y1="180" x2="458" y2="150" stroke="#0f766e" stroke-width="2" marker-end="url(#gdArrowTeal)"/>
  <line x1="390" y1="205" x2="458" y2="235" stroke="#0f766e" stroke-width="2" marker-end="url(#gdArrowTeal)"/>

  <rect x="630" y="150" width="160" height="110" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="710" y="170" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Not delivery — convergence.</text>
  <text x="710" y="185" font-size="9" fill="#334155" text-anchor="middle">Every editor is both producer</text>
  <text x="710" y="199" font-size="9" fill="#334155" text-anchor="middle">and consumer of the same</text>
  <text x="710" y="213" font-size="9" fill="#334155" text-anchor="middle">mutable state; edits are</text>
  <text x="710" y="227" font-size="9" fill="#334155" text-anchor="middle">transformed, not just</text>
  <text x="710" y="241" font-size="9" fill="#334155" text-anchor="middle">queued and forwarded</text>

  <defs>
    <marker id="gdArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="gdArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
