<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">One node holds the lease; a failed lease renewal triggers re-election</text>

  <!-- Leader -->
  <rect x="300" y="55" width="160" height="55" rx="8" fill="#0f766e"/>
  <text x="380" y="79" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Node B — Leader</text>
  <text x="380" y="97" font-size="9" fill="#ccfbf1" text-anchor="middle">holds lease, epoch 4</text>

  <!-- Followers -->
  <rect x="60" y="150" width="140" height="55" rx="8" fill="#1d4ed8"/>
  <text x="130" y="174" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Node A</text>
  <text x="130" y="192" font-size="9" fill="#dbeafe" text-anchor="middle">follower</text>

  <rect x="560" y="150" width="140" height="55" rx="8" fill="#1d4ed8"/>
  <text x="630" y="174" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Node C</text>
  <text x="630" y="192" font-size="9" fill="#dbeafe" text-anchor="middle">follower</text>

  <!-- Coordination store -->
  <rect x="300" y="150" width="160" height="55" rx="8" fill="#334155"/>
  <text x="380" y="174" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Lease Store</text>
  <text x="380" y="192" font-size="9" fill="#cbd5e1" text-anchor="middle">strongly consistent</text>

  <!-- leader <-> lease store renew -->
  <line x1="380" y1="112" x2="380" y2="148" stroke="#0f766e" stroke-width="2" marker-end="url(#leArrowTeal)"/>
  <text x="440" y="132" font-size="9" fill="#0f766e" text-anchor="middle">renew before TTL</text>

  <!-- followers watch lease store -->
  <line x1="200" y1="177" x2="298" y2="177" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#leArrowGray)"/>
  <line x1="560" y1="177" x2="462" y2="177" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#leArrowGray)"/>
  <text x="130" y="215" font-size="8" fill="#64748b" text-anchor="middle">watches for expiry</text>
  <text x="630" y="215" font-size="8" fill="#64748b" text-anchor="middle">watches for expiry</text>

  <!-- failure box -->
  <rect x="30" y="240" width="700" height="65" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="263" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="600">If Node B misses a renewal, the lease expires and Node A or C acquires it at epoch 5</text>
  <text x="380" y="280" font-size="9" fill="#dc2626" text-anchor="middle">fencing on the epoch rejects any late write Node B still attempts as the stale leader</text>

  <defs>
    <marker id="leArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="leArrowGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
