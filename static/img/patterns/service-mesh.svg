<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Every service gets a sidecar proxy; a control plane configures all of them uniformly</text>

  <!-- Control plane -->
  <rect x="300" y="40" width="160" height="50" rx="8" fill="#334155"/>
  <text x="380" y="61" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Control plane</text>
  <text x="380" y="78" font-size="9" fill="#cbd5e1" text-anchor="middle">policy + telemetry</text>

  <!-- Service A with sidecar -->
  <rect x="70" y="140" width="180" height="90" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="160" y="155" font-size="8.5" fill="#64748b" text-anchor="middle">pod / host</text>
  <rect x="85" y="165" width="150" height="35" rx="6" fill="#1d4ed8"/>
  <text x="160" y="187" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">Service A</text>
  <rect x="85" y="205" width="150" height="20" rx="4" fill="#0f766e"/>
  <text x="160" y="219" font-size="9" fill="#ffffff" text-anchor="middle">sidecar proxy</text>

  <!-- Service B with sidecar -->
  <rect x="510" y="140" width="180" height="90" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="600" y="155" font-size="8.5" fill="#64748b" text-anchor="middle">pod / host</text>
  <rect x="525" y="165" width="150" height="35" rx="6" fill="#1d4ed8"/>
  <text x="600" y="187" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">Service B</text>
  <rect x="525" y="205" width="150" height="20" rx="4" fill="#0f766e"/>
  <text x="600" y="219" font-size="9" fill="#ffffff" text-anchor="middle">sidecar proxy</text>

  <!-- Control plane to sidecars (thin config lines) -->
  <line x1="330" y1="90" x2="180" y2="163" stroke="#334155" stroke-width="1.3" stroke-dasharray="2,2" marker-end="url(#smArrowGray)"/>
  <line x1="430" y1="90" x2="580" y2="163" stroke="#334155" stroke-width="1.3" stroke-dasharray="2,2" marker-end="url(#smArrowGray)"/>
  <text x="230" y="120" font-size="8" fill="#334155" text-anchor="middle">mTLS + retry policy</text>
  <text x="530" y="120" font-size="8" fill="#334155" text-anchor="middle">mTLS + retry policy</text>

  <!-- Sidecar to sidecar (actual traffic) -->
  <line x1="235" y1="215" x2="523" y2="215" stroke="#0f766e" stroke-width="2.5" marker-end="url(#smArrowTeal)"/>
  <text x="380" y="245" font-size="9" fill="#0f766e" text-anchor="middle" font-weight="600">encrypted service-to-service call, retried by the proxies</text>

  <rect x="230" y="260" width="300" height="45" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="278" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="600">Control plane outage: existing traffic</text>
  <text x="380" y="292" font-size="9.5" fill="#b45309" text-anchor="middle">flows, but policy updates stop propagating</text>

  <defs>
    <marker id="smArrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="smArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
