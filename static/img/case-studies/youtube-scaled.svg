<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="430" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">YouTube: scaled design</text>

  <!-- Viewer -->
  <rect x="20" y="180" width="110" height="50" rx="8" fill="#1d4ed8"/>
  <text x="75" y="201" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Viewers</text>
  <text x="75" y="217" font-size="8" fill="#dbeafe" text-anchor="middle">~15K plays/s peak</text>

  <!-- CDN edge (global) -->
  <rect x="165" y="150" width="140" height="110" rx="8" fill="#b45309"/>
  <text x="235" y="175" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">CDN Edges</text>
  <text x="235" y="192" font-size="8" fill="#fde68a" text-anchor="middle">(global, near viewer)</text>
  <text x="235" y="212" font-size="8" fill="#fde68a" text-anchor="middle">popular renditions</text>
  <text x="235" y="226" font-size="8" fill="#fde68a" text-anchor="middle">kept resident —</text>
  <text x="235" y="240" font-size="8" fill="#fde68a" text-anchor="middle">tens of Gbps egress</text>

  <line x1="130" y1="205" x2="163" y2="205" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ytsArrowBlue)"/>

  <!-- Origin blob store -->
  <rect x="360" y="180" width="140" height="50" rx="8" fill="#334155"/>
  <text x="430" y="201" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Origin Blob Store</text>
  <text x="430" y="217" font-size="8" fill="#cbd5e1" text-anchor="middle">cache-miss traffic only</text>

  <line x1="305" y1="205" x2="358" y2="205" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ytsArrowAmber)"/>

  <!-- Uploader -->
  <rect x="20" y="60" width="110" height="50" rx="8" fill="#1d4ed8"/>
  <text x="75" y="81" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Uploaders</text>
  <text x="75" y="97" font-size="8" fill="#dbeafe" text-anchor="middle">low volume, bursty</text>

  <!-- Task queue -->
  <rect x="165" y="60" width="140" height="50" rx="8" fill="#15803d"/>
  <text x="235" y="81" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Transcode Task Queue</text>
  <text x="235" y="97" font-size="8" fill="#dcfce7" text-anchor="middle">per-rendition tasks</text>

  <line x1="130" y1="85" x2="163" y2="85" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ytsArrowBlue)"/>

  <!-- Worker fleet, auto-scaled -->
  <rect x="360" y="40" width="140" height="45" rx="8" fill="#15803d"/>
  <text x="430" y="59" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Worker Pool 1..N</text>
  <text x="430" y="73" font-size="8" fill="#dcfce7" text-anchor="middle">auto-scaled on queue depth</text>

  <rect x="360" y="95" width="140" height="45" rx="8" fill="#15803d"/>
  <text x="430" y="114" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">GPU/CPU-bound</text>
  <text x="430" y="128" font-size="8" fill="#dcfce7" text-anchor="middle">compute-scaled, not I/O</text>

  <line x1="305" y1="75" x2="358" y2="62" stroke="#0f766e" stroke-width="2" marker-end="url(#ytsArrowTeal)"/>
  <line x1="305" y1="90" x2="358" y2="115" stroke="#0f766e" stroke-width="2" marker-end="url(#ytsArrowTeal)"/>

  <line x1="430" y1="85" x2="430" y2="140" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="430" y1="140" x2="430" y2="178" stroke="#0f766e" stroke-width="1.5" marker-end="url(#ytsArrowTeal)"/>

  <!-- Metadata store, sharded + replicated -->
  <rect x="580" y="60" width="150" height="50" rx="8" fill="#334155"/>
  <text x="655" y="81" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Metadata Shards</text>
  <text x="655" y="97" font-size="8" fill="#cbd5e1" text-anchor="middle">+ read replicas</text>

  <line x1="500" y1="205" x2="655" y2="112" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- View count sharded counters -->
  <rect x="580" y="180" width="150" height="50" rx="8" fill="#334155"/>
  <text x="655" y="201" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Sharded View Counters</text>
  <text x="655" y="217" font-size="8" fill="#cbd5e1" text-anchor="middle">periodic aggregate</text>

  <line x1="500" y1="205" x2="578" y2="205" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4,3"/>

  <rect x="20" y="330" width="810" height="70" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="425" y="350" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Green = scaled/redundant additions</text>
  <text x="425" y="367" font-size="9" fill="#334155" text-anchor="middle">Worker pool scales on compute/queue-depth (upload side); CDN edges scale on bandwidth/</text>
  <text x="425" y="383" font-size="9" fill="#334155" text-anchor="middle">geographic locality (playback side) — two independent axes, opposite geographic needs</text>

  <defs>
    <marker id="ytsArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="ytsArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="ytsArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
