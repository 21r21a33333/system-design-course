<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>

  <text x="380" y="26" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">A router uses the shard key to send each request to the shard that owns it</text>

  <!-- clients -->
  <rect x="30" y="120" width="120" height="60" rx="8" fill="#1d4ed8"/>
  <text x="90" y="146" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Clients</text>
  <text x="90" y="164" font-size="9" fill="#dbeafe" text-anchor="middle">query by shard key</text>

  <!-- router -->
  <rect x="230" y="115" width="150" height="70" rx="8" fill="#334155"/>
  <text x="305" y="142" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Router</text>
  <text x="305" y="160" font-size="9" fill="#cbd5e1" text-anchor="middle">hash(key) % N</text>
  <text x="305" y="173" font-size="9" fill="#cbd5e1" text-anchor="middle">or range / directory</text>

  <line x1="150" y1="150" x2="228" y2="150" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#shArrowBlue)"/>

  <!-- shard 0 -->
  <rect x="500" y="40" width="220" height="60" rx="8" fill="#0f766e"/>
  <text x="610" y="64" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Shard 0</text>
  <text x="610" y="82" font-size="9" fill="#ccfbf1" text-anchor="middle">keys A–H  (disjoint subset)</text>
  <line x1="380" y1="140" x2="498" y2="80" stroke="#0f766e" stroke-width="2" marker-end="url(#shArrowTeal)"/>

  <!-- shard 1 (hot) amber -->
  <rect x="500" y="130" width="220" height="60" rx="8" fill="#b45309"/>
  <text x="610" y="154" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Shard 1  (hot)</text>
  <text x="610" y="172" font-size="9" fill="#fef3c7" text-anchor="middle">keys I–P  — celebrity key here</text>
  <line x1="380" y1="150" x2="498" y2="160" stroke="#b45309" stroke-width="2.5" marker-end="url(#shArrowAmber)"/>

  <!-- shard 2 -->
  <rect x="500" y="220" width="220" height="60" rx="8" fill="#0f766e"/>
  <text x="610" y="244" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Shard 2</text>
  <text x="610" y="262" font-size="9" fill="#ccfbf1" text-anchor="middle">keys Q–Z  (disjoint subset)</text>
  <line x1="380" y1="160" x2="498" y2="240" stroke="#0f766e" stroke-width="2" marker-end="url(#shArrowTeal)"/>

  <!-- keyspace bar -->
  <text x="380" y="308" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">Key space partitioned into disjoint ranges — each key lives on exactly one shard</text>
  <rect x="60" y="318" width="213" height="24" rx="4" fill="#0f766e"/>
  <text x="166" y="334" font-size="10" fill="#ffffff" text-anchor="middle">A–H → Shard 0</text>
  <rect x="277" y="318" width="213" height="24" rx="4" fill="#b45309"/>
  <text x="383" y="334" font-size="10" fill="#ffffff" text-anchor="middle">I–P → Shard 1 (hot)</text>
  <rect x="494" y="318" width="206" height="24" rx="4" fill="#0f766e"/>
  <text x="597" y="334" font-size="10" fill="#ffffff" text-anchor="middle">Q–Z → Shard 2</text>

  <defs>
    <marker id="shArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="shArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="shArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
