<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Requests spread across healthy instances; unhealthy ones are skipped</text>

  <!-- Client -->
  <rect x="30" y="140" width="120" height="55" rx="8" fill="#1d4ed8"/>
  <text x="90" y="164" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Clients</text>
  <text x="90" y="181" font-size="9" fill="#dbeafe" text-anchor="middle">incoming requests</text>

  <!-- Load balancer (the pattern) -->
  <rect x="260" y="130" width="160" height="65" rx="8" fill="#0f766e"/>
  <text x="340" y="157" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Load Balancer</text>
  <text x="340" y="175" font-size="9" fill="#ccfbf1" text-anchor="middle">least-connections</text>

  <line x1="150" y1="167" x2="258" y2="162" stroke="#1d4ed8" stroke-width="2" marker-end="url(#lbArrowBlue)"/>

  <!-- Backend 1 healthy -->
  <rect x="560" y="40" width="150" height="55" rx="8" fill="#334155"/>
  <text x="635" y="64" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Instance A</text>
  <text x="635" y="81" font-size="9" fill="#cbd5e1" text-anchor="middle">2 active conns</text>

  <!-- Backend 2 healthy, more loaded -->
  <rect x="560" y="130" width="150" height="55" rx="8" fill="#334155"/>
  <text x="635" y="154" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Instance B</text>
  <text x="635" y="171" font-size="9" fill="#cbd5e1" text-anchor="middle">7 active conns</text>

  <!-- Backend 3 unhealthy -->
  <rect x="560" y="220" width="150" height="55" rx="8" fill="#dc2626"/>
  <text x="635" y="244" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Instance C</text>
  <text x="635" y="261" font-size="9" fill="#fee2e2" text-anchor="middle">failed health check</text>

  <line x1="420" y1="150" x2="558" y2="68" stroke="#0f766e" stroke-width="2.5" marker-end="url(#lbArrowTeal)"/>
  <text x="480" y="100" font-size="9" fill="#0f766e" text-anchor="middle">routed here</text>

  <line x1="420" y1="165" x2="558" y2="165" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <line x1="420" y1="180" x2="558" y2="240" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="480" y="215" font-size="9" fill="#94a3b8" text-anchor="middle">skipped</text>

  <rect x="30" y="278" width="690" height="32" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="375" y="298" font-size="9" fill="#334155" text-anchor="middle">next request goes to Instance A — fewest in-flight connections among healthy backends</text>

  <defs>
    <marker id="lbArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="lbArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
