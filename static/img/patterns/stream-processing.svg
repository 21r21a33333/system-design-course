<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Unbounded event stream grouped into tumbling windows; a watermark triggers emission</text>

  <!-- event timeline -->
  <line x1="40" y1="90" x2="720" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#spArrow)"/>
  <text x="726" y="86" font-size="9" fill="#64748b">event time</text>

  <!-- window boundaries -->
  <line x1="140" y1="70" x2="140" y2="230" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="320" y1="70" x2="320" y2="230" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="500" y1="70" x2="500" y2="230" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- window labels -->
  <text x="230" y="60" font-size="9" fill="#0f766e" text-anchor="middle" font-weight="600">window [0,10)</text>
  <text x="410" y="60" font-size="9" fill="#0f766e" text-anchor="middle" font-weight="600">window [10,20)</text>

  <!-- events in window 1 (green = on-time) -->
  <circle cx="170" cy="90" r="7" fill="#15803d"/>
  <circle cx="230" cy="90" r="7" fill="#15803d"/>
  <circle cx="285" cy="90" r="7" fill="#15803d"/>
  <!-- events in window 2 -->
  <circle cx="360" cy="90" r="7" fill="#15803d"/>
  <circle cx="450" cy="90" r="7" fill="#15803d"/>
  <!-- late event (amber) -->
  <circle cx="205" cy="90" r="7" fill="#b45309"/>
  <text x="205" y="118" font-size="8" fill="#b45309" text-anchor="middle">late</text>

  <!-- watermark -->
  <line x1="320" y1="70" x2="320" y2="235" stroke="#dc2626" stroke-width="2.5"/>
  <text x="320" y="248" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="600">watermark = 10</text>

  <!-- stateful operator -->
  <rect x="150" y="150" width="160" height="55" rx="8" fill="#0f766e"/>
  <text x="230" y="173" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Stateful operator</text>
  <text x="230" y="190" font-size="9" fill="#ccfbf1" text-anchor="middle">(key, window) → count/sum</text>

  <!-- state store -->
  <rect x="150" y="255" width="160" height="45" rx="8" fill="#334155"/>
  <text x="230" y="275" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">State store</text>
  <text x="230" y="290" font-size="8" fill="#cbd5e1" text-anchor="middle">checkpointed for fault tolerance</text>
  <line x1="230" y1="205" x2="230" y2="253" stroke="#64748b" stroke-width="1.5" marker-end="url(#spArrowSlate)"/>

  <!-- emission on watermark -->
  <rect x="470" y="150" width="230" height="55" rx="8" fill="#1d4ed8"/>
  <text x="585" y="173" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Emitted result</text>
  <text x="585" y="190" font-size="9" fill="#dbeafe" text-anchor="middle">window [0,10) closed → count=3</text>
  <line x1="320" y1="177" x2="468" y2="177" stroke="#1d4ed8" stroke-width="2" marker-end="url(#spArrowBlue)"/>
  <text x="393" y="170" font-size="8" fill="#1d4ed8" text-anchor="middle">on watermark</text>

  <!-- late-drop note -->
  <text x="585" y="255" font-size="9" fill="#b45309" text-anchor="middle">event before watermark → late,</text>
  <text x="585" y="270" font-size="9" fill="#b45309" text-anchor="middle">dropped or side-output</text>

  <defs>
    <marker id="spArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="spArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="spArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
</svg>
