<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Each client type gets its own tailored backend, not one shared API</text>

  <!-- Clients -->
  <rect x="30" y="50" width="120" height="42" rx="8" fill="#1d4ed8"/>
  <text x="90" y="76" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Mobile app</text>

  <rect x="30" y="140" width="120" height="42" rx="8" fill="#1d4ed8"/>
  <text x="90" y="166" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Web app</text>

  <rect x="30" y="230" width="120" height="42" rx="8" fill="#1d4ed8"/>
  <text x="90" y="256" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Smart TV app</text>

  <!-- BFFs -->
  <rect x="230" y="50" width="150" height="42" rx="8" fill="#0f766e"/>
  <text x="305" y="72" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Mobile BFF</text>
  <text x="305" y="86" font-size="8.5" fill="#ccfbf1" text-anchor="middle">small, pre-aggregated</text>

  <rect x="230" y="140" width="150" height="42" rx="8" fill="#0f766e"/>
  <text x="305" y="162" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Web BFF</text>
  <text x="305" y="176" font-size="8.5" fill="#ccfbf1" text-anchor="middle">richer, granular</text>

  <rect x="230" y="230" width="150" height="42" rx="8" fill="#0f766e"/>
  <text x="305" y="252" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">TV BFF</text>
  <text x="305" y="266" font-size="8.5" fill="#ccfbf1" text-anchor="middle">low-bandwidth shape</text>

  <line x1="150" y1="71" x2="228" y2="71" stroke="#1d4ed8" stroke-width="2" marker-end="url(#bffArrowBlue)"/>
  <line x1="150" y1="161" x2="228" y2="161" stroke="#1d4ed8" stroke-width="2" marker-end="url(#bffArrowBlue)"/>
  <line x1="150" y1="251" x2="228" y2="251" stroke="#1d4ed8" stroke-width="2" marker-end="url(#bffArrowBlue)"/>

  <!-- Shared backend services -->
  <rect x="560" y="100" width="160" height="42" rx="8" fill="#334155"/>
  <text x="640" y="126" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Orders service</text>

  <rect x="560" y="155" width="160" height="42" rx="8" fill="#334155"/>
  <text x="640" y="181" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Catalog service</text>

  <line x1="380" y1="65" x2="558" y2="112" stroke="#0f766e" stroke-width="1.5" marker-end="url(#bffArrowTeal)"/>
  <line x1="380" y1="155" x2="558" y2="125" stroke="#0f766e" stroke-width="1.5" marker-end="url(#bffArrowTeal)"/>
  <line x1="380" y1="165" x2="558" y2="170" stroke="#0f766e" stroke-width="1.5" marker-end="url(#bffArrowTeal)"/>
  <line x1="380" y1="245" x2="558" y2="185" stroke="#0f766e" stroke-width="1.5" marker-end="url(#bffArrowTeal)"/>

  <text x="470" y="220" font-size="9" fill="#334155" text-anchor="middle">each BFF aggregates the same shared services differently</text>

  <rect x="480" y="255" width="220" height="45" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="590" y="273" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="600">Duplicated aggregation logic</text>
  <text x="590" y="287" font-size="9.5" fill="#b45309" text-anchor="middle">across BFFs is the trade-off cost</text>

  <defs>
    <marker id="bffArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="bffArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
