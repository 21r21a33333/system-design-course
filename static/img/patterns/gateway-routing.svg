<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>

  <!-- Client -->
  <rect x="30" y="130" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="95" y="165" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Client</text>

  <!-- Gateway / router -->
  <rect x="260" y="110" width="180" height="100" rx="8" fill="#64748b"/>
  <text x="350" y="150" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">Gateway</text>
  <text x="350" y="172" font-size="11" fill="#e2e8f0" text-anchor="middle">match path → route</text>

  <line x1="160" y1="160" x2="258" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrowRt)"/>

  <!-- three backends, only one lit up per request -->
  <rect x="540" y="30" width="150" height="55" rx="8" fill="#334155"/>
  <text x="615" y="53" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">/orders</text>
  <text x="615" y="70" font-size="10" fill="#cbd5e1" text-anchor="middle">Orders Service</text>

  <rect x="540" y="132" width="150" height="55" rx="8" fill="#0f766e"/>
  <text x="615" y="155" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">/users</text>
  <text x="615" y="172" font-size="10" fill="#ccfbf1" text-anchor="middle">Users Service</text>

  <rect x="540" y="234" width="150" height="55" rx="8" fill="#334155"/>
  <text x="615" y="257" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">/inventory</text>
  <text x="615" y="274" font-size="10" fill="#cbd5e1" text-anchor="middle">Inventory Service</text>

  <!-- only the matched route is a solid highlighted arrow -->
  <line x1="440" y1="150" x2="538" y2="60" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowRtFaint)"/>
  <line x1="440" y1="160" x2="538" y2="160" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowRtTeal)"/>
  <line x1="440" y1="170" x2="538" y2="260" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowRtFaint)"/>

  <text x="345" y="255" font-size="10" fill="#334155" text-anchor="middle">one request → one backend</text>

  <defs>
    <marker id="arrowRt" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowRtTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowRtFaint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>
