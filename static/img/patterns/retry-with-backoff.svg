<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Each retry waits longer (exponential) with random jitter, until success or the budget is exhausted</text>

  <!-- timeline axis -->
  <line x1="60" y1="230" x2="700" y2="230" stroke="#64748b" stroke-width="2"/>
  <text x="700" y="252" font-size="9" fill="#64748b" text-anchor="end">time →</text>

  <!-- Attempt 1 (fail) -->
  <rect x="70" y="200" width="34" height="30" rx="4" fill="#dc2626"/>
  <text x="87" y="220" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
  <text x="87" y="192" font-size="8.5" fill="#dc2626" text-anchor="middle">fail</text>

  <!-- wait 1 ~100ms -->
  <rect x="104" y="212" width="60" height="8" fill="#1d4ed8" opacity="0.35"/>
  <text x="134" y="180" font-size="8.5" fill="#1d4ed8" text-anchor="middle">wait ≈100ms</text>
  <line x1="104" y1="200" x2="164" y2="200" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Attempt 2 (fail) -->
  <rect x="164" y="200" width="34" height="30" rx="4" fill="#dc2626"/>
  <text x="181" y="220" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
  <text x="181" y="192" font-size="8.5" fill="#dc2626" text-anchor="middle">fail</text>

  <!-- wait 2 ~200ms -->
  <rect x="198" y="212" width="110" height="8" fill="#1d4ed8" opacity="0.35"/>
  <text x="253" y="180" font-size="8.5" fill="#1d4ed8" text-anchor="middle">wait ≈200ms</text>
  <line x1="198" y1="200" x2="308" y2="200" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Attempt 3 (fail) -->
  <rect x="308" y="200" width="34" height="30" rx="4" fill="#dc2626"/>
  <text x="325" y="220" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
  <text x="325" y="192" font-size="8.5" fill="#dc2626" text-anchor="middle">fail</text>

  <!-- wait 3 ~400ms -->
  <rect x="342" y="212" width="200" height="8" fill="#1d4ed8" opacity="0.35"/>
  <text x="442" y="180" font-size="8.5" fill="#1d4ed8" text-anchor="middle">wait ≈400ms</text>
  <line x1="342" y1="200" x2="542" y2="200" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Attempt 4 (success) -->
  <rect x="542" y="200" width="34" height="30" rx="4" fill="#15803d"/>
  <text x="559" y="220" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">4</text>
  <text x="559" y="192" font-size="8.5" fill="#15803d" text-anchor="middle">ok</text>

  <!-- jitter band illustration -->
  <text x="140" y="290" font-size="10" fill="#b45309" font-weight="600">jitter</text>
  <rect x="185" y="280" width="90" height="14" rx="3" fill="#b45309" opacity="0.25"/>
  <line x1="230" y1="278" x2="230" y2="296" stroke="#b45309" stroke-width="2"/>
  <text x="360" y="291" font-size="9" fill="#334155">actual wait is picked randomly inside the window, so many callers don't retry in lockstep</text>

  <!-- cap note -->
  <text x="620" y="140" font-size="9" fill="#334155" text-anchor="middle">delay doubles</text>
  <text x="620" y="153" font-size="9" fill="#334155" text-anchor="middle">up to a capped max</text>
  <path d="M 130 165 Q 400 110 610 160" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>

  <defs></defs>
</svg>
