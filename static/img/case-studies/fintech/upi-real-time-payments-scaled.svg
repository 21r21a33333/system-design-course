<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">UPI at scale: a sharded, idempotent switch fronting many banks</text>

  <!-- Many PSP apps -->
  <rect x="20" y="70" width="140" height="70" rx="8" fill="#0f766e"/>
  <text x="90" y="95" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Many PSP apps</text>
  <text x="90" y="111" font-size="9" fill="#ccfbf1" text-anchor="middle">interoperable over</text>
  <text x="90" y="124" font-size="9" fill="#ccfbf1" text-anchor="middle">one common API</text>

  <!-- API gateway -->
  <rect x="220" y="70" width="150" height="70" rx="8" fill="#1d4ed8"/>
  <text x="295" y="95" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Switch API gateway</text>
  <text x="295" y="111" font-size="9" fill="#dbeafe" text-anchor="middle">auth, rate limit,</text>
  <text x="295" y="124" font-size="9" fill="#dbeafe" text-anchor="middle">signature verify</text>

  <!-- Sharded switch -->
  <rect x="430" y="60" width="170" height="45" rx="8" fill="#6d28d9"/>
  <text x="515" y="80" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Switch core shard A</text>
  <text x="515" y="95" font-size="9" fill="#ede9fe" text-anchor="middle">txn id range 0..n</text>
  <rect x="430" y="115" width="170" height="45" rx="8" fill="#6d28d9"/>
  <text x="515" y="135" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Switch core shard B</text>
  <text x="515" y="150" font-size="9" fill="#ede9fe" text-anchor="middle">sharded by txn id</text>

  <!-- Idempotency + mapper store -->
  <rect x="430" y="185" width="170" height="60" rx="8" fill="#b45309"/>
  <text x="515" y="208" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Txn-id + VPA store</text>
  <text x="515" y="224" font-size="9" fill="#fde68a" text-anchor="middle">strongly consistent,</text>
  <text x="515" y="237" font-size="9" fill="#fde68a" text-anchor="middle">dedupes retries</text>

  <!-- Bank adapters -->
  <rect x="660" y="70" width="140" height="45" rx="8" fill="#be123c"/>
  <text x="730" y="90" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Bank A adapter</text>
  <text x="730" y="105" font-size="9" fill="#fecdd3" text-anchor="middle">debit / credit API</text>
  <rect x="660" y="130" width="140" height="45" rx="8" fill="#be123c"/>
  <text x="730" y="150" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Bank B adapter</text>
  <text x="730" y="165" font-size="9" fill="#fecdd3" text-anchor="middle">circuit breaker</text>
  <rect x="660" y="190" width="140" height="45" rx="8" fill="#be123c"/>
  <text x="730" y="210" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Bank C adapter</text>
  <text x="730" y="225" font-size="9" fill="#fecdd3" text-anchor="middle">retry with backoff</text>

  <!-- Settlement -->
  <rect x="220" y="300" width="380" height="60" rx="8" fill="#334155"/>
  <text x="410" y="325" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Deferred net settlement engine</text>
  <text x="410" y="342" font-size="9" fill="#cbd5e1" text-anchor="middle">nets multilateral positions across banks in scheduled cycles, posts to RBI settlement</text>

  <!-- arrows -->
  <line x1="160" y1="105" x2="218" y2="105" stroke="#0f766e" stroke-width="2" marker-end="url(#upiScaleTeal)"/>
  <line x1="370" y1="95" x2="428" y2="82" stroke="#1d4ed8" stroke-width="2" marker-end="url(#upiScaleBlue)"/>
  <line x1="370" y1="120" x2="428" y2="135" stroke="#1d4ed8" stroke-width="2" marker-end="url(#upiScaleBlue)"/>
  <line x1="515" y1="160" x2="515" y2="183" stroke="#6d28d9" stroke-width="2" marker-end="url(#upiScaleViolet)"/>
  <line x1="600" y1="90" x2="658" y2="90" stroke="#6d28d9" stroke-width="2" marker-end="url(#upiScaleViolet)"/>
  <line x1="600" y1="140" x2="658" y2="150" stroke="#6d28d9" stroke-width="2" marker-end="url(#upiScaleViolet)"/>
  <line x1="515" y1="245" x2="470" y2="298" stroke="#334155" stroke-width="2" marker-end="url(#upiScaleSlate)"/>
  <line x1="730" y1="235" x2="600" y2="330" stroke="#be123c" stroke-width="2" marker-end="url(#upiScaleRose)"/>

  <!-- note -->
  <rect x="30" y="180" width="170" height="120" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="115" y="200" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">The switch holds no funds.</text>
  <text x="115" y="216" font-size="9" fill="#334155" text-anchor="middle">It authorizes and records</text>
  <text x="115" y="230" font-size="9" fill="#334155" text-anchor="middle">each transfer in real time,</text>
  <text x="115" y="244" font-size="9" fill="#334155" text-anchor="middle">then banks settle net</text>
  <text x="115" y="258" font-size="9" fill="#334155" text-anchor="middle">balances later. Same txn</text>
  <text x="115" y="272" font-size="9" fill="#334155" text-anchor="middle">id replayed returns the</text>
  <text x="115" y="286" font-size="9" fill="#334155" text-anchor="middle">stored result, never a</text>
  <text x="115" y="300" font-size="9" fill="#334155" text-anchor="middle">second debit.</text>

  <defs>
    <marker id="upiScaleTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="upiScaleBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="upiScaleViolet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6d28d9"/>
    </marker>
    <marker id="upiScaleAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="upiScaleRose" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#be123c"/>
    </marker>
    <marker id="upiScaleSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
