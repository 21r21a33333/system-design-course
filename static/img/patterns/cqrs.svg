<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="24" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">One write model, many purpose-built read models, synchronized asynchronously</text>

  <!-- Client / callers -->
  <rect x="24" y="90" width="96" height="52" rx="8" fill="#334155"/>
  <text x="72" y="112" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Callers</text>
  <text x="72" y="128" font-size="8.5" fill="#cbd5e1" text-anchor="middle">commands</text>

  <rect x="24" y="200" width="96" height="52" rx="8" fill="#334155"/>
  <text x="72" y="222" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Callers</text>
  <text x="72" y="238" font-size="8.5" fill="#cbd5e1" text-anchor="middle">queries</text>

  <!-- Command side -->
  <rect x="200" y="78" width="180" height="76" rx="8" fill="#1d4ed8"/>
  <text x="290" y="104" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Command side</text>
  <text x="290" y="121" font-size="8.5" fill="#dbeafe" text-anchor="middle">validates + mutates</text>
  <text x="290" y="135" font-size="8.5" fill="#dbeafe" text-anchor="middle">normalized · consistent</text>

  <!-- caller -> command -->
  <line x1="120" y1="116" x2="198" y2="116" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#cqArrowBlue)"/>

  <!-- Change feed (events / CDC) -->
  <rect x="200" y="176" width="180" height="44" rx="8" fill="#b45309"/>
  <text x="290" y="196" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Change feed</text>
  <text x="290" y="211" font-size="8.5" fill="#fde68a" text-anchor="middle">events / CDC · async</text>

  <!-- command -> change feed -->
  <line x1="290" y1="154" x2="290" y2="174" stroke="#b45309" stroke-width="2.5" marker-end="url(#cqArrowAmber)"/>
  <text x="366" y="168" font-size="8.5" fill="#b45309" text-anchor="middle">publish</text>

  <!-- Read models -->
  <rect x="470" y="70" width="200" height="46" rx="8" fill="#0f766e"/>
  <text x="570" y="90" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Read model: search index</text>
  <text x="570" y="105" font-size="8.5" fill="#ccfbf1" text-anchor="middle">denormalized for text queries</text>

  <rect x="470" y="128" width="200" height="46" rx="8" fill="#0f766e"/>
  <text x="570" y="148" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Read model: dashboard</text>
  <text x="570" y="163" font-size="8.5" fill="#ccfbf1" text-anchor="middle">pre-aggregated rollups</text>

  <rect x="470" y="186" width="200" height="46" rx="8" fill="#0f766e"/>
  <text x="570" y="206" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Read model: product card</text>
  <text x="570" y="221" font-size="8.5" fill="#ccfbf1" text-anchor="middle">one row per browse page</text>

  <!-- change feed -> read models (projections) -->
  <line x1="380" y1="192" x2="468" y2="96" stroke="#0f766e" stroke-width="2" marker-end="url(#cqArrowTeal)"/>
  <line x1="380" y1="198" x2="468" y2="151" stroke="#0f766e" stroke-width="2" marker-end="url(#cqArrowTeal)"/>
  <line x1="380" y1="204" x2="468" y2="209" stroke="#0f766e" stroke-width="2" marker-end="url(#cqArrowTeal)"/>
  <text x="430" y="150" font-size="8.5" fill="#0f766e" text-anchor="middle" font-weight="600">project</text>

  <!-- caller queries -> read models -->
  <line x1="120" y1="226" x2="468" y2="216" stroke="#0f766e" stroke-width="2.5" marker-end="url(#cqArrowTeal)"/>
  <text x="250" y="240" font-size="8.5" fill="#0f766e" text-anchor="middle">read (eventually consistent)</text>

  <rect x="24" y="286" width="712" height="36" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="308" font-size="9" fill="#334155" text-anchor="middle">Reads never touch the write store; the async feed means a just-written change lags on the read side for a short window</text>

  <defs>
    <marker id="cqArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
    <marker id="cqArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="cqArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
  </defs>
</svg>
