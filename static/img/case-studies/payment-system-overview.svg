<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Payment System: initial high-level design</text>

  <!-- Merchant -->
  <rect x="20" y="160" width="130" height="60" rx="8" fill="#1d4ed8"/>
  <text x="85" y="185" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Merchant</text>
  <text x="85" y="202" font-size="9" fill="#dbeafe" text-anchor="middle">+ idempotency key</text>

  <!-- Payment service -->
  <rect x="220" y="160" width="150" height="60" rx="8" fill="#0f766e"/>
  <text x="295" y="185" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Payment Service</text>
  <text x="295" y="202" font-size="9" fill="#ccfbf1" text-anchor="middle">orchestration</text>

  <line x1="150" y1="180" x2="218" y2="180" stroke="#1d4ed8" stroke-width="2" marker-end="url(#psArrowBlue)"/>
  <line x1="218" y1="200" x2="150" y2="200" stroke="#1d4ed8" stroke-width="2" marker-end="url(#psArrowBlue)"/>

  <!-- Idempotency store -->
  <rect x="220" y="60" width="150" height="55" rx="8" fill="#b45309"/>
  <text x="295" y="83" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Idempotency Store</text>
  <text x="295" y="99" font-size="9" fill="#fde68a" text-anchor="middle">check first, always</text>

  <line x1="295" y1="115" x2="295" y2="158" stroke="#b45309" stroke-width="2" marker-end="url(#psArrowAmber)"/>

  <!-- Ledger -->
  <rect x="220" y="250" width="150" height="60" rx="8" fill="#334155"/>
  <text x="295" y="275" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Ledger</text>
  <text x="295" y="292" font-size="9" fill="#cbd5e1" text-anchor="middle">durable, append-only</text>

  <line x1="295" y1="220" x2="295" y2="248" stroke="#334155" stroke-width="2" marker-end="url(#psArrowSlate)"/>

  <!-- Payment gateway/processor -->
  <rect x="440" y="160" width="170" height="60" rx="8" fill="#0f766e"/>
  <text x="525" y="185" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Payment Gateway /</text>
  <text x="525" y="202" font-size="9" fill="#ccfbf1" text-anchor="middle">Processor (external)</text>

  <line x1="370" y1="175" x2="438" y2="175" stroke="#0f766e" stroke-width="2" marker-end="url(#psArrowTeal)"/>
  <line x1="438" y1="195" x2="370" y2="195" stroke="#0f766e" stroke-width="2" marker-end="url(#psArrowTeal)"/>

  <rect x="640" y="130" width="160" height="120" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="720" y="150" font-size="9" fill="#334155" text-anchor="middle" font-weight="600">Ledger write happens</text>
  <text x="720" y="164" font-size="9" fill="#334155" text-anchor="middle">BEFORE the gateway call —</text>
  <text x="720" y="178" font-size="9" fill="#334155" text-anchor="middle">a crash mid-call leaves a</text>
  <text x="720" y="192" font-size="9" fill="#334155" text-anchor="middle">durable "processing" record</text>
  <text x="720" y="206" font-size="9" fill="#334155" text-anchor="middle">to reconcile against, not</text>
  <text x="720" y="220" font-size="9" fill="#334155" text-anchor="middle">an ambiguous void</text>

  <defs>
    <marker id="psArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="psArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <marker id="psArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="psArrowSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
