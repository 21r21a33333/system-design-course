<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="24" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">One deployed binary; the flag SDK decides on/off per request at runtime — no redeploy</text>

  <!-- Deployed service -->
  <rect x="24" y="120" width="150" height="90" rx="8" fill="#0f766e"/>
  <text x="99" y="150" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Service (v2)</text>
  <text x="99" y="168" font-size="9" fill="#ccfbf1" text-anchor="middle">new code shipped</text>
  <text x="99" y="182" font-size="9" fill="#ccfbf1" text-anchor="middle">dark, behind flag</text>
  <text x="99" y="200" font-size="9" fill="#ccfbf1" text-anchor="middle">+ flag SDK (cached)</text>

  <!-- Flag config source -->
  <rect x="24" y="250" width="150" height="52" rx="8" fill="#1d4ed8"/>
  <text x="99" y="272" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Flag service</text>
  <text x="99" y="289" font-size="9" fill="#dbeafe" text-anchor="middle">config, streamed to SDK</text>
  <line x1="99" y1="250" x2="99" y2="212" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="3,3"/>

  <!-- evaluation ladder -->
  <text x="430" y="52" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="600">evaluate(flag, user) — precedence top to bottom</text>

  <rect x="250" y="66" width="360" height="42" rx="6" fill="#dc2626"/>
  <text x="430" y="86" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">1. Kill switch</text>
  <text x="430" y="100" font-size="9" fill="#fee2e2" text-anchor="middle">killed → OFF for everyone, instantly</text>

  <rect x="250" y="118" width="360" height="42" rx="6" fill="#b45309"/>
  <text x="430" y="138" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">2. Targeting rules</text>
  <text x="430" y="152" font-size="9" fill="#fef3c7" text-anchor="middle">tier=beta, region=EU → ON for that segment</text>

  <rect x="250" y="170" width="360" height="42" rx="6" fill="#334155"/>
  <text x="430" y="190" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">3. Percentage rollout</text>
  <text x="430" y="204" font-size="9" fill="#cbd5e1" text-anchor="middle">hash(flag, user) % 100 &lt; rollout → ON</text>

  <rect x="250" y="222" width="360" height="40" rx="6" fill="#15803d"/>
  <text x="430" y="247" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">else → OFF (fall through)</text>

  <line x1="174" y1="150" x2="248" y2="90" stroke="#0f766e" stroke-width="2" marker-end="url(#ffArrow)"/>

  <rect x="250" y="280" width="360" height="30" rx="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="430" y="299" font-size="9" fill="#334155" text-anchor="middle">deploy is decoupled from release — flip a flag, not a deployment</text>

  <defs>
    <marker id="ffArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/></marker>
  </defs>
</svg>
