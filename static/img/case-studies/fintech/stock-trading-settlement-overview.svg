<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="stkArrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="stkArrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="stkArrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="820" height="470" fill="#ffffff"/>

  <text x="410" y="24" font-size="13" fill="#334155" text-anchor="middle" font-weight="600">Tap to own: seconds of execution, then a day of clearing and settlement</text>

  <!-- Row 1: real-time execution path -->
  <text x="24" y="52" font-size="10" fill="#64748b" font-weight="600">Real time (milliseconds to seconds)</text>

  <!-- Investor -->
  <rect x="24" y="62" width="118" height="58" rx="8" fill="#1d4ed8"/>
  <text x="83" y="86" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Investor</text>
  <text x="83" y="103" font-size="9" fill="#dbeafe" text-anchor="middle">limit buy 100 TSLA</text>
  <text x="83" y="114" font-size="9" fill="#dbeafe" text-anchor="middle">at 150.00</text>

  <!-- Broker -->
  <rect x="176" y="62" width="118" height="58" rx="8" fill="#1d4ed8"/>
  <text x="235" y="82" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Broker</text>
  <text x="235" y="98" font-size="9" fill="#dbeafe" text-anchor="middle">risk + funds check,</text>
  <text x="235" y="109" font-size="9" fill="#dbeafe" text-anchor="middle">builds FIX order</text>

  <!-- Smart order router -->
  <rect x="328" y="52" width="140" height="78" rx="8" fill="#0f766e"/>
  <text x="398" y="74" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Smart order router</text>
  <text x="398" y="90" font-size="9" fill="#ccfbf1" text-anchor="middle">best execution:</text>
  <text x="398" y="101" font-size="9" fill="#ccfbf1" text-anchor="middle">market maker (PFOF)</text>
  <text x="398" y="112" font-size="9" fill="#ccfbf1" text-anchor="middle">vs public exchange</text>

  <!-- Market maker -->
  <rect x="502" y="52" width="132" height="36" rx="8" fill="#0f766e"/>
  <text x="568" y="70" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Market maker</text>
  <text x="568" y="82" font-size="8.5" fill="#ccfbf1" text-anchor="middle">internalizes at NBBO</text>

  <!-- Exchange + matching engine -->
  <rect x="502" y="96" width="132" height="60" rx="8" fill="#0f766e"/>
  <text x="568" y="114" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">Exchange</text>
  <text x="568" y="128" font-size="8.5" fill="#ccfbf1" text-anchor="middle">matching engine,</text>
  <text x="568" y="139" font-size="8.5" fill="#ccfbf1" text-anchor="middle">price-time order book</text>

  <!-- Execution -->
  <rect x="668" y="62" width="128" height="58" rx="8" fill="#6d28d9"/>
  <text x="732" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Execution</text>
  <text x="732" y="98" font-size="9" fill="#ede9fe" text-anchor="middle">fill printed,</text>
  <text x="732" y="109" font-size="9" fill="#ede9fe" text-anchor="middle">confirm to app</text>

  <!-- Row 1 arrows -->
  <line x1="142" y1="91" x2="172" y2="91" stroke="#1d4ed8" stroke-width="2" marker-end="url(#stkArrowBlue)"/>
  <line x1="294" y1="91" x2="324" y2="91" stroke="#1d4ed8" stroke-width="2" marker-end="url(#stkArrowBlue)"/>
  <line x1="468" y1="78" x2="498" y2="70" stroke="#0f766e" stroke-width="2" marker-end="url(#stkArrowGreen)"/>
  <line x1="468" y1="104" x2="498" y2="120" stroke="#0f766e" stroke-width="2" marker-end="url(#stkArrowGreen)"/>
  <line x1="634" y1="70" x2="664" y2="82" stroke="#6d28d9" stroke-width="2" marker-end="url(#stkArrowGreen)"/>
  <line x1="634" y1="126" x2="664" y2="104" stroke="#6d28d9" stroke-width="2" marker-end="url(#stkArrowGreen)"/>

  <!-- Divider -->
  <line x1="24" y1="176" x2="796" y2="176" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Row 2: post-trade path -->
  <text x="24" y="200" font-size="10" fill="#64748b" font-weight="600">Post-trade (same day into T+1)</text>

  <!-- Clearing / CCP -->
  <rect x="24" y="214" width="196" height="96" rx="8" fill="#b45309"/>
  <text x="122" y="236" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Clearing (CCP: NSCC)</text>
  <text x="122" y="256" font-size="9" fill="#fde68a" text-anchor="middle">novation: steps in as buyer</text>
  <text x="122" y="268" font-size="9" fill="#fde68a" text-anchor="middle">to every seller, seller to</text>
  <text x="122" y="280" font-size="9" fill="#fde68a" text-anchor="middle">every buyer; guarantees</text>
  <text x="122" y="296" font-size="9" fill="#fde68a" text-anchor="middle">multilateral net (CNS) + margin</text>

  <!-- Settlement / DTC -->
  <rect x="256" y="214" width="196" height="96" rx="8" fill="#b45309"/>
  <text x="354" y="236" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Settlement (DTC, T+1)</text>
  <text x="354" y="256" font-size="9" fill="#fde68a" text-anchor="middle">book-entry transfer of</text>
  <text x="354" y="268" font-size="9" fill="#fde68a" text-anchor="middle">shares vs cash, atomically</text>
  <text x="354" y="280" font-size="9" fill="#fde68a" text-anchor="middle">delivery versus payment</text>
  <text x="354" y="296" font-size="9" fill="#fde68a" text-anchor="middle">(DVP)</text>

  <!-- Custody -->
  <rect x="488" y="214" width="196" height="96" rx="8" fill="#6d28d9"/>
  <text x="586" y="236" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Custody</text>
  <text x="586" y="256" font-size="9" fill="#ede9fe" text-anchor="middle">shares held in street name</text>
  <text x="586" y="268" font-size="9" fill="#ede9fe" text-anchor="middle">at DTC under Cede and Co;</text>
  <text x="586" y="280" font-size="9" fill="#ede9fe" text-anchor="middle">investor owns a book entry</text>
  <text x="586" y="296" font-size="9" fill="#ede9fe" text-anchor="middle">on the broker's ledger</text>

  <!-- Row 2 arrows -->
  <line x1="220" y1="262" x2="252" y2="262" stroke="#b45309" stroke-width="2" marker-end="url(#stkArrowAmber)"/>
  <line x1="452" y1="262" x2="484" y2="262" stroke="#6d28d9" stroke-width="2" marker-end="url(#stkArrowGreen)"/>

  <!-- Execution feeds clearing -->
  <path d="M732,120 L732,192 L122,192 L122,210" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#stkArrowAmber)"/>
  <text x="410" y="188" font-size="9" fill="#b45309" text-anchor="middle" font-weight="600">every execution is submitted to the clearing corporation</text>

  <!-- Footer note -->
  <text x="410" y="342" font-size="9.5" fill="#475569" text-anchor="middle">The investor sees "filled" in seconds; the shares and cash actually change hands one business day later,</text>
  <text x="410" y="356" font-size="9.5" fill="#475569" text-anchor="middle">netted down so the depository moves a fraction of the gross traded value.</text>

  <!-- Legend -->
  <rect x="256" y="392" width="14" height="14" rx="3" fill="#1d4ed8"/>
  <text x="276" y="403" font-size="9" fill="#334155">order origination</text>
  <rect x="392" y="392" width="14" height="14" rx="3" fill="#0f766e"/>
  <text x="412" y="403" font-size="9" fill="#334155">routing and matching</text>
  <rect x="540" y="392" width="14" height="14" rx="3" fill="#b45309"/>
  <text x="560" y="403" font-size="9" fill="#334155">clearing and settlement</text>
</svg>
